<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Persona mask + Shadow behind: mask on front, shadow-shape behind -->
  <!-- Shadow (behind, dark) -->
  <ellipse cx="530" cy="248" rx="130" ry="158" fill="#6b21a8" opacity="0.3"/>
  <ellipse cx="530" cy="248" rx="130" ry="158" fill="none" stroke="#6b21a8" stroke-width="4" stroke-dasharray="10,6"/>
  <!-- Persona mask (front, bright) -->
  <ellipse cx="470" cy="228" rx="105" ry="128" fill="#ddd6fe" opacity="0.6"/>
  <ellipse cx="470" cy="228" rx="105" ry="128" fill="none" stroke="#7c3aed" stroke-width="6"/>
  <!-- Mask features (eyes/mouth - happy face) -->
  <circle cx="440" cy="205" r="15" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <circle cx="500" cy="205" r="15" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <path d="M 435 248 C 452 268 488 268 505 248" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <!-- Shadow features (sad/hidden - barely visible) -->
  <circle cx="560" cy="220" r="12" fill="#6b21a8" opacity="0.3"/>
  <circle cx="608" cy="220" r="12" fill="#6b21a8" opacity="0.3"/>
  <path d="M 555 268 C 572 250 605 250 620 268" fill="none" stroke="#6b21a8" stroke-width="3" opacity="0.35"/>

</svg>