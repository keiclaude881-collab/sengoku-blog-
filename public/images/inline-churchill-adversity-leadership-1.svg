<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 波乱のキャリア曲線が最終的に上昇する -->

  <!-- Grid lines -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#e8e0d4" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="940" y2="320" stroke="#e8e0d4" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="940" y2="240" stroke="#e8e0d4" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="80" y1="160" x2="940" y2="160" stroke="#e8e0d4" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="80" y1="80" x2="940" y2="80" stroke="#e8e0d4" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Y axis labels -->
  <text x="68" y="325" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">底</text>
  <text x="68" y="245" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">低</text>
  <text x="68" y="165" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">中</text>
  <text x="68" y="85" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">高</text>

  <!-- Career path: youth dip (入学3度落第), rise (ジャーナリスト), drop (ガリポリ失脚),荒野10年 flat low, sharp rise to PM at 65 -->
  <path d="M 100 200
           C 130 210 150 300 190 310
           C 230 320 250 240 290 220
           C 330 200 350 180 390 160
           C 430 140 450 290 500 305
           C 540 315 580 310 640 308
           C 680 306 700 270 740 240
           C 780 205 820 140 870 100
           C 900 75 920 68 940 62"
        stroke="#b45309" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Key failure points -->
  <circle cx="190" cy="310" r="7" fill="#92400e" opacity="0.85"/>
  <circle cx="500" cy="305" r="7" fill="#92400e" opacity="0.85"/>

  <!-- 荒野の10年 zone -->
  <rect x="500" y="290" width="145" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1" opacity="0.8"/>
  <text x="572" y="307" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle">荒野の10年</text>

  <!-- Success point -->
  <circle cx="940" cy="62" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
  <text x="940" y="46" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">首相就任</text>
  <text x="940" y="32" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">65歳</text>

  <!-- Failure labels -->
  <text x="190" y="350" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle">士官学校落第</text>
  <text x="500" y="345" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle">ガリポリ失脚</text>

  <!-- Shade upward final rise -->
  <path d="M 700 240 C 740 205 780 140 870 100 C 900 75 920 68 940 62 L 940 320 L 700 320 Z"
        fill="#f59e0b" opacity="0.08"/>

  <!-- Title -->
  <text x="500" y="390" font-family="'Hiragino Sans', sans-serif" font-size="15" fill="#b45309" text-anchor="middle" letter-spacing="2" opacity="0.85">幾度の挫折を越えて、65歳で頂点に立ったチャーチルのキャリア曲線</text>
</svg>
