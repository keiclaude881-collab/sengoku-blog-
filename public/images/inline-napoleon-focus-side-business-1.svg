<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f7faff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#dbeafe" stroke-width="2"/>
  <!-- 拡散する光が、一点に収束していくイメージ(選択と集中) -->
  <g stroke="#3b82f6" stroke-width="2.5" opacity="0.7">
    <line x1="280" y1="100" x2="560" y2="210"/>
    <line x1="300" y1="320" x2="560" y2="210"/>
    <line x1="260" y1="210" x2="560" y2="210"/>
    <line x1="320" y1="150" x2="560" y2="210"/>
    <line x1="320" y1="270" x2="560" y2="210"/>
  </g>
  <circle cx="560" cy="210" r="16" fill="#1e40af"/>
  <circle cx="560" cy="210" r="30" fill="none" stroke="#1e40af" stroke-width="2.5" opacity="0.5"/>
</svg>
