<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 「価格」と「価値」のギャップ＝安全余裕率 -->

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">「価格」と「価値」のギャップ＝安全余裕率</text>
  <line x1="100" y1="58" x2="900" y2="58" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Baseline -->
  <line x1="100" y1="370" x2="420" y2="370" stroke="#92400e" stroke-width="2"/>

  <!-- 価値 bar -->
  <rect x="150" y="100" width="90" height="270" fill="#92400e" opacity="0.78"/>
  <text x="195" y="85" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">価値</text>
  <text x="195" y="245" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#fef3c7" text-anchor="middle">企業の実力・</text>
  <text x="195" y="265" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#fef3c7" text-anchor="middle">本来の値段</text>

  <!-- 価格 bar -->
  <rect x="320" y="210" width="90" height="160" fill="#f59e0b" opacity="0.75"/>
  <text x="365" y="195" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">価格</text>
  <text x="365" y="295" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">今の株価</text>

  <!-- Margin of safety bracket -->
  <path d="M 270 100 L 290 100 L 290 210 L 270 210" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="300" y="148" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#b45309">安全余裕率</text>
  <text x="300" y="170" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309">(Margin of Safety)</text>

  <!-- x-axis labels -->
  <text x="195" y="392" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#78716c" text-anchor="middle">本質的価値</text>
  <text x="365" y="392" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#78716c" text-anchor="middle">市場価格</text>

  <!-- Right side: explanation box -->
  <rect x="540" y="80" width="380" height="280" rx="8" fill="none" stroke="#e8e0d4" stroke-width="1.5"/>
  <text x="730" y="115" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">グラハムの考え方</text>
  <line x1="560" y1="128" x2="900" y2="128" stroke="#e8e0d4" stroke-width="1"/>

  <circle cx="565" cy="160" r="5" fill="#92400e"/>
  <text x="580" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">価格は感情で毎日動く(Mr.マーケット)</text>

  <circle cx="565" cy="198" r="5" fill="#92400e"/>
  <text x="580" y="203" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">価値は事業の実態でゆっくり変わる</text>

  <circle cx="565" cy="236" r="5" fill="#92400e"/>
  <text x="580" y="241" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">差が大きいほど、判断ミスへの耐性が高い</text>

  <circle cx="565" cy="274" r="5" fill="#92400e"/>
  <text x="580" y="279" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">下落は「割安」が広がるチャンスでもある</text>

  <!-- Bottom quote -->
  <text x="500" y="408" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85" font-style="italic">「短期的に見れば人気投票、長期的に見れば体重計」</text>
</svg>
