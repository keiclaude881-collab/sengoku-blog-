<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Factory silhouette on the left, the source of wealth -->
  <g fill="#92400e" opacity="0.85">
    <rect x="100" y="350" width="280" height="180"/>
    <rect x="140" y="270" width="40" height="90"/>
    <rect x="220" y="240" width="40" height="120"/>
    <rect x="300" y="290" width="40" height="70"/>
    <ellipse cx="160" cy="250" rx="22" ry="14" fill="#b45309" opacity="0.6"/>
    <ellipse cx="240" cy="215" rx="26" ry="16" fill="#b45309" opacity="0.6"/>
  </g>

  <!-- Coins flowing out from the factory, arcing across the sky -->
  <g fill="#f59e0b" stroke="#d97706" stroke-width="2">
    <circle cx="430" cy="280" r="20"/>
    <circle cx="510" cy="220" r="24"/>
    <circle cx="600" cy="190" r="26"/>
    <circle cx="690" cy="200" r="24"/>
    <circle cx="780" cy="240" r="22"/>
  </g>
  <path d="M 380 340 C 450 260 550 180 650 175 C 750 170 820 220 870 280" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3,9" opacity="0.5"/>

  <!-- Library/civic building silhouette on the right, where wealth lands and becomes social good -->
  <g fill="#fde68a" stroke="#92400e" stroke-width="3">
    <polygon points="830,330 1130,330 980,240"/>
    <rect x="850" y="330" width="260" height="170"/>
  </g>
  <g stroke="#b45309" stroke-width="6">
    <line x1="890" y1="330" x2="890" y2="500"/>
    <line x1="945" y1="330" x2="945" y2="500"/>
    <line x1="1000" y1="330" x2="1000" y2="500"/>
    <line x1="1055" y1="330" x2="1055" y2="500"/>
    <line x1="1090" y1="330" x2="1090" y2="500"/>
  </g>
  <rect x="850" y="500" width="260" height="14" fill="#92400e" opacity="0.5"/>
  <rect x="836" y="514" width="288" height="14" fill="#92400e" opacity="0.35"/>

  <!-- People silhouettes near the library, representing society benefitting -->
  <g fill="#78350f" opacity="0.7">
    <circle cx="760" cy="555" r="13"/>
    <rect x="748" y="568" width="24" height="40" rx="8"/>
    <circle cx="1160" cy="560" r="11"/>
    <rect x="1149" y="571" width="22" height="36" rx="8"/>
  </g>

  <!-- Decorative sun, symbolizing legacy/lasting good -->
  <circle cx="600" cy="100" r="36" fill="#fde68a" opacity="0.9"/>
  <g stroke="#fde68a" stroke-width="4" opacity="0.7">
    <line x1="600" y1="40" x2="600" y2="20"/>
    <line x1="660" y1="100" x2="680" y2="100"/>
    <line x1="540" y1="100" x2="520" y2="100"/>
  </g>
</svg>
