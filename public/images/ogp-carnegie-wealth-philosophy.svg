<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf7f2"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#92400e"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="130" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="2">投資・お金</text>

  <!-- Main title -->
  <text x="60" y="185" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="52" font-weight="700" fill="#1c1917" letter-spacing="-1">カーネギーの</text>
  <text x="60" y="255" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="52" font-weight="700" fill="#1c1917" letter-spacing="-1">富の哲学</text>

  <!-- Subtitle -->
  <text x="60" y="320" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="28" fill="#b45309" letter-spacing="2">稼ぎ、増やし、使い切る</text>

  <!-- Divider line -->
  <line x1="60" y1="355" x2="680" y2="355" stroke="#e8e0d4" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">「裕福なまま死ぬことは恥だ」——世界一の富豪が遺した言葉</text>
  <text x="60" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">が示す、お金に振り回されない豊かさの本質。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#b45309" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: Library + Coins -->
  <!-- Library building -->
  <rect x="840" y="160" width="240" height="220" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="2.5"/>
  <!-- Pediment (triangular roof) -->
  <polygon points="820,160 1100,160 960,80" fill="#fef3c7" stroke="#92400e" stroke-width="2.5"/>
  <!-- Pillars -->
  <line x1="880" y1="160" x2="880" y2="380" stroke="#b45309" stroke-width="4"/>
  <line x1="930" y1="160" x2="930" y2="380" stroke="#b45309" stroke-width="4"/>
  <line x1="990" y1="160" x2="990" y2="380" stroke="#b45309" stroke-width="4"/>
  <line x1="1040" y1="160" x2="1040" y2="380" stroke="#b45309" stroke-width="4"/>
  <!-- Door -->
  <rect x="932" y="260" width="95" height="120" rx="4" fill="#d97706" opacity="0.45" stroke="#92400e" stroke-width="2"/>
  <!-- Windows -->
  <rect x="858" y="190" width="38" height="38" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="1025" y="190" width="38" height="38" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <!-- Steps -->
  <rect x="820" y="378" width="280" height="12" rx="2" fill="#b45309" opacity="0.4"/>
  <rect x="808" y="390" width="304" height="12" rx="2" fill="#b45309" opacity="0.3"/>
  <!-- Library label -->
  <text x="960" y="435" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">図書館</text>

  <!-- Coins (stacked) -->
  <ellipse cx="780" cy="490" rx="42" ry="12" fill="#f59e0b" opacity="0.9" stroke="#d97706" stroke-width="1.5"/>
  <rect x="738" y="470" width="84" height="22" fill="#f59e0b" opacity="0.9"/>
  <rect x="738" y="470" width="84" height="22" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="780" cy="470" rx="42" ry="12" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>

  <ellipse cx="780" cy="452" rx="42" ry="12" fill="#d97706" opacity="0.9" stroke="#b45309" stroke-width="1.5"/>
  <rect x="738" y="432" width="84" height="22" fill="#d97706" opacity="0.9"/>
  <rect x="738" y="432" width="84" height="22" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="780" cy="432" rx="42" ry="12" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>

  <ellipse cx="780" cy="415" rx="42" ry="12" fill="#b45309" opacity="0.9" stroke="#92400e" stroke-width="1.5"/>
  <rect x="738" y="395" width="84" height="22" fill="#b45309" opacity="0.9"/>
  <rect x="738" y="395" width="84" height="22" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="780" cy="395" rx="42" ry="12" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>

  <text x="780" y="520" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" fill="#92400e" text-anchor="middle">資産</text>

  <!-- Arrow from coins to library -->
  <path d="M 825 445 Q 870 420 900 430" fill="none" stroke="#92400e" stroke-width="2.5" stroke-dasharray="8,4"/>
  <polygon points="895,422 910,432 898,442" fill="#92400e"/>
</svg>
