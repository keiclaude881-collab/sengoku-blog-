<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <text x="500" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">只管打坐——ただひたすら、今ここに座る</text>

  <!-- 座禅する人物シルエット（中央） -->
  <!-- 頭 -->
  <circle cx="500" cy="155" r="26" fill="#6b21a8"/>
  <!-- 胴体（結跏趺坐） -->
  <ellipse cx="500" cy="240" rx="68" ry="45" fill="#6b21a8"/>
  <!-- 脚（折りたたみ） -->
  <ellipse cx="500" cy="275" rx="90" ry="22" fill="#4c1d95"/>
  <!-- 手（法界定印） -->
  <ellipse cx="500" cy="252" rx="40" ry="14" fill="#5b21b6"/>

  <!-- 波紋1（最内） -->
  <circle cx="500" cy="255" r="110" fill="none" stroke="#c4b5fd" stroke-width="2.5" opacity="0.9"/>
  <!-- 波紋2 -->
  <circle cx="500" cy="255" r="155" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.7"/>
  <!-- 波紋3 -->
  <circle cx="500" cy="255" r="200" fill="none" stroke="#ddd6fe" stroke-width="1.5" opacity="0.5"/>
  <!-- 波紋4（最外） -->
  <circle cx="500" cy="255" r="240" fill="none" stroke="#ede9fe" stroke-width="1" opacity="0.3"/>

  <!-- 左側テキスト -->
  <text x="160" y="200" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">過去</text>
  <text x="160" y="222" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">記憶・後悔</text>
  <!-- 左側×マーク -->
  <line x1="140" y1="240" x2="180" y2="270" stroke="#d1d5db" stroke-width="2"/>
  <line x1="180" y1="240" x2="140" y2="270" stroke="#d1d5db" stroke-width="2"/>

  <!-- 右側テキスト -->
  <text x="840" y="200" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">未来</text>
  <text x="840" y="222" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">不安・期待</text>
  <!-- 右側×マーク -->
  <line x1="820" y1="240" x2="860" y2="270" stroke="#d1d5db" stroke-width="2"/>
  <line x1="860" y1="240" x2="820" y2="270" stroke="#d1d5db" stroke-width="2"/>

  <!-- 中央「今」バッジ -->
  <circle cx="500" cy="155" r="42" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="500" y="100" font-family="sans-serif" font-size="22" font-weight="900" fill="#a855f7" text-anchor="middle">今</text>

  <!-- 下部メッセージ -->
  <rect x="180" y="358" width="640" height="44" rx="10" fill="#f3e8ff"/>
  <text x="500" y="385" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">「悟りを求めて座るのではなく、座ること自体が悟りである」— 道元</text>
</svg>
