<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf5ff"/>

  <!-- left: old rigid square structure, cracking apart and falling away -->
  <g transform="translate(330,310)">
    <rect x="-110" y="-110" width="220" height="220" rx="6" fill="none" stroke="#d8b4fe" stroke-width="6" opacity="0.6"/>
    <!-- crack lines -->
    <path d="M -30 -110 L -10 -40 L -50 10 L 10 60 L -20 110" stroke="#9333ea" stroke-width="3" fill="none" opacity="0.5"/>
    <!-- fragments breaking off and falling -->
    <rect x="120" y="-60" width="40" height="40" fill="#d8b4fe" opacity="0.7" transform="rotate(18 140 -40)"/>
    <rect x="150" y="40" width="32" height="32" fill="#c4b5fd" opacity="0.6" transform="rotate(-12 166 56)"/>
    <rect x="100" y="130" width="26" height="26" fill="#d8b4fe" opacity="0.5" transform="rotate(30 113 143)"/>
    <rect x="-160" y="150" width="34" height="34" fill="#c4b5fd" opacity="0.55" transform="rotate(-20 -143 167)"/>
  </g>

  <!-- arrow sweeping from old to new -->
  <path d="M 480 300 C 600 230 700 230 820 270" fill="none" stroke="#7e22ce" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 820 270 L 792 256 M 820 270 L 800 294" stroke="#7e22ce" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- right: new flexible flowing form emerging -->
  <g transform="translate(880,310)">
    <path d="M -120 60 C -120 -60 0 -100 60 -60 C 130 -20 130 80 60 110 C -10 138 -120 130 -120 60 Z"
          fill="#9333ea" opacity="0.85"/>
    <path d="M -70 30 C -70 -30 40 -50 70 -10 C 95 25 70 70 20 80 C -30 90 -70 80 -70 30 Z"
          fill="#d8b4fe" opacity="0.8"/>
    <circle cx="20" cy="20" r="14" fill="#faf5ff" opacity="0.9"/>
  </g>

  <!-- rising particles, suggesting transformation/energy -->
  <circle cx="650" cy="160" r="6" fill="#d8b4fe" opacity="0.7"/>
  <circle cx="690" cy="120" r="4" fill="#9333ea" opacity="0.6"/>
  <circle cx="610" cy="110" r="5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="1020" cy="180" r="5" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="1060" cy="230" r="4" fill="#9333ea" opacity="0.5"/>

  <ellipse cx="330" cy="490" rx="150" ry="16" fill="#e9d5ff" opacity="0.5"/>
  <ellipse cx="880" cy="500" rx="170" ry="16" fill="#e9d5ff" opacity="0.5"/>
</svg>
