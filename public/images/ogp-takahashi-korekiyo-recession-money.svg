<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Recovery J-curve (recession then recovery) -->
  <!-- axes -->
  <line x1="180" y1="520" x2="1020" y2="520" stroke="#92400e" stroke-width="4" opacity="0.30"/>
  <line x1="180" y1="100"  x2="180" y2="520"  stroke="#92400e" stroke-width="4" opacity="0.30"/>
  <!-- J-curve path: start mid-high, drop deep, then sharply rise -->
  <path d="M 200,230 C 320,230 380,480 480,490 C 580,500 680,380 820,150 L 960,95"
        fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <!-- dot at bottom of curve (recession trough) -->
  <circle cx="480" cy="492" r="16" fill="#92400e" opacity="0.75"/>
  <!-- arrow at recovery end -->
  <polygon points="975,88 948,118 962,136" fill="#d97706" opacity="0.88"/>
  <!-- glow at recovery high (upward moment) -->
  <circle cx="960" cy="95" r="32" fill="#fbbf24" opacity="0.20"/>
  <circle cx="960" cy="95" r="18" fill="#fbbf24" opacity="0.40"/>
</svg>