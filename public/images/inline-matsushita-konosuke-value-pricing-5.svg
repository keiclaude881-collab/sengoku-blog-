<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 3哲学まとめ -->

  <!-- タイトル -->
  <text x="500" y="45" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">松下幸之助のお金哲学・3つの柱</text>
  <line x1="100" y1="62" x2="900" y2="62" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- 哲学①：価値で選ばれる -->
  <rect x="65" y="85" width="270" height="230" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="65" y="85" width="270" height="52" rx="10" fill="#d97706" opacity="0.6"/>
  <rect x="65" y="122" width="270" height="15" fill="#d97706" opacity="0.6"/>
  <text x="200" y="108" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#faf7f2" text-anchor="middle">哲学① 価値で選ばれる</text>
  <text x="200" y="125" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">「安売りに頼らない」</text>

  <text x="200" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">松下電器の実践</text>
  <text x="200" y="185" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">品質・信頼・サービスで</text>
  <text x="200" y="203" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">選ばれ続ける仕組み</text>
  <line x1="90" y1="218" x2="310" y2="218" stroke="#e8e0d4" stroke-width="1"/>
  <text x="200" y="238" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">現代への応用</text>
  <text x="200" y="256" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">副業・スキルの価値を磨き</text>
  <text x="200" y="274" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">安さでなく質で勝負する</text>
  <text x="200" y="300" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">「値段を下げない」ことが価値を守る</text>

  <!-- 哲学②：商売は感謝の連鎖 -->
  <rect x="365" y="85" width="270" height="230" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="365" y="85" width="270" height="52" rx="10" fill="#b45309" opacity="0.65"/>
  <rect x="365" y="122" width="270" height="15" fill="#b45309" opacity="0.65"/>
  <text x="500" y="108" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#faf7f2" text-anchor="middle">哲学② 感謝の連鎖</text>
  <text x="500" y="125" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">「お金は価値交換の証」</text>

  <text x="500" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">松下の捉え方</text>
  <text x="500" y="185" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">お金は「価値を届けた証」</text>
  <text x="500" y="203" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">受け取ることを恥じない</text>
  <line x1="390" y1="218" x2="610" y2="218" stroke="#e8e0d4" stroke-width="1"/>
  <text x="500" y="238" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">現代への応用</text>
  <text x="500" y="256" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">適正価格の設定に</text>
  <text x="500" y="274" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">罪悪感を持たなくなる</text>
  <text x="500" y="300" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">「もらい過ぎ」はなく「価値通り」</text>

  <!-- 哲学③：循環させる -->
  <rect x="665" y="85" width="270" height="230" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="665" y="85" width="270" height="52" rx="10" fill="#92400e" opacity="0.75"/>
  <rect x="665" y="122" width="270" height="15" fill="#92400e" opacity="0.75"/>
  <text x="800" y="108" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">哲学③ 循環させる</text>
  <text x="800" y="125" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">「再投資で複利を生む」</text>

  <text x="800" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">松下電器の成長</text>
  <text x="800" y="185" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">利益を設備・人材・</text>
  <text x="800" y="203" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">研究へ再投資し続けた</text>
  <line x1="690" y1="218" x2="910" y2="218" stroke="#e8e0d4" stroke-width="1"/>
  <text x="800" y="238" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">現代への応用</text>
  <text x="800" y="256" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">収入の一部を積立投資・</text>
  <text x="800" y="274" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#1c1917" text-anchor="middle">自己投資へ自動回し</text>
  <text x="800" y="300" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">仕組みが回ると複利が働く</text>

  <text x="500" y="395" font-family="'Hiragino Sans', sans-serif" font-size="15" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85">「価値を上げること」がお金を増やす最短ルート</text>
</svg>
