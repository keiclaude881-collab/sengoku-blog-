<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Large scissors (being different, cutting your own path) -->
  <!-- blade 1 (upper-left to lower-right) -->
  <ellipse cx="448" cy="448" rx="30" ry="30" fill="none" stroke="#3b82f6" stroke-width="14" opacity="0.82"/>
  <line x1="470" y1="430" x2="840" y2="200" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" opacity="0.82"/>
  <!-- blade 2 (lower-left to upper-right) -->
  <ellipse cx="448" cy="182" rx="30" ry="30" fill="none" stroke="#1e40af" stroke-width="14" opacity="0.82"/>
  <line x1="470" y1="200" x2="840" y2="430" stroke="#1e40af" stroke-width="14" stroke-linecap="round" opacity="0.82"/>
  <!-- pivot screw at crossing -->
  <circle cx="640" cy="315" r="22" fill="#3b82f6" opacity="0.90"/>
  <circle cx="640" cy="315" r="11" fill="#bfdbfe" opacity="0.85"/>
  <!-- cutting line (dashed, going right) -->
  <line x1="850" y1="315" x2="1050" y2="315" stroke="#60a5fa" stroke-width="6" stroke-dasharray="14,10" opacity="0.55"/>
</svg>