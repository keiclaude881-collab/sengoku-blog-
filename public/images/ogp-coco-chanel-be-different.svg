<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f7faff"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dbeafe" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#1e40af"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="130" height="34" rx="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="2">仕事・副業</text>

  <!-- Main title -->
  <text x="60" y="185" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="50" font-weight="700" fill="#1c1917" letter-spacing="-1">ココ・シャネルに学ぶ</text>
  <text x="60" y="255" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="50" font-weight="700" fill="#1c1917" letter-spacing="-1">「違い」を仕事にする力</text>

  <!-- Subtitle -->
  <text x="60" y="320" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="28" fill="#2563eb" letter-spacing="2">「みんなと同じ」が一番のリスク</text>

  <!-- Divider line -->
  <line x1="60" y1="355" x2="680" y2="355" stroke="#dbeafe" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">孤児院で学んだ裁縫を武器に、女性をコルセットから解放し、</text>
  <text x="60" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">シャネルというブランドを一代で築き上げた伝説のデザイナー。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#2563eb" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: 3-step flow (notice discomfort -> question normal -> shape the difference) -->
  <rect x="800" y="100" width="340" height="320" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>

  <text x="970" y="138" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="22" font-weight="700" fill="#1e40af" text-anchor="middle">差別化の3ステップ</text>

  <!-- Step 1 -->
  <rect x="850" y="150" width="240" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="970" y="192" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">① 不満に気づく</text>

  <!-- Arrow 1 -->
  <line x1="970" y1="216" x2="970" y2="234" stroke="#2563eb" stroke-width="4"/>
  <path d="M 958,228 L 970,240 L 982,228 Z" fill="#2563eb"/>

  <!-- Step 2 -->
  <rect x="850" y="240" width="240" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="970" y="282" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">② 当たり前を疑う</text>

  <!-- Arrow 2 -->
  <line x1="970" y1="306" x2="970" y2="324" stroke="#2563eb" stroke-width="4"/>
  <path d="M 958,318 L 970,330 L 982,318 Z" fill="#2563eb"/>

  <!-- Step 3 (highlighted) -->
  <rect x="835" y="330" width="270" height="70" rx="10" fill="#1e40af"/>
  <text x="970" y="374" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="700" fill="#eff6ff" text-anchor="middle">③ 違いを形にする</text>
</svg>
