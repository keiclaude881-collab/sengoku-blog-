<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dfe7f3" stroke-width="2"/>

  <!-- ルネサンス風横顔シルエット -->
  <path d="M 260 230
           C 300 210 350 215 372 250
           C 388 276 386 300 398 312
           C 408 322 398 332 384 332
           C 380 350 372 366 358 378
           L 358 470 L 264 470
           C 264 410 250 360 250 320
           C 248 280 240 250 260 230 Z"
        fill="#1e3a8a" opacity="0.82"/>
  <circle cx="356" cy="270" r="5" fill="#f7f9fc"/>

  <!-- チェスの駒 -->
  <g opacity="0.8">
    <rect x="700" y="430" width="60" height="14" rx="3" fill="#1e40af"/>
    <rect x="715" y="380" width="30" height="50" fill="#1e40af"/>
    <circle cx="730" cy="368" r="16" fill="#1e40af"/>
  </g>
  <g opacity="0.5">
    <rect x="800" y="430" width="60" height="14" rx="3" fill="#3b82f6"/>
    <path d="M 815 430 L 845 430 L 838 386 L 822 386 Z" fill="#3b82f6"/>
    <rect x="820" y="362" width="20" height="24" fill="#3b82f6"/>
  </g>

  <!-- ノートPC -->
  <g opacity="0.7">
    <rect x="900" y="470" width="160" height="14" rx="3" fill="#1e3a8a"/>
    <path d="M 920 470 L 1040 470 L 1030 380 L 930 380 Z" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  </g>

  <!-- カテゴリラベル -->
  <rect x="700" y="180" width="120" height="36" rx="18" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="760" y="204" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="1">仕事・副業</text>

  <!-- タイトル -->
  <text x="700" y="280" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">マキャベリの</text>
  <text x="700" y="324" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">副業で失敗しない原則</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
