<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Open book with quill (The Prince - writing secret knowledge) -->
  <!-- open book body -->
  <path d="M 250,220 Q 250,200 280,195 L 595,195 L 595,480 Q 350,480 250,480 Z" fill="#dbeafe" opacity="0.75"/>
  <path d="M 950,220 Q 950,200 920,195 L 605,195 L 605,480 Q 850,480 950,480 Z" fill="#bfdbfe" opacity="0.70"/>
  <!-- spine -->
  <rect x="590" y="193" width="20" height="290" rx="4" fill="#1e40af" opacity="0.65"/>
  <!-- page lines left -->
  <g stroke="#3b82f6" stroke-width="2.5" opacity="0.35">
    <line x1="300" y1="250" x2="560" y2="250"/>
    <line x1="300" y1="275" x2="560" y2="275"/>
    <line x1="300" y1="300" x2="560" y2="300"/>
    <line x1="300" y1="325" x2="560" y2="325"/>
    <line x1="300" y1="350" x2="560" y2="350"/>
    <line x1="300" y1="375" x2="560" y2="375"/>
    <line x1="300" y1="400" x2="560" y2="400"/>
    <line x1="300" y1="425" x2="560" y2="425"/>
  </g>
  <!-- page lines right -->
  <g stroke="#3b82f6" stroke-width="2.5" opacity="0.30">
    <line x1="640" y1="250" x2="900" y2="250"/>
    <line x1="640" y1="275" x2="900" y2="275"/>
    <line x1="640" y1="300" x2="900" y2="300"/>
    <line x1="640" y1="325" x2="900" y2="325"/>
    <line x1="640" y1="350" x2="900" y2="350"/>
  </g>
  <!-- quill pen (crossing the book diagonally) -->
  <path d="M 750,150 Q 580,280 450,450" fill="none" stroke="#1e40af" stroke-width="8" stroke-linecap="round" opacity="0.80"/>
  <!-- quill feather top -->
  <path d="M 750,150 Q 800,120 840,90 Q 780,140 760,160 Q 800,110 830,100 Q 770,145 750,150 Z" fill="#3b82f6" opacity="0.70"/>
  <!-- ink nib -->
  <ellipse cx="455" cy="455" rx="12" ry="6" fill="#1e40af" opacity="0.80"/>
</svg>