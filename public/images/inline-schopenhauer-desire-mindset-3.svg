<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Blind will: gears spinning without purpose/direction -->
  <!-- Large gear (blind will) -->
  <circle cx="500" cy="210" r="128" fill="none" stroke="#7c3aed" stroke-width="7"/>
  <circle cx="500" cy="210" r="92" fill="#ddd6fe" opacity="0.25"/>
  <!-- Gear teeth -->
  <rect x="481" y="68" width="38" height="28" rx="4" fill="#7c3aed" opacity="0.6"/>
  <rect x="481" y="324" width="38" height="28" rx="4" fill="#7c3aed" opacity="0.6"/>
  <rect x="358" y="197" width="28" height="38" rx="4" fill="#7c3aed" opacity="0.6"/>
  <rect x="614" y="197" width="28" height="38" rx="4" fill="#7c3aed" opacity="0.6"/>
  <!-- Diagonal teeth -->
  <rect x="386" y="113" width="28" height="38" rx="4" fill="#7c3aed" opacity="0.6" transform="rotate(-45, 400, 132)"/>
  <rect x="580" y="113" width="28" height="38" rx="4" fill="#7c3aed" opacity="0.6" transform="rotate(45, 594, 132)"/>
  <rect x="386" y="260" width="28" height="38" rx="4" fill="#7c3aed" opacity="0.6" transform="rotate(45, 400, 279)"/>
  <rect x="580" y="260" width="28" height="38" rx="4" fill="#7c3aed" opacity="0.6" transform="rotate(-45, 594, 279)"/>
  <!-- Blind center (no purpose/goal) -->
  <circle cx="500" cy="210" r="38" fill="#faf5ff" opacity="0.7"/>
  <line x1="478" y1="188" x2="522" y2="232" stroke="#ddd6fe" stroke-width="6" opacity="0.5"/>
  <line x1="522" y1="188" x2="478" y2="232" stroke="#ddd6fe" stroke-width="6" opacity="0.5"/>
  <!-- Rotation arrow -->
  <path d="M 360 140 A 175 175 0 0 1 500 82" fill="none" stroke="#c4b5fd" stroke-width="5"/>
  <polyline points="486,80 500,82 494,96" fill="none" stroke="#c4b5fd" stroke-width="4"/>

</svg>