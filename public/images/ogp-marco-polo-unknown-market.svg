<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Ship sailing toward unknown horizon -->
  <!-- water -->
  <path d="M 0,420 Q 300,400 600,420 Q 900,440 1200,420 L 1200,630 L 0,630 Z" fill="#3b82f6" opacity="0.25"/>
  <!-- horizon line -->
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#3b82f6" stroke-width="3" opacity="0.30"/>
  <!-- ship hull -->
  <path d="M 380,390 Q 350,420 380,440 L 820,440 Q 850,420 820,390 Z" fill="#1e40af" opacity="0.80"/>
  <!-- mast -->
  <line x1="600" y1="240" x2="600" y2="392" stroke="#1e40af" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- main sail -->
  <path d="M 600,248 L 780,310 L 600,370 Z" fill="#3b82f6" opacity="0.72"/>
  <!-- front sail -->
  <path d="M 600,280 L 420,320 L 600,355 Z" fill="#60a5fa" opacity="0.55"/>
  <!-- flag at top -->
  <path d="M 600,240 L 650,220 L 600,200" fill="#1e40af" opacity="0.70"/>
  <!-- question mark island on horizon (unknown) -->
  <circle cx="950" cy="418" r="20" fill="#bfdbfe" opacity="0.60"/>
  <line x1="950" y1="300" x2="950" y2="398" stroke="#bfdbfe" stroke-width="4" stroke-dasharray="10,6" opacity="0.40"/>
</svg>