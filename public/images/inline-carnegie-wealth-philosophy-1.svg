<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 工場から富が生まれ、社会へと流れ出していくイメージ -->

  <!-- 工場建物 -->
  <g transform="translate(200,260)">
    <!-- 工場本体 -->
    <rect x="-80" y="-100" width="160" height="100" fill="#d97706" opacity="0.6"/>
    <rect x="-80" y="-100" width="160" height="100" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <!-- 屋根 -->
    <polygon points="-90,-100 80,-100 80,-120 30,-140 -90,-120" fill="#b45309" opacity="0.7"/>
    <!-- 煙突 -->
    <rect x="-50" y="-160" width="22" height="60" fill="#92400e" opacity="0.8"/>
    <rect x="20" y="-150" width="18" height="50" fill="#92400e" opacity="0.8"/>
    <!-- 窓 -->
    <rect x="-60" y="-80" width="30" height="25" rx="2" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="-10" y="-80" width="30" height="25" rx="2" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="40" y="-80" width="30" height="25" rx="2" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <!-- ドア -->
    <rect x="-18" y="-45" width="36" height="45" rx="2" fill="#92400e" opacity="0.6"/>
  </g>

  <!-- 煙（富のシンボルとして） -->
  <ellipse cx="150" cy="85" rx="16" ry="10" fill="#f59e0b" opacity="0.3"/>
  <ellipse cx="145" cy="68" rx="13" ry="9" fill="#f59e0b" opacity="0.25"/>
  <ellipse cx="155" cy="52" rx="10" ry="8" fill="#f59e0b" opacity="0.2"/>
  <ellipse cx="222" cy="95" rx="12" ry="8" fill="#f59e0b" opacity="0.3"/>
  <ellipse cx="218" cy="80" rx="10" ry="7" fill="#f59e0b" opacity="0.25"/>

  <!-- コイン群（富） -->
  <g transform="translate(420,210)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" opacity="0.85" stroke="#92400e" stroke-width="2"/>
    <text x="0" y="8" font-family="'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">$</text>
  </g>
  <g transform="translate(470,175)">
    <circle cx="0" cy="0" r="22" fill="#d97706" opacity="0.75" stroke="#92400e" stroke-width="2"/>
    <text x="0" y="7" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#faf7f2" text-anchor="middle">$</text>
  </g>
  <g transform="translate(480,245)">
    <circle cx="0" cy="0" r="18" fill="#f59e0b" opacity="0.7" stroke="#92400e" stroke-width="2"/>
    <text x="0" y="6" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">$</text>
  </g>

  <!-- 矢印：富が社会へ流れる -->
  <path d="M 510 210 C 560 190 600 175 640 170" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="640,162 656,170 640,178" fill="#92400e"/>
  <path d="M 510 210 C 560 215 600 225 640 240" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 4"/>
  <polygon points="640,232 656,240 640,248" fill="#b45309"/>
  <path d="M 510 210 C 555 230 595 265 630 290" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
  <polygon points="622,292 636,302 642,286" fill="#d97706"/>

  <!-- 図書館・建物（社会還元） -->
  <g transform="translate(740,165)">
    <rect x="-44" y="-55" width="88" height="55" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <polygon points="-52,-55 52,-55 0,-90" fill="#b45309" opacity="0.8"/>
    <rect x="-10" y="-35" width="20" height="35" fill="#92400e" opacity="0.5"/>
    <text x="0" y="-16" font-family="'Hiragino Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">図書館</text>
    <line x1="-28" y1="-42" x2="-28" y2="-22" stroke="#92400e" stroke-width="1.5"/>
    <line x1="28" y1="-42" x2="28" y2="-22" stroke="#92400e" stroke-width="1.5"/>
  </g>

  <!-- 人のグループ（社会） -->
  <g transform="translate(740,290)">
    <!-- 人1 -->
    <circle cx="-40" cy="-40" r="10" fill="#b45309" opacity="0.7"/>
    <line x1="-40" y1="-30" x2="-40" y2="-5" stroke="#92400e" stroke-width="2.5"/>
    <line x1="-40" y1="-20" x2="-52" y2="-10" stroke="#92400e" stroke-width="2"/>
    <line x1="-40" y1="-20" x2="-28" y2="-10" stroke="#92400e" stroke-width="2"/>
    <line x1="-40" y1="-5" x2="-48" y2="15" stroke="#92400e" stroke-width="2"/>
    <line x1="-40" y1="-5" x2="-32" y2="15" stroke="#92400e" stroke-width="2"/>
    <!-- 人2 -->
    <circle cx="0" cy="-40" r="10" fill="#d97706" opacity="0.7"/>
    <line x1="0" y1="-30" x2="0" y2="-5" stroke="#92400e" stroke-width="2.5"/>
    <line x1="0" y1="-20" x2="-12" y2="-10" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="-20" x2="12" y2="-10" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="-5" x2="-8" y2="15" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="-5" x2="8" y2="15" stroke="#92400e" stroke-width="2"/>
    <!-- 人3 -->
    <circle cx="40" cy="-40" r="10" fill="#f59e0b" opacity="0.7"/>
    <line x1="40" y1="-30" x2="40" y2="-5" stroke="#92400e" stroke-width="2.5"/>
    <line x1="40" y1="-20" x2="28" y2="-10" stroke="#92400e" stroke-width="2"/>
    <line x1="40" y1="-20" x2="52" y2="-10" stroke="#92400e" stroke-width="2"/>
    <line x1="40" y1="-5" x2="32" y2="15" stroke="#92400e" stroke-width="2"/>
    <line x1="40" y1="-5" x2="48" y2="15" stroke="#92400e" stroke-width="2"/>
  </g>

  <!-- ラベル -->
  <text x="200" y="310" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle" opacity="0.9">製鉄業</text>
  <text x="420" y="260" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle" opacity="0.85">富の創出</text>
  <text x="740" y="130" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">社会への還元</text>

  <!-- タイトルテキスト -->
  <text x="500" y="390" font-family="'Hiragino Sans', sans-serif" font-size="16" fill="#b45309" text-anchor="middle" letter-spacing="2" opacity="0.8">工場で生まれた富は、やがて社会全体へと流れ出す</text>
</svg>
