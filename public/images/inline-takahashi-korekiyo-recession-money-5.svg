  </defs>
  <rect width="1000" height="420" fill="url(#bg_5)"/>
  <circle cx="920" cy="60" r="120" fill="#fde68a" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#fbbf24" opacity="0.3"/>
  
  <!-- crowd arrows going down-left -->
  <line x1="250" y1="160" x2="380" y2="290" stroke="#d97706" stroke-width="6" opacity="0.3"/>
  <line x1="310" y1="150" x2="440" y2="280" stroke="#d97706" stroke-width="6" opacity="0.3"/>
  <line x1="370" y1="155" x2="500" y2="285" stroke="#d97706" stroke-width="6" opacity="0.3"/>
  <!-- single bold arrow going up-right -->
  <line x1="450" y1="330" x2="700" y2="130" stroke="#92400e" stroke-width="10" opacity="0.7"/>
  <polygon points="700,130 672,155 695,170" fill="#92400e" opacity="0.8"/>
  <!-- contrarian coin -->
  <circle cx="700" cy="130" r="32" fill="#fbbf24" opacity="0.7"/>
