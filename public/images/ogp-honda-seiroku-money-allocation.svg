<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="hsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#hsBg)"/>

  <!-- single coin stack at the source (left) representing income -->
  <g>
    <ellipse cx="180" cy="330" rx="70" ry="20" fill="#d97706"/>
    <ellipse cx="180" cy="312" rx="70" ry="20" fill="#f59e0b"/>
    <ellipse cx="180" cy="294" rx="70" ry="20" fill="#d97706"/>
    <ellipse cx="180" cy="276" rx="70" ry="20" fill="#f59e0b"/>
    <ellipse cx="180" cy="258" rx="70" ry="20" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- pipe splitting into 4 equal channels: one quarter peels off (saved/invested), three quarters flow to daily life -->
  <path d="M 180 350 L 180 400" stroke="#92400e" stroke-width="14" fill="none"/>

  <!-- divider showing 1/4 vs 3/4 split -->
  <path d="M 180 400 C 180 430, 120 440, 90 470 C 60 500, 60 540, 90 560"
        stroke="#92400e" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 180 400 C 180 440, 280 450, 380 470 C 560 505, 760 495, 980 470"
        stroke="#d97706" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- the 1/4 channel grows into a tree (compounding / invested capital) -->
  <g transform="translate(90,470)">
    <rect x="-9" y="0" width="18" height="80" fill="#92400e"/>
    <circle cx="0" cy="-40" r="58" fill="#f59e0b"/>
    <circle cx="-44" cy="-10" r="38" fill="#d97706"/>
    <circle cx="44" cy="-10" r="38" fill="#d97706"/>
    <circle cx="0" cy="-85" r="34" fill="#fde68a"/>
  </g>

  <!-- coin orbiting the tree, symbolizing compound reinvestment -->
  <circle cx="90" cy="350" r="160" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>
  <circle cx="220" cy="220" r="16" fill="#fde68a" stroke="#92400e" stroke-width="3"/>

  <!-- 3/4 channel widens into open hands releasing coins (the later-life giving away of wealth) -->
  <g transform="translate(980,420)">
    <path d="M -90 60 C -90 10, -50 -20, 0 -20 C 50 -20, 90 10, 90 60 L 90 90 L -90 90 Z" fill="#92400e" opacity="0.85"/>
    <path d="M -70 0 C -70 -30, -30 -50, 0 -50 C 30 -50, 70 -30, 70 0" fill="none" stroke="#92400e" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- coins flying outward from the open hands, symbolizing the large donation -->
  <circle cx="1080" cy="290" r="20" fill="#f59e0b"/>
  <circle cx="1140" cy="340" r="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="1015" cy="260" r="13" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="1100" cy="220" r="10" fill="#f59e0b"/>

  <!-- small institution silhouette (school/public works) receiving the gift -->
  <g transform="translate(1080,500)" opacity="0.55">
    <polygon points="-60,0 0,-40 60,0" fill="#92400e"/>
    <rect x="-50" y="0" width="100" height="44" fill="#92400e"/>
    <rect x="-12" y="14" width="24" height="30" fill="#fef3c7"/>
  </g>
</svg>
