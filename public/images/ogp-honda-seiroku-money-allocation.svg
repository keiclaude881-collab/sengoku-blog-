<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- 育つ木（複利・成長のメタファー） -->
  <g transform="translate(330,470)" opacity="0.85">
    <rect x="-10" y="-130" width="20" height="130" fill="#92400e" opacity="0.6"/>
    <circle cx="0" cy="-160" r="64" fill="#d97706" opacity="0.55"/>
    <circle cx="-46" cy="-128" r="42" fill="#b45309" opacity="0.55"/>
    <circle cx="48" cy="-132" r="46" fill="#f59e0b" opacity="0.55"/>
    <ellipse cx="0" cy="6" rx="74" ry="16" fill="#92400e" opacity="0.18"/>
  </g>

  <!-- 循環の矢印: 増やす → 還元する -->
  <g transform="translate(840,420)" opacity="0.8">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="13 9" stroke-linecap="round"/>
    <path d="M 76 -36 L 92 -54 L 102 -32 Z" fill="#b45309"/>
  </g>
  <text x="840" y="396" font-family="'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle" opacity="0.85">貯める</text>
  <text x="840" y="426" font-family="'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle" opacity="0.85">↓</text>
  <text x="840" y="456" font-family="'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle" opacity="0.85">活かして使う</text>

  <!-- カテゴリラベル -->
  <rect x="700" y="170" width="120" height="36" rx="18" fill="#fef3c7" stroke="#fde68a"/>
  <text x="760" y="194" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">投資・お金</text>

  <!-- タイトル -->
  <text x="700" y="262" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">本多静六に学ぶ</text>
  <text x="700" y="304" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">お金の「使い方」</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
