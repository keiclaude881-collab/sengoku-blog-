<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf8fc"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#ecdffa" stroke-width="2"/>

  <!-- ローマ皇帝の胸像シルエット -->
  <circle cx="340" cy="270" r="50" fill="#6b21a8" opacity="0.8"/>
  <path d="M 270 470
           C 270 400 300 366 340 366
           C 380 366 410 400 410 470 Z"
        fill="#6b21a8" opacity="0.8"/>
  <path d="M 300 250 Q 340 230 380 250 L 380 262 Q 340 246 300 262 Z" fill="#f3e8ff" opacity="0.7"/>
  <rect x="240" y="470" width="200" height="16" rx="3" fill="#6b21a8" opacity="0.55"/>

  <!-- 滑らかに右肩上がりの成長曲線 -->
  <polyline points="700,570 780,540 860,500 940,450 1020,410 1100,360"
            fill="none" stroke="#9333ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="700" cy="570" r="6" fill="#9333ea"/>
  <circle cx="1100" cy="360" r="6" fill="#6b21a8"/>
  <line x1="700" y1="600" x2="1100" y2="600" stroke="#e9d5ff" stroke-width="2"/>
  <line x1="700" y1="600" x2="700" y2="360" stroke="#e9d5ff" stroke-width="2"/>

  <!-- カテゴリラベル -->
  <rect x="660" y="180" width="100" height="36" rx="18" fill="#f3e8ff" stroke="#e9d5ff"/>
  <text x="710" y="204" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="1">思考法</text>

  <!-- タイトル -->
  <text x="660" y="280" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">ストア哲学と</text>
  <text x="660" y="324" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">インデックス投資</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
