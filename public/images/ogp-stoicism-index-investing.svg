<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad9)"/>

  <!-- distant calm sun -->
  <circle cx="600" cy="160" r="60" fill="#e9d5ff" opacity="0.9"/>

  <!-- a steady, unmoved mountain (stoic calm) -->
  <path d="M 0 470 L 280 190 L 480 400 L 620 250 L 900 470 Z" fill="#9333ea" opacity="0.55"/>
  <path d="M 280 190 L 350 270 L 230 290 Z" fill="#f3e8ff" opacity="0.85"/>
  <path d="M 620 250 L 670 320 L 580 330 Z" fill="#f3e8ff" opacity="0.7"/>
  <path d="M 200 470 L 480 240 L 760 470 Z" fill="#7e22ce" opacity="0.5"/>

  <!-- a calm flat sea below, with a smooth, only-gently-rising line (steady investing through volatility) -->
  <rect x="0" y="470" width="1200" height="160" fill="#d8b4fe" opacity="0.35"/>
  <path d="M 0 510 Q 80 495 160 510 Q 240 525 320 510 Q 400 495 480 510 Q 560 525 640 505 Q 720 485 800 495 Q 880 505 960 480 Q 1040 455 1120 460 Q 1170 463 1200 455"
        fill="none" stroke="#6b21a8" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="0" cy="510" r="8" fill="#7e22ce"/>
  <circle cx="1200" cy="455" r="8" fill="#6b21a8"/>

  <!-- gentle ripples -->
  <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 60 560 Q 150 545 240 560 Q 330 575 420 560"/>
    <path d="M 500 590 Q 590 575 680 590 Q 770 605 860 590"/>
    <path d="M 900 555 Q 990 540 1080 555 Q 1140 564 1180 558"/>
  </g>
</svg>
