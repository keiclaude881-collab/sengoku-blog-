<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Ideal world (Forms): shadows below, true forms above with light rays -->
  <!-- Ground level (phenomenal world) -->
  <rect x="100" y="300" width="800" height="100" fill="#ddd6fe" opacity="0.25"/>
  <!-- Shadows on ground (imperfect copies) -->
  <ellipse cx="250" cy="328" rx="80" ry="22" fill="#6b21a8" opacity="0.2"/>
  <ellipse cx="500" cy="338" rx="90" ry="20" fill="#6b21a8" opacity="0.2"/>
  <ellipse cx="750" cy="328" rx="70" ry="20" fill="#6b21a8" opacity="0.2"/>
  <!-- True Forms (above) -->
  <polygon points="250,158 310,258 190,258" fill="#7c3aed" opacity="0.7"/>
  <circle cx="500" cy="208" r="70" fill="#7c3aed" opacity="0.65"/>
  <rect x="680" y="148" width="140" height="120" rx="8" fill="#7c3aed" opacity="0.65"/>
  <!-- Light rays from Forms down to ground -->
  <line x1="250" y1="258" x2="250" y2="305" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="500" y1="278" x2="500" y2="312" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="750" y1="268" x2="750" y2="305" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="6,4" opacity="0.4"/>
  <!-- Line separating two worlds -->
  <line x1="100" y1="295" x2="900" y2="295" stroke="#c4b5fd" stroke-width="4" opacity="0.4"/>

</svg>