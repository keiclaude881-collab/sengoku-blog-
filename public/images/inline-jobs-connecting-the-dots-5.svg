<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Waste → treasure: transform junk into gold -->
  <!-- "Waste" pile (left) - varied scattered shapes -->
  <circle cx="180" cy="280" r="25" fill="#bfdbfe" opacity="0.5"/>
  <rect x="130" y="250" width="40" height="30" rx="4" fill="#bfdbfe" opacity="0.45"/>
  <polygon points="200,240 230,270 170,270" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="240" cy="300" r="18" fill="#bfdbfe" opacity="0.45"/>
  <rect x="150" y="305" width="35" height="25" rx="3" fill="#bfdbfe" opacity="0.4"/>
  <!-- Transformation arrow (alchemical/magic) -->
  <line x1="320" y1="265" x2="500" y2="265" stroke="#1d4ed8" stroke-width="7"/>
  <polyline points="486,252 503,265 486,278" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <!-- Sparkle marks on arrow -->
  <line x1="395" y1="248" x2="395" y2="258" stroke="#93c5fd" stroke-width="3"/>
  <line x1="410" y1="253" x2="380" y2="253" stroke="#93c5fd" stroke-width="3"/>
  <!-- Gold/treasure (right): neatly stacked coins -->
  <circle cx="680" cy="278" r="32" fill="#1d4ed8" opacity="0.85"/>
  <circle cx="680" cy="250" r="32" fill="#1d4ed8" opacity="0.75"/>
  <circle cx="680" cy="222" r="32" fill="#1d4ed8" opacity="0.65"/>
  <circle cx="750" cy="285" r="28" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="750" cy="260" r="28" fill="#1d4ed8" opacity="0.7"/>
  <!-- Glow rings -->
  <circle cx="700" cy="250" r="90" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.3"/>

</svg>