<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bg_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg_3)"/>
  <circle cx="920" cy="60" r="120" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#c4b5fd" opacity="0.3"/>
  
  <!-- single trunk rising -->
  <rect x="487" y="300" width="26" height="90" rx="8" fill="#6b21a8" opacity="0.5"/>
  <!-- branch split -->
  <line x1="500" y1="300" x2="350" y2="200" stroke="#7c3aed" stroke-width="8" opacity="0.45" stroke-linecap="round"/>
  <line x1="500" y1="300" x2="650" y2="200" stroke="#7c3aed" stroke-width="8" opacity="0.45" stroke-linecap="round"/>
  <!-- second split -->
  <line x1="350" y1="200" x2="250" y2="130" stroke="#7c3aed" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <line x1="350" y1="200" x2="450" y2="130" stroke="#7c3aed" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <line x1="650" y1="200" x2="550" y2="130" stroke="#7c3aed" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <line x1="650" y1="200" x2="750" y2="130" stroke="#7c3aed" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <!-- leaf nodes -->
  <circle cx="250" cy="130" r="22" fill="#7c3aed" opacity="0.5"/>
  <circle cx="450" cy="130" r="22" fill="#7c3aed" opacity="0.5"/>
  <circle cx="550" cy="130" r="22" fill="#6b21a8" opacity="0.5"/>
  <circle cx="750" cy="130" r="22" fill="#6b21a8" opacity="0.5"/>

</svg>