<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- exponential growth curve -->
  <path d="M 100 540 C 300 535 500 510 650 440 C 780 375 880 270 1100 100" fill="none" stroke="url(#lineGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- dots on the curve marking milestones -->
  <g fill="#92400e">
    <circle cx="100" cy="540" r="10"/>
    <circle cx="350" cy="528" r="13"/>
    <circle cx="580" cy="490" r="16"/>
    <circle cx="780" cy="390" r="19"/>
    <circle cx="950" cy="240" r="22"/>
    <circle cx="1100" cy="100" r="26"/>
  </g>

  <!-- coin stack at the end -->
  <g transform="translate(1100,60)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="40" ry="12" fill="#f59e0b"/>
    <rect x="-40" y="-30" width="80" height="30" fill="#d97706"/>
    <ellipse cx="0" cy="-30" rx="40" ry="12" fill="#fbbf24"/>
    <rect x="-40" y="-58" width="80" height="28" fill="#d97706"/>
    <ellipse cx="0" cy="-58" rx="40" ry="12" fill="#fbbf24"/>
  </g>

  <!-- small coin at start (zero) -->
  <g transform="translate(100,556)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="18" ry="6" fill="#fde68a"/>
  </g>

  <!-- network lines connecting nodes (information/relationship network) -->
  <g stroke="#fde68a" stroke-width="2" opacity="0.5">
    <line x1="350" y1="528" x2="580" y2="490"/>
    <line x1="580" y1="490" x2="780" y2="390"/>
    <line x1="580" y1="490" x2="480" y2="200"/>
    <line x1="780" y1="390" x2="950" y2="240"/>
    <line x1="780" y1="390" x2="700" y2="150"/>
  </g>

  <!-- small node circles on network -->
  <g fill="#f59e0b" opacity="0.6">
    <circle cx="480" cy="200" r="8"/>
    <circle cx="700" cy="150" r="8"/>
    <circle cx="900" cy="350" r="7"/>
  </g>

  <!-- decorative corner accent -->
  <circle cx="150" cy="130" r="60" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.4"/>
  <circle cx="150" cy="130" r="90" fill="none" stroke="#fde68a" stroke-width="1" opacity="0.25"/>
</svg>
