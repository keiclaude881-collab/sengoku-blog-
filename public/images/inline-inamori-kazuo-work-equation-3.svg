<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Equation: Ability × Effort × Mindset (multiplicative) -->
  <!-- Three circles with multiplication signs -->
  <circle cx="200" cy="210" r="70" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="200" cy="210" r="70" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Ability: gear -->
  <circle cx="200" cy="210" r="32" fill="#1e40af" opacity="0.6"/>
  <circle cx="200" cy="210" r="20" fill="#eff6ff"/>
  
  <!-- × sign -->
  <line x1="290" y1="200" x2="315" y2="220" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="315" y1="200" x2="290" y2="220" stroke="#1d4ed8" stroke-width="5"/>
  
  <circle cx="400" cy="210" r="70" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="400" cy="210" r="70" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Effort: flame -->
  <path d="M 400 250 C 380 230 375 205 390 185 C 390 185 392 195 400 195 C 408 195 422 175 420 155 C 435 175 440 200 428 225 C 435 215 438 200 432 192 C 445 210 445 240 400 250 Z"
        fill="#1d4ed8" opacity="0.75"/>
  
  <!-- × sign -->
  <line x1="490" y1="200" x2="515" y2="220" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="515" y1="200" x2="490" y2="220" stroke="#1d4ed8" stroke-width="5"/>
  
  <circle cx="620" cy="210" r="70" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="620" cy="210" r="70" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Mindset: up arrow (positive) -->
  <line x1="620" y1="248" x2="620" y2="180" stroke="#1e40af" stroke-width="6"/>
  <polyline points="604,197 620,175 636,197" fill="none" stroke="#1e40af" stroke-width="6"/>
  
  <!-- = result box -->
  <line x1="710" y1="200" x2="740" y2="200" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="710" y1="220" x2="740" y2="220" stroke="#1d4ed8" stroke-width="5"/>
  <rect x="760" y="155" width="180" height="110" rx="8" fill="#1e40af" opacity="0.25"/>
  <rect x="760" y="155" width="180" height="110" rx="8" fill="none" stroke="#1d4ed8" stroke-width="5"/>
  <!-- Big upward arrow in result -->
  <line x1="850" y1="240" x2="850" y2="175" stroke="#1d4ed8" stroke-width="7"/>
  <polyline points="832,193 850,168 868,193" fill="none" stroke="#1d4ed8" stroke-width="7"/>

</svg>