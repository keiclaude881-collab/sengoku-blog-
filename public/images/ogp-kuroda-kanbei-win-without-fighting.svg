<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Empty battlefield + open gate (win without fighting) -->
  <!-- ground plane -->
  <ellipse cx="600" cy="480" rx="480" ry="60" fill="#bfdbfe" opacity="0.25"/>
  <!-- castle gate (open) -->
  <!-- left tower -->
  <rect x="300" y="200" width="80" height="240" rx="6" fill="#3b82f6" opacity="0.70"/>
  <!-- right tower -->
  <rect x="820" y="200" width="80" height="240" rx="6" fill="#3b82f6" opacity="0.70"/>
  <!-- gate arch -->
  <path d="M 380,280 Q 600,180 820,280" fill="none" stroke="#1e40af" stroke-width="16" opacity="0.75"/>
  <!-- open gate doors (swung open = no resistance) -->
  <rect x="380" y="280" width="80" height="160" rx="4" fill="#1e40af" opacity="0.50" transform="rotate(-35 380 280)"/>
  <rect x="820" y="280" width="80" height="160" rx="4" fill="#1e40af" opacity="0.50" transform="rotate(35 820 280)"/>
  <!-- victory path through empty gate -->
  <line x1="600" y1="310" x2="600" y2="490" stroke="#60a5fa" stroke-width="10" stroke-dasharray="18,10" opacity="0.55"/>
</svg>