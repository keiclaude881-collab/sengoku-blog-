<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7faff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dbeafe" stroke-width="2"/>

  <!-- 軍配/扇のモチーフ(指揮・采配の象徴) -->
  <g transform="translate(330,360)" opacity="0.85">
    <path d="M 0 0 L -120 -64 A 132 132 0 0 1 120 -64 Z" fill="#dbeafe" opacity="0.7"/>
    <path d="M 0 0 L -90 -82" stroke="#1e40af" stroke-width="2" opacity="0.55"/>
    <path d="M 0 0 L -40 -118" stroke="#1e40af" stroke-width="2" opacity="0.55"/>
    <path d="M 0 0 L 40 -118" stroke="#1e40af" stroke-width="2" opacity="0.55"/>
    <path d="M 0 0 L 90 -82" stroke="#1e40af" stroke-width="2" opacity="0.55"/>
    <path d="M -120 -64 A 132 132 0 0 1 120 -64" fill="none" stroke="#1e40af" stroke-width="3" opacity="0.55"/>
    <rect x="-9" y="0" width="18" height="100" rx="5" fill="#1e3a8a" opacity="0.7"/>
    <circle cx="0" cy="-58" r="14" fill="#1e3a8a" opacity="0.6"/>
  </g>

  <!-- 静かな盤面（戦わずして勝つ＝盤上で完結するイメージ） -->
  <g transform="translate(840,470)" opacity="0.7">
    <rect x="-110" y="-110" width="220" height="220" rx="6" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="-110" y1="-37" x2="110" y2="-37" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <line x1="-110" y1="37" x2="110" y2="37" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <line x1="-37" y1="-110" x2="-37" y2="110" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <line x1="37" y1="-110" x2="37" y2="110" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <circle cx="-37" cy="-37" r="14" fill="#1e40af" opacity="0.75"/>
    <circle cx="37" cy="37" r="14" fill="#93c5fd" opacity="0.85"/>
  </g>

  <!-- カテゴリラベル -->
  <rect x="700" y="170" width="120" height="36" rx="18" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="760" y="194" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="1">仕事・副業</text>

  <!-- タイトル -->
  <text x="700" y="262" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">黒田官兵衛に学ぶ</text>
  <text x="700" y="304" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">「戦わずして勝つ」戦略</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
