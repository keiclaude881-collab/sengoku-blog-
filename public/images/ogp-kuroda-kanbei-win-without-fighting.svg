<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="kkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#kkBg)"/>

  <!-- open war fan (gunbai), the strategist's tool, centered as the dominant motif -->
  <g transform="translate(600,330)">
    <path d="M 0 0 L -260 -150 A 290 290 0 0 1 260 -150 Z" fill="#bfdbfe" opacity="0.8"/>
    <path d="M -260 -150 A 290 290 0 0 1 260 -150" fill="none" stroke="#1e40af" stroke-width="5"/>
    <path d="M 0 0 L -195 -170" stroke="#1e40af" stroke-width="2.5" opacity="0.55"/>
    <path d="M 0 0 L -110 -210" stroke="#1e40af" stroke-width="2.5" opacity="0.55"/>
    <path d="M 0 0 L 0 -225" stroke="#1e40af" stroke-width="2.5" opacity="0.55"/>
    <path d="M 0 0 L 110 -210" stroke="#1e40af" stroke-width="2.5" opacity="0.55"/>
    <path d="M 0 0 L 195 -170" stroke="#1e40af" stroke-width="2.5" opacity="0.55"/>
    <rect x="-12" y="0" width="24" height="160" rx="6" fill="#1e3a8a"/>
    <circle cx="0" cy="-78" r="20" fill="#3b82f6"/>
  </g>

  <!-- two opposing circular formations (armies) on either side, separated by calm space rather than clashing -->
  <g opacity="0.85">
    <circle cx="190" cy="470" r="70" fill="#1e40af"/>
    <circle cx="160" cy="430" r="14" fill="#93c5fd"/>
    <circle cx="210" cy="420" r="14" fill="#93c5fd"/>
    <circle cx="170" cy="500" r="14" fill="#93c5fd"/>
    <circle cx="220" cy="495" r="14" fill="#93c5fd"/>
  </g>
  <g opacity="0.6">
    <circle cx="1010" cy="470" r="70" fill="#3b82f6"/>
    <circle cx="980" cy="430" r="14" fill="#dbeafe"/>
    <circle cx="1030" cy="420" r="14" fill="#dbeafe"/>
    <circle cx="990" cy="500" r="14" fill="#dbeafe"/>
    <circle cx="1040" cy="495" r="14" fill="#dbeafe"/>
  </g>

  <!-- a calm gap between the two forces, with a single dashed line meeting peacefully in the middle (negotiation, not battle) -->
  <path d="M 280 480 C 400 475, 480 480, 600 480" fill="none" stroke="#1e40af" stroke-width="3" stroke-dasharray="4 10" opacity="0.6"/>
  <path d="M 600 480 C 720 480, 800 475, 920 480" fill="none" stroke="#1e40af" stroke-width="3" stroke-dasharray="4 10" opacity="0.6"/>
  <circle cx="600" cy="480" r="12" fill="#1e40af"/>

  <!-- soft radiating rings from the fan, suggesting influence/persuasion spreading outward without conflict -->
  <circle cx="600" cy="330" r="230" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.4"/>
  <circle cx="600" cy="330" r="290" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.3"/>
</svg>
