<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <text x="500" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">「今日死んでも悔いないか」——毎朝の問い</text>

  <!-- カレンダー外枠 -->
  <rect x="280" y="70" width="440" height="300" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
  <!-- カレンダーヘッダー -->
  <rect x="280" y="70" width="440" height="56" rx="12" fill="#6b21a8"/>
  <rect x="280" y="104" width="440" height="22" fill="#6b21a8"/>
  <text x="500" y="104" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">2026年 6月</text>

  <!-- 曜日 -->
  <text x="320" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">日</text>
  <text x="383" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">月</text>
  <text x="446" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">火</text>
  <text x="509" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">水</text>
  <text x="572" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">木</text>
  <text x="635" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">金</text>
  <text x="698" y="146" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">土</text>
  <line x1="290" y1="152" x2="710" y2="152" stroke="#e9d5ff" stroke-width="1"/>

  <!-- 日付（簡略） -->
  <text x="635" y="180" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">1</text>
  <text x="698" y="180" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">2</text>
  <text x="320" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">3</text>
  <text x="383" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">4</text>
  <text x="446" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">5</text>
  <text x="509" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">6</text>
  <text x="572" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">7</text>
  <text x="635" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">8</text>
  <text x="698" y="215" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">9</text>
  <text x="320" y="250" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">10</text>
  <!-- 今日（9日）をハイライト -->
  <circle cx="698" cy="206" r="20" fill="#6b21a8"/>
  <text x="698" y="212" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
  <!-- 「今日」ラベル -->
  <text x="698" y="234" font-family="sans-serif" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle">今日</text>

  <!-- 残り日数の表示 -->
  <rect x="310" y="265" width="380" height="80" rx="8" fill="#fdf4ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="500" y="295" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">今日が最後の日なら——</text>
  <text x="500" y="325" font-family="sans-serif" font-size="17" font-weight="700" fill="#6b21a8" text-anchor="middle">あなたは何をしますか？</text>

  <!-- 左側コメント -->
  <text x="150" y="200" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">毎朝</text>
  <text x="150" y="222" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">問う</text>
  <line x1="190" y1="210" x2="270" y2="210" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="270,210 255,204 255,216" fill="#8b5cf6"/>

  <!-- 右側コメント -->
  <text x="840" y="200" font-family="sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">死を意識すると</text>
  <text x="840" y="220" font-family="sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">本質が浮かぶ</text>
</svg>
