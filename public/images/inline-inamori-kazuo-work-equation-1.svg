<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Talented person with no results: person with star but empty results box -->
  <circle cx="280" cy="188" r="38" fill="#93c5fd" opacity="0.7"/>
  <rect x="242" y="226" width="76" height="100" rx="8" fill="#93c5fd" opacity="0.6"/>
  <!-- Star badge (talent) -->
  <polygon points="280,148 287,168 308,168 292,180 298,200 280,188 262,200 268,180 252,168 273,168"
           fill="#93c5fd" opacity="0.9"/>
  <!-- Results box (empty, question marks) -->
  <rect x="520" y="148" width="260" height="160" rx="8" fill="none" stroke="#1e40af" stroke-width="5" opacity="0.5"/>
  <!-- Empty/question -->
  <line x1="600" y1="208" x2="720" y2="208" stroke="#bfdbfe" stroke-width="5" stroke-dasharray="12,8" opacity="0.6"/>
  <!-- Arrow from person to results box (broken) -->
  <line x1="360" y1="228" x2="510" y2="228" stroke="#1e40af" stroke-width="5" stroke-dasharray="10,8" opacity="0.5"/>
  <polyline points="497,215 513,228 497,241" fill="none" stroke="#1e40af" stroke-width="5" opacity="0.5"/>

</svg>