<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7ff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 静かに満ちていく月のイメージ(機が熟すのを待つ) -->
  <g transform="translate(330,440)" opacity="0.8">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
    <path d="M 0 -68 A 68 68 0 1 0 0 68 A 50 50 0 1 1 0 -68 Z" fill="#6b21a8" opacity="0.7"/>
    <circle cx="118" cy="-62" r="5" fill="#a855f7" opacity="0.6"/>
    <circle cx="98" cy="-92" r="3" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- 静かに伸びる一本の道(布石を打ち続ける) -->
  <g transform="translate(870,420)" opacity="0.7">
    <path d="M -100 80 L 90 -90" stroke="#6b21a8" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/>
    <circle cx="-100" cy="80" r="6" fill="#6b21a8"/>
    <circle cx="-30" cy="10" r="6" fill="#a855f7" opacity="0.7"/>
    <circle cx="40" cy="-60" r="6" fill="#a855f7" opacity="0.5"/>
    <path d="M 90 -90 L 60 -86 M 90 -90 L 86 -60" stroke="#6b21a8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- カテゴリラベル -->
  <rect x="700" y="170" width="148" height="36" rx="18" fill="#f3e8ff" stroke="#e9d5ff"/>
  <text x="774" y="194" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="1">思考法 / 戦略</text>

  <!-- タイトル -->
  <text x="700" y="262" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">徳川家康に学ぶ</text>
  <text x="700" y="304" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">「待つ力」という戦略</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
