<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Anger/frustration: person with ignored work next to unrecognized papers -->
  <circle cx="280" cy="188" r="38" fill="#1e40af" opacity="0.7"/>
  <rect x="244" y="226" width="72" height="100" rx="8" fill="#1e40af" opacity="0.6"/>
  <!-- Papers/research with arrows being dismissed -->
  <rect x="480" y="178" width="160" height="200" rx="6" fill="#bfdbfe" opacity="0.3"/>
  <rect x="480" y="178" width="160" height="200" rx="6" fill="none" stroke="#93c5fd" stroke-width="4" stroke-dasharray="8,5"/>
  <line x1="510" y1="225" x2="600" y2="225" stroke="#93c5fd" stroke-width="4" opacity="0.5"/>
  <line x1="510" y1="250" x2="590" y2="250" stroke="#93c5fd" stroke-width="3" opacity="0.4"/>
  <line x1="510" y1="275" x2="610" y2="275" stroke="#93c5fd" stroke-width="3" opacity="0.4"/>
  <!-- X mark over the recognition -->
  <line x1="680" y1="178" x2="760" y2="258" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
  <line x1="760" y1="178" x2="680" y2="258" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
  <!-- Anger lines from person -->
  <line x1="320" y1="178" x2="360" y2="160" stroke="#1e40af" stroke-width="3" opacity="0.6"/>
  <line x1="330" y1="185" x2="375" y2="172" stroke="#1e40af" stroke-width="3" opacity="0.5"/>

</svg>