<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Turtle (defense) + coin stacks -->
  <!-- turtle body (oval shell) -->
  <ellipse cx="540" cy="320" rx="200" ry="165" fill="#d97706" opacity="0.70"/>
  <!-- shell hexagonal segments -->
  <!-- center hex -->
  <polygon points="540,255 590,285 590,345 540,375 490,345 490,285"
           fill="none" stroke="#fde68a" stroke-width="4" opacity="0.6"/>
  <!-- top hex -->
  <polygon points="540,195 590,225 590,255 540,255 490,255 490,225"
           fill="none" stroke="#fde68a" stroke-width="3" opacity="0.4"/>
  <!-- bottom hex -->
  <polygon points="540,375 590,375 590,405 540,435 490,405 490,375"
           fill="none" stroke="#fde68a" stroke-width="3" opacity="0.4"/>
  <!-- left hex -->
  <polygon points="390,285 440,255 490,285 490,345 440,375 390,345"
           fill="none" stroke="#fde68a" stroke-width="3" opacity="0.4"/>
  <!-- right hex -->
  <polygon points="590,285 640,255 690,285 690,345 640,375 590,345"
           fill="none" stroke="#fde68a" stroke-width="3" opacity="0.4"/>
  <!-- head -->
  <ellipse cx="540" cy="132" rx="52" ry="44" fill="#d97706" opacity="0.72"/>
  <!-- 4 legs -->
  <ellipse cx="350" cy="250" rx="42" ry="28" fill="#d97706" opacity="0.60" transform="rotate(-30 350 250)"/>
  <ellipse cx="730" cy="250" rx="42" ry="28" fill="#d97706" opacity="0.60" transform="rotate(30 730 250)"/>
  <ellipse cx="350" cy="390" rx="42" ry="28" fill="#d97706" opacity="0.60" transform="rotate(30 350 390)"/>
  <ellipse cx="730" cy="390" rx="42" ry="28" fill="#d97706" opacity="0.60" transform="rotate(-30 730 390)"/>
  <!-- coin stacks (right side) -->
  <ellipse cx="870" cy="410" rx="65" ry="12" fill="#fbbf24" opacity="0.65"/>
  <ellipse cx="870" cy="397" rx="65" ry="12" fill="#fbbf24" opacity="0.75"/>
  <ellipse cx="870" cy="384" rx="65" ry="12" fill="#fbbf24" opacity="0.82"/>
  <ellipse cx="870" cy="371" rx="65" ry="12" fill="#fde68a" opacity="0.88"/>
  <ellipse cx="870" cy="355" rx="62" ry="11" fill="#fde68a" opacity="0.90"/>
  <rect x="808" y="355" width="124" height="55" fill="#fbbf24" opacity="0.50"/>
</svg>