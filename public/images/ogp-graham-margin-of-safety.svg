<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="gr-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gr-glow)"/>

  <!-- baseline -->
  <line x1="280" y1="500" x2="920" y2="500" stroke="#92400e" stroke-width="3" opacity="0.5"/>

  <!-- tall bar: intrinsic value -->
  <rect x="340" y="190" width="120" height="310" rx="10" fill="#92400e" opacity="0.85"/>

  <!-- short bar: market price -->
  <rect x="700" y="340" width="120" height="160" rx="10" fill="#f59e0b" opacity="0.85"/>

  <!-- cushion / margin-of-safety gap, drawn as a soft padded bracket between the two heights -->
  <path d="M 500 195 C 560 195 560 335 600 340" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <rect x="500" y="195" width="200" height="145" rx="16" fill="#fde68a" opacity="0.5"/>

  <!-- small cushioning chevrons inside the gap, like a shock absorber -->
  <g stroke="#b45309" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M 540 230 l 30 20 l -30 20"/>
    <path d="M 600 230 l 30 20 l -30 20"/>
    <path d="M 540 290 l 30 20 l -30 20"/>
    <path d="M 600 290 l 30 20 l -30 20"/>
  </g>

  <!-- a falling/crashing arrow approaching from upper right, deflected by the cushion -->
  <path d="M 1040 160 C 980 230 900 290 830 330" stroke="#dc2626" stroke-width="5" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M 845 312 L 830 330 L 850 334 Z" fill="#dc2626" opacity="0.6"/>

  <!-- the cushion absorbs it: small burst shape where arrow meets the bracket -->
  <circle cx="700" cy="335" r="22" fill="#fde68a" opacity="0.8"/>
  <circle cx="700" cy="335" r="10" fill="#d97706"/>

  <!-- coin accents grounding the "value" bar -->
  <g transform="translate(400,520)">
    <ellipse cx="0" cy="14" rx="40" ry="12" fill="#d97706"/>
    <ellipse cx="0" cy="-2" rx="40" ry="12" fill="#fbbf24"/>
  </g>

  <!-- decorative motes -->
  <circle cx="160" cy="150" r="18" fill="#fde68a" opacity="0.6"/>
  <circle cx="1110" cy="540" r="20" fill="#f59e0b" opacity="0.4"/>
  <circle cx="1080" cy="120" r="12" fill="#d97706" opacity="0.35"/>
</svg>
