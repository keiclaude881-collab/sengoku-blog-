<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#ddd6fe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#ddd6fe" opacity="0.12"/>
  <!-- Military fan / Gunbai (軍配 - war fan used by generals) -->
  <!-- handle -->
  <rect x="583" y="430" width="34" height="140" rx="10" fill="#6b21a8" opacity="0.80"/>
  <!-- handle grip wrapping -->
  <rect x="575" y="460" width="50" height="12" rx="4" fill="#ddd6fe" opacity="0.45"/>
  <rect x="575" y="490" width="50" height="12" rx="4" fill="#ddd6fe" opacity="0.45"/>
  <rect x="575" y="520" width="50" height="12" rx="4" fill="#ddd6fe" opacity="0.45"/>
  <!-- fan body (large semicircle) -->
  <path d="M 280,430 A 320,320 0 0,1 920,430 Z" fill="#8b5cf6" opacity="0.72"/>
  <!-- fan top edge arc -->
  <path d="M 280,430 A 320,320 0 0,1 920,430" fill="none" stroke="#ddd6fe" stroke-width="8" opacity="0.55"/>
  <!-- radial lines (fan ribs) -->
  <g stroke="#ddd6fe" stroke-width="5" opacity="0.40">
    <line x1="600" y1="430" x2="280" y2="430"/>
    <line x1="600" y1="430" x2="310" y2="290"/>
    <line x1="600" y1="430" x2="400" y2="155"/>
    <line x1="600" y1="430" x2="520" y2="112"/>
    <line x1="600" y1="430" x2="600" y2="110"/>
    <line x1="600" y1="430" x2="680" y2="112"/>
    <line x1="600" y1="430" x2="800" y2="155"/>
    <line x1="600" y1="430" x2="890" y2="290"/>
    <line x1="600" y1="430" x2="920" y2="430"/>
  </g>
  <!-- decorative circle in fan center -->
  <circle cx="600" cy="310" r="70" fill="none" stroke="#ddd6fe" stroke-width="6" opacity="0.35"/>
  <circle cx="600" cy="310" r="35" fill="#ddd6fe" opacity="0.20"/>
</svg>