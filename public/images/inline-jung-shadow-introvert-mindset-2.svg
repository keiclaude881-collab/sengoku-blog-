<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Introvert/extrovert spectrum: arrow scale with I on left E on right -->
  <!-- Scale bar -->
  <line x1="150" y1="210" x2="850" y2="210" stroke="#ddd6fe" stroke-width="8" stroke-linecap="round"/>
  <!-- Gradient fill (I side darker, E side lighter) -->
  <rect x="150" y="194" width="700" height="32" rx="16" fill="url(#bg)" opacity="0.3"/>
  <!-- Introvert zone (left) -->
  <circle cx="240" cy="210" r="55" fill="#7c3aed" opacity="0.5"/>
  <circle cx="240" cy="210" r="55" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <!-- Inward arrow (introvert) -->
  <line x1="240" y1="168" x2="240" y2="254" stroke="#6b21a8" stroke-width="5"/>
  <polyline points="225,178 240,160 255,178" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <!-- Extrovert zone (right) -->
  <circle cx="760" cy="210" r="55" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="760" cy="210" r="55" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <!-- Outward arrows (extrovert) -->
  <line x1="760" y1="248" x2="720" y2="184" stroke="#6b21a8" stroke-width="5"/>
  <line x1="760" y1="248" x2="800" y2="184" stroke="#6b21a8" stroke-width="5"/>
  <polyline points="714,196 718,180 730,192" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <polyline points="806,196 802,180 790,192" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <!-- Spectrum arrow marker -->
  <circle cx="500" cy="210" r="22" fill="#7c3aed" opacity="0.4"/>
  <circle cx="500" cy="210" r="22" fill="none" stroke="#7c3aed" stroke-width="5"/>

</svg>