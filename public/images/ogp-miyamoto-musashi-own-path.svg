<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#faf7ff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <!-- 左側の紫バー -->
  <rect x="0" y="0" width="12" height="630" fill="#6b21a8"/>

  <!-- 右側グラフィック：二本の刀と円 -->
  <circle cx="960" cy="315" r="180" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <circle cx="960" cy="315" r="140" fill="none" stroke="#d8b4fe" stroke-width="1.5"/>
  <!-- 刀1（右斜め） -->
  <line x1="870" y1="180" x2="1050" y2="450" stroke="#6b21a8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="870,180 860,168 882,172" fill="#6b21a8"/>
  <!-- 刀2（左斜め） -->
  <line x1="1050" y1="180" x2="870" y2="450" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1050,180 1062,168 1040,172" fill="#8b5cf6"/>
  <!-- 中心点 -->
  <circle cx="960" cy="315" r="8" fill="#a855f7"/>
  <circle cx="960" cy="315" r="3" fill="#fff"/>

  <!-- カテゴリバッジ -->
  <rect x="68" y="70" width="160" height="34" rx="17" fill="#ede9fe"/>
  <text x="148" y="93" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle">思考・マインド</text>

  <!-- タイトル -->
  <text x="68" y="200" font-family="'Noto Sans JP', sans-serif" font-size="62" font-weight="900" fill="#6b21a8">宮本武蔵の哲学</text>

  <!-- サブタイトル -->
  <text x="68" y="280" font-family="'Noto Sans JP', sans-serif" font-size="36" font-weight="700" fill="#374151">自分の基準を作る</text>

  <!-- 区切り線 -->
  <line x1="68" y1="320" x2="700" y2="320" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 説明テキスト -->
  <text x="68" y="380" font-family="'Noto Sans JP', sans-serif" font-size="24" fill="#6b7280">60回以上の決闘で無敗。強さの本質は</text>
  <text x="68" y="415" font-family="'Noto Sans JP', sans-serif" font-size="24" fill="#6b7280">「昨日の自分を超える」思考法にあった。</text>

  <!-- 引用 -->
  <rect x="68" y="460" width="680" height="80" rx="8" fill="#f3e8ff"/>
  <text x="88" y="496" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="700" fill="#6b21a8">「千日の稽古を鍛とし、万日の稽古を錬とす」</text>
  <text x="88" y="524" font-family="'Noto Sans JP', sans-serif" font-size="16" fill="#7c3aed">— 宮本武蔵『五輪書』</text>

  <!-- サイト名 -->
  <text x="68" y="594" font-family="'Noto Sans JP', sans-serif" font-size="18" fill="#9ca3af">偉人ラボ — ijin-lab.com</text>
</svg>
