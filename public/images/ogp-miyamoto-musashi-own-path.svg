<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf5ff"/>

  <!-- faint concentric circles behind figure: focus/dojo -->
  <circle cx="600" cy="330" r="230" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <circle cx="600" cy="330" r="170" fill="none" stroke="#d8b4fe" stroke-width="2"/>
  <circle cx="600" cy="330" r="110" fill="none" stroke="#d8b4fe" stroke-width="1.5" opacity="0.7"/>

  <!-- ground -->
  <ellipse cx="600" cy="540" rx="320" ry="20" fill="#e9d5ff" opacity="0.6"/>
  <line x1="180" y1="540" x2="1020" y2="540" stroke="#d8b4fe" stroke-width="2" opacity="0.6"/>

  <!-- single swordsman silhouette, mid-stance, sword raised -->
  <g transform="translate(600,330)">
    <!-- head -->
    <circle cx="0" cy="-150" r="34" fill="#6b21a8"/>
    <!-- body -->
    <path d="M -40 -110 Q -42 -40 -34 60 L 34 60 Q 42 -40 40 -110 Q 0 -130 -40 -110 Z" fill="#6b21a8"/>
    <!-- legs / stance -->
    <path d="M -34 60 L -64 200 L -36 210 L -10 78 Z" fill="#6b21a8"/>
    <path d="M 34 60 L 56 200 L 28 210 L 14 78 Z" fill="#6b21a8"/>
    <!-- raised arm holding sword -->
    <path d="M 30 -90 L 100 -160 L 88 -176 L 18 -110 Z" fill="#6b21a8"/>
    <!-- sword blade -->
    <line x1="100" y1="-160" x2="220" y2="-280" stroke="#9333ea" stroke-width="10" stroke-linecap="round"/>
    <line x1="220" y1="-280" x2="245" y2="-305" stroke="#7e22ce" stroke-width="6" stroke-linecap="round"/>
    <!-- other arm, low guard -->
    <path d="M -30 -90 L -90 -40 L -78 -22 L -16 -78 Z" fill="#6b21a8"/>
    <line x1="-90" y1="-40" x2="-150" y2="20" stroke="#9333ea" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- motion lines suggesting solitary practice -->
  <path d="M 760 160 Q 820 140 870 100" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-dasharray="6,8" opacity="0.7"/>
  <path d="M 800 210 Q 850 195 890 165" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-dasharray="6,8" opacity="0.5"/>

  <!-- single distant path/road, symbolizing "own path" walked alone -->
  <path d="M 600 560 C 600 480 600 400 600 330" stroke="#9333ea" stroke-width="3" stroke-dasharray="3,10" opacity="0.4" fill="none"/>

  <!-- scattered minimal dust/energy particles -->
  <circle cx="300" cy="220" r="5" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="270" cy="280" r="3.5" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="930" cy="240" r="4" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="960" cy="300" r="5" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="340" cy="450" r="4" fill="#d8b4fe" opacity="0.4"/>
  <circle cx="900" cy="460" r="4.5" fill="#d8b4fe" opacity="0.4"/>
</svg>
