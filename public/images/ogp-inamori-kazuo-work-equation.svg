<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- gear large left -->
  <g transform="translate(220,310)" opacity="0.5">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#3b82f6" stroke-width="18"/>
    <circle cx="0" cy="0" r="34" fill="#bfdbfe"/>
    <g fill="#3b82f6">
      <rect x="-12" y="-128" width="24" height="36" rx="4"/>
      <rect x="-12" y="92" width="24" height="36" rx="4"/>
      <rect x="-128" y="-12" width="36" height="24" rx="4"/>
      <rect x="92" y="-12" width="36" height="24" rx="4"/>
      <g transform="rotate(45)">
        <rect x="-12" y="-128" width="24" height="36" rx="4"/>
        <rect x="-12" y="92" width="24" height="36" rx="4"/>
        <rect x="-128" y="-12" width="36" height="24" rx="4"/>
        <rect x="92" y="-12" width="36" height="24" rx="4"/>
      </g>
    </g>
  </g>

  <!-- gear small right -->
  <g transform="translate(980,280)" opacity="0.5">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1e40af" stroke-width="14"/>
    <circle cx="0" cy="0" r="24" fill="#dbeafe"/>
    <g fill="#1e40af">
      <rect x="-9" y="-90" width="18" height="26" rx="3"/>
      <rect x="-9" y="64" width="18" height="26" rx="3"/>
      <rect x="-90" y="-9" width="26" height="18" rx="3"/>
      <rect x="64" y="-9" width="26" height="18" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-9" y="-90" width="18" height="26" rx="3"/>
        <rect x="-9" y="64" width="18" height="26" rx="3"/>
        <rect x="-90" y="-9" width="26" height="18" rx="3"/>
        <rect x="64" y="-9" width="26" height="18" rx="3"/>
      </g>
    </g>
  </g>

  <!-- equation: Result = Attitude × Effort × Ability -->
  <!-- Three rising bars representing the three multiplied factors -->
  <g opacity="0.85">
    <!-- Attitude bar -->
    <rect x="420" y="280" width="90" height="280" fill="#3b82f6" rx="6"/>
    <!-- Effort bar (tallest) -->
    <rect x="560" y="160" width="90" height="400" fill="#1e40af" rx="6"/>
    <!-- Ability bar -->
    <rect x="700" y="220" width="90" height="340" fill="#2563eb" rx="6"/>
  </g>

  <!-- × symbols between bars -->
  <g fill="#93c5fd" font-size="52" font-weight="bold" text-anchor="middle" opacity="0.8">
  </g>

  <!-- = Result arrow pointing right -->
  <path d="M 820 310 L 960 310" fill="none" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/>
  <polygon points="960,310 928,292 928,328" fill="#1e40af"/>

  <!-- star/result at end -->
  <g transform="translate(1000,310)" fill="#f59e0b" opacity="0.8">
    <polygon points="0,-36 9,-12 34,-12 14,5 22,30 0,16 -22,30 -14,5 -34,-12 -9,-12" />
  </g>

  <!-- baseline -->
  <rect x="400" y="560" width="430" height="4" fill="#bfdbfe" rx="2"/>

  <!-- background accent -->
  <circle cx="600" cy="80" r="50" fill="#bfdbfe" opacity="0.3"/>
</svg>
