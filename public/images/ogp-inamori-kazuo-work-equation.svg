<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>
  <!-- Flame (熱意 × 能力 × 考え方) -->
  <defs>
    <radialGradient id="flame" cx="50%" cy="80%" r="60%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <!-- outer glow -->
  <ellipse cx="600" cy="370" rx="220" ry="250" fill="url(#glow)"/>
  <!-- main flame shape -->
  <path d="M 600,110 C 700,180 760,250 720,340 C 690,400 650,420 600,440
           C 550,420 510,400 480,340 C 440,250 500,180 600,110 Z"
        fill="url(#flame)"/>
  <!-- inner flame (lighter center) -->
  <path d="M 600,185 C 650,230 670,280 650,335 C 635,370 620,390 600,400
           C 580,390 565,370 550,335 C 530,280 550,230 600,185 Z"
        fill="#fde68a" opacity="0.65"/>
  <!-- three base dots (三要素) -->
  <circle cx="510" cy="490" r="18" fill="#3b82f6" opacity="0.55"/>
  <circle cx="600" cy="500" r="18" fill="#3b82f6" opacity="0.55"/>
  <circle cx="690" cy="490" r="18" fill="#3b82f6" opacity="0.55"/>
  <!-- connecting lines between base dots -->
  <line x1="510" y1="490" x2="600" y2="500" stroke="#3b82f6" stroke-width="3" opacity="0.40"/>
  <line x1="600" y1="500" x2="690" y2="490" stroke="#3b82f6" stroke-width="3" opacity="0.40"/>
</svg>