<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Alps crossing: supply line being cut off -->
  <!-- Mountain range (Alps) -->
  <polygon points="200,360 350,150 500,360" fill="#bfdbfe" opacity="0.45"/>
  <polygon points="380,360 520,130 660,360" fill="#bfdbfe" opacity="0.5"/>
  <polygon points="560,360 700,170 840,360" fill="#bfdbfe" opacity="0.45"/>
  <!-- Path crossing the mountains -->
  <path d="M 100 320 C 200 280 300 260 380 200 C 460 140 540 150 640 240 C 720 310 820 350 920 360"
        fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>
  <!-- Supply line being cut (X on right side) -->
  <line x1="780" y1="300" x2="900" y2="360" stroke="#1e40af" stroke-width="6" stroke-dasharray="15,8" opacity="0.5"/>
  <line x1="830" y1="295" x2="810" y2="330" stroke="#1e40af" stroke-width="8" stroke-linecap="round"/>
  <line x1="810" y1="295" x2="830" y2="330" stroke="#1e40af" stroke-width="8" stroke-linecap="round"/>

</svg>