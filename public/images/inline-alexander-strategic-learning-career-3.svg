<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Battle map with knowledge application: arrow from study room to battlefield -->
  <!-- Study room (left) -->
  <rect x="100" y="148" width="280" height="198" fill="none" stroke="#1e40af" stroke-width="5" rx="6"/>
  <!-- Book icon -->
  <rect x="180" y="200" width="100" height="80" rx="4" fill="#93c5fd" opacity="0.7"/>
  <line x1="230" y1="200" x2="230" y2="280" stroke="#1e40af" stroke-width="4"/>
  <!-- Arrow to battlefield -->
  <line x1="390" y1="247" x2="600" y2="247" stroke="#1d4ed8" stroke-width="7"/>
  <polyline points="588,233 605,247 588,261" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <!-- Battle formation -->
  <circle cx="680" cy="200" r="22" fill="#93c5fd" opacity="0.7"/>
  <circle cx="760" cy="200" r="22" fill="#93c5fd" opacity="0.7"/>
  <circle cx="840" cy="200" r="22" fill="#93c5fd" opacity="0.7"/>
  <circle cx="720" cy="295" r="22" fill="#1e40af" opacity="0.8"/>
  <circle cx="800" cy="295" r="22" fill="#1e40af" opacity="0.8"/>
  <!-- Converging arrows (pincer) -->
  <line x1="680" y1="225" x2="720" y2="285" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="840" y1="225" x2="800" y2="285" stroke="#1d4ed8" stroke-width="4"/>

</svg>