<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Chess king on empty board (focus on what matters) -->
  <!-- chessboard -->
  <rect x="240" y="340" width="720" height="200" rx="6" fill="#1e40af" opacity="0.20"/>
  <!-- board squares (simplified grid) -->
  <g fill="#3b82f6" opacity="0.15">
    <rect x="240" y="340" width="90" height="50"/><rect x="420" y="340" width="90" height="50"/>
    <rect x="600" y="340" width="90" height="50"/><rect x="780" y="340" width="90" height="50"/>
    <rect x="330" y="390" width="90" height="50"/><rect x="510" y="390" width="90" height="50"/>
    <rect x="690" y="390" width="90" height="50"/><rect x="870" y="390" width="90" height="50"/>
    <rect x="240" y="440" width="90" height="50"/><rect x="420" y="440" width="90" height="50"/>
    <rect x="600" y="440" width="90" height="50"/><rect x="780" y="440" width="90" height="50"/>
  </g>
  <!-- King piece (large, centered) -->
  <!-- base -->
  <rect x="545" y="320" width="110" height="22" rx="6" fill="#1e40af" opacity="0.85"/>
  <!-- body -->
  <rect x="558" y="240" width="84" height="85" rx="8" fill="#1e40af" opacity="0.82"/>
  <!-- neck collar -->
  <rect x="562" y="225" width="76" height="20" rx="5" fill="#3b82f6" opacity="0.80"/>
  <!-- head -->
  <ellipse cx="600" cy="200" rx="42" ry="32" fill="#3b82f6" opacity="0.78"/>
  <!-- crown cross -->
  <rect x="595" y="155" width="10" height="50" rx="3" fill="#1e40af" opacity="0.85"/>
  <rect x="575" y="168" width="50" height="10" rx="3" fill="#1e40af" opacity="0.85"/>
  <!-- focus spotlight -->
  <circle cx="600" cy="280" r="180" fill="#bfdbfe" opacity="0.12"/>
</svg>