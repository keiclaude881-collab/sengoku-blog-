<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 「額」vs「率（%）」で管理する対比図 -->

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">「額で管理」vs「率で管理」——何が違うのか</text>
  <line x1="100" y1="58" x2="900" y2="58" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- VS divider -->
  <line x1="500" y1="75" x2="500" y2="370" stroke="#e8e0d4" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="500" cy="220" r="28" fill="#faf7f2" stroke="#e8e0d4" stroke-width="2"/>
  <text x="500" y="226" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">VS</text>

  <!-- Left: 額で管理 (NG) -->
  <rect x="60" y="75" width="400" height="44" rx="6" fill="#e8e0d4" opacity="0.6"/>
  <text x="260" y="103" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#78716c" text-anchor="middle">「額」で管理する</text>

  <!-- Scenario boxes left -->
  <rect x="80" y="138" width="360" height="64" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="163" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">収入20万円 → 毎月3万円積立</text>
  <text x="260" y="185" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">収入が30万円に増えると…</text>

  <rect x="80" y="218" width="360" height="64" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="243" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">「少し余裕があるから使っていいか」</text>
  <text x="260" y="265" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">→ ライフスタイル・インフレ発生</text>

  <rect x="80" y="298" width="360" height="55" rx="6" fill="#f59e0b" opacity="0.2" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="321" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">収入が減ったとき</text>
  <text x="260" y="341" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">→「今月はゼロ」で習慣が崩れる</text>

  <!-- Right: 率で管理 (OK / Rockefeller) -->
  <rect x="540" y="75" width="400" height="44" rx="6" fill="#92400e" opacity="0.8"/>
  <text x="740" y="103" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#fef3c7" text-anchor="middle">「率（%）」で管理する</text>

  <rect x="560" y="138" width="360" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="740" y="163" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">収入20万円 → 収入の15%を積立</text>
  <text x="740" y="185" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">収入が30万円に増えると…</text>

  <rect x="560" y="218" width="360" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="740" y="243" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">積立額も自動で4.5万円に増える</text>
  <text x="740" y="265" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle">→ 習慣を考え直す必要がない</text>

  <rect x="560" y="298" width="360" height="55" rx="6" fill="#f59e0b" opacity="0.3" stroke="#b45309" stroke-width="1.5"/>
  <text x="740" y="321" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">収入が減ったとき</text>
  <text x="740" y="341" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle">→ 比率のまま継続。習慣は崩れない</text>

  <!-- Bottom label -->
  <text x="500" y="393" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85">ロックフェラーは「率」で管理したから、億万長者になっても習慣を変えなかった</text>
</svg>
