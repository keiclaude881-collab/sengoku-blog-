  <rect x="720" y="175" width="80" height="80" rx="40" fill="#92400e" opacity="0.4"/>
  <!-- center connection -->
  <circle cx="500" cy="215" r="30" fill="#fbbf24" opacity="0.8"/>
  <circle cx="500" cy="215" r="18" fill="white" opacity="0.7"/>
  <!-- pledge arc above -->
  <path d="M 350 160 Q 500 100 650 160" fill="none" stroke="#d97706" stroke-width="5" opacity="0.5"/>
  <!-- stars -->
  <polygon points="500,90 508,112 532,112 513,126 520,149 500,135 480,149 487,126 468,112 492,112" fill="#fbbf24" opacity="0.7"/>

