<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bg_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg_3)"/>
  <circle cx="920" cy="60" r="120" fill="#fde68a" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#fbbf24" opacity="0.3"/>
  
  <!-- two hands meeting in center -->
  <!-- left hand -->
