<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 手放すことで、新しい道がひらけるイメージ -->
  <g transform="translate(400,210)">
    <circle cx="-90" cy="0" r="34" fill="none" stroke="#8b5cf6" stroke-width="3.5" opacity="0.85"/>
    <path d="M -56 0 L 40 0" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="7 8" opacity="0.85"/>
    <circle cx="40" cy="0" r="7" fill="#8b5cf6"/>
  </g>

  <g transform="translate(640,210)">
    <path d="M -64 56 L 0 -64 L 64 56 Z" fill="none" stroke="#6b21a8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 0 -64 L 0 -86" stroke="#6b21a8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-86" r="7" fill="#6b21a8"/>
  </g>

  <text x="500" y="340" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="600" fill="#6b21a8" text-anchor="middle" letter-spacing="2" opacity="0.75">手放すことで、ひらける道がある</text>
</svg>
