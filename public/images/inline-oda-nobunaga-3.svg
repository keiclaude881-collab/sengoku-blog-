<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 手放すことで、新しい道がひらけるイメージ -->
  <g transform="translate(400,210)">
    <circle cx="-90" cy="0" r="34" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.55"/>
    <path d="M -56 0 L 40 0" stroke="#c4b5fd" stroke-width="2.5" stroke-dasharray="7 8" opacity="0.6"/>
    <circle cx="40" cy="0" r="6" fill="#c4b5fd" opacity="0.7"/>
  </g>

  <g transform="translate(640,210)">
    <path d="M -64 56 L 0 -64 L 64 56 Z" fill="none" stroke="#6b21a8" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 0 -64 L 0 -86" stroke="#6b21a8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-86" r="7" fill="#6b21a8"/>
  </g>

  <text x="500" y="340" font-family="'Hiragino Sans', sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle" letter-spacing="2" opacity="0.7">手放すことで、ひらける道がある</text>
</svg>
