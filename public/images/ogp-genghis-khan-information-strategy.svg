<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7faff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dbeafe" stroke-width="2"/>

  <!-- 草原と地平線 -->
  <rect x="0" y="470" width="1200" height="160" fill="#dbeafe" opacity="0.35"/>
  <line x1="0" y1="470" x2="1200" y2="470" stroke="#bfdbfe" stroke-width="2"/>

  <!-- 騎馬のシルエット（簡略化） -->
  <g transform="translate(300,420)" opacity="0.85">
    <ellipse cx="0" cy="40" rx="64" ry="22" fill="#1e40af" opacity="0.25"/>
    <path d="M -60 36 Q -60 4 -28 -2 L 10 -2 Q 30 -2 40 18 L 40 36 Z" fill="#1e3a8a"/>
    <rect x="-10" y="-34" width="14" height="36" rx="4" fill="#1e3a8a"/>
    <circle cx="-3" cy="-44" r="11" fill="#1e3a8a"/>
    <line x1="40" y1="10" x2="78" y2="-22" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 伝達ルート（点線の矢印群） -->
  <g stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 470 360 L 620 320" stroke-dasharray="8 7"/>
    <path d="M 470 400 L 640 420" stroke-dasharray="8 7"/>
    <path d="M 470 440 L 600 480" stroke-dasharray="8 7"/>
  </g>
  <circle cx="470" cy="400" r="10" fill="#3b82f6"/>
  <circle cx="650" cy="320" r="7" fill="#1e40af"/>
  <circle cx="660" cy="420" r="7" fill="#1e40af"/>
  <circle cx="615" cy="490" r="7" fill="#1e40af"/>

  <!-- カテゴリラベル -->
  <rect x="700" y="180" width="120" height="36" rx="18" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="760" y="204" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="1">仕事・副業</text>

  <!-- タイトル -->
  <text x="700" y="280" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">チンギス・ハンに学ぶ</text>
  <text x="700" y="324" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">「情報戦略」</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
