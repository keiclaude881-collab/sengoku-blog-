<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- lattice connection lines (background) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.5">
    <!-- horizontal -->
    <line x1="200" y1="160" x2="440" y2="160"/>
    <line x1="440" y1="160" x2="680" y2="160"/>
    <line x1="680" y1="160" x2="920" y2="160"/>
    <line x1="200" y1="315" x2="440" y2="315"/>
    <line x1="440" y1="315" x2="680" y2="315"/>
    <line x1="680" y1="315" x2="920" y2="315"/>
    <line x1="320" y1="470" x2="560" y2="470"/>
    <line x1="560" y1="470" x2="800" y2="470"/>
    <!-- vertical -->
    <line x1="200" y1="160" x2="200" y2="315"/>
    <line x1="440" y1="160" x2="440" y2="315"/>
    <line x1="440" y1="315" x2="560" y2="470"/>
    <line x1="680" y1="160" x2="680" y2="315"/>
    <line x1="680" y1="315" x2="800" y2="470"/>
    <line x1="920" y1="160" x2="920" y2="315"/>
    <!-- diagonal -->
    <line x1="200" y1="160" x2="440" y2="315"/>
    <line x1="440" y1="160" x2="200" y2="315"/>
    <line x1="680" y1="160" x2="920" y2="315"/>
    <line x1="920" y1="160" x2="680" y2="315"/>
    <line x1="440" y1="315" x2="320" y2="470"/>
    <line x1="560" y1="470" x2="680" y2="315"/>
    <line x1="800" y1="470" x2="920" y2="315"/>
  </g>

  <!-- highlighted active connections -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.7">
    <line x1="440" y1="160" x2="680" y2="315"/>
    <line x1="680" y1="315" x2="560" y2="470"/>
    <line x1="440" y1="315" x2="680" y2="315"/>
  </g>

  <!-- nodes (outer ring, dim) -->
  <g fill="#1e40af" opacity="0.5">
    <circle cx="200" cy="160" r="22"/>
    <circle cx="920" cy="160" r="22"/>
    <circle cx="200" cy="315" r="22"/>
    <circle cx="920" cy="315" r="22"/>
    <circle cx="320" cy="470" r="22"/>
    <circle cx="800" cy="470" r="22"/>
  </g>

  <!-- nodes (mid, semi-active) -->
  <g fill="#1d4ed8" opacity="0.7">
    <circle cx="440" cy="160" r="26"/>
    <circle cx="440" cy="315" r="26"/>
    <circle cx="800" cy="315" r="26"/>
  </g>

  <!-- nodes (active, highlighted) -->
  <circle cx="680" cy="160" r="30" fill="url(#nodeGrad)" opacity="0.9"/>
  <circle cx="680" cy="315" r="36" fill="url(#nodeGrad)"/>
  <circle cx="560" cy="470" r="30" fill="url(#nodeGrad)" opacity="0.9"/>

  <!-- center node glow -->
  <circle cx="680" cy="315" r="58" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
  <circle cx="680" cy="315" r="80" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.12"/>

  <!-- label dots inside nodes -->
  <g fill="#0f172a" font-family="serif" text-anchor="middle" opacity="0.9">
  </g>

  <!-- decorative small dots -->
  <g fill="#475569" opacity="0.4">
    <circle cx="100" cy="80" r="4"/>
    <circle cx="1100" cy="100" r="3"/>
    <circle cx="150" cy="540" r="3"/>
    <circle cx="1050" cy="520" r="4"/>
    <circle cx="600" cy="60" r="3"/>
    <circle cx="600" cy="580" r="3"/>
  </g>
</svg>
