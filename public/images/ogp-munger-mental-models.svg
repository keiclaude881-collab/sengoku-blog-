<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#ddd6fe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#ddd6fe" opacity="0.12"/>
  <!-- Hexagonal lattice (lattice of mental models) -->
  <!-- define single hex helper as reusable paths -->
  <!-- center hex at (600,315) -->
  <polygon points="600,255 652,285 652,345 600,375 548,345 548,285"
           fill="#8b5cf6" opacity="0.60" stroke="#ddd6fe" stroke-width="4"/>
  <!-- top-left hex (around 496,195) -->
  <polygon points="496,135 548,165 548,225 496,255 444,225 444,165"
           fill="#a78bfa" opacity="0.45" stroke="#ddd6fe" stroke-width="3"/>
  <!-- top-right hex (around 704,195) -->
  <polygon points="704,135 756,165 756,225 704,255 652,225 652,165"
           fill="#a78bfa" opacity="0.45" stroke="#ddd6fe" stroke-width="3"/>
  <!-- left hex (around 392,315) -->
  <polygon points="392,255 444,285 444,345 392,375 340,345 340,285"
           fill="#7c3aed" opacity="0.40" stroke="#ddd6fe" stroke-width="3"/>
  <!-- right hex (around 808,315) -->
  <polygon points="808,255 860,285 860,345 808,375 756,345 756,285"
           fill="#7c3aed" opacity="0.40" stroke="#ddd6fe" stroke-width="3"/>
  <!-- bottom-left hex (around 496,435) -->
  <polygon points="496,375 548,405 548,465 496,495 444,465 444,405"
           fill="#a78bfa" opacity="0.45" stroke="#ddd6fe" stroke-width="3"/>
  <!-- bottom-right hex (around 704,435) -->
  <polygon points="704,375 756,405 756,465 704,495 652,465 652,405"
           fill="#a78bfa" opacity="0.45" stroke="#ddd6fe" stroke-width="3"/>
  <!-- connection lines between hex centers -->
  <g stroke="#8b5cf6" stroke-width="5" opacity="0.35">
    <line x1="600" y1="315" x2="496" y2="195"/>
    <line x1="600" y1="315" x2="704" y2="195"/>
    <line x1="600" y1="315" x2="392" y2="315"/>
    <line x1="600" y1="315" x2="808" y2="315"/>
    <line x1="600" y1="315" x2="496" y2="435"/>
    <line x1="600" y1="315" x2="704" y2="435"/>
  </g>
</svg>