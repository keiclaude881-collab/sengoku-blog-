<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Create rather than quit: building new institute -->
  <!-- Old (broken) building on left -->
  <rect x="80" y="238" width="240" height="150" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.5" stroke-dasharray="10,7"/>
  <polygon points="48,238 352,238 200,158" fill="#bfdbfe" opacity="0.3"/>
  <!-- X/closing it -->
  <line x1="80" y1="238" x2="320" y2="388" stroke="#93c5fd" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Arrow to new building -->
  <line x1="360" y1="300" x2="480" y2="300" stroke="#1d4ed8" stroke-width="7"/>
  <polyline points="466,287 483,300 466,313" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  
  <!-- New fresh institute being built (bright) -->
  <rect x="520" y="218" width="380" height="200" fill="#bfdbfe" opacity="0.35"/>
  <rect x="520" y="218" width="380" height="200" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <polygon points="480,218 940,218 710,118" fill="#1e40af" opacity="0.6"/>
  <!-- Scaffolding (being built) -->
  <line x1="520" y1="218" x2="520" y2="80" stroke="#1e40af" stroke-width="4" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="900" y1="218" x2="900" y2="80" stroke="#1e40af" stroke-width="4" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="520" y1="140" x2="900" y2="140" stroke="#1e40af" stroke-width="3" opacity="0.4" stroke-dasharray="6,4"/>

</svg>