<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf7f2"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#92400e"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="130" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="2">投資・お金</text>

  <!-- Main title -->
  <text x="60" y="185" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="50" font-weight="700" fill="#1c1917" letter-spacing="-1">バビロンの大富豪に</text>
  <text x="60" y="255" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="50" font-weight="700" fill="#1c1917" letter-spacing="-1">学ぶ「収入の1割」</text>

  <!-- Subtitle -->
  <text x="60" y="320" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="28" fill="#b45309" letter-spacing="2">今日から始める「先取り貯蓄」習慣</text>

  <!-- Divider line -->
  <line x1="60" y1="355" x2="680" y2="355" stroke="#e8e0d4" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">今から4000年前の都市バビロンに伝わる、</text>
  <text x="60" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">「収入の1割を先に確保する」というシンプルな法則。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#b45309" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: 10 coins, 1 set aside, growing into wealth -->
  <rect x="800" y="100" width="340" height="320" rx="8" fill="#fef3c7" stroke="#e8e0d4" stroke-width="1.5"/>

  <text x="940" y="122" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">毎月の収入を10等分</text>

  <!-- Coins row 1 -->
  <circle cx="850" cy="152" r="18" fill="#92400e"/>
  <text x="850" y="157" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="700" fill="#fef3c7" text-anchor="middle">1/10</text>
  <circle cx="895" cy="152" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="940" cy="152" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="985" cy="152" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="1030" cy="152" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>

  <!-- Coins row 2 -->
  <circle cx="895" cy="198" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="940" cy="198" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="985" cy="198" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="1030" cy="198" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>

  <text x="962" y="232" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">残り9割は生活費へ</text>

  <!-- Arrow down from highlighted coin to plant -->
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <line x1="850" y1="172" x2="850" y2="295" stroke="#b45309" stroke-width="3" marker-end="url(#arrowDown)"/>
  <text x="912" y="270" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">そのまま投資へ</text>

  <!-- Plant: pot + stem + leaves -->
  <ellipse cx="850" cy="357" rx="28" ry="10" fill="#92400e"/>
  <line x1="850" y1="357" x2="850" y2="292" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="833" cy="287" rx="18" ry="9" fill="#22c55e" transform="rotate(-30 833 287)"/>
  <ellipse cx="867" cy="287" rx="18" ry="9" fill="#22c55e" transform="rotate(30 867 287)"/>

  <text x="850" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">黄金が働く(複利)</text>
</svg>
