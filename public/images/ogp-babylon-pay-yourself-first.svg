<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ziggurat / ancient Babylon silhouette in background -->
  <g opacity="0.35" fill="#d97706">
    <rect x="120" y="430" width="260" height="40"/>
    <rect x="150" y="390" width="200" height="40"/>
    <rect x="180" y="350" width="140" height="40"/>
    <rect x="210" y="312" width="80" height="38"/>
  </g>

  <!-- A jar/vessel receiving coins, with the first portion highlighted -->
  <g transform="translate(820,210)">
    <path d="M -120 60 C -120 220 -100 320 0 320 C 100 320 120 220 120 60 L 110 40 C 70 60 -70 60 -110 40 Z" fill="#fef9e7" stroke="#d97706" stroke-width="4"/>
    <path d="M -108 130 C -108 240 -90 300 0 300 C 90 300 108 240 108 130 Z" fill="#fde68a"/>
    <path d="M -108 130 C -108 152 -90 162 0 162 C 90 162 108 152 108 130 Z" fill="#f59e0b"/>
    <path d="M -60 10 L -50 45 L 50 45 L 60 10 Z" fill="#fef9e7" stroke="#d97706" stroke-width="4"/>
  </g>

  <!-- Coins falling from above into the jar, the first coin singled out and bigger -->
  <g>
    <circle cx="700" cy="80" r="34" fill="url(#coinGrad)" stroke="#92400e" stroke-width="3"/>
    <circle cx="700" cy="80" r="18" fill="none" stroke="#92400e" stroke-width="2"/>
    <circle cx="790" cy="40" r="20" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <circle cx="860" cy="70" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <circle cx="930" cy="35" r="22" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <circle cx="980" cy="90" r="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- Dashed path showing the first coin's separate route into the jar -->
  <path d="M 700 114 C 700 150 760 170 800 200" fill="none" stroke="#92400e" stroke-width="4" stroke-dasharray="2,10" opacity="0.6"/>

  <!-- Stack of coins growing on the left, representing accumulated savings over time -->
  <g>
    <ellipse cx="270" cy="560" rx="80" ry="18" fill="#d97706"/>
    <ellipse cx="270" cy="540" rx="80" ry="18" fill="#f59e0b"/>
    <ellipse cx="270" cy="520" rx="80" ry="18" fill="#d97706"/>
    <ellipse cx="270" cy="500" rx="80" ry="18" fill="#f59e0b"/>
    <ellipse cx="270" cy="480" rx="80" ry="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>
  <g>
    <ellipse cx="410" cy="560" rx="60" ry="14" fill="#d97706"/>
    <ellipse cx="410" cy="546" rx="60" ry="14" fill="#f59e0b"/>
    <ellipse cx="410" cy="532" rx="60" ry="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- Small upward arrow symbolizing growth -->
  <path d="M 270 462 L 270 410 M 250 432 L 270 410 L 290 432" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
