<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- past arrow (faded, pointing left - "cause/origin") -->
  <g opacity="0.25">
    <line x1="520" y1="260" x2="180" y2="260" stroke="#6b21a8" stroke-width="6" stroke-linecap="round"/>
    <polygon points="180,260 215,243 215,277" fill="#6b21a8"/>
    <!-- X mark over past arrow -->
    <line x1="300" y1="220" x2="400" y2="300" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <line x1="400" y1="220" x2="300" y2="300" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- chain / shackle (past holding back) -->
  <g fill="none" stroke="#c4b5fd" stroke-width="4" opacity="0.35">
    <circle cx="540" cy="340" r="20"/>
    <circle cx="490" cy="340" r="20"/>
    <circle cx="440" cy="340" r="20"/>
    <circle cx="390" cy="340" r="20"/>
    <line x1="560" y1="340" x2="580" y2="340"/>
  </g>

  <!-- central figure -->
  <g fill="#7c3aed" opacity="0.9">
    <circle cx="600" cy="260" r="36"/>
    <path d="M 560 296 C 560 250 640 250 640 296 L 650 400 L 550 400 Z"/>
  </g>

  <!-- figure breaking free - raised arm -->
  <g fill="#7c3aed" opacity="0.9">
    <!-- arm reaching forward/up -->
    <line x1="640" y1="296" x2="720" y2="230" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- forward arrow (vivid, purpose/future) -->
  <g opacity="0.95">
    <line x1="680" y1="260" x2="1020" y2="260" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round"/>
    <polygon points="1020,260 985,240 985,280" fill="#a855f7"/>
  </g>

  <!-- "goal" star / target at end of forward arrow -->
  <circle cx="1060" cy="260" r="36" fill="#a855f7" opacity="0.15"/>
  <circle cx="1060" cy="260" r="22" fill="#a855f7" opacity="0.3"/>
  <circle cx="1060" cy="260" r="10" fill="#7c3aed" opacity="0.8"/>

  <!-- label: 原因 (past) -->
  <text x="300" y="210" text-anchor="middle" font-size="22" fill="#6b21a8" opacity="0.4" font-family="serif">過去・原因</text>

  <!-- label: 目的 (future) -->
  <text x="850" y="220" text-anchor="middle" font-size="24" fill="#7c3aed" opacity="0.8" font-family="serif">目的・未来</text>

  <!-- radiating lines from figure (energy/change) -->
  <g stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="600" y1="224" x2="600" y2="180"/>
    <line x1="564" y1="236" x2="532" y2="200"/>
    <line x1="636" y1="236" x2="668" y2="200"/>
    <line x1="596" y1="400" x2="590" y2="450"/>
    <line x1="614" y1="400" x2="620" y2="450"/>
  </g>

  <!-- decorative dots -->
  <g fill="#a855f7" opacity="0.15">
    <circle cx="100" cy="100" r="40"/>
    <circle cx="1100" cy="520" r="50"/>
    <circle cx="200" cy="500" r="30"/>
    <circle cx="1050" cy="120" r="35"/>
  </g>
</svg>
