<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#ddd6fe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#ddd6fe" opacity="0.12"/>
  <!-- Person with large upward arrow (目的論) -->
  <!-- arrow (large, bold, pointing up) -->
  <rect x="585" y="235" width="30" height="280" rx="6" fill="#8b5cf6" opacity="0.80"/>
  <polygon points="600,160 548,252 652,252" fill="#8b5cf6" opacity="0.85"/>
  <!-- person silhouette -->
  <!-- head -->
  <circle cx="600" cy="500" r="46" fill="#6b21a8" opacity="0.70"/>
  <!-- body -->
  <path d="M 555,545 Q 540,570 538,610 L 662,610 Q 660,570 645,545 Q 630,530 600,527 Q 570,530 555,545 Z"
        fill="#6b21a8" opacity="0.65"/>
  <!-- arms (raised, reaching up) -->
  <line x1="555" y1="555" x2="505" y2="505" stroke="#6b21a8" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <line x1="645" y1="555" x2="695" y2="505" stroke="#6b21a8" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <!-- glow around arrow tip -->
  <circle cx="600" cy="180" r="55" fill="#ddd6fe" opacity="0.30"/>
</svg>