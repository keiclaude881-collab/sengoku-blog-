<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f0f7ff"/>

  <!-- ground -->
  <ellipse cx="600" cy="560" rx="380" ry="20" fill="#bfdbfe" opacity="0.5"/>
  <line x1="200" y1="560" x2="1000" y2="560" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>

  <!-- balance scale, symbolizing 分度 (measured balance) between main work and side work -->
  <g transform="translate(600,280)">
    <line x1="0" y1="-130" x2="0" y2="180" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
    <path d="M -170 -90 L 170 -90" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="-130" r="14" fill="#1e3a8a"/>
    <polygon points="0,170 -36,200 36,200" fill="#1e3a8a"/>
    <rect x="-90" y="195" width="180" height="16" rx="6" fill="#1e3a8a"/>

    <!-- left pan: book (lifework / reading) -->
    <line x1="-170" y1="-90" x2="-170" y2="-10" stroke="#3b82f6" stroke-width="3"/>
    <path d="M -230 -10 Q -170 20 -110 -10 L -110 6 Q -170 36 -230 6 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="3.5"/>
    <path d="M -195 -28 L -160 -16 L -160 8 L -195 -4 Z" fill="#ffffff" stroke="#1e40af" stroke-width="2.5"/>
    <path d="M -160 -16 L -125 -28 L -125 -4 L -160 8 Z" fill="#f0f7ff" stroke="#1e40af" stroke-width="2.5"/>

    <!-- right pan: firewood bundle (main work / labor) -->
    <line x1="170" y1="-90" x2="170" y2="-10" stroke="#3b82f6" stroke-width="3"/>
    <path d="M 110 -10 Q 170 20 230 -10 L 230 6 Q 170 36 110 6 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="3.5"/>
    <g stroke="#92400e" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <line x1="125" y1="-22" x2="215" y2="-26"/>
      <line x1="125" y1="-10" x2="215" y2="-14"/>
      <line x1="125" y1="2" x2="215" y2="-2"/>
    </g>
  </g>

  <!-- small footpath / circular arrow suggesting steady ongoing cycle -->
  <g transform="translate(600,470)" opacity="0.6">
    <path d="M -90 0 A 90 28 0 1 1 90 0" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="2,12" stroke-linecap="round"/>
    <path d="M 90 0 A 90 28 0 1 1 -90 0" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="2,12" stroke-linecap="round"/>
    <path d="M -90 0 L -78 -14 L -66 4 Z" fill="#3b82f6"/>
    <path d="M 90 0 L 78 14 L 66 -4 Z" fill="#3b82f6"/>
  </g>

  <circle cx="240" cy="180" r="6" fill="#93c5fd" opacity="0.6"/>
  <circle cx="290" cy="230" r="4" fill="#93c5fd" opacity="0.5"/>
  <circle cx="960" cy="180" r="6" fill="#93c5fd" opacity="0.6"/>
  <circle cx="910" cy="230" r="4" fill="#93c5fd" opacity="0.5"/>
</svg>
