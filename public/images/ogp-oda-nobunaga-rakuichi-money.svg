<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Open gate (楽市楽座) with coins flowing through -->
  <!-- left pillar -->
  <rect x="370" y="140" width="50" height="380" rx="8" fill="#92400e" opacity="0.75"/>
  <!-- right pillar -->
  <rect x="780" y="140" width="50" height="380" rx="8" fill="#92400e" opacity="0.75"/>
  <!-- top crossbeam -->
  <rect x="330" y="130" width="540" height="32" rx="6" fill="#92400e" opacity="0.80"/>
  <!-- second beam (lower) -->
  <rect x="370" y="190" width="460" height="22" rx="5" fill="#92400e" opacity="0.60"/>
  <!-- coins cascading through the open gate (3 diagonal streams) -->
  <!-- stream 1 (left-center) -->
  <circle cx="500" cy="280" r="22" fill="#fbbf24" opacity="0.80"/>
  <circle cx="515" cy="340" r="22" fill="#d97706"  opacity="0.75"/>
  <circle cx="500" cy="400" r="22" fill="#fbbf24" opacity="0.70"/>
  <circle cx="510" cy="460" r="22" fill="#d97706"  opacity="0.65"/>
  <!-- stream 2 (center) -->
  <circle cx="600" cy="265" r="24" fill="#fde68a" opacity="0.85"/>
  <circle cx="605" cy="330" r="24" fill="#fbbf24" opacity="0.80"/>
  <circle cx="600" cy="395" r="24" fill="#fde68a" opacity="0.75"/>
  <circle cx="598" cy="460" r="24" fill="#fbbf24" opacity="0.70"/>
  <!-- stream 3 (right-center) -->
  <circle cx="700" cy="280" r="22" fill="#d97706"  opacity="0.80"/>
  <circle cx="690" cy="345" r="22" fill="#fbbf24" opacity="0.75"/>
  <circle cx="700" cy="410" r="22" fill="#d97706"  opacity="0.70"/>
  <circle cx="695" cy="470" r="22" fill="#fbbf24" opacity="0.65"/>
  <!-- open space indication -->
  <rect x="420" y="222" width="360" height="278" fill="#fffbeb" opacity="0.15"/>
</svg>