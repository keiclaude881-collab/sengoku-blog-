<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f7faff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#dbeafe" stroke-width="2"/>
  <!-- 中心から広範囲に張り巡らされた情報網のイメージ -->
  <g transform="translate(500,210)" stroke="#3b82f6" stroke-width="2.5" opacity="0.7">
    <line x1="0" y1="0" x2="-180" y2="-90"/>
    <line x1="0" y1="0" x2="180" y2="-90"/>
    <line x1="0" y1="0" x2="-200" y2="40"/>
    <line x1="0" y1="0" x2="200" y2="40"/>
    <line x1="0" y1="0" x2="-120" y2="130"/>
    <line x1="0" y1="0" x2="120" y2="130"/>
    <line x1="0" y1="0" x2="0" y2="-150"/>
  </g>
  <g transform="translate(500,210)">
    <circle cx="0" cy="0" r="14" fill="#1e40af"/>
    <circle cx="-180" cy="-90" r="7" fill="#3b82f6"/>
    <circle cx="180" cy="-90" r="7" fill="#3b82f6"/>
    <circle cx="-200" cy="40" r="7" fill="#3b82f6"/>
    <circle cx="200" cy="40" r="7" fill="#3b82f6"/>
    <circle cx="-120" cy="130" r="7" fill="#3b82f6"/>
    <circle cx="120" cy="130" r="7" fill="#3b82f6"/>
    <circle cx="0" cy="-150" r="7" fill="#3b82f6"/>
  </g>
</svg>
