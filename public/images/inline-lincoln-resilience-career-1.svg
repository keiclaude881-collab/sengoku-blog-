<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 山あり谷ありのキャリアグラフ（最終的に上昇） -->

  <!-- Grid lines -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#e8e0d4" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="920" y2="320" stroke="#e8e0d4" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="920" y2="240" stroke="#e8e0d4" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="80" y1="160" x2="920" y2="160" stroke="#e8e0d4" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="80" y1="80" x2="920" y2="80" stroke="#e8e0d4" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Y axis labels -->
  <text x="68" y="325" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">底</text>
  <text x="68" y="245" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">低</text>
  <text x="68" y="165" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">中</text>
  <text x="68" y="85" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="end">高</text>

  <!-- Career path line: starts mid, dips, rises, dips, rises high -->
  <path d="M 100 220
           C 140 210 160 290 200 300
           C 240 310 260 270 300 280
           C 340 290 360 300 400 315
           C 440 325 460 260 500 250
           C 540 240 560 280 600 285
           C 640 290 660 240 700 230
           C 740 220 760 180 800 160
           C 840 140 880 95 920 75"
        stroke="#b45309" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Failure points (downward arrows) -->
  <circle cx="200" cy="300" r="7" fill="#92400e" opacity="0.8"/>
  <circle cx="400" cy="315" r="7" fill="#92400e" opacity="0.8"/>
  <circle cx="600" cy="285" r="7" fill="#92400e" opacity="0.8"/>

  <!-- Success point (upward arrow end) -->
  <circle cx="920" cy="75" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
  <text x="920" y="60" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">大統領</text>
  <text x="920" y="47" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">51歳</text>

  <!-- Failure labels -->
  <text x="200" y="342" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle">事業失敗</text>
  <text x="400" y="355" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle">選挙落選</text>
  <text x="600" y="325" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle">再落選</text>

  <!-- Shade the upward zone at the end -->
  <path d="M 700 230 C 740 220 760 180 800 160 C 840 140 880 95 920 75 L 920 320 L 700 320 Z"
        fill="#f59e0b" opacity="0.08"/>

  <!-- Title -->
  <text x="500" y="390" font-family="'Hiragino Sans', sans-serif" font-size="15" fill="#b45309" text-anchor="middle" letter-spacing="2" opacity="0.85">失敗を重ねながら、最終的に高みへと到達するキャリアの軌跡</text>
</svg>
