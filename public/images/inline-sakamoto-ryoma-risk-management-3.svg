<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 分岐点で複数の道を事前に確認しておくイメージ -->
  <g stroke="#92400e" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 200 310 L 460 230"/>
    <circle cx="460" cy="230" r="10" fill="#92400e"/>
    <!-- メインの道(実線) -->
    <path d="M 460 230 L 720 160" stroke-width="4"/>
    <path d="M 720 160 L 700 152 M 720 160 L 706 174"/>
    <!-- 他の道(破線) -->
    <path d="M 460 230 L 710 230" stroke-dasharray="4 8" opacity="0.5"/>
    <path d="M 460 230 L 710 300" stroke-dasharray="4 8" opacity="0.4"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="720" cy="160" r="10"/>
    <circle cx="710" cy="230" r="7" opacity="0.5"/>
    <circle cx="710" cy="300" r="7" opacity="0.4"/>
  </g>
</svg>
