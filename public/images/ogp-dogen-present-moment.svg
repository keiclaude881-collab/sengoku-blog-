<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#faf7ff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <!-- 左側の紫バー -->
  <rect x="0" y="0" width="12" height="630" fill="#6b21a8"/>

  <!-- 右側グラフィック：座禅する人物と波紋 -->
  <circle cx="960" cy="315" r="200" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <circle cx="960" cy="315" r="155" fill="none" stroke="#ddd6fe" stroke-width="2"/>
  <circle cx="960" cy="315" r="110" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <!-- 座禅シルエット -->
  <!-- 頭 -->
  <circle cx="960" cy="240" r="30" fill="#6b21a8"/>
  <!-- 胴体 -->
  <ellipse cx="960" cy="320" rx="72" ry="48" fill="#6b21a8"/>
  <!-- 脚 -->
  <ellipse cx="960" cy="358" rx="95" ry="24" fill="#4c1d95"/>
  <!-- 手 -->
  <ellipse cx="960" cy="332" rx="44" ry="15" fill="#5b21b6"/>
  <!-- 中心点の輝き -->
  <circle cx="960" cy="315" r="10" fill="#a855f7" opacity="0.8"/>
  <circle cx="960" cy="315" r="4" fill="#fff"/>

  <!-- カテゴリバッジ -->
  <rect x="68" y="70" width="160" height="34" rx="17" fill="#ede9fe"/>
  <text x="148" y="93" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle">思考・マインド</text>

  <!-- タイトル -->
  <text x="68" y="200" font-family="'Noto Sans JP', sans-serif" font-size="56" font-weight="900" fill="#6b21a8">道元の禅的集中力</text>

  <!-- サブタイトル -->
  <text x="68" y="278" font-family="'Noto Sans JP', sans-serif" font-size="34" font-weight="700" fill="#374151">只管打坐——今この瞬間に</text>

  <!-- 区切り線 -->
  <line x1="68" y1="318" x2="700" y2="318" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 説明テキスト -->
  <text x="68" y="374" font-family="'Noto Sans JP', sans-serif" font-size="22" fill="#6b7280">雑念を消すのではなく「気づいて戻る」。</text>
  <text x="68" y="408" font-family="'Noto Sans JP', sans-serif" font-size="22" fill="#6b7280">800年前の禅が教える現代のマインドフルネス。</text>

  <!-- 引用 -->
  <rect x="68" y="450" width="680" height="80" rx="8" fill="#f3e8ff"/>
  <text x="88" y="486" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="700" fill="#6b21a8">「而今の山水は、古仏の道現成なり」</text>
  <text x="88" y="514" font-family="'Noto Sans JP', sans-serif" font-size="16" fill="#7c3aed">— 道元『正法眼蔵』山水経</text>

  <!-- サイト名 -->
  <text x="68" y="594" font-family="'Noto Sans JP', sans-serif" font-size="18" fill="#9ca3af">偉人ラボ — ijin-lab.com</text>
</svg>
