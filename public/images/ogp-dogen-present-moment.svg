<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="figGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Concentric ripples spreading from the center, representing stillness radiating outward -->
  <circle cx="600" cy="345" r="90" fill="none" stroke="#c4b5fd" stroke-width="2.5" opacity="0.9"/>
  <circle cx="600" cy="345" r="150" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.7"/>
  <circle cx="600" cy="345" r="210" fill="none" stroke="#ddd6fe" stroke-width="1.5" opacity="0.55"/>
  <circle cx="600" cy="345" r="270" fill="none" stroke="#ede9fe" stroke-width="1.5" opacity="0.4"/>

  <!-- Seated meditation (zazen) silhouette, centered -->
  <g transform="translate(600,345)">
    <circle cx="0" cy="-150" r="34" fill="url(#figGrad)"/>
    <path d="M -88 60 C -88 -40 -64 -100 0 -100 C 64 -100 88 -40 88 60 Z" fill="url(#figGrad)"/>
    <ellipse cx="0" cy="100" rx="118" ry="28" fill="#4c1d95"/>
    <ellipse cx="0" cy="48" rx="52" ry="18" fill="#6b21a8"/>
  </g>

  <!-- Soft glowing point above the figure's head, signifying clarity/awareness -->
  <circle cx="600" cy="170" r="10" fill="#c084fc" opacity="0.9"/>
  <circle cx="600" cy="170" r="20" fill="#c084fc" opacity="0.3"/>

  <!-- Minimalist temple roofline silhouette in the far background -->
  <g fill="#e9d5ff" opacity="0.6">
    <polygon points="60,150 240,150 150,90"/>
    <rect x="90" y="150" width="120" height="14"/>
    <polygon points="960,140 1140,140 1050,80"/>
    <rect x="990" y="140" width="120" height="14"/>
  </g>

  <!-- A single thin branch with a few falling leaves/petals drifting down, symbolizing the present moment passing quietly -->
  <path d="M 1020 230 C 1060 250 1090 290 1110 340" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
  <g fill="#c4b5fd" opacity="0.8">
    <ellipse cx="980" cy="420" rx="9" ry="5" transform="rotate(30 980 420)"/>
    <ellipse cx="1050" cy="480" rx="9" ry="5" transform="rotate(-15 1050 480)"/>
    <ellipse cx="160" cy="460" rx="9" ry="5" transform="rotate(20 160 460)"/>
  </g>
</svg>
