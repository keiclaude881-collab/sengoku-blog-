<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370">
  <rect width="1000" height="370" fill="#fffbeb" rx="12"/>
  <rect x="0" y="0" width="1000" height="370" rx="12" fill="none" stroke="#fde68a" stroke-width="1.5"/>

  <text x="500" y="38" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">「論語と算盤」——道徳と利益は、なぜ矛盾しないのか</text>

  <!-- Balance beam structure -->
  <!-- Center pole -->
  <line x1="500" y1="175" x2="500" y2="240" stroke="#92400e" stroke-width="5"/>
  <!-- Fulcrum triangle -->
  <polygon points="500,240 468,275 532,275" fill="#d97706"/>
  <rect x="455" y="275" width="90" height="12" rx="4" fill="#d97706"/>

  <!-- Balance beam (horizontal) -->
  <line x1="160" y1="175" x2="840" y2="175" stroke="#92400e" stroke-width="6"/>

  <!-- Left pan suspension -->
  <line x1="230" y1="175" x2="200" y2="200" stroke="#78350f" stroke-width="2"/>
  <line x1="230" y1="175" x2="260" y2="200" stroke="#78350f" stroke-width="2"/>

  <!-- Left pan: 論語 -->
  <rect x="145" y="200" width="170" height="120" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="230" y="228" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">論語（道徳）</text>
  <line x1="165" y1="238" x2="295" y2="238" stroke="#d97706" stroke-width="1"/>
  <text x="230" y="258" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">✦ 仁：思いやり</text>
  <text x="230" y="276" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">✦ 義：正義・誠実</text>
  <text x="230" y="294" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">✦ 信：約束を守る</text>
  <text x="230" y="312" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">→ 長期の社会的信用</text>

  <!-- Right pan suspension -->
  <line x1="770" y1="175" x2="740" y2="200" stroke="#78350f" stroke-width="2"/>
  <line x1="770" y1="175" x2="800" y2="200" stroke="#78350f" stroke-width="2"/>

  <!-- Right pan: 算盤 -->
  <rect x="685" y="200" width="170" height="120" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="770" y="228" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">算盤（経済）</text>
  <line x1="705" y1="238" x2="835" y2="238" stroke="#d97706" stroke-width="1"/>
  <text x="770" y="258" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">✦ 収益の確保</text>
  <text x="770" y="276" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">✦ 効率の追求</text>
  <text x="770" y="294" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">✦ 事業の成長</text>
  <text x="770" y="312" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#78350f" text-anchor="middle">→ 産業・雇用の拡大</text>

  <!-- Center explanation -->
  <rect x="390" y="58" width="220" height="80" rx="10" fill="#d97706"/>
  <text x="500" y="86" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">道徳経済合一</text>
  <text x="500" y="108" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">どちらかを犠牲にせず</text>
  <text x="500" y="126" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">両方を同時に追う</text>
  <line x1="500" y1="138" x2="500" y2="170" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- = balance notation -->
  <text x="500" y="163" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" fill="#92400e" text-anchor="middle">⬇</text>

  <!-- Bottom note -->
  <text x="500" y="340" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" fill="#92400e" text-anchor="middle">「道徳なき経済は罪悪、経済なき道徳は寝言」——渋沢栄一</text>
</svg>
