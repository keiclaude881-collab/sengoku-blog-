      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg_2)"/>
  <circle cx="920" cy="60" r="120" fill="#fde68a" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#fbbf24" opacity="0.3"/>
  
  <rect x="330" y="130" width="340" height="220" rx="12" fill="#d97706" opacity="0.15"/>
  <rect x="340" y="140" width="320" height="200" rx="10" fill="white" opacity="0.6"/>
