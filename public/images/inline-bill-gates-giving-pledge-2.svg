  <line x1="370" y1="200" x2="630" y2="200" stroke="#d97706" stroke-width="3" opacity="0.4"/>
  <line x1="370" y1="225" x2="580" y2="225" stroke="#d97706" stroke-width="3" opacity="0.4"/>
  <line x1="370" y1="250" x2="610" y2="250" stroke="#d97706" stroke-width="3" opacity="0.4"/>
  <!-- coin icons at bottom of scroll -->
  <circle cx="420" cy="300" r="20" fill="#92400e" opacity="0.7"/>
  <circle cx="500" cy="300" r="20" fill="#92400e" opacity="0.7"/>
  <circle cx="580" cy="300" r="20" fill="#92400e" opacity="0.7"/>
