<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="boltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Background decorative orbs -->
  <circle cx="200" cy="150" r="220" fill="#fde68a" opacity="0.18"/>
  <circle cx="1050" cy="500" r="180" fill="#fbbf24" opacity="0.12"/>

  <!-- Radiating lines from lightning bolt center -->
  <g stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round">
    <line x1="480" y1="315" x2="280" y2="315"/>
    <line x1="480" y1="315" x2="300" y2="200"/>
    <line x1="480" y1="315" x2="300" y2="430"/>
    <line x1="480" y1="315" x2="370" y2="140"/>
    <line x1="480" y1="315" x2="370" y2="490"/>
    <line x1="600" y1="315" x2="920" y2="315"/>
    <line x1="600" y1="315" x2="860" y2="160"/>
    <line x1="600" y1="315" x2="860" y2="470"/>
    <line x1="540" y1="315" x2="540" y2="120"/>
    <line x1="540" y1="315" x2="540" y2="510"/>
  </g>

  <!-- Lightning bolt glow backdrop -->
  <ellipse cx="540" cy="315" rx="160" ry="200" fill="url(#boltGlow)" opacity="0.5"/>

  <!-- Main lightning bolt (Tesla AC symbol) -->
  <g filter="url(#glow)">
    <polygon
      points="580,130 490,310 555,310 500,500 630,285 558,285 620,130"
      fill="url(#boltFill)"
      opacity="0.92"
    />
    <!-- Inner highlight -->
    <polygon
      points="572,165 516,300 556,300 516,430 594,300 554,300 590,165"
      fill="#fef3c7"
      opacity="0.25"
    />
  </g>

  <!-- Broken/torn contract on right side -->
  <g transform="translate(780, 200)">
    <!-- Paper shadow -->
    <rect x="4" y="4" width="160" height="200" rx="4" fill="#d97706" opacity="0.15"/>
    <!-- Paper body top half -->
    <rect x="0" y="0" width="160" height="95" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2" opacity="0.9"/>
    <!-- Paper body bottom half (torn, shifted) -->
    <rect x="5" y="108" width="160" height="95" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2" opacity="0.85" transform="rotate(3, 85, 155)"/>
    <!-- Torn edge top -->
    <polyline points="0,95 20,88 40,96 60,85 80,94 100,83 120,92 140,86 160,95" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.7"/>
    <!-- Torn edge bottom -->
    <polyline points="5,108 25,115 45,107 65,118 85,109 105,120 125,111 145,117 165,108" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>
    <!-- Lines on paper (contract text suggestion) -->
    <g stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <line x1="20" y1="25" x2="140" y2="25"/>
      <line x1="20" y1="42" x2="140" y2="42"/>
      <line x1="20" y1="59" x2="110" y2="59"/>
      <line x1="20" y1="76" x2="130" y2="76"/>
    </g>
    <g stroke="#fbbf24" stroke-width="2" opacity="0.4" stroke-linecap="round" transform="rotate(3, 85, 155)">
      <line x1="25" y1="125" x2="145" y2="125"/>
      <line x1="25" y1="142" x2="145" y2="142"/>
      <line x1="25" y1="159" x2="115" y2="159"/>
      <line x1="25" y1="176" x2="135" y2="176"/>
    </g>
    <!-- X mark over contract -->
    <line x1="55" y1="35" x2="105" y2="85" stroke="#92400e" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="105" y1="35" x2="55" y2="85" stroke="#92400e" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Coins scattering / flowing away -->
  <!-- Coin group 1 — upper left area, dispersing -->
  <g opacity="0.75">
    <ellipse cx="320" cy="200" rx="22" ry="22" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="320" cy="200" rx="14" ry="14" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g opacity="0.55" transform="rotate(-15, 260, 260)">
    <ellipse cx="260" cy="260" rx="18" ry="18" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="200" cy="320" rx="14" ry="14" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <g opacity="0.3">
    <ellipse cx="160" cy="390" rx="10" ry="10" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  </g>
  <!-- Coin group 2 — lower area -->
  <g opacity="0.65">
    <ellipse cx="350" cy="450" rx="20" ry="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="350" cy="450" rx="12" ry="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g opacity="0.45">
    <ellipse cx="280" cy="500" rx="15" ry="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <g opacity="0.25">
    <ellipse cx="220" cy="540" rx="10" ry="10" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  </g>
  <!-- Coin group 3 — upper right, further away -->
  <g opacity="0.35">
    <ellipse cx="730" cy="140" rx="16" ry="16" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <g opacity="0.2">
    <ellipse cx="670" cy="100" rx="11" ry="11" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  </g>

  <!-- Dotted arc showing coins flowing away from bolt -->
  <path d="M 500 250 Q 380 220 280 310 Q 220 370 180 450" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <path d="M 510 380 Q 430 440 330 470 Q 270 490 210 530" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2"/>

  <!-- Small spark/star decorations around bolt -->
  <g fill="#fbbf24" opacity="0.5" filter="url(#glow)">
    <circle cx="430" cy="170" r="3"/>
    <circle cx="660" cy="160" r="3"/>
    <circle cx="420" cy="460" r="3"/>
    <circle cx="655" cy="460" r="3"/>
    <circle cx="390" cy="315" r="2.5"/>
    <circle cx="690" cy="315" r="2.5"/>
  </g>
  <!-- Larger spark lines -->
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="425" y1="165" x2="415" y2="155"/>
    <line x1="425" y1="165" x2="435" y2="155"/>
    <line x1="425" y1="165" x2="420" y2="152"/>
    <line x1="655" y1="155" x2="645" y2="145"/>
    <line x1="655" y1="155" x2="665" y2="145"/>
  </g>

  <!-- Bottom decorative lines -->
  <line x1="60" y1="585" x2="1140" y2="585" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="593" x2="1140" y2="593" stroke="#d97706" stroke-width="0.5" opacity="0.2"/>
</svg>
