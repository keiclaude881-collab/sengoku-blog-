<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <rect width="1000" height="380" fill="#f8faff" rx="12"/>
  <rect x="0" y="0" width="1000" height="380" rx="12" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Title -->
  <text x="500" y="44" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">翻訳者を介するコミュニケーション vs 直接の言語で話す</text>

  <!-- LEFT SIDE: 翻訳介在 -->
  <!-- King -->
  <rect x="40" y="80" width="120" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="105" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">歴代の王</text>
  <text x="100" y="125" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">(ギリシャ語のみ)</text>

  <!-- Arrow to translator -->
  <line x1="160" y1="108" x2="215" y2="108" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="210,103 220,108 210,113" fill="#6366f1"/>

  <!-- Translator box -->
  <rect x="220" y="80" width="100" height="56" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="270" y="105" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">翻訳者</text>
  <text x="270" y="123" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="10" fill="#78350f" text-anchor="middle">情報が変質する</text>

  <!-- Arrow to people -->
  <line x1="320" y1="108" x2="375" y2="108" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="370,103 380,108 370,113" fill="#6366f1"/>

  <!-- People box -->
  <rect x="380" y="80" width="120" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="440" y="105" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">エジプト民衆</text>
  <text x="440" y="123" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="10" fill="#4338ca" text-anchor="middle">司祭・商人・兵士</text>

  <!-- Loss tags -->
  <rect x="195" y="155" width="150" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="270" y="173" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">⚠ ニュアンス・スピード・信頼が失われる</text>

  <!-- LEFT label -->
  <rect x="40" y="210" width="460" height="36" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="270" y="233" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">従来の王のやり方：275年間続いた慣習</text>

  <!-- Divider -->
  <line x1="510" y1="60" x2="510" y2="320" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="510" y="350" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">VS</text>

  <!-- RIGHT SIDE: クレオパトラ直接 -->
  <!-- Cleopatra -->
  <rect x="540" y="80" width="130" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="605" y="105" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">クレオパトラ</text>
  <text x="605" y="123" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">(9カ国語習得)</text>

  <!-- Direct arrows to groups -->
  <!-- to Priests -->
  <line x1="670" y1="95" x2="790" y2="85" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="783,78 796,83 785,91" fill="#3b82f6"/>
  <rect x="795" y="65" width="90" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="840" y="87" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">エジプト司祭</text>

  <!-- to Merchants -->
  <line x1="670" y1="108" x2="790" y2="145" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="783,137 796,143 787,152" fill="#3b82f6"/>
  <rect x="795" y="127" width="90" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="840" y="149" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">ローマ将軍</text>

  <!-- to Caesar -->
  <line x1="670" y1="120" x2="790" y2="204" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="782,197 795,202 784,212" fill="#3b82f6"/>
  <rect x="795" y="187" width="90" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="840" y="209" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">アラビア商人</text>

  <!-- Direct label -->
  <text x="728" y="115" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">直接</text>
  <text x="728" y="160" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">直接</text>
  <text x="728" y="215" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">直接</text>

  <!-- Gain tag -->
  <rect x="538" y="155" width="150" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="613" y="173" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#166534" text-anchor="middle">✓ 情報・信頼・スピードをすべて確保</text>

  <!-- RIGHT label -->
  <rect x="540" y="248" width="420" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="750" y="271" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">クレオパトラのやり方：相手の言語で直接つながる</text>
</svg>
