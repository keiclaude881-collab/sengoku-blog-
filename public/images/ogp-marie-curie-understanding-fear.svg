<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="mcGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e9d5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f3e8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#faf5ff"/>

  <!-- left half: murky unknown (darker, fading shapes) -->
  <g opacity="0.35">
    <circle cx="230" cy="230" r="70" fill="#9333ea" opacity="0.25"/>
    <circle cx="330" cy="380" r="50" fill="#7e22ce" opacity="0.2"/>
    <circle cx="170" cy="430" r="36" fill="#9333ea" opacity="0.22"/>
    <path d="M 120 150 Q 200 100 280 150 Q 220 200 120 150 Z" fill="#6b21a8" opacity="0.15"/>
  </g>

  <!-- center: glowing flask radiating light (understanding dissolves fear) -->
  <circle cx="600" cy="315" r="260" fill="url(#mcGlow)"/>

  <!-- radiating light rays -->
  <g stroke="#9333ea" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="600" y1="80" x2="600" y2="130"/>
    <line x1="600" y1="500" x2="600" y2="550"/>
    <line x1="420" y1="150" x2="455" y2="185"/>
    <line x1="780" y1="150" x2="745" y2="185"/>
    <line x1="420" y1="480" x2="455" y2="445"/>
    <line x1="780" y1="480" x2="745" y2="445"/>
  </g>

  <!-- flask -->
  <g>
    <rect x="572" y="190" width="56" height="70" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="4"/>
    <path d="M 572 260 L 540 400 Q 538 420 560 420 L 640 420 Q 662 420 660 400 L 628 260 Z" fill="#f3e8ff" stroke="#7e22ce" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 552 340 Q 600 320 648 340 L 656 390 Q 658 408 644 408 L 556 408 Q 542 408 544 390 Z" fill="#9333ea" opacity="0.85"/>
    <circle cx="600" cy="310" r="5" fill="#7e22ce"/>
    <circle cx="615" cy="330" r="4" fill="#7e22ce"/>
    <circle cx="585" cy="335" r="3.5" fill="#7e22ce"/>
  </g>

  <!-- bubbles rising -->
  <circle cx="560" cy="160" r="6" fill="#d8b4fe" opacity="0.7"/>
  <circle cx="650" cy="130" r="9" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="600" cy="100" r="5" fill="#d8b4fe" opacity="0.6"/>

  <!-- right half: clear, ordered shapes (understanding / clarity) -->
  <g>
    <circle cx="980" cy="220" r="46" fill="none" stroke="#9333ea" stroke-width="3.5" opacity="0.7"/>
    <circle cx="980" cy="220" r="22" fill="#d8b4fe" opacity="0.8"/>
    <circle cx="1060" cy="380" r="34" fill="none" stroke="#7e22ce" stroke-width="3.5" opacity="0.7"/>
    <circle cx="1060" cy="380" r="14" fill="#9333ea" opacity="0.8"/>
    <circle cx="900" cy="420" r="26" fill="none" stroke="#9333ea" stroke-width="3" opacity="0.6"/>
    <circle cx="900" cy="420" r="10" fill="#d8b4fe" opacity="0.8"/>
    <line x1="980" y1="266" x2="1060" y2="346" stroke="#7e22ce" stroke-width="2" stroke-dasharray="4,5" opacity="0.5"/>
    <line x1="940" y1="240" x2="900" y2="394" stroke="#7e22ce" stroke-width="2" stroke-dasharray="4,5" opacity="0.5"/>
  </g>

  <ellipse cx="600" cy="560" rx="120" ry="14" fill="#d8b4fe" opacity="0.4"/>
</svg>
