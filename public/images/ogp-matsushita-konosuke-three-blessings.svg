<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gemGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="gemGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Soft background orbs -->
  <circle cx="150" cy="150" r="220" fill="url(#glowA)" opacity="0.5"/>
  <circle cx="1050" cy="480" r="200" fill="url(#glowB)" opacity="0.4"/>
  <circle cx="600" cy="320" r="300" fill="#ddd6fe" opacity="0.08"/>

  <!-- Decorative arc connecting the three gems -->
  <path d="M 270 430 Q 600 200 930 430" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>

  <!-- Upward rays from each gem -->
  <!-- Gem 1 rays -->
  <g opacity="0.25" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round">
    <line x1="270" y1="350" x2="270" y2="220"/>
    <line x1="270" y1="350" x2="240" y2="225"/>
    <line x1="270" y1="350" x2="300" y2="225"/>
    <line x1="270" y1="350" x2="215" y2="240"/>
    <line x1="270" y1="350" x2="325" y2="240"/>
  </g>
  <!-- Gem 2 rays -->
  <g opacity="0.25" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round">
    <line x1="600" y1="310" x2="600" y2="155"/>
    <line x1="600" y1="310" x2="565" y2="160"/>
    <line x1="600" y1="310" x2="635" y2="160"/>
    <line x1="600" y1="310" x2="540" y2="175"/>
    <line x1="600" y1="310" x2="660" y2="175"/>
  </g>
  <!-- Gem 3 rays -->
  <g opacity="0.25" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round">
    <line x1="930" y1="350" x2="930" y2="220"/>
    <line x1="930" y1="350" x2="900" y2="225"/>
    <line x1="930" y1="350" x2="960" y2="225"/>
    <line x1="930" y1="350" x2="875" y2="240"/>
    <line x1="930" y1="350" x2="985" y2="240"/>
  </g>

  <!-- Constraint bases (small downward triangles → transformed) -->
  <!-- Base 1 -->
  <polygon points="270,490 230,550 310,550" fill="#ddd6fe" opacity="0.4"/>
  <line x1="270" y1="490" x2="270" y2="440" stroke="#c4b5fd" stroke-width="2" opacity="0.6"/>

  <!-- Base 2 -->
  <polygon points="600,470 555,540 645,540" fill="#ddd6fe" opacity="0.4"/>
  <line x1="600" y1="470" x2="600" y2="420" stroke="#c4b5fd" stroke-width="2" opacity="0.6"/>

  <!-- Base 3 -->
  <polygon points="930,490 890,550 970,550" fill="#ddd6fe" opacity="0.4"/>
  <line x1="930" y1="490" x2="930" y2="440" stroke="#c4b5fd" stroke-width="2" opacity="0.6"/>

  <!-- Gem 1 (貧乏 → 勤勉) — left -->
  <g filter="url(#glow)">
    <!-- Diamond shape -->
    <polygon points="270,360 230,410 270,450 310,410" fill="url(#gemGrad1)" opacity="0.9"/>
    <!-- Facet lines -->
    <line x1="270" y1="360" x2="270" y2="450" stroke="#faf5ff" stroke-width="1" opacity="0.4"/>
    <line x1="230" y1="410" x2="310" y2="410" stroke="#faf5ff" stroke-width="1" opacity="0.4"/>
    <line x1="270" y1="360" x2="248" y2="395" stroke="#faf5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="270" y1="360" x2="292" y2="395" stroke="#faf5ff" stroke-width="0.8" opacity="0.3"/>
    <!-- Shine -->
    <ellipse cx="258" cy="390" rx="6" ry="4" fill="white" opacity="0.4" transform="rotate(-20,258,390)"/>
  </g>

  <!-- Gem 2 (病弱 → 任せる力) — center, larger -->
  <g filter="url(#softGlow)">
    <polygon points="600,320 548,385 600,435 652,385" fill="url(#gemGrad1)" opacity="0.95"/>
    <line x1="600" y1="320" x2="600" y2="435" stroke="#faf5ff" stroke-width="1.2" opacity="0.4"/>
    <line x1="548" y1="385" x2="652" y2="385" stroke="#faf5ff" stroke-width="1.2" opacity="0.4"/>
    <line x1="600" y1="320" x2="572" y2="368" stroke="#faf5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="600" y1="320" x2="628" y2="368" stroke="#faf5ff" stroke-width="0.8" opacity="0.3"/>
    <ellipse cx="583" cy="360" rx="8" ry="5" fill="white" opacity="0.45" transform="rotate(-20,583,360)"/>
    <!-- Extra sparkle -->
    <circle cx="600" cy="320" r="5" fill="white" opacity="0.6"/>
  </g>

  <!-- Gem 3 (低学歴 → 謙虚さ) — right -->
  <g filter="url(#glow)">
    <polygon points="930,360 890,410 930,450 970,410" fill="url(#gemGrad2)" opacity="0.9"/>
    <line x1="930" y1="360" x2="930" y2="450" stroke="#faf5ff" stroke-width="1" opacity="0.4"/>
    <line x1="890" y1="410" x2="970" y2="410" stroke="#faf5ff" stroke-width="1" opacity="0.4"/>
    <line x1="930" y1="360" x2="908" y2="395" stroke="#faf5ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="930" y1="360" x2="952" y2="395" stroke="#faf5ff" stroke-width="0.8" opacity="0.3"/>
    <ellipse cx="918" cy="390" rx="6" ry="4" fill="white" opacity="0.4" transform="rotate(-20,918,390)"/>
  </g>

  <!-- Small connecting dots along the arc -->
  <circle cx="420" cy="290" r="4" fill="#a78bfa" opacity="0.4"/>
  <circle cx="480" cy="250" r="3" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="720" cy="250" r="3" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="780" cy="290" r="4" fill="#a78bfa" opacity="0.4"/>

  <!-- Floating stars/sparkles -->
  <g fill="#7c3aed" opacity="0.3">
    <circle cx="100" cy="300" r="3"/>
    <circle cx="130" cy="200" r="2"/>
    <circle cx="80" cy="400" r="2.5"/>
    <circle cx="1100" cy="200" r="3"/>
    <circle cx="1070" cy="320" r="2"/>
    <circle cx="1120" cy="400" r="2.5"/>
    <circle cx="400" cy="120" r="2"/>
    <circle cx="800" cy="110" r="2.5"/>
    <circle cx="600" cy="90" r="3"/>
  </g>

  <!-- Number labels — three circles with ordinal marks -->
  <circle cx="270" cy="290" r="22" fill="#7c3aed" opacity="0.15"/>
  <circle cx="270" cy="290" r="16" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <text x="270" y="296" text-anchor="middle" font-family="serif" font-size="16" fill="#6b21a8" opacity="0.7" font-weight="bold">1</text>

  <circle cx="600" cy="260" r="22" fill="#7c3aed" opacity="0.15"/>
  <circle cx="600" cy="260" r="16" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <text x="600" y="266" text-anchor="middle" font-family="serif" font-size="16" fill="#6b21a8" opacity="0.7" font-weight="bold">2</text>

  <circle cx="930" cy="290" r="22" fill="#7c3aed" opacity="0.15"/>
  <circle cx="930" cy="290" r="16" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <text x="930" y="296" text-anchor="middle" font-family="serif" font-size="16" fill="#6b21a8" opacity="0.7" font-weight="bold">3</text>

  <!-- Bottom decorative line -->
  <line x1="60" y1="590" x2="1140" y2="590" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
</svg>
