<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="iyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="iySea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#iyBg)"/>

  <!-- sea -->
  <rect x="0" y="430" width="1200" height="200" fill="url(#iySea)"/>
  <path d="M 0 430 C 200 410, 400 450, 600 430 C 800 410, 1000 450, 1200 430 L 1200 460 C 1000 480, 800 440, 600 460 C 400 480, 200 440, 0 460 Z" fill="#f59e0b" opacity="0.5"/>

  <!-- sun -->
  <circle cx="600" cy="160" r="80" fill="#f59e0b" opacity="0.85"/>
  <circle cx="600" cy="160" r="110" fill="#fde68a" opacity="0.4"/>

  <!-- three small ships on the left, converging toward one point (dispersed starting resources) -->
  <g opacity="0.9">
    <g transform="translate(150,330)">
      <path d="M -40 20 L 40 20 L 28 40 L -28 40 Z" fill="#92400e"/>
      <line x1="0" y1="20" x2="0" y2="-30" stroke="#78350f" stroke-width="4"/>
      <path d="M 0 -28 L 34 -8 L 0 4 Z" fill="#d97706"/>
    </g>
    <g transform="translate(230,370)">
      <path d="M -36 18 L 36 18 L 26 36 L -26 36 Z" fill="#92400e"/>
      <line x1="0" y1="18" x2="0" y2="-26" stroke="#78350f" stroke-width="4"/>
      <path d="M 0 -24 L 30 -6 L 0 4 Z" fill="#d97706"/>
    </g>
    <g transform="translate(150,400)">
      <path d="M -32 16 L 32 16 L 23 32 L -23 32 Z" fill="#92400e"/>
      <line x1="0" y1="16" x2="0" y2="-22" stroke="#78350f" stroke-width="4"/>
      <path d="M 0 -20 L 26 -5 L 0 3 Z" fill="#d97706"/>
    </g>
  </g>

  <!-- converging funnel lines from the three ships into one path -->
  <path d="M 150 330 C 350 350, 550 380, 760 400" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>
  <path d="M 230 370 C 400 380, 580 390, 760 400" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>
  <path d="M 150 400 C 350 400, 560 400, 760 400" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>

  <!-- one large, powerful steamship on the right (concentrated resources, the result) -->
  <g transform="translate(950,400)">
    <path d="M -160 60 L 160 60 L 120 120 L -120 120 Z" fill="#78350f"/>
    <rect x="-70" y="-20" width="140" height="80" fill="#92400e"/>
    <rect x="-30" y="-70" width="14" height="56" fill="#78350f"/>
    <rect x="30" y="-70" width="14" height="56" fill="#78350f"/>
    <circle cx="-23" cy="-82" r="14" fill="#92400e" opacity="0.6"/>
    <circle cx="37" cy="-82" r="14" fill="#92400e" opacity="0.6"/>
    <rect x="-110" y="0" width="220" height="14" fill="#d97706"/>
  </g>

  <!-- rising arrow above the large ship emphasizing growth from concentration -->
  <path d="M 950 250 L 950 150" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
  <polygon points="950,120 925,160 975,160" fill="#78350f"/>
</svg>
