<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <text x="500" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">昨日の自分 vs 今日の自分</text>

  <!-- 左ボックス：昨日の自分 -->
  <rect x="80" y="80" width="340" height="220" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="250" y="118" font-family="sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle">昨日の自分</text>
  <!-- スティックフィギュア（小さめ） -->
  <circle cx="250" cy="170" r="22" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <line x1="250" y1="192" x2="250" y2="250" stroke="#8b5cf6" stroke-width="3"/>
  <line x1="250" y1="210" x2="220" y2="230" stroke="#8b5cf6" stroke-width="2.5"/>
  <line x1="250" y1="210" x2="280" y2="230" stroke="#8b5cf6" stroke-width="2.5"/>
  <line x1="250" y1="250" x2="228" y2="285" stroke="#8b5cf6" stroke-width="2.5"/>
  <line x1="250" y1="250" x2="272" y2="285" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="250" y="310" font-family="sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">基準点</text>

  <!-- 矢印（右方向、強調） -->
  <line x1="440" y1="190" x2="555" y2="190" stroke="#6b21a8" stroke-width="4"/>
  <polygon points="555,190 535,178 535,202" fill="#6b21a8"/>
  <text x="497" y="178" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">超える</text>
  <text x="497" y="212" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">+1%</text>

  <!-- 右ボックス：今日の自分 -->
  <rect x="580" y="80" width="340" height="220" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="750" y="118" font-family="sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle">今日の自分</text>
  <!-- スティックフィギュア（やや大きめ、成長） -->
  <circle cx="750" cy="162" r="26" fill="none" stroke="#6b21a8" stroke-width="3"/>
  <line x1="750" y1="188" x2="750" y2="250" stroke="#6b21a8" stroke-width="3.5"/>
  <line x1="750" y1="205" x2="716" y2="222" stroke="#6b21a8" stroke-width="3"/>
  <line x1="750" y1="205" x2="784" y2="222" stroke="#6b21a8" stroke-width="3"/>
  <line x1="750" y1="250" x2="726" y2="286" stroke="#6b21a8" stroke-width="3"/>
  <line x1="750" y1="250" x2="774" y2="286" stroke="#6b21a8" stroke-width="3"/>
  <text x="750" y="310" font-family="sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle">今日の基準点</text>

  <!-- 下部メッセージ -->
  <rect x="180" y="330" width="640" height="56" rx="10" fill="#f3e8ff"/>
  <text x="500" y="360" font-family="sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">比べる相手は「他人」ではなく「昨日の自分」</text>
  <text x="500" y="378" font-family="sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">— 五輪書の教え</text>
</svg>
