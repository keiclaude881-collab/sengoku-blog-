<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <radialGradient id="lightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- darkness layer -->
  <rect width="1200" height="630" fill="#0f0a1e" opacity="0.5"/>

  <!-- central light source -->
  <circle cx="600" cy="300" r="200" fill="url(#lightGrad)"/>
  <circle cx="600" cy="300" r="80" fill="#f3e8ff" opacity="0.25"/>
  <circle cx="600" cy="300" r="30" fill="#e9d5ff" opacity="0.5"/>

  <!-- candle flame / light at center -->
  <ellipse cx="600" cy="290" rx="18" ry="30" fill="#e9d5ff" opacity="0.8"/>
  <path d="M 600 260 C 610 240 615 220 605 200 C 595 215 585 230 590 260 Z" fill="#d8b4fe" opacity="0.7"/>

  <!-- rays emanating outward -->
  <g stroke="#a855f7" stroke-width="2" opacity="0.4">
    <line x1="600" y1="300" x2="200" y2="100"/>
    <line x1="600" y1="300" x2="1000" y2="100"/>
    <line x1="600" y1="300" x2="200" y2="500"/>
    <line x1="600" y1="300" x2="1000" y2="500"/>
    <line x1="600" y1="300" x2="100" y2="300"/>
    <line x1="600" y1="300" x2="1100" y2="300"/>
  </g>

  <!-- silhouette figure looking toward the light -->
  <g transform="translate(350,430)" opacity="0.9">
    <circle cx="0" cy="-30" r="22" fill="#d8b4fe"/>
    <path d="M -30 80 C -30 10 -20 -8 0 -8 C 20 -8 30 10 30 80 Z" fill="#c084fc"/>
    <path d="M -18 80 L -22 140 L -6 140 L -2 90 Z" fill="#a855f7"/>
    <path d="M 18 80 L 22 140 L 6 140 L 2 90 Z" fill="#a855f7"/>
    <!-- arm stretched toward light -->
    <path d="M 30 20 C 80 0 140 -20 200 -30" fill="none" stroke="#d8b4fe" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="-30" r="8" fill="#e9d5ff"/>
  </g>

  <!-- horizontal bars/obstacles the figure crosses -->
  <g stroke="#4c1d95" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="490" x2="480" y2="490"/>
    <line x1="100" y1="530" x2="420" y2="530"/>
    <line x1="100" y1="570" x2="360" y2="570"/>
  </g>

  <!-- small stars in the dark sky -->
  <g fill="#e9d5ff" opacity="0.5">
    <circle cx="150" cy="80" r="3"/>
    <circle cx="300" cy="40" r="2"/>
    <circle cx="900" cy="60" r="3"/>
    <circle cx="1050" cy="100" r="2"/>
    <circle cx="1100" cy="50" r="3"/>
    <circle cx="80" cy="200" r="2"/>
    <circle cx="1120" cy="400" r="2"/>
  </g>
</svg>
