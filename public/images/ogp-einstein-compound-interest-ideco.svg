<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgG)"/>
  <circle cx="120" cy="540" r="80" fill="#fde68a" opacity="0.45"/>
  <circle cx="1080" cy="100" r="60" fill="#fde68a" opacity="0.45"/>
  
  <!-- Exponential compound growth curve -->
  <path d="M 200 480 C 300 475 400 460 500 430 C 600 390 650 340 720 260 C 780 190 830 145 920 100"
        fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Area under curve (shaded) -->
  <path d="M 200 480 C 300 475 400 460 500 430 C 600 390 650 340 720 260 C 780 190 830 145 920 100 L 920 480 Z"
        fill="#fde68a" opacity="0.3"/>
  
  <!-- Data points on curve -->
  <circle cx="200" cy="480" r="10" fill="#d97706"/>
  <circle cx="350" cy="468" r="10" fill="#d97706"/>
  <circle cx="500" cy="430" r="10" fill="#d97706"/>
  <circle cx="650" cy="340" r="12" fill="#d97706"/>
  <circle cx="800" cy="180" r="14" fill="#d97706"/>
  <circle cx="920" cy="100" r="16" fill="#b45309"/>
  
  <!-- Axes -->
  <line x1="170" y1="100" x2="170" y2="500" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="500" x2="950" y2="500" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Magnifying glass over the steep end of curve -->
  <circle cx="870" cy="170" r="90" fill="none" stroke="#92400e" stroke-width="8" opacity="0.7"/>
  <circle cx="870" cy="170" r="90" fill="#fffbeb" opacity="0.25"/>
  <line x1="932" y1="240" x2="990" y2="310" stroke="#92400e" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <!-- Magnified growth inside lens -->
  <path d="M 800 200 C 825 170 850 130 900 110"
        fill="none" stroke="#d97706" stroke-width="5" opacity="0.8"/>
  <circle cx="900" cy="110" r="8" fill="#d97706" opacity="0.8"/>

</svg>