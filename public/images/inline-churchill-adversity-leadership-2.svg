<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 最悪シナリオを先読みして備える構造図 -->

  <!-- Title -->
  <text x="500" y="44" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">最悪シナリオ先読みフレームワーク</text>

  <!-- Step 1: 計画段階 -->
  <rect x="60" y="70" width="230" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="175" y="100" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">STEP 1</text>
  <text x="175" y="124" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">プロジェクト開始前に</text>
  <text x="175" y="146" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">「最悪の結末」を書く</text>
  <text x="175" y="168" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">（悲観的に想定する）</text>

  <!-- Arrow 1→2 -->
  <line x1="292" y1="125" x2="370" y2="125" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="366,116 382,125 366,134" fill="#92400e"/>

  <!-- Step 2: 備え -->
  <rect x="384" y="70" width="230" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="499" y="100" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">STEP 2</text>
  <text x="499" y="124" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">最悪を防ぐ手を</text>
  <text x="499" y="146" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">事前に打っておく</text>
  <text x="499" y="168" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">（対策を先に設計）</text>

  <!-- Arrow 2→3 -->
  <line x1="616" y1="125" x2="694" y2="125" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="690,116 706,125 690,134" fill="#92400e"/>

  <!-- Step 3: 実行 -->
  <rect x="708" y="70" width="230" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="823" y="100" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">STEP 3</text>
  <text x="823" y="124" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">危機が来ても</text>
  <text x="823" y="146" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">冷静に対処できる</text>
  <text x="823" y="168" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">（想定内だから動じない）</text>

  <!-- Divider -->
  <line x1="60" y1="218" x2="940" y2="218" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- チャーチルの言葉 quote box -->
  <rect x="120" y="236" width="760" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" opacity="0.9"/>
  <text x="500" y="267" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">「悲観主義者は好機の中に困難を見る</text>
  <text x="500" y="292" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">楽観主義者は困難の中に好機を見る」― チャーチル</text>

  <!-- Two column comparison -->
  <!-- Pessimist column -->
  <rect x="60" y="322" width="420" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <text x="270" y="348" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">先に最悪を想定する（推奨）</text>
  <text x="270" y="370" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">→ 危機が来ても「想定内」で動じない</text>

  <!-- Optimist column -->
  <rect x="520" y="322" width="420" height="70" rx="8" fill="#fef3c7" stroke="#e8e0d4" stroke-width="1.5" opacity="0.7"/>
  <text x="730" y="348" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">根拠のない楽観（非推奨）</text>
  <text x="730" y="370" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">→ 危機が来たとき慌てて判断を誤る</text>
</svg>
