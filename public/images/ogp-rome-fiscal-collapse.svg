<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad2)"/>

  <!-- ground line -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#fde68a" stroke-width="3"/>

  <!-- crumbling roman columns, three, one cracked/toppled -->
  <g>
    <!-- column 1: standing -->
    <g transform="translate(280,520)">
      <rect x="-46" y="-280" width="92" height="20" fill="#92400e"/>
      <rect x="-30" y="-260" width="60" height="220" fill="#d97706"/>
      <rect x="-46" y="-20" width="92" height="20" fill="#92400e"/>
      <line x1="-18" y1="-250" x2="-18" y2="-50" stroke="#fde68a" stroke-width="3" opacity="0.7"/>
      <line x1="6" y1="-250" x2="6" y2="-50" stroke="#fde68a" stroke-width="3" opacity="0.7"/>
    </g>

    <!-- column 2: cracked, leaning -->
    <g transform="translate(560,520) rotate(-7)">
      <rect x="-46" y="-260" width="92" height="20" fill="#92400e" opacity="0.85"/>
      <rect x="-30" y="-240" width="60" height="200" fill="#f59e0b" opacity="0.85"/>
      <rect x="-46" y="-20" width="92" height="20" fill="#92400e" opacity="0.85"/>
      <path d="M -10 -230 L 6 -160 L -6 -150 L 14 -60" stroke="#78350f" stroke-width="5" fill="none" opacity="0.8"/>
    </g>

    <!-- column 3: toppled, broken into segments -->
    <g transform="translate(880,500)">
      <rect x="-110" y="-20" width="70" height="40" rx="6" fill="#92400e" opacity="0.75" transform="rotate(4 -75 0)"/>
      <rect x="-20" y="-18" width="90" height="36" rx="6" fill="#d97706" opacity="0.75" transform="rotate(-2 25 0)"/>
      <rect x="90" y="-22" width="60" height="42" rx="6" fill="#92400e" opacity="0.75" transform="rotate(6 120 0)"/>
    </g>
  </g>

  <!-- downward trend line over the scene -->
  <path d="M 140 160 L 420 220 L 660 200 L 860 320 L 1080 420" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="140" cy="160" r="9" fill="#78350f"/>
  <circle cx="1080" cy="420" r="9" fill="#78350f"/>

  <!-- thin cracks radiating in sky -->
  <path d="M 980 90 L 1010 140 L 990 150 L 1030 200" stroke="#d97706" stroke-width="3" fill="none" opacity="0.5"/>
</svg>
