<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- タイトルテキスト -->
  <text x="500" y="50" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">ひとりの剣士、静かなる素振り</text>

  <!-- 地面 -->
  <line x1="200" y1="340" x2="800" y2="340" stroke="#d8b4fe" stroke-width="2"/>

  <!-- 人物スティックフィギュア（武者の構え） -->
  <circle cx="500" cy="130" r="28" fill="none" stroke="#6b21a8" stroke-width="3"/>
  <line x1="500" y1="158" x2="500" y2="280" stroke="#6b21a8" stroke-width="4"/>
  <line x1="500" y1="185" x2="430" y2="155" stroke="#6b21a8" stroke-width="3.5"/>
  <line x1="430" y1="155" x2="380" y2="100" stroke="#6b21a8" stroke-width="3.5"/>
  <line x1="500" y1="185" x2="560" y2="175" stroke="#6b21a8" stroke-width="3.5"/>
  <line x1="390" y1="95" x2="300" y2="60" stroke="#6b21a8" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="60" x2="285" y2="52" stroke="#a855f7" stroke-width="7" stroke-linecap="round"/>
  <path d="M 330 75 Q 400 30 470 80" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="500" y1="280" x2="460" y2="340" stroke="#6b21a8" stroke-width="3.5"/>
  <line x1="500" y1="280" x2="550" y2="340" stroke="#6b21a8" stroke-width="3.5"/>

  <circle cx="700" cy="200" r="4" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="720" cy="240" r="3" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="690" cy="270" r="5" fill="#d8b4fe" opacity="0.4"/>
  <circle cx="300" cy="220" r="4" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="280" cy="260" r="3" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="310" cy="290" r="5" fill="#d8b4fe" opacity="0.4"/>

  <ellipse cx="500" cy="346" rx="60" ry="8" fill="#e9d5ff" opacity="0.7"/>

  <text x="780" y="200" font-family="sans-serif" font-size="20" font-weight="700" fill="#6b21a8" text-anchor="middle">一日一剣</text>
  <text x="780" y="230" font-family="sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">他と比べず</text>
  <text x="780" y="254" font-family="sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">ただ磨く</text>

  <text x="220" y="370" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">静寂の中に</text>
  <text x="220" y="390" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">本質がある</text>
</svg>
