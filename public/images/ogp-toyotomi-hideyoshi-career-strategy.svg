<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Staircase going upward (from sandal carrier to ruler) -->
  <!-- steps (going up left to right) -->
  <g fill="#3b82f6">
    <rect x="180" y="490" width="140" height="50" rx="5" opacity="0.55"/>
    <rect x="320" y="440" width="140" height="100" rx="5" opacity="0.60"/>
    <rect x="460" y="380" width="140" height="160" rx="5" opacity="0.65"/>
    <rect x="600" y="310" width="140" height="230" rx="5" opacity="0.72"/>
    <rect x="740" y="230" width="140" height="310" rx="5" opacity="0.80"/>
    <rect x="880" y="140" width="140" height="400" rx="5" opacity="0.88"/>
  </g>
  <!-- step tops (highlighted) -->
  <g fill="#bfdbfe" opacity="0.50">
    <rect x="180" y="486" width="140" height="10" rx="3"/>
    <rect x="320" y="436" width="140" height="10" rx="3"/>
    <rect x="460" y="376" width="140" height="10" rx="3"/>
    <rect x="600" y="306" width="140" height="10" rx="3"/>
    <rect x="740" y="226" width="140" height="10" rx="3"/>
    <rect x="880" y="136" width="140" height="10" rx="3"/>
  </g>
  <!-- ascending arrow following staircase -->
  <polyline points="250,485 390,435 530,375 670,305 810,225 950,140"
            fill="none" stroke="#1e40af" stroke-width="8" stroke-dasharray="14,8" opacity="0.55"/>
  <!-- figure at top -->
  <circle cx="950" cy="110" r="24" fill="#1e40af" opacity="0.80"/>
</svg>