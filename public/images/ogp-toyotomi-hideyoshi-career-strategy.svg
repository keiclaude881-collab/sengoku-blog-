<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- 左縦バー -->
  <rect x="0" y="0" width="12" height="630" fill="#92400e"/>

  <!-- 装飾モチーフ: 階段シルエット（秀吉の出世） -->
  <g opacity="0.18" transform="translate(80,180)">
    <rect x="0" y="200" width="80" height="40" fill="#92400e"/>
    <rect x="80" y="160" width="80" height="80" fill="#92400e"/>
    <rect x="160" y="120" width="80" height="120" fill="#92400e"/>
    <rect x="240" y="80" width="80" height="160" fill="#92400e"/>
    <rect x="320" y="40" width="80" height="200" fill="#92400e"/>
  </g>

  <!-- 家紋モチーフ（五七の桐・簡略化） -->
  <g transform="translate(900,340)" opacity="0.15">
    <ellipse cx="0" cy="-60" rx="18" ry="28" fill="#92400e"/>
    <ellipse cx="-34" cy="-44" rx="16" ry="24" fill="#92400e"/>
    <ellipse cx="34" cy="-44" rx="16" ry="24" fill="#92400e"/>
    <ellipse cx="-58" cy="-20" rx="13" ry="19" fill="#92400e"/>
    <ellipse cx="58" cy="-20" rx="13" ry="19" fill="#92400e"/>
    <rect x="-4" y="-20" width="8" height="80" rx="3" fill="#92400e"/>
  </g>

  <!-- カテゴリバッジ -->
  <rect x="680" y="170" width="150" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="755" y="194" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">キャリア・副業</text>

  <!-- タイトル -->
  <text x="680" y="270" font-family="'Shippori Mincho', 'Hiragino Mincho ProN', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">豊臣秀吉の出世戦略</text>
  <text x="680" y="318" font-family="'Shippori Mincho', 'Hiragino Mincho ProN', serif" font-size="22" font-weight="400" fill="#44403c" letter-spacing="1">農民から天下人へ</text>

  <!-- サブタイトル -->
  <text x="680" y="370" font-family="'Hiragino Sans', sans-serif" font-size="18" fill="#92400e" letter-spacing="0.5">先読み・信頼・居場所づくりの3原則</text>

  <!-- サイト名 -->
  <text x="100" y="585" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
