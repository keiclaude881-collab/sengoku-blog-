<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 短期視点vs長期視点の時間軸の違い -->

  <!-- Top band label -->
  <text x="500" y="45" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">同じ「失敗」が、時間軸によってまったく違う意味を持つ</text>

  <!-- LEFT: short-term view -->
  <rect x="60" y="65" width="400" height="300" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  <text x="260" y="100" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">短期視点（今だけ見る）</text>

  <!-- Short timeline: short bar with big X at end -->
  <line x1="110" y1="210" x2="380" y2="210" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <polygon points="390,210 370,200 370,220" fill="#d97706"/>

  <!-- Big X for failure -->
  <line x1="250" y1="155" x2="310" y2="195" stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="310" y1="155" x2="250" y2="195" stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <text x="280" y="240" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">失敗</text>

  <!-- Emotion labels -->
  <text x="260" y="280" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">「終わった」</text>
  <text x="260" y="302" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">「自分はダメだ」</text>
  <text x="260" y="324" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">「もうやめたい」</text>

  <!-- Divider -->
  <line x1="500" y1="65" x2="500" y2="365" stroke="#e8e0d4" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- RIGHT: long-term view -->
  <rect x="540" y="65" width="400" height="300" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2" opacity="0.6"/>
  <text x="740" y="100" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">長期視点（10年先まで見る）</text>

  <!-- Long timeline with upward trajectory -->
  <line x1="560" y1="270" x2="880" y2="270" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Points on timeline -->
  <!-- Failure point -->
  <circle cx="650" cy="255" r="7" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="295" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">失敗</text>

  <!-- Arrow from failure upward to future -->
  <path d="M 650 248 C 680 200 750 160 840 130" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="836,120 850,132 837,142" fill="#92400e"/>

  <!-- Future success point -->
  <circle cx="850" cy="130" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
  <text x="850" y="115" font-family="'Hiragino Sans', sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">転機</text>

  <!-- In between: small dots showing growth -->
  <circle cx="710" cy="210" r="4" fill="#b45309" opacity="0.5"/>
  <circle cx="760" cy="185" r="4" fill="#b45309" opacity="0.6"/>
  <circle cx="805" cy="160" r="4" fill="#b45309" opacity="0.7"/>

  <!-- Long-term message -->
  <text x="740" y="310" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">「あの経験があったから」</text>
  <text x="740" y="332" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">「今の自分がある」</text>
  <text x="740" y="354" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle" opacity="0.9">に変わる</text>
</svg>
