<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">「出来事」と「感情」のあいだにあるもの</text>
  <line x1="100" y1="58" x2="900" y2="58" stroke="#e9d5ff" stroke-width="1.5"/>

  <!-- Box 1: 出来事 -->
  <rect x="50" y="165" width="110" height="85" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="105" y="202" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">出来事</text>
  <text x="105" y="223" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#78716c" text-anchor="middle">(同僚の態度)</text>

  <!-- Arrow 1 -->
  <line x1="164" y1="205" x2="208" y2="205" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 2: 判断・解釈（強調） -->
  <rect x="214" y="148" width="150" height="118" rx="8" fill="#f3e8ff" stroke="#6b21a8" stroke-width="3"/>
  <text x="289" y="190" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle">自分の判断</text>
  <text x="289" y="212" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle">・解釈</text>
  <text x="289" y="238" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">↑ ここだけが変えられる</text>

  <!-- Arrow 2 -->
  <line x1="370" y1="205" x2="412" y2="205" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 3: 感情・反応 -->
  <rect x="418" y="165" width="110" height="85" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="473" y="202" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">感情・反応</text>
  <text x="473" y="223" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#78716c" text-anchor="middle">(イライラ・不安)</text>

  <!-- caption -->
  <text x="289" y="285" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#78716c" text-anchor="middle">同じ出来事でも、判断が変われば感情も変わる</text>

  <!-- Right side: explanation box -->
  <rect x="560" y="80" width="380" height="280" rx="8" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="750" y="115" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">アウレリウスの考え方</text>
  <line x1="580" y1="128" x2="920" y2="128" stroke="#e9d5ff" stroke-width="1"/>

  <circle cx="585" cy="160" r="5" fill="#6b21a8"/>
  <text x="600" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">出来事そのものは、良くも悪くもない</text>

  <circle cx="585" cy="198" r="5" fill="#6b21a8"/>
  <text x="600" y="203" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">反応を生むのは、自分自身の「解釈」</text>

  <circle cx="585" cy="236" r="5" fill="#6b21a8"/>
  <text x="600" y="241" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">朝に「予行演習」しておくと動揺しにくい</text>

  <circle cx="585" cy="274" r="5" fill="#6b21a8"/>
  <text x="600" y="279" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">夜に書き出すと、判断のクセに気づける</text>

  <!-- Bottom quote -->
  <text x="500" y="408" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" letter-spacing="1" opacity="0.85" font-style="italic">「『害された』と思わなければ、害されてはいない」</text>
</svg>
