<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Wallace competitor appears: two runners suddenly side by side -->
  <!-- Track/path -->
  <line x1="100" y1="310" x2="900" y2="310" stroke="#ddd6fe" stroke-width="4" opacity="0.5"/>
  <!-- Darwin (frontrunner, slowing) -->
  <circle cx="420" cy="242" r="32" fill="#c4b5fd" opacity="0.7"/>
  <rect x="392" y="274" width="60" height="80" rx="7" fill="#c4b5fd" opacity="0.6"/>
  <!-- Running legs -->
  <line x1="400" y1="354" x2="375" y2="395" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="440" y1="354" x2="455" y2="395" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Wallace (sudden competitor, fast) -->
  <circle cx="600" cy="230" r="32" fill="#7c3aed" opacity="0.8"/>
  <rect x="572" y="262" width="60" height="80" rx="7" fill="#7c3aed" opacity="0.7"/>
  <!-- Speed lines behind Wallace -->
  <line x1="540" y1="240" x2="488" y2="240" stroke="#c4b5fd" stroke-width="3" opacity="0.5"/>
  <line x1="538" y1="258" x2="486" y2="255" stroke="#c4b5fd" stroke-width="3" opacity="0.4"/>
  <line x1="540" y1="272" x2="488" y2="268" stroke="#c4b5fd" stroke-width="3" opacity="0.35"/>
  <!-- Exclamation mark above Darwin -->
  <line x1="420" y1="190" x2="420" y2="208" stroke="#6b21a8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="420" cy="218" r="5" fill="#6b21a8"/>

</svg>