<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- decorative circles -->
  <circle cx="1100" cy="80" r="200" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="100" cy="550" r="150" fill="#c4b5fd" opacity="0.25"/>

  <!-- glow halo around center diamond -->
  <ellipse cx="600" cy="315" rx="200" ry="200" fill="url(#glow)"/>

  <!-- decision diamond (rotated square) -->
  <polygon points="600,140 780,315 600,490 420,315" fill="#7c3aed" opacity="0.12"/>
  <polygon points="600,140 780,315 600,490 420,315" fill="none" stroke="#7c3aed" stroke-width="5" opacity="0.5"/>

  <!-- inner diamond -->
  <polygon points="600,210 710,315 600,420 490,315" fill="#6b21a8" opacity="0.18"/>
  <polygon points="600,210 710,315 600,420 490,315" fill="none" stroke="#6b21a8" stroke-width="4" opacity="0.4"/>

  <!-- flame / pure light at center -->
  <ellipse cx="600" cy="290" rx="32" ry="55" fill="#7c3aed" opacity="0.45"/>
  <ellipse cx="600" cy="300" rx="20" ry="38" fill="#c4b5fd" opacity="0.7"/>
  <ellipse cx="600" cy="312" rx="11" ry="22" fill="white" opacity="0.8"/>

  <!-- four direction arrows from diamond -->
  <!-- top -->
  <line x1="600" y1="130" x2="600" y2="88" stroke="#7c3aed" stroke-width="4" opacity="0.4"/>
  <polygon points="600,78 591,95 609,95" fill="#7c3aed" opacity="0.4"/>
  <!-- bottom -->
  <line x1="600" y1="500" x2="600" y2="542" stroke="#7c3aed" stroke-width="4" opacity="0.4"/>
  <polygon points="600,552 591,535 609,535" fill="#7c3aed" opacity="0.4"/>
  <!-- right -->
  <line x1="790" y1="315" x2="840" y2="315" stroke="#6b21a8" stroke-width="4" opacity="0.4"/>
  <circle cx="860" cy="315" r="18" fill="#6b21a8" opacity="0.35"/>
  <!-- left -->
  <line x1="410" y1="315" x2="360" y2="315" stroke="#6b21a8" stroke-width="4" opacity="0.4"/>
  <circle cx="340" cy="315" r="18" fill="#6b21a8" opacity="0.35"/>

  <!-- decorative dots -->
  <circle cx="960" cy="200" r="10" fill="#7c3aed" opacity="0.3"/>
  <circle cx="990" cy="240" r="7" fill="#7c3aed" opacity="0.25"/>
  <circle cx="240" cy="420" r="10" fill="#6b21a8" opacity="0.3"/>
  <circle cx="210" cy="380" r="7" fill="#6b21a8" opacity="0.25"/>

  <!-- scale / balance beam (subtle, top-right area) -->
  <line x1="880" y1="160" x2="980" y2="160" stroke="#7c3aed" stroke-width="4" opacity="0.35"/>
  <line x1="930" y1="140" x2="930" y2="200" stroke="#7c3aed" stroke-width="4" opacity="0.4"/>
  <circle cx="880" cy="175" r="16" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="980" cy="168" r="12" fill="#7c3aed" opacity="0.4"/>
</svg>