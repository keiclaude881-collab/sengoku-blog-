  <rect x="760" y="460" width="20" height="70" fill="#d97706"/>
  <line x1="770" y1="440" x2="770" y2="540" stroke="#d97706" stroke-width="3"/>
  <rect x="810" y="420" width="20" height="90" fill="#92400e"/>
  <line x1="820" y1="400" x2="820" y2="520" stroke="#92400e" stroke-width="3"/>
  <rect x="860" y="380" width="20" height="100" fill="#b45309"/>
