  <line x1="230" y1="190" x2="390" y2="190" stroke="#92400e" stroke-width="3" opacity="0.7"/>
  <line x1="230" y1="230" x2="390" y2="230" stroke="#92400e" stroke-width="3" opacity="0.6"/>
  <line x1="230" y1="270" x2="360" y2="270" stroke="#92400e" stroke-width="3" opacity="0.55"/>
