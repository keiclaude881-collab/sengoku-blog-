<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad10)"/>

  <circle cx="1060" cy="140" r="80" fill="#fde68a" opacity="0.4"/>
  <circle cx="130" cy="520" r="70" fill="#fde68a" opacity="0.4"/>

  <!-- shield motif (defense first) on the left, sheltering a steadily rising bar chart -->
  <g transform="translate(330,330)">
    <path d="M 0 -210 L 170 -150 L 170 30 Q 170 170 0 240 Q -170 170 -170 30 L -170 -150 Z" fill="#92400e" opacity="0.85"/>
    <path d="M 0 -180 L 140 -128 L 140 28 Q 140 145 0 205 Q -140 145 -140 28 L -140 -128 Z" fill="#fef3c7" opacity="0.9"/>

    <!-- bars rising inside the shield -->
    <rect x="-90" y="60" width="36" height="60" fill="#d97706"/>
    <rect x="-36" y="20" width="36" height="100" fill="#f59e0b"/>
    <rect x="18" y="-30" width="36" height="150" fill="#92400e"/>
  </g>

  <!-- arrow flying toward a target on the right (precision, not scattershot) -->
  <g transform="translate(880,330)">
    <circle r="150" fill="none" stroke="#92400e" stroke-width="6" opacity="0.7"/>
    <circle r="100" fill="none" stroke="#d97706" stroke-width="6" opacity="0.75"/>
    <circle r="50" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.8"/>
    <circle r="10" fill="#92400e"/>
  </g>
  <g stroke="#78350f" stroke-width="6" stroke-linecap="round">
    <line x1="560" y1="280" x2="855" y2="320"/>
  </g>
  <path d="M 855 320 L 824 304 M 855 320 L 828 336" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- fletching -->
  <path d="M 560 280 L 540 266 M 560 280 L 540 296" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
