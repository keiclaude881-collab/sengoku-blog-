  <line x1="230" y1="350" x2="340" y2="350" stroke="#92400e" stroke-width="3" opacity="0.45"/>
  <circle cx="310" cy="450" r="34" fill="none" stroke="#92400e" stroke-width="2.5" opacity="0.6"/>
  <text x="310" y="461" font-family="'Shippori Mincho', serif" font-size="30" fill="#92400e" text-anchor="middle" opacity="0.75">兵</text>

  <!-- ローソク足チャート -->
  <line x1="640" y1="600" x2="1040" y2="600" stroke="#d6cdbf" stroke-width="2"/>
  <rect x="660" y="530" width="20" height="60" fill="#d97706"/>
  <line x1="670" y1="510" x2="670" y2="600" stroke="#d97706" stroke-width="3"/>
  <rect x="710" y="500" width="20" height="80" fill="#92400e"/>
