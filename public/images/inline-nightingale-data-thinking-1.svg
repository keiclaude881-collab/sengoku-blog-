<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">同じ「野戦病院」でも、見方を変えると打つ手が変わる</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#e9d5ff" stroke-width="1.5"/>

  <!-- Row 1: 感覚的判断 -->
  <text x="40" y="92" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#9ca3af">よくある発想(感覚的判断)</text>

  <rect x="40" y="105" width="120" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="100" y="146" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#57534e" text-anchor="middle">野戦病院</text>

  <line x1="164" y1="140" x2="206" y2="140" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrowGray)"/>

  <rect x="210" y="105" width="200" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="310" y="138" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">「戦争だから</text>
  <text x="310" y="158" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">仕方ない」という感覚</text>

  <line x1="414" y1="140" x2="456" y2="140" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrowGray)"/>

  <rect x="460" y="105" width="160" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="540" y="138" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">対策は</text>
  <text x="540" y="158" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#78716c" text-anchor="middle">「精神論」どまり</text>

  <!-- Row 2: データに基づく判断 -->
  <text x="40" y="222" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#7c3aed">ナイチンゲールの発想(データ思考)</text>

  <rect x="40" y="235" width="120" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="100" y="276" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#57534e" text-anchor="middle">野戦病院</text>

  <line x1="164" y1="270" x2="206" y2="270" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <rect x="210" y="218" width="220" height="104" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="320" y="262" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">死因を記録・分類(統計)</text>
  <text x="320" y="284" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">↑ まず「数える」</text>

  <line x1="434" y1="270" x2="476" y2="270" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <rect x="480" y="235" width="180" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="570" y="266" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">感染症対策に</text>
  <text x="570" y="286" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">資源を集中</text>

  <!-- caption -->
  <text x="335" y="365" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#78716c" text-anchor="middle">同じ現場でも、「何を見るか」で対策はまるで変わる</text>

  <!-- Right side: explanation box -->
  <rect x="650" y="80" width="310" height="280" rx="8" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="805" y="115" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">ナイチンゲールの思考法</text>
  <line x1="670" y1="128" x2="940" y2="128" stroke="#e9d5ff" stroke-width="1"/>

  <circle cx="675" cy="160" r="5" fill="#6b21a8"/>
  <text x="690" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">印象や評判より先に、まず「数える」</text>

  <circle cx="675" cy="198" r="5" fill="#6b21a8"/>
  <text x="690" y="203" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">データを「誰の目にも明らかな図」に変える</text>

  <circle cx="675" cy="236" r="5" fill="#6b21a8"/>
  <text x="690" y="241" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">「本当の原因」が見えれば、優先順位が変わる</text>

  <circle cx="675" cy="274" r="5" fill="#6b21a8"/>
  <text x="690" y="279" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">感情ではなく、事実にもとづいて判断する</text>

  <!-- Bottom quote -->
  <text x="500" y="405" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" letter-spacing="1" opacity="0.85" font-style="italic">「統計こそ、神の意図を理解するための学問である」</text>
</svg>
