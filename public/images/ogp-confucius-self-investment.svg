<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- An open book / scroll spread across the lower-center, base of all learning -->
  <path d="M 260 420 C 420 380 540 380 600 420 L 600 540 C 540 510 420 510 260 540 Z" fill="#ede9fe" stroke="#9333ea" stroke-width="3"/>
  <path d="M 940 420 C 780 380 660 380 600 420 L 600 540 C 660 510 780 510 940 540 Z" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
  <g stroke="#6b21a8" stroke-width="2.5" opacity="0.6">
    <line x1="300" y1="450" x2="430" y2="430"/>
    <line x1="300" y1="475" x2="430" y2="458"/>
    <line x1="300" y1="500" x2="410" y2="486"/>
    <line x1="770" y1="430" x2="900" y2="450"/>
    <line x1="790" y1="458" x2="900" y2="475"/>
    <line x1="810" y1="486" x2="900" y2="500"/>
  </g>

  <!-- A single tree growing up from the spine of the book, representing knowledge bearing fruit -->
  <rect x="588" y="280" width="24" height="160" fill="#6b21a8"/>
  <circle cx="600" cy="240" r="60" fill="#a855f7"/>
  <circle cx="540" cy="270" r="44" fill="#9333ea"/>
  <circle cx="660" cy="270" r="44" fill="#9333ea"/>
  <circle cx="600" cy="190" r="40" fill="#c084fc"/>

  <!-- Fruit dots on the tree, representing the returns of self-investment -->
  <g fill="#fde68a" stroke="#d97706" stroke-width="1.5">
    <circle cx="560" cy="230" r="9"/>
    <circle cx="630" cy="220" r="9"/>
    <circle cx="600" cy="260" r="9"/>
    <circle cx="660" cy="280" r="8"/>
  </g>

  <!-- Concentric rings rippling outward from the tree, symbolizing growth spreading -->
  <circle cx="600" cy="240" r="230" fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="240" r="280" fill="none" stroke="#f3e8ff" stroke-width="2" opacity="0.5"/>

  <!-- Small footpath of stepping stones leading toward the tree, representing daily small steps of learning -->
  <g fill="#d8b4fe" opacity="0.8">
    <ellipse cx="150" cy="560" rx="26" ry="12"/>
    <ellipse cx="230" cy="540" rx="26" ry="12"/>
    <ellipse cx="310" cy="525" rx="26" ry="12"/>
    <ellipse cx="390" cy="510" rx="26" ry="12"/>
  </g>
  <g fill="#d8b4fe" opacity="0.8">
    <ellipse cx="1050" cy="560" rx="26" ry="12"/>
    <ellipse cx="970" cy="540" rx="26" ry="12"/>
    <ellipse cx="890" cy="525" rx="26" ry="12"/>
    <ellipse cx="810" cy="510" rx="26" ry="12"/>
  </g>
</svg>
