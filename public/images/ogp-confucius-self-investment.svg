<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf8fc"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#ecdffa" stroke-width="2"/>

  <!-- 開いた書物（竹簡/書物モチーフ） -->
  <path d="M 220 250 L 380 250 L 380 470 L 220 470 Z" fill="#f3e8ff" opacity="0.6"/>
  <path d="M 380 250 L 540 250 L 540 470 L 380 470 Z" fill="#e9d5ff" opacity="0.6"/>
  <line x1="380" y1="250" x2="380" y2="470" stroke="#9333ea" stroke-width="2" opacity="0.5"/>
  <line x1="245" y1="290" x2="355" y2="290" stroke="#6b21a8" stroke-width="3" opacity="0.5"/>
  <line x1="245" y1="320" x2="355" y2="320" stroke="#6b21a8" stroke-width="3" opacity="0.4"/>
  <line x1="245" y1="350" x2="335" y2="350" stroke="#6b21a8" stroke-width="3" opacity="0.35"/>
  <line x1="405" y1="290" x2="515" y2="290" stroke="#6b21a8" stroke-width="3" opacity="0.5"/>
  <line x1="405" y1="320" x2="515" y2="320" stroke="#6b21a8" stroke-width="3" opacity="0.4"/>
  <line x1="405" y1="350" x2="495" y2="350" stroke="#6b21a8" stroke-width="3" opacity="0.35"/>
  <circle cx="380" cy="430" r="30" fill="none" stroke="#6b21a8" stroke-width="2.5" opacity="0.6"/>
  <text x="380" y="441" font-family="'Shippori Mincho', serif" font-size="26" fill="#6b21a8" text-anchor="middle" opacity="0.75">学</text>

  <!-- 学び→実践の循環矢印 -->
  <g transform="translate(840,470)" opacity="0.8">
    <circle cx="0" cy="0" r="86" fill="none" stroke="#9333ea" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>
    <path d="M 70 -36 L 86 -52 L 96 -30 Z" fill="#9333ea"/>
  </g>
  <text x="840" y="478" font-family="'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.85">学び ⇄ 実践</text>

  <!-- カテゴリラベル -->
  <rect x="660" y="180" width="100" height="36" rx="18" fill="#f3e8ff" stroke="#e9d5ff"/>
  <text x="710" y="204" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="1">思考法</text>

  <!-- タイトル -->
  <text x="660" y="280" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">孔子に学ぶ</text>
  <text x="660" y="324" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">「自己投資」の本質</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
