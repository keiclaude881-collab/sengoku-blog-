<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 稼ぐ→再投資→価値増大の循環 -->

  <!-- Title -->
  <text x="500" y="45" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">「循環させる」複利思考</text>
  <line x1="120" y1="60" x2="880" y2="60" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Step 1: 稼ぐ -->
  <rect x="80" y="95" width="200" height="180" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="80" y="95" width="200" height="44" rx="8" fill="#d97706" opacity="0.65"/>
  <rect x="80" y="125" width="200" height="14" fill="#d97706" opacity="0.65"/>
  <text x="180" y="125" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#faf7f2" text-anchor="middle">① 稼ぐ</text>
  <!-- 棒グラフ（収入） -->
  <rect x="110" y="200" width="30" height="50" fill="#f59e0b" opacity="0.7" stroke="#d97706" stroke-width="1"/>
  <rect x="150" y="180" width="30" height="70" fill="#d97706" opacity="0.7" stroke="#b45309" stroke-width="1"/>
  <rect x="190" y="160" width="30" height="90" fill="#b45309" opacity="0.75" stroke="#92400e" stroke-width="1"/>
  <line x1="100" y1="255" x2="235" y2="255" stroke="#92400e" stroke-width="1.5"/>
  <text x="180" y="278" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-style="italic">本業・副業で稼ぐ</text>

  <!-- Arrow 1 -->
  <path d="M 285 185 L 355 185" fill="none" stroke="#92400e" stroke-width="3"/>
  <polygon points="355,176 373,185 355,194" fill="#92400e"/>
  <text x="319" y="173" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">自動的に</text>
  <text x="319" y="200" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">配分</text>

  <!-- Step 2: 再投資 -->
  <rect x="370" y="95" width="260" height="180" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="370" y="95" width="260" height="44" rx="8" fill="#b45309" opacity="0.7"/>
  <rect x="370" y="125" width="260" height="14" fill="#b45309" opacity="0.7"/>
  <text x="500" y="125" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#faf7f2" text-anchor="middle">② 再投資する</text>
  <!-- 3つの投資先 -->
  <circle cx="398" cy="165" r="6" fill="#d97706"/>
  <text x="414" y="170" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">設備・品質への投資</text>
  <circle cx="398" cy="198" r="6" fill="#d97706"/>
  <text x="414" y="203" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">人材育成・教育</text>
  <circle cx="398" cy="231" r="6" fill="#d97706"/>
  <text x="414" y="236" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">研究開発・自己投資</text>
  <!-- 現代版 -->
  <rect x="380" y="250" width="240" height="20" rx="3" fill="#f59e0b" opacity="0.2"/>
  <text x="500" y="265" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-style="italic">現代：積立投資・スキルアップに自動回し</text>

  <!-- Arrow 2 -->
  <path d="M 635 185 L 705 185" fill="none" stroke="#92400e" stroke-width="3"/>
  <polygon points="705,176 723,185 705,194" fill="#92400e"/>
  <text x="669" y="173" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">時間が</text>
  <text x="669" y="200" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">経つほど</text>

  <!-- Step 3: 価値増大 -->
  <rect x="720" y="95" width="200" height="180" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="720" y="95" width="200" height="44" rx="8" fill="#92400e" opacity="0.8"/>
  <rect x="720" y="125" width="200" height="14" fill="#92400e" opacity="0.8"/>
  <text x="820" y="125" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#fef3c7" text-anchor="middle">③ 価値が増大</text>
  <!-- 指数的成長 -->
  <path d="M 745 250 C 780 248 810 230 830 200 C 845 175 855 155 890 130"
        stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 745 250 L 890 250" stroke="#92400e" stroke-width="1.5" opacity="0.4"/>
  <path d="M 745 250 L 745 130" stroke="#92400e" stroke-width="1.5" opacity="0.4"/>
  <path d="M 745 250 C 780 248 810 230 830 200 C 845 175 855 155 890 130 L 890 250 Z"
        fill="#f59e0b" opacity="0.12"/>
  <text x="820" y="270" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">複利で雪だるま式に</text>

  <!-- 底部の戻り矢印（循環） -->
  <path d="M 820 280 Q 820 360 500 375 Q 180 390 180 285" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 4"/>
  <polygon points="174,290 180,274 186,290" fill="#d97706"/>
  <text x="500" y="370" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">価値増大が新たな稼ぐ力を生む</text>

  <text x="500" y="405" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85">溜め込むのではなく、価値を生む場所へ動かし続ける</text>
</svg>
