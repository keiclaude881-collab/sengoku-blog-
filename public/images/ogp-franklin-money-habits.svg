<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="fr-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fr-glow)"/>

  <!-- jar of coins (savings habit) on the left -->
  <g transform="translate(390,400)">
    <path d="M -110 -190 L -126 130 C -126 158 -70 172 0 172 C 70 172 126 158 126 130 L 110 -190 Z" fill="#fde68a" opacity="0.45" stroke="#d97706" stroke-width="4"/>
    <path d="M -118 -200 L 118 -200 L 110 -150 L -110 -150 Z" fill="#f59e0b" opacity="0.6"/>
    <!-- coin stack inside jar -->
    <ellipse cx="0" cy="90" rx="92" ry="20" fill="#d97706"/>
    <ellipse cx="0" cy="55" rx="86" ry="20" fill="#f59e0b"/>
    <ellipse cx="0" cy="20" rx="78" ry="20" fill="#fbbf24"/>
    <ellipse cx="0" cy="-12" rx="68" ry="18" fill="#fde68a"/>
    <!-- coin falling in -->
    <circle cx="40" cy="-260" r="26" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
    <line x1="40" y1="-234" x2="40" y2="-205" stroke="#d97706" stroke-width="3" stroke-dasharray="4 6" opacity="0.6"/>
  </g>

  <!-- growing plant beside the jar (compounding) -->
  <g transform="translate(610,520)">
    <path d="M 0 0 C 0 -60 -14 -100 -8 -150" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-30" cy="-120" rx="34" ry="18" fill="#d97706" opacity="0.8" transform="rotate(-30 -30 -120)"/>
    <ellipse cx="18" cy="-150" rx="34" ry="18" fill="#f59e0b" opacity="0.8" transform="rotate(20 18 -150)"/>
    <ellipse cx="-10" cy="-185" rx="30" ry="16" fill="#fbbf24" opacity="0.85" transform="rotate(-10 -10 -185)"/>
    <circle cx="-6" cy="-205" r="16" fill="#fde68a"/>
  </g>

  <!-- rising bar chart on the right (compound growth over time) -->
  <g>
    <rect x="800" y="470" width="56" height="80" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <rect x="876" y="420" width="56" height="130" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <rect x="952" y="350" width="56" height="200" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <rect x="1028" y="260" width="56" height="290" rx="6" fill="#92400e"/>
  </g>

  <!-- gentle arc connecting jar to growth, like a habit-to-result path -->
  <path d="M 470 280 C 600 180 760 180 870 260" stroke="#d97706" stroke-width="3" fill="none" stroke-dasharray="2 12" opacity="0.5" stroke-linecap="round"/>
  <path d="M 858 248 L 870 260 L 854 270 Z" fill="#d97706" opacity="0.6"/>

  <!-- decorative coin dots -->
  <circle cx="160" cy="160" r="18" fill="#fde68a" opacity="0.7"/>
  <circle cx="1130" cy="150" r="24" fill="#fde68a" opacity="0.6"/>
  <circle cx="1100" cy="580" r="14" fill="#f59e0b" opacity="0.5"/>
</svg>
