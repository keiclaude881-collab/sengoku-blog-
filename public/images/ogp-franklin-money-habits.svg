  <text x="760" y="296" font-family="'Shippori Mincho', serif" font-size="34" font-weight="700" fill="#1c1917" letter-spacing="1">お金の習慣</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
