<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Three learning principles: Learn → Apply → Adapt (three stations) -->
  <circle cx="200" cy="210" r="65" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="200" cy="210" r="65" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Book icon -->
  <rect x="170" y="185" width="60" height="50" rx="3" fill="#1e40af" opacity="0.6"/>
  <line x1="200" y1="185" x2="200" y2="235" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="275" y1="210" x2="435" y2="210" stroke="#93c5fd" stroke-width="5"/>
  <polyline points="422,198 438,210 422,222" fill="none" stroke="#93c5fd" stroke-width="4"/>
  
  <circle cx="500" cy="210" r="65" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="500" cy="210" r="65" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Sword/action icon -->
  <line x1="500" y1="250" x2="500" y2="180" stroke="#1e40af" stroke-width="6"/>
  <line x1="480" y1="228" x2="520" y2="228" stroke="#1e40af" stroke-width="6"/>
  <line x1="575" y1="210" x2="735" y2="210" stroke="#93c5fd" stroke-width="5"/>
  <polyline points="722,198 738,210 722,222" fill="none" stroke="#93c5fd" stroke-width="4"/>
  
  <circle cx="800" cy="210" r="65" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="800" cy="210" r="65" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Cycle arrows (adapt) -->
  <path d="M 760 200 A 40 40 0 1 1 800 250" fill="none" stroke="#1e40af" stroke-width="5"/>
  <polyline points="788,252 800,252 800,240" fill="none" stroke="#1e40af" stroke-width="5"/>

</svg>