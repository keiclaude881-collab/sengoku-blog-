<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="hg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#hg-glow)"/>

  <!-- turbulent crashing waves (panic/crisis) surrounding but not reaching the vault -->
  <g fill="#fde68a" opacity="0.6">
    <path d="M 0 380 Q 90 320 180 380 T 360 380 T 540 380 L 540 630 L 0 630 Z"/>
  </g>
  <g fill="#f59e0b" opacity="0.45">
    <path d="M 660 400 Q 760 340 860 400 T 1060 400 T 1260 400 L 1260 630 L 660 630 Z"/>
  </g>
  <g stroke="#d97706" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 30 300 Q 110 260 190 300"/>
    <path d="M 950 280 Q 1030 240 1110 280"/>
    <path d="M 60 220 Q 120 195 180 220"/>
  </g>

  <!-- calm clear zone around the vault -->
  <circle cx="600" cy="330" r="210" fill="#fffbeb" opacity="0.85"/>
  <circle cx="600" cy="330" r="210" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="2 14" opacity="0.7"/>

  <!-- solid standing vault/strongbox, unmoved -->
  <g transform="translate(600,360)">
    <ellipse cx="0" cy="150" rx="150" ry="20" fill="#92400e" opacity="0.15"/>
    <rect x="-130" y="-110" width="260" height="240" rx="14" fill="#92400e"/>
    <rect x="-110" y="-90" width="220" height="200" rx="10" fill="#b45309"/>
    <!-- dial wheel, plain shape -->
    <circle cx="0" cy="-10" r="46" fill="#fde68a" stroke="#78350f" stroke-width="6"/>
    <circle cx="0" cy="-10" r="14" fill="#78350f"/>
    <line x1="0" y1="-10" x2="0" y2="-44" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="26" y2="-10" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- handle -->
    <rect x="-50" y="70" width="100" height="18" rx="9" fill="#78350f"/>
  </g>

  <!-- coins stacked beside the vault, steady -->
  <g transform="translate(400,500)">
    <ellipse cx="0" cy="20" rx="46" ry="14" fill="#d97706"/>
    <ellipse cx="0" cy="0" rx="46" ry="14" fill="#f59e0b"/>
    <ellipse cx="0" cy="-20" rx="46" ry="14" fill="#fbbf24"/>
  </g>
  <g transform="translate(820,500)">
    <ellipse cx="0" cy="14" rx="40" ry="12" fill="#d97706"/>
    <ellipse cx="0" cy="-4" rx="40" ry="12" fill="#fbbf24"/>
  </g>

  <!-- decorative motes -->
  <circle cx="170" cy="140" r="16" fill="#fde68a" opacity="0.6"/>
  <circle cx="1100" cy="150" r="20" fill="#f59e0b" opacity="0.4"/>
</svg>
