<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="er-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#er-glow)"/>

  <!-- soft outer field of incoming "words" as plain shapes, fading before reaching the circle -->
  <g opacity="0.55">
    <path d="M 110 150 q 60 -10 110 18" stroke="#d8b4fe" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 90 320 q 70 6 120 -22" stroke="#d8b4fe" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 150 470 q 60 -28 118 -10" stroke="#d8b4fe" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 1010 150 q -60 -10 -110 18" stroke="#d8b4fe" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 1030 320 q -70 6 -120 -22" stroke="#d8b4fe" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 970 470 q -60 -28 -118 -10" stroke="#d8b4fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- arrows of judgment, stopping at the boundary ring -->
  <g stroke="#9333ea" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M 230 240 L 360 285"/>
    <path d="M 250 400 L 372 350"/>
    <path d="M 970 240 L 840 285"/>
    <path d="M 950 400 L 828 350"/>
  </g>
  <g fill="#9333ea" opacity="0.5">
    <path d="M 360 285 l -22 -12 l 4 24 z"/>
    <path d="M 372 350 l -8 -23 l -18 16 z"/>
    <path d="M 840 285 l 22 -12 l -4 24 z"/>
    <path d="M 828 350 l 8 -23 l 18 16 z"/>
  </g>

  <!-- boundary ring (consent) -->
  <circle cx="600" cy="330" r="190" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-dasharray="2 14" opacity="0.8"/>

  <!-- protected inner circle -->
  <circle cx="600" cy="330" r="150" fill="#f3e8ff"/>
  <circle cx="600" cy="330" r="150" fill="none" stroke="#9333ea" stroke-width="4"/>

  <!-- standing figure, calm, centered -->
  <g transform="translate(600,330)">
    <ellipse cx="0" cy="92" rx="62" ry="14" fill="#6b21a8" opacity="0.15"/>
    <!-- body -->
    <path d="M -46 90 C -46 30 -40 -10 0 -10 C 40 -10 46 30 46 90 Z" fill="#7e22ce"/>
    <!-- head -->
    <circle cx="0" cy="-48" r="34" fill="#e9d5ff"/>
    <!-- simple raised chin / posture line -->
    <path d="M -20 -36 C -10 -28 10 -28 20 -36" stroke="#7e22ce" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- gentle rising light above the figure (inner strength) -->
  <g opacity="0.8">
    <circle cx="600" cy="150" r="10" fill="#fbe9ff"/>
    <circle cx="600" cy="150" r="22" fill="#e9d5ff" opacity="0.6"/>
  </g>

  <!-- corner accents -->
  <circle cx="110" cy="90" r="26" fill="#e9d5ff" opacity="0.7"/>
  <circle cx="1100" cy="540" r="36" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="1080" cy="100" r="14" fill="#9333ea" opacity="0.35"/>
  <circle cx="120" cy="560" r="18" fill="#9333ea" opacity="0.3"/>
</svg>
