<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <text x="500" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">日常のすべてが修行——「普通の時間」の質を上げる</text>

  <!-- 左上：食事 -->
  <rect x="60" y="80" width="200" height="140" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="160" y="112" font-family="sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">食事</text>
  <!-- 碗のシルエット -->
  <ellipse cx="160" cy="155" rx="42" ry="14" fill="#c4b5fd"/>
  <path d="M 118 155 Q 118 185 160 190 Q 202 185 202 155" fill="#a855f7"/>
  <!-- 箸 -->
  <line x1="130" y1="140" x2="150" y2="175" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="145" y1="138" x2="163" y2="173" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="160" y="206" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">味・香り・食感に集中</text>

  <!-- 右上：歩行 -->
  <rect x="310" y="80" width="200" height="140" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="410" y="112" font-family="sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">歩行</text>
  <!-- 歩く人物 -->
  <circle cx="410" cy="140" r="16" fill="none" stroke="#6b21a8" stroke-width="2.5"/>
  <line x1="410" y1="156" x2="410" y2="192" stroke="#6b21a8" stroke-width="3"/>
  <line x1="410" y1="168" x2="390" y2="180" stroke="#6b21a8" stroke-width="2.5"/>
  <line x1="410" y1="168" x2="430" y2="178" stroke="#6b21a8" stroke-width="2.5"/>
  <line x1="410" y1="192" x2="392" y2="208" stroke="#6b21a8" stroke-width="2.5"/>
  <line x1="410" y1="192" x2="426" y2="210" stroke="#6b21a8" stroke-width="2.5"/>
  <text x="410" y="222" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">足裏・呼吸・景色に集中</text>

  <!-- 左下：会議 -->
  <rect x="60" y="250" width="200" height="140" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="160" y="282" font-family="sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">会議</text>
  <!-- 人物3人 -->
  <circle cx="120" cy="315" r="12" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="160" cy="308" r="14" fill="#8b5cf6"/>
  <circle cx="200" cy="315" r="12" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <!-- 発言波 -->
  <path d="M 160 295 Q 170 285 180 295" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 155 290 Q 168 276 183 290" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <text x="160" y="358" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">発言者の言葉だけに集中</text>
  <text x="160" y="374" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">ながら作業をしない</text>

  <!-- 右下：家事 -->
  <rect x="310" y="250" width="200" height="140" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="410" y="282" font-family="sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">家事</text>
  <!-- 水の流れ -->
  <path d="M 380 315 Q 390 305 400 315 Q 410 325 420 315 Q 430 305 440 315" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M 380 332 Q 390 322 400 332 Q 410 342 420 332 Q 430 322 440 332" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 380 349 Q 390 339 400 349 Q 410 359 420 349 Q 430 339 440 349" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.7"/>
  <text x="410" y="374" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">水の音・手の感触に集中</text>

  <!-- 右側：中央メッセージ -->
  <rect x="570" y="100" width="370" height="240" rx="14" fill="#6b21a8"/>
  <text x="755" y="138" font-family="sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">道元の教え</text>
  <line x1="610" y1="152" x2="900" y2="152" stroke="#a855f7" stroke-width="1.5"/>
  <text x="755" y="182" font-family="sans-serif" font-size="13" fill="#e9d5ff" text-anchor="middle">「洗面・食事・睡眠</text>
  <text x="755" y="204" font-family="sans-serif" font-size="13" fill="#e9d5ff" text-anchor="middle">すべてが修行である」</text>
  <line x1="610" y1="222" x2="900" y2="222" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
  <text x="755" y="252" font-family="sans-serif" font-size="13" fill="#ddd6fe" text-anchor="middle">特別な時間だけでなく</text>
  <text x="755" y="274" font-family="sans-serif" font-size="13" fill="#ddd6fe" text-anchor="middle">普通の時間の質を上げる</text>
  <rect x="610" y="294" width="290" height="36" rx="8" fill="#a855f7"/>
  <text x="755" y="317" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">「只管」＝ただひたすらに</text>
</svg>
