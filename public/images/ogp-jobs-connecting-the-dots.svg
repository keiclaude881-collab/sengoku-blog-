<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>
  <!-- Three dots connecting into a star (connect the dots) -->
  <!-- connection lines (dashed) -->
  <line x1="340" y1="440" x2="600" y2="170" stroke="#3b82f6" stroke-width="6" stroke-dasharray="14,8" opacity="0.55"/>
  <line x1="860" y1="440" x2="600" y2="170" stroke="#3b82f6" stroke-width="6" stroke-dasharray="14,8" opacity="0.55"/>
  <line x1="340" y1="440" x2="860" y2="440" stroke="#3b82f6" stroke-width="6" stroke-dasharray="14,8" opacity="0.55"/>
  <!-- three source dots -->
  <circle cx="340" cy="440" r="34" fill="#3b82f6" opacity="0.75"/>
  <circle cx="860" cy="440" r="34" fill="#3b82f6" opacity="0.75"/>
  <circle cx="600" cy="170" r="34" fill="#3b82f6" opacity="0.75"/>
  <!-- inner dots -->
  <circle cx="340" cy="440" r="18" fill="#bfdbfe" opacity="0.80"/>
  <circle cx="860" cy="440" r="18" fill="#bfdbfe" opacity="0.80"/>
  <circle cx="600" cy="170" r="18" fill="#bfdbfe" opacity="0.80"/>
  <!-- convergence star at centroid (~600,350) -->
  <circle cx="600" cy="350" r="60" fill="#1e40af" opacity="0.75"/>
  <circle cx="600" cy="350" r="36" fill="#60a5fa" opacity="0.80"/>
  <circle cx="600" cy="350" r="18" fill="#bfdbfe" opacity="0.90"/>
  <!-- glow -->
  <circle cx="600" cy="350" r="90" fill="#dbeafe" opacity="0.25"/>
</svg>