<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101a10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c96d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2A6B50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d9e76;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- 左の縦ライン装飾 -->
  <rect x="60" y="60" width="4" height="510" fill="url(#accent)" opacity="0.8" />

  <!-- 右の縦ライン装飾 -->
  <rect x="1136" y="60" width="4" height="510" fill="url(#accent)" opacity="0.3" />

  <!-- 上の横ライン -->
  <rect x="60" y="60" width="1080" height="2" fill="url(#accent)" opacity="0.4" />

  <!-- 下の横ライン -->
  <rect x="60" y="568" width="1080" height="2" fill="url(#accent)" opacity="0.4" />

  <!-- 背景の家紋的円形装飾 -->
  <circle cx="600" cy="315" r="260" fill="none" stroke="#2A6B50" stroke-width="1" opacity="0.15" />
  <circle cx="600" cy="315" r="220" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.08" />
  <circle cx="600" cy="315" r="180" fill="none" stroke="#2A6B50" stroke-width="1" opacity="0.06" />

  <!-- サイトタイトル（日本語） -->
  <text x="600" y="230" font-family="serif" font-size="80" font-weight="bold" fill="url(#accent)" text-anchor="middle" letter-spacing="20">決断の系譜</text>

  <!-- 区切り線 -->
  <rect x="400" y="270" width="400" height="1" fill="url(#green)" opacity="0.8" />

  <!-- サブタイトル -->
  <text x="600" y="330" font-family="serif" font-size="26" fill="#d4c5a0" text-anchor="middle" letter-spacing="4" opacity="0.9">歴史の選択が、未来を変える。</text>

  <!-- 英語タイトル -->
  <text x="600" y="420" font-family="Georgia, serif" font-size="22" fill="#8a7a5a" text-anchor="middle" letter-spacing="6" opacity="0.8">KETSUDAN NO KEIFU</text>

  <!-- ドメイン -->
  <text x="600" y="530" font-family="monospace" font-size="18" fill="#6a6a6a" text-anchor="middle" letter-spacing="2">sengoku-blog.vercel.app</text>
</svg>
