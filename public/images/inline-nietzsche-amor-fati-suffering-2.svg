<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- God is dead: empty pedestal where god figure was -->
  <!-- Pedestal/altar -->
  <rect x="350" y="298" width="300" height="80" rx="8" fill="#c4b5fd" opacity="0.5"/>
  <rect x="380" y="238" width="240" height="65" rx="6" fill="#c4b5fd" opacity="0.45"/>
  <!-- Empty space above pedestal (where god was) -->
  <rect x="400" y="88" width="200" height="155" rx="6" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="10,7" opacity="0.5"/>
  <!-- Dust/fragments falling from empty space -->
  <circle cx="450" cy="140" r="8" fill="#ddd6fe" opacity="0.5"/>
  <circle cx="490" cy="108" r="6" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="550" cy="155" r="7" fill="#ddd6fe" opacity="0.45"/>
  <circle cx="520" cy="125" r="5" fill="#ddd6fe" opacity="0.35"/>
  <!-- People looking up in shock (small figures) -->
  <circle cx="268" cy="330" r="14" fill="#7c3aed" opacity="0.5"/>
  <rect x="257" y="344" width="22" height="32" rx="4" fill="#7c3aed" opacity="0.4"/>
  <circle cx="732" cy="330" r="14" fill="#7c3aed" opacity="0.5"/>
  <rect x="721" y="344" width="22" height="32" rx="4" fill="#7c3aed" opacity="0.4"/>

</svg>