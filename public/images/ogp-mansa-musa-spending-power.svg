<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="mmBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mmBg)"/>

  <!-- soft center divider -->
  <rect x="592" y="0" width="16" height="630" fill="#fde68a" opacity="0.5"/>

  <!-- LEFT: a great pile of coins scattering outward and fading, symbolizing reckless giving that devalued the gold -->
  <g>
    <circle cx="220" cy="470" r="34" fill="#d97706"/>
    <circle cx="280" cy="490" r="30" fill="#d97706"/>
    <circle cx="170" cy="500" r="26" fill="#f59e0b"/>
    <circle cx="250" cy="440" r="24" fill="#f59e0b"/>
    <!-- scattering coins flying away and shrinking/fading, showing dispersal and lost value -->
    <circle cx="330" cy="400" r="20" fill="#f59e0b" opacity="0.85"/>
    <circle cx="390" cy="340" r="16" fill="#fde68a" opacity="0.7" stroke="#d97706" stroke-width="2"/>
    <circle cx="120" cy="380" r="16" fill="#fde68a" opacity="0.7" stroke="#d97706" stroke-width="2"/>
    <circle cx="430" cy="280" r="12" fill="#fde68a" opacity="0.5" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="80" cy="300" r="11" fill="#fde68a" opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="460" cy="210" r="8" fill="#fde68a" opacity="0.3"/>
    <circle cx="40" cy="230" r="8" fill="#fde68a" opacity="0.25"/>
    <!-- downward arrow showing value dropping -->
    <path d="M 250 180 L 250 100" stroke="#92400e" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <polygon points="250,130 225,90 275,90" fill="#92400e" opacity="0.7"/>
  </g>

  <!-- RIGHT: a solid, rising structure (Timbuktu mosque/library) built from accumulated wealth, symbolizing lasting legacy -->
  <g transform="translate(900,0)">
    <!-- Sankore-mosque-inspired stepped mud-brick towers -->
    <rect x="-130" y="380" width="60" height="190" fill="#92400e"/>
    <polygon points="-130,380 -100,330 -70,380" fill="#78350f"/>
    <rect x="-40" y="320" width="80" height="250" fill="#92400e"/>
    <polygon points="-40,320 0,250 40,320" fill="#78350f"/>
    <rect x="60" y="400" width="60" height="170" fill="#92400e"/>
    <polygon points="60,400 90,350 120,400" fill="#78350f"/>

    <!-- wooden beam pegs jutting from the towers, a signature Sahel architectural motif -->
    <g stroke="#d97706" stroke-width="5">
      <line x1="-125" y1="420" x2="-105" y2="420"/>
      <line x1="-125" y1="470" x2="-105" y2="470"/>
      <line x1="-35" y1="380" x2="-15" y2="380"/>
      <line x1="15" y1="380" x2="35" y2="380"/>
      <line x1="-35" y1="440" x2="-15" y2="440"/>
      <line x1="15" y1="440" x2="35" y2="440"/>
      <line x1="65" y1="440" x2="85" y2="440"/>
      <line x1="95" y1="440" x2="115" y2="440"/>
    </g>

    <!-- small doorway -->
    <rect x="-16" y="500" width="32" height="70" fill="#fef3c7"/>

    <!-- rising sun/glow behind the towers, suggesting enduring prosperity -->
    <circle cx="0" cy="260" r="90" fill="#f59e0b" opacity="0.25"/>

    <!-- upward arrow showing growth/legacy -->
    <path d="M 0 200 L 0 120" stroke="#92400e" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <polygon points="0,90 -25,130 25,130" fill="#92400e" opacity="0.7"/>
  </g>
</svg>
