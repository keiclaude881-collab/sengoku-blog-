<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Three judgment questions: magnifying glass + decision tree -->
  <!-- Decision/magnifying glass -->
  <circle cx="280" cy="210" r="110" fill="#ddd6fe" opacity="0.3"/>
  <circle cx="280" cy="210" r="110" fill="none" stroke="#7c3aed" stroke-width="6"/>
  <line x1="362" y1="292" x2="430" y2="360" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- Three branch paths from magnifier -->
  <line x1="400" y1="210" x2="530" y2="210" stroke="#c4b5fd" stroke-width="5"/>
  <line x1="530" y1="210" x2="650" y2="155" stroke="#c4b5fd" stroke-width="5"/>
  <line x1="530" y1="210" x2="650" y2="210" stroke="#c4b5fd" stroke-width="5"/>
  <line x1="530" y1="210" x2="650" y2="265" stroke="#c4b5fd" stroke-width="5"/>
  <!-- Question circles at end -->
  <circle cx="700" cy="155" r="42" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="700" cy="155" r="42" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="700" cy="210" r="42" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="700" cy="210" r="42" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="700" cy="265" r="42" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="700" cy="265" r="42" fill="none" stroke="#7c3aed" stroke-width="4"/>

</svg>