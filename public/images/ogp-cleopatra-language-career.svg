<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f0f7ff"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#bfdbfe" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#1e40af"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="130" height="34" rx="17" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="125" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="2">仕事・副業</text>

  <!-- Main title -->
  <text x="60" y="175" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="44" font-weight="700" fill="#1c1917" letter-spacing="-1">275年間、誰も話さなかった</text>
  <text x="60" y="235" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="44" font-weight="700" fill="#1c1917" letter-spacing="-1">言葉を学んだ女王</text>

  <!-- Subtitle -->
  <text x="60" y="295" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="24" fill="#3b82f6" letter-spacing="1">クレオパトラに学ぶ「相手の言語で話す」キャリア戦略</text>

  <!-- Divider line -->
  <line x1="60" y1="328" x2="680" y2="328" stroke="#bfdbfe" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="368" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#6b7280" letter-spacing="0.5">プトレマイオス朝の王たちは275年間</text>
  <text x="60" y="398" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#6b7280" letter-spacing="0.5">エジプト語を話さなかった。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#3b82f6" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: 9 languages hub -->
  <rect x="790" y="80" width="360" height="380" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>

  <text x="970" y="120" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">クレオパトラの9カ国語</text>

  <!-- Center circle -->
  <circle cx="970" cy="265" r="46" fill="#1e40af"/>
  <text x="970" y="259" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">クレオ</text>
  <text x="970" y="278" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">パトラ</text>

  <!-- Language bubbles -->
  <circle cx="890" cy="165" r="28" fill="#3b82f6"/>
  <text x="890" y="170" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">エジプト語</text>
  <line x1="914" y1="185" x2="930" y2="220" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="970" cy="148" r="28" fill="#3b82f6"/>
  <text x="970" y="153" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">ギリシャ語</text>
  <line x1="970" y1="176" x2="970" y2="219" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="1050" cy="165" r="28" fill="#3b82f6"/>
  <text x="1050" y="170" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">アラビア語</text>
  <line x1="1026" y1="185" x2="1010" y2="220" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="835" cy="265" r="28" fill="#60a5fa"/>
  <text x="835" y="270" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">ヘブライ語</text>
  <line x1="863" y1="265" x2="924" y2="265" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="1105" cy="265" r="28" fill="#60a5fa"/>
  <text x="1105" y="270" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">シリア語</text>
  <line x1="1077" y1="265" x2="1016" y2="265" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="890" cy="370" r="28" fill="#60a5fa"/>
  <text x="890" y="375" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">メディア語</text>
  <line x1="914" y1="352" x2="930" y2="315" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="970" cy="390" r="28" fill="#60a5fa"/>
  <text x="970" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">ラテン語</text>
  <line x1="970" y1="362" x2="970" y2="311" stroke="#93c5fd" stroke-width="1.5"/>

  <circle cx="1050" cy="370" r="28" fill="#60a5fa"/>
  <text x="1050" y="375" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#fff" text-anchor="middle">パルティア語</text>
  <line x1="1026" y1="352" x2="1010" y2="315" stroke="#93c5fd" stroke-width="1.5"/>
</svg>
