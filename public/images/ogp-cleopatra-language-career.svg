<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Eye of Horus (Egyptian eye) -->
  <!-- outer almond eye shape -->
  <path d="M 270,315 Q 430,220 600,315 Q 430,410 270,315 Z" fill="#1e40af" opacity="0.75"/>
  <path d="M 270,315 Q 430,220 600,315 Q 430,410 270,315 Z" fill="none" stroke="#3b82f6" stroke-width="8" opacity="0.60"/>
  <!-- right extension lines -->
  <path d="M 600,315 Q 750,240 930,315" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <path d="M 600,315 Q 750,390 930,315" fill="none" stroke="#1e40af" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <!-- iris -->
  <circle cx="435" cy="315" r="65" fill="#1e40af" opacity="0.85"/>
  <circle cx="435" cy="315" r="38" fill="#3b82f6" opacity="0.70"/>
  <circle cx="435" cy="315" r="16" fill="#bfdbfe" opacity="0.90"/>
  <!-- lower tear drop -->
  <path d="M 435,380 Q 390,440 400,480 Q 435,510 470,480 Q 480,440 435,380 Z" fill="#3b82f6" opacity="0.55"/>
  <!-- highlight dot on iris -->
  <circle cx="450" cy="302" r="10" fill="#ffffff" opacity="0.40"/>
</svg>