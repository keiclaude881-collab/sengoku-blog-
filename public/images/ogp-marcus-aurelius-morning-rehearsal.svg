<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="maBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#maBg)"/>

  <!-- sun rising over horizon -->
  <g>
    <circle cx="600" cy="300" r="190" fill="#e9d5ff" opacity="0.5"/>
    <circle cx="600" cy="300" r="120" fill="#d8b4fe" opacity="0.55"/>
    <circle cx="600" cy="300" r="70" fill="#9333ea"/>
  </g>

  <!-- sun rays -->
  <g stroke="#9333ea" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <line x1="600" y1="120" x2="600" y2="160"/>
    <line x1="600" y1="440" x2="600" y2="480"/>
    <line x1="420" y1="300" x2="460" y2="300"/>
    <line x1="740" y1="300" x2="780" y2="300"/>
    <line x1="473" y1="173" x2="500" y2="200"/>
    <line x1="727" y1="173" x2="700" y2="200"/>
    <line x1="473" y1="427" x2="500" y2="400"/>
    <line x1="727" y1="427" x2="700" y2="400"/>
  </g>

  <!-- horizon line -->
  <line x1="0" y1="470" x2="1200" y2="470" stroke="#7e22ce" stroke-width="2" opacity="0.4"/>

  <!-- open journal resting below horizon, foreground -->
  <g>
    <polygon points="280,490 590,460 590,610 280,640" fill="#ffffff" stroke="#7e22ce" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="920,490 610,460 610,610 920,640" fill="#ffffff" stroke="#7e22ce" stroke-width="3" stroke-linejoin="round"/>
    <line x1="600" y1="460" x2="600" y2="625" stroke="#6b21a8" stroke-width="2.5"/>

    <line x1="320" y1="500" x2="555" y2="490" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="525" x2="555" y2="515" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="550" x2="545" y2="540" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="575" x2="525" y2="566" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>

    <line x1="645" y1="490" x2="880" y2="500" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="645" y1="515" x2="880" y2="525" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="655" y1="540" x2="870" y2="550" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="675" y1="566" x2="850" y2="575" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- floating calm clouds -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="150" cy="200" rx="70" ry="26"/>
    <ellipse cx="210" cy="186" rx="48" ry="22"/>
    <ellipse cx="1020" cy="220" rx="80" ry="28"/>
    <ellipse cx="950" cy="206" rx="50" ry="22"/>
  </g>

  <!-- small bird silhouettes - calm sky -->
  <g stroke="#7e22ce" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 860 140 Q 875 125 890 140 Q 905 125 920 140"/>
    <path d="M 920 175 Q 932 163 944 175 Q 956 163 968 175"/>
  </g>
</svg>
