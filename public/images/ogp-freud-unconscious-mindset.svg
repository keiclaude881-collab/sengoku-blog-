<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#ddd6fe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#ddd6fe" opacity="0.12"/>
  <!-- Iceberg (consciousness vs unconscious) -->
  <!-- ocean / deep water -->
  <rect x="0" y="290" width="1200" height="340" fill="#4c1d95" opacity="0.35"/>
  <!-- waterline ripples -->
  <path d="M 0,292 Q 150,280 300,292 Q 450,304 600,292 Q 750,280 900,292 Q 1050,304 1200,292"
        fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.45"/>
  <path d="M 0,304 Q 150,292 300,304 Q 450,316 600,304 Q 750,292 900,304 Q 1050,316 1200,304"
        fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.30"/>
  <!-- iceberg tip above water (small triangle ~10%) -->
  <polygon points="600,95 700,290 500,290" fill="#f3e8ff" opacity="0.90"/>
  <!-- highlight on tip -->
  <polygon points="600,108 640,270 600,240" fill="#ffffff" opacity="0.35"/>
  <!-- iceberg mass below water (large ~90%) -->
  <polygon points="500,290 700,290 810,460 770,565 600,600 430,565 390,460" fill="#7c3aed" opacity="0.65"/>
  <!-- inner glow of submerged mass -->
  <polygon points="530,300 670,300 740,430 600,480 460,430" fill="#a78bfa" opacity="0.20"/>
  <!-- bubbles in deep -->
  <circle cx="300" cy="400" r="14" fill="#a78bfa" opacity="0.20"/>
  <circle cx="900" cy="460" r="10" fill="#a78bfa" opacity="0.18"/>
  <circle cx="450" cy="530" r="8"  fill="#a78bfa" opacity="0.15"/>
</svg>