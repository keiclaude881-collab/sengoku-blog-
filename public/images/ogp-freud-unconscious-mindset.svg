<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="iceAbove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="iceBelow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- water surface region -->
  <rect x="0" y="270" width="1200" height="360" fill="url(#waterGrad)"/>

  <!-- water surface ripple lines -->
  <g stroke="#a78bfa" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 60 272 Q 200 260 340 272 Q 480 284 620 272 Q 760 260 900 272 Q 1040 284 1140 272"/>
    <path d="M 60 282 Q 200 270 340 282 Q 480 294 620 282 Q 760 270 900 282 Q 1040 294 1140 282"/>
  </g>

  <!-- ICEBERG above water (tip, ~10%) -->
  <polygon points="600,80 680,270 520,270" fill="url(#iceAbove)" opacity="0.9"/>
  <!-- highlight -->
  <polygon points="600,90 645,260 600,230" fill="#f5f3ff" opacity="0.4"/>

  <!-- ICEBERG below water (bulk, ~90%) -->
  <polygon points="520,270 680,270 780,480 740,580 600,620 460,580 420,480" fill="url(#iceBelow)" opacity="0.8"/>
  <!-- inner highlight -->
  <polygon points="540,280 660,280 730,440 600,480 470,440" fill="#7c3aed" opacity="0.2"/>

  <!-- "意識 10%" label above water -->
  <rect x="720" y="130" width="200" height="52" rx="8" fill="#f3e8ff" opacity="0.85"/>
  <text x="820" y="153" text-anchor="middle" font-size="15" fill="#6b21a8" font-weight="bold">意識</text>
  <text x="820" y="173" text-anchor="middle" font-size="13" fill="#7c3aed" opacity="0.8">（海面上 10%）</text>
  <!-- connector line -->
  <line x1="720" y1="156" x2="660" y2="175" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- "無意識 90%" label below water -->
  <rect x="780" y="400" width="230" height="52" rx="8" fill="#4c1d95" opacity="0.7"/>
  <text x="895" y="423" text-anchor="middle" font-size="15" fill="#ede9fe" font-weight="bold">無意識</text>
  <text x="895" y="443" text-anchor="middle" font-size="13" fill="#c4b5fd" opacity="0.85">（海中 90%）</text>
  <!-- connector line -->
  <line x1="780" y1="426" x2="740" y2="420" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- id/ego/superego labels inside iceberg below -->
  <text x="600" y="360" text-anchor="middle" font-size="14" fill="#ede9fe" opacity="0.6">イド・自我・超自我</text>
  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#ddd6fe" opacity="0.5">抑圧された感情・記憶・欲求</text>

  <!-- "前意識" small band near surface -->
  <text x="430" y="300" text-anchor="middle" font-size="12" fill="#c4b5fd" opacity="0.5">前意識</text>

  <!-- left: small human silhouette above water -->
  <g transform="translate(200, 180)" opacity="0.7">
    <circle cx="0" cy="0" r="22" fill="#c4b5fd"/>
    <path d="M -22 22 C -22 -6 22 -6 22 22 L 26 80 L -26 80 Z" fill="#c4b5fd"/>
    <!-- thought bubble -->
    <circle cx="30" cy="-15" r="8" fill="#f3e8ff" opacity="0.5"/>
    <circle cx="42" cy="-28" r="6" fill="#f3e8ff" opacity="0.4"/>
    <circle cx="52" cy="-38" r="4" fill="#f3e8ff" opacity="0.3"/>
  </g>

  <!-- decorative circles (bubbles in water) -->
  <g fill="#a78bfa" opacity="0.15">
    <circle cx="150" cy="380" r="18"/>
    <circle cx="320" cy="460" r="12"/>
    <circle cx="1050" cy="350" r="14"/>
    <circle cx="980" cy="500" r="20"/>
    <circle cx="400" cy="540" r="10"/>
  </g>

  <!-- top-right decorative dots -->
  <g fill="#c4b5fd" opacity="0.25">
    <circle cx="1050" cy="80" r="4"/>
    <circle cx="1100" cy="60" r="3"/>
    <circle cx="1080" cy="110" r="2"/>
    <circle cx="120" cy="70" r="3"/>
    <circle cx="90" cy="100" r="2"/>
  </g>
</svg>
