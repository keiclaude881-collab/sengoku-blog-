<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Start from strengths: highlighted trait glowing vs. weaknesses faded -->
  <!-- Person silhouette with one highlighted trait -->
  <circle cx="500" cy="168" r="52" fill="#1e40af" opacity="0.8"/>
  <rect x="440" y="220" width="120" height="140" rx="10" fill="#1e40af" opacity="0.7"/>
  <!-- Strength highlight (bright) -->
  <circle cx="500" cy="168" r="68" fill="none" stroke="#93c5fd" stroke-width="5" opacity="0.7"/>
  <circle cx="500" cy="168" r="80" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.5"/>
  <!-- Weakness bars (faded, smaller) -->
  <rect x="180" y="260" width="180" height="30" rx="4" fill="#bfdbfe" opacity="0.4"/>
  <rect x="180" y="300" width="120" height="30" rx="4" fill="#bfdbfe" opacity="0.3"/>
  <rect x="180" y="340" width="90" height="30" rx="4" fill="#bfdbfe" opacity="0.25"/>
  <!-- Strength bar (bright, long) -->
  <rect x="640" y="260" width="220" height="30" rx="4" fill="#1e40af" opacity="0.85"/>
  <rect x="640" y="300" width="180" height="30" rx="4" fill="#1e40af" opacity="0.7"/>
  <!-- Arrow pointing to strength -->
  <line x1="565" y1="270" x2="630" y2="270" stroke="#1d4ed8" stroke-width="5"/>
  <polyline points="617,258 633,270 617,282" fill="none" stroke="#1d4ed8" stroke-width="4"/>

</svg>