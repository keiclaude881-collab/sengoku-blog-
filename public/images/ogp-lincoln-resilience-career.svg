<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Log cabin → Capitol dome (rise from humble origins) -->
  <!-- Log cabin (left) -->
  <!-- cabin body -->
  <rect x="160" y="340" width="200" height="140" rx="4" fill="#3b82f6" opacity="0.65"/>
  <!-- cabin roof -->
  <polygon points="150,340 360,340 255,240" fill="#1e40af" opacity="0.72"/>
  <!-- cabin door -->
  <rect x="230" y="400" width="50" height="80" rx="4" fill="#bfdbfe" opacity="0.70"/>
  <!-- log lines on cabin -->
  <g stroke="#bfdbfe" stroke-width="4" opacity="0.40">
    <line x1="160" y1="365" x2="360" y2="365"/>
    <line x1="160" y1="390" x2="360" y2="390"/>
    <line x1="160" y1="415" x2="360" y2="415"/>
    <line x1="160" y1="440" x2="360" y2="440"/>
  </g>
  <!-- rising path arrow -->
  <path d="M 360,420 Q 600,300 840,300" fill="none" stroke="#60a5fa" stroke-width="10" stroke-dasharray="18,10" opacity="0.60"/>
  <polygon points="855,300 822,283 822,317" fill="#60a5fa" opacity="0.70"/>
  <!-- Capitol dome (right) -->
  <rect x="840" y="350" width="180" height="130" rx="4" fill="#3b82f6" opacity="0.70"/>
  <!-- dome -->
  <ellipse cx="930" cy="355" rx="90" ry="75" fill="#1e40af" opacity="0.75"/>
  <!-- drum of dome -->
  <rect x="880" y="330" width="100" height="30" rx="4" fill="#3b82f6" opacity="0.75"/>
  <!-- lantern on top -->
  <rect x="922" y="282" width="16" height="55" rx="3" fill="#1e40af" opacity="0.80"/>
  <!-- columns on capitol -->
  <g fill="#bfdbfe" opacity="0.50">
    <rect x="858" y="350" width="12" height="130"/>
    <rect x="878" y="350" width="12" height="130"/>
    <rect x="980" y="350" width="12" height="130"/>
    <rect x="1000" y="350" width="12" height="130"/>
  </g>
</svg>