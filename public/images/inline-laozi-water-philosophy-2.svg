<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <rect width="1000" height="380" fill="#faf5ff" rx="12"/>
  <rect x="0" y="0" width="1000" height="380" rx="12" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>

  <text x="500" y="38" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">「柔弱は剛強に勝つ」——嵐の中、竹と硬い木はどうなるか</text>

  <!-- Wind arrows -->
  <line x1="40" y1="120" x2="120" y2="120" stroke="#c084fc" stroke-width="3"/>
  <polygon points="115,113 130,120 115,127" fill="#c084fc"/>
  <line x1="40" y1="160" x2="120" y2="160" stroke="#c084fc" stroke-width="3"/>
  <polygon points="115,153 130,160 115,167" fill="#c084fc"/>
  <line x1="40" y1="200" x2="120" y2="200" stroke="#c084fc" stroke-width="3"/>
  <polygon points="115,193 130,200 115,207" fill="#c084fc"/>
  <text x="80" y="100" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle">強風</text>

  <!-- LEFT: rigid tree breaking -->
  <rect x="270" y="270" width="20" height="80" fill="#a8a29e"/>
  <!-- broken trunk top, snapped and fallen -->
  <line x1="280" y1="270" x2="280" y2="190" stroke="#a8a29e" stroke-width="20" stroke-linecap="round"/>
  <line x1="280" y1="190" x2="370" y2="150" stroke="#a8a29e" stroke-width="16" stroke-linecap="round"/>
  <!-- snap marks -->
  <line x1="265" y1="195" x2="295" y2="185" stroke="#78350f" stroke-width="3"/>
  <line x1="268" y1="205" x2="298" y2="195" stroke="#78350f" stroke-width="3"/>
  <!-- broken branches scattered -->
  <line x1="330" y1="170" x2="360" y2="200" stroke="#a8a29e" stroke-width="6" stroke-linecap="round"/>
  <line x1="350" y1="140" x2="320" y2="120" stroke="#a8a29e" stroke-width="6" stroke-linecap="round"/>
  <text x="280" y="368" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">剛強：硬い木 → 折れる</text>

  <!-- divider -->
  <line x1="500" y1="80" x2="500" y2="350" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- RIGHT: bamboo bending -->
  <rect x="660" y="270" width="16" height="80" fill="#4d7c0f"/>
  <!-- bending bamboo stalk with curve -->
  <path d="M 668 270 C 668 220, 700 190, 740 170 C 770 155, 790 140, 800 110"
        fill="none" stroke="#65a30d" stroke-width="14" stroke-linecap="round"/>
  <!-- bamboo segment lines -->
  <line x1="668" y1="250" x2="684" y2="248" stroke="#3f6212" stroke-width="2"/>
  <line x1="672" y1="225" x2="690" y2="220" stroke="#3f6212" stroke-width="2"/>
  <line x1="690" y1="195" x2="708" y2="186" stroke="#3f6212" stroke-width="2"/>
  <line x1="730" y1="172" x2="745" y2="158" stroke="#3f6212" stroke-width="2"/>
  <!-- leaves -->
  <ellipse cx="805" cy="100" rx="22" ry="9" fill="#84cc16" transform="rotate(-30 805 100)"/>
  <ellipse cx="790" cy="118" rx="20" ry="8" fill="#84cc16" transform="rotate(-10 790 118)"/>
  <ellipse cx="760" cy="150" rx="18" ry="7" fill="#84cc16" transform="rotate(20 760 150)"/>

  <text x="730" y="368" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#3f6212" text-anchor="middle">柔弱：竹 → しなって生き残る</text>
</svg>
