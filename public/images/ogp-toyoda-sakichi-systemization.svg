<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Interlocking gears (automation/systemization) -->
  <!-- large gear (left) -->
  <circle cx="440" cy="315" r="155" fill="#3b82f6" opacity="0.60"/>
  <circle cx="440" cy="315" r="95"  fill="#dbeafe" opacity="0.85"/>
  <circle cx="440" cy="315" r="35"  fill="#3b82f6" opacity="0.75"/>
  <!-- gear teeth (large) -->
  <g fill="#3b82f6" opacity="0.65">
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(0 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(45 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(90 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(135 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(180 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(225 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(270 440 315)"/>
    <rect x="418" y="148" width="44" height="38" rx="5" transform="rotate(315 440 315)"/>
  </g>
  <!-- small gear (right, meshing) -->
  <circle cx="730" cy="315" r="100" fill="#1e40af" opacity="0.65"/>
  <circle cx="730" cy="315" r="60"  fill="#dbeafe" opacity="0.85"/>
  <circle cx="730" cy="315" r="22"  fill="#1e40af" opacity="0.78"/>
  <!-- gear teeth (small) -->
  <g fill="#1e40af" opacity="0.70">
    <rect x="712" y="204" width="36" height="28" rx="4" transform="rotate(0 730 315)"/>
    <rect x="712" y="204" width="36" height="28" rx="4" transform="rotate(60 730 315)"/>
    <rect x="712" y="204" width="36" height="28" rx="4" transform="rotate(120 730 315)"/>
    <rect x="712" y="204" width="36" height="28" rx="4" transform="rotate(180 730 315)"/>
    <rect x="712" y="204" width="36" height="28" rx="4" transform="rotate(240 730 315)"/>
    <rect x="712" y="204" width="36" height="28" rx="4" transform="rotate(300 730 315)"/>
  </g>
</svg>