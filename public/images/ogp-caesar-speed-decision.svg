<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- A river (Rubicon) crossing the frame diagonally -->
  <path d="M -50 250 C 250 320 500 240 750 320 C 950 380 1100 330 1250 380 L 1250 480 C 1100 430 950 480 750 420 C 500 340 250 420 -50 350 Z" fill="url(#riverGrad)" opacity="0.55"/>
  <path d="M -50 280 C 250 350 500 270 750 350 C 950 410 1100 360 1250 410" fill="none" stroke="#7e22ce" stroke-width="3" opacity="0.4"/>

  <!-- Many faint, scattered, undecided paths on the left bank -->
  <g stroke="#d8b4fe" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 150 540 C 200 480 170 430 220 380"/>
    <path d="M 220 560 C 260 500 230 440 270 390"/>
    <path d="M 300 555 C 320 490 280 450 320 400"/>
  </g>

  <!-- One bold, single, straight arrow crossing decisively to the right bank -->
  <path d="M 280 470 L 980 200" fill="none" stroke="#6b21a8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="980,200 925,206 952,250" fill="#6b21a8"/>

  <!-- A simple bridge silhouette over the river marking the crossing point -->
  <path d="M 560 300 Q 660 230 760 300" fill="none" stroke="#581c87" stroke-width="6" opacity="0.5"/>

  <!-- Standard/banner silhouette on the far bank, signifying the decisive destination reached -->
  <g transform="translate(1020,170)">
    <rect x="-4" y="-90" width="8" height="190" fill="#581c87"/>
    <path d="M 4 -90 L 70 -65 L 4 -40 Z" fill="#9333ea"/>
  </g>

  <!-- Concentric rings on the left bank suggesting hesitation / circling thought -->
  <circle cx="240" cy="430" r="60" fill="none" stroke="#ddd6fe" stroke-width="3" opacity="0.6"/>
  <circle cx="240" cy="430" r="95" fill="none" stroke="#ede9fe" stroke-width="2" opacity="0.5"/>
</svg>
