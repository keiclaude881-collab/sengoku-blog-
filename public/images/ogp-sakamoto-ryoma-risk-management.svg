<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- 船が波を越えて進むイメージ -->
  <g transform="translate(330,380)" opacity="0.8">
    <path d="M -130 20 Q -80 -10 0 -60 Q 80 -10 130 20 Z" fill="#f59e0b" opacity="0.7"/>
    <path d="M 0 -60 L 0 -160" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 -160 L 80 -110 L 0 -90 Z" fill="#b45309" opacity="0.8"/>
    <path d="M -160 30 Q -80 10 0 30 Q 80 10 160 30" stroke="#d97706" stroke-width="3" fill="none" stroke-dasharray="5 8" opacity="0.6"/>
    <path d="M -170 60 Q -80 40 0 60 Q 80 40 170 60" stroke="#d97706" stroke-width="2.5" fill="none" stroke-dasharray="4 9" opacity="0.4"/>
  </g>

  <!-- カテゴリラベル -->
  <rect x="700" y="170" width="128" height="36" rx="18" fill="#fef3c7" stroke="#fde68a"/>
  <text x="764" y="194" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">投資・お金</text>

  <!-- タイトル -->
  <text x="700" y="262" font-family="'Shippori Mincho', serif" font-size="29" font-weight="700" fill="#1c1917" letter-spacing="1">坂本龍馬に学ぶ</text>
  <text x="700" y="304" font-family="'Shippori Mincho', serif" font-size="29" font-weight="700" fill="#1c1917" letter-spacing="1">「リスクのとり方と</text>
  <text x="700" y="344" font-family="'Shippori Mincho', serif" font-size="29" font-weight="700" fill="#1c1917" letter-spacing="1">逃げ道の作り方」</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
