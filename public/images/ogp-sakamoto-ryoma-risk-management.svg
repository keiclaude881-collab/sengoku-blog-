<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad3)"/>

  <!-- sun -->
  <circle cx="980" cy="140" r="70" fill="#fde68a" opacity="0.8"/>
  <circle cx="980" cy="140" r="46" fill="#f59e0b" opacity="0.6"/>

  <!-- waves -->
  <g fill="none" stroke="#d97706">
    <path d="M -20 470 Q 100 440 220 470 Q 340 500 460 470 Q 580 440 700 470 Q 820 500 940 470 Q 1060 440 1220 470" stroke-width="4" opacity="0.5"/>
    <path d="M -20 520 Q 100 490 220 520 Q 340 550 460 520 Q 580 490 700 520 Q 820 550 940 520 Q 1060 490 1220 520" stroke-width="4" opacity="0.4"/>
    <path d="M -20 570 Q 100 540 220 570 Q 340 600 460 570 Q 580 540 700 570 Q 820 600 940 570 Q 1060 540 1220 570" stroke-width="4" opacity="0.3"/>
  </g>

  <!-- ship sailing forward -->
  <g transform="translate(560,420)">
    <path d="M -130 30 Q -70 -10 0 -60 Q 70 -10 130 30 Z" fill="#92400e"/>
    <path d="M 0 -60 L 0 -190" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 -190 L 85 -135 L 0 -110 Z" fill="#f59e0b"/>
    <path d="M 0 -160 L -60 -110 L 0 -95 Z" fill="#d97706" opacity="0.85"/>
  </g>

  <!-- small secondary boat (escape route) -->
  <g transform="translate(850,470) scale(0.55)">
    <path d="M -130 30 Q -70 -10 0 -60 Q 70 -10 130 30 Z" fill="#d97706" opacity="0.8"/>
    <path d="M 0 -60 L 0 -160" stroke="#92400e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 -160 L 70 -118 L 0 -100 Z" fill="#fde68a"/>
  </g>

  <!-- dashed route line forking into two paths (risk + escape route) -->
  <path d="M 250 380 Q 400 330 560 360" stroke="#92400e" stroke-width="3" fill="none" stroke-dasharray="6 8" opacity="0.6"/>
  <path d="M 560 360 Q 700 400 850 470" stroke="#92400e" stroke-width="3" fill="none" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="250" cy="380" r="8" fill="#78350f"/>
</svg>
