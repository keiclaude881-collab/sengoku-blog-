<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Three figures in a row (人は城 - people are the castle) -->
  <!-- center figure (larger = leader) -->
  <circle cx="600" cy="230" r="58" fill="#3b82f6" opacity="0.82"/>
  <path d="M 548,286 Q 530,310 525,380 L 675,380 Q 670,310 652,286 Q 630,265 600,263 Q 570,265 548,286 Z" fill="#3b82f6" opacity="0.78"/>
  <!-- left figure -->
  <circle cx="380" cy="255" r="46" fill="#1e40af" opacity="0.70"/>
  <path d="M 338,297 Q 322,318 318,380 L 442,380 Q 438,318 422,297 Q 406,278 380,276 Q 354,278 338,297 Z" fill="#1e40af" opacity="0.65"/>
  <!-- right figure -->
  <circle cx="820" cy="255" r="46" fill="#1e40af" opacity="0.70"/>
  <path d="M 778,297 Q 762,318 758,380 L 882,380 Q 878,318 862,297 Q 846,278 820,276 Q 794,278 778,297 Z" fill="#1e40af" opacity="0.65"/>
  <!-- connecting line (unity) -->
  <line x1="425" y1="340" x2="548" y2="320" stroke="#bfdbfe" stroke-width="8" opacity="0.50"/>
  <line x1="652" y1="320" x2="775" y2="340" stroke="#bfdbfe" stroke-width="8" opacity="0.50"/>
  <!-- castle silhouette above (but people = castle) -->
  <path d="M 400,180 L 400,130 L 420,130 L 420,100 L 440,100 L 440,130 L 460,130 L 460,180 Z" fill="#bfdbfe" opacity="0.25"/>
  <path d="M 740,180 L 740,130 L 760,130 L 760,100 L 780,100 L 780,130 L 800,130 L 800,180 Z" fill="#bfdbfe" opacity="0.25"/>
</svg>