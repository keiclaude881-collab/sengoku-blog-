<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <rect width="1000" height="380" fill="#f0f7ff" rx="12"/>
  <rect x="0" y="0" width="1000" height="380" rx="12" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>

  <text x="500" y="38" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">元朝での24年間——マルコ・ポーロが身につけた4つの力</text>

  <!-- Center node -->
  <circle cx="500" cy="210" r="50" fill="#1e40af"/>
  <text x="500" y="202" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">マルコ</text>
  <text x="500" y="220" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">・ポーロ</text>

  <!-- Spokes -->
  <line x1="500" y1="160" x2="500" y2="100" stroke="#93c5fd" stroke-width="2"/>
  <line x1="548" y1="210" x2="700" y2="210" stroke="#93c5fd" stroke-width="2"/>
  <line x1="500" y1="260" x2="500" y2="320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="452" y1="210" x2="300" y2="210" stroke="#93c5fd" stroke-width="2"/>

  <!-- Top: 語学力 -->
  <rect x="400" y="48" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="68" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">① 語学力</text>
  <text x="500" y="88" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">複数言語を使い分け交渉</text>

  <!-- Right: 外交力 -->
  <rect x="705" y="184" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="805" y="204" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">② 外交力</text>
  <text x="805" y="224" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">フビライ・ハンの使者を務める</text>

  <!-- Bottom: 商業ネットワーク -->
  <rect x="400" y="325" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="345" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">③ 商業ネットワーク</text>
  <text x="500" y="365" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">各地の商人・役人と関係構築</text>

  <!-- Left: 観察記録力 -->
  <rect x="95" y="184" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="195" y="204" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">④ 観察記録力</text>
  <text x="195" y="224" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">見聞きした情報を細かく記録</text>
</svg>
