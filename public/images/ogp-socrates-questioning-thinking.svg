  <path d="M 475 200 L 520 200" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 5" opacity="0.4"/>
  <path d="M 515 194 L 525 200 L 515 206" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <circle cx="548" cy="200" r="28" fill="#a855f7" opacity="0.12"/>
