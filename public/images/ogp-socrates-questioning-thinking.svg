  <text x="260" y="208" font-family="'Shippori Mincho', serif" font-size="28" fill="#6b21a8" text-anchor="middle" opacity="0.75">？</text>
  <path d="M 325 200 L 390 200" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.5"/>
  <path d="M 384 193 L 396 200 L 384 207" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <circle cx="430" cy="200" r="42" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.5"/>
