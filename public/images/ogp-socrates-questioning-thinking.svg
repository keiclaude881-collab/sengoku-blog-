  <!-- small dotted connector arcs hinting at dialogue / chain reaction -->
  <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="4 8">
    <path d="M 240 470 Q 320 500 400 460"/>
    <path d="M 440 460 Q 520 480 600 400"/>
