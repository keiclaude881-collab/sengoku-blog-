      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad8)"/>

  <circle cx="1080" cy="500" r="100" fill="#e9d5ff" opacity="0.5"/>
  <circle cx="120" cy="120" r="70" fill="#e9d5ff" opacity="0.5"/>

  <!-- chain of question-mark-shaped curls, growing larger, spiraling rightward and upward -->
  <g fill="none" stroke-linecap="round">
    <path d="M 180 420 Q 140 380 170 340 Q 200 300 250 320 Q 300 340 280 390 Q 264 426 220 426" stroke="#d8b4fe" stroke-width="10" opacity="0.7"/>
    <circle cx="218" cy="464" r="8" fill="#d8b4fe" opacity="0.7"/>

    <path d="M 360 380 Q 300 330 340 280 Q 380 230 450 258 Q 520 286 494 350 Q 472 398 410 398" stroke="#9333ea" stroke-width="13" opacity="0.8"/>
    <circle cx="406" cy="448" r="10" fill="#9333ea" opacity="0.8"/>

    <path d="M 600 330 Q 520 260 580 190 Q 640 120 730 156 Q 820 192 786 276 Q 758 340 670 340" stroke="#7e22ce" stroke-width="17" opacity="0.9"/>
    <circle cx="664" cy="408" r="13" fill="#7e22ce" opacity="0.9"/>

    <path d="M 900 270 Q 800 180 880 90 Q 960 0 1070 44" stroke="#6b21a8" stroke-width="20" opacity="0.95"/>
    <circle cx="1080" cy="60" r="16" fill="#6b21a8" opacity="0.95"/>
