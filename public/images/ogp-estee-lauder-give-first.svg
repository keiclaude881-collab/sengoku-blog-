<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="el-glow" cx="38%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#el-glow)"/>

  <!-- expanding ripples from the gift, suggesting returns spreading outward -->
  <circle cx="430" cy="345" r="120" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.6"/>
  <circle cx="430" cy="345" r="190" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.45"/>
  <circle cx="430" cy="345" r="260" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.3"/>

  <!-- open hand offering a small bottle (give first) -->
  <g transform="translate(430,360)">
    <!-- palm -->
    <path d="M -110 40 C -110 -10 -70 -30 0 -30 C 70 -30 110 -10 110 40 C 110 80 70 96 0 96 C -70 96 -110 80 -110 40 Z" fill="#f59e0b" opacity="0.85"/>
    <!-- fingers -->
    <rect x="-92" y="-6" width="26" height="58" rx="13" fill="#f59e0b" opacity="0.85"/>
    <rect x="-50" y="-22" width="26" height="74" rx="13" fill="#f59e0b" opacity="0.9"/>
    <rect x="-6" y="-30" width="26" height="82" rx="13" fill="#f59e0b" opacity="0.95"/>
    <rect x="38" y="-22" width="26" height="74" rx="13" fill="#f59e0b" opacity="0.9"/>
    <rect x="78" y="-6" width="24" height="58" rx="12" fill="#f59e0b" opacity="0.85"/>
  </g>

  <!-- small perfume bottle resting above the palm -->
  <g transform="translate(430,250)">
    <rect x="-26" y="-10" width="52" height="70" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
    <rect x="-12" y="-34" width="24" height="28" rx="6" fill="#d97706"/>
    <rect x="-8" y="-46" width="16" height="16" rx="4" fill="#92400e"/>
    <line x1="-26" y1="20" x2="26" y2="20" stroke="#92400e" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- sparkle accents around the gift -->
  <g fill="#d97706" opacity="0.7">
    <circle cx="320" cy="210" r="6"/>
    <circle cx="560" cy="220" r="8"/>
    <circle cx="300" cy="420" r="5"/>
  </g>

  <!-- growth side: coins/graph rising from the gesture, on the right -->
  <g transform="translate(880,420)">
    <rect x="-30" y="-40" width="60" height="40" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <rect x="50" y="-90" width="60" height="90" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <rect x="130" y="-150" width="60" height="150" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <path d="M -30 -150 L 30 -110 L 90 -130 L 190 -190" stroke="#92400e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 175 -200 L 190 -190 L 178 -174 Z" fill="#92400e"/>
  </g>

  <!-- decorative coin dots -->
  <circle cx="1080" cy="160" r="22" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="0.8"/>
  <circle cx="1130" cy="220" r="14" fill="#f59e0b" opacity="0.6"/>
  <circle cx="150" cy="540" r="20" fill="#fde68a" opacity="0.6"/>
</svg>
