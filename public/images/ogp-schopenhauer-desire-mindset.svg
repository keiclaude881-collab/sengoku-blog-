<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#ddd6fe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#ddd6fe" opacity="0.12"/>
  <!-- Pendulum (欲望の振り子) -->
  <!-- pivot mount at top center -->
  <rect x="560" y="95" width="80" height="22" rx="6" fill="#6b21a8" opacity="0.60"/>
  <circle cx="600" cy="107" r="16" fill="#8b5cf6" opacity="0.75"/>
  <!-- left swing arc (dotted) -->
  <path d="M 600,107 L 350,490" stroke="#a78bfa" stroke-width="6" stroke-dasharray="14,8" stroke-linecap="round" opacity="0.50"/>
  <!-- right swing arc (dotted) -->
  <path d="M 600,107 L 850,490" stroke="#a78bfa" stroke-width="6" stroke-dasharray="14,8" stroke-linecap="round" opacity="0.50"/>
  <!-- rest/center line -->
  <line x1="600" y1="107" x2="600" y2="490" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <!-- swing arc (showing motion path) -->
  <path d="M 350,490 Q 600,370 850,490" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-dasharray="16,10" opacity="0.45"/>
  <!-- ball at left position (joy peak) -->
  <circle cx="350" cy="492" r="38" fill="#8b5cf6" opacity="0.55"/>
  <circle cx="350" cy="492" r="22" fill="#ddd6fe" opacity="0.70"/>
  <!-- ball at right position (boredom peak) -->
  <circle cx="850" cy="492" r="38" fill="#8b5cf6" opacity="0.55"/>
  <circle cx="850" cy="492" r="22" fill="#ddd6fe" opacity="0.70"/>
  <!-- ball at center position (transition) -->
  <circle cx="600" cy="492" r="30" fill="#6b21a8" opacity="0.72"/>
  <circle cx="600" cy="492" r="16" fill="#a78bfa" opacity="0.80"/>
</svg>