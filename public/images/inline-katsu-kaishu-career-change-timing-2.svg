<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <rect width="1000" height="400" fill="#f0f7ff"/>
  <rect x="0" y="0" width="1000" height="400" fill="none" stroke="#dbeafe" stroke-width="2"/>
  <g fill="none" stroke="#3b82f6" stroke-width="5">
    <path d="M 150 200 Q 350 60 550 200" stroke-dasharray="10 8"/>
    <path d="M 550 200 Q 750 340 850 200"/>
  </g>
  <circle cx="150" cy="200" r="14" fill="#1e40af"/>
  <circle cx="550" cy="200" r="16" fill="#1e3a8a"/>
  <circle cx="850" cy="200" r="14" fill="#1e40af"/>
  <g fill="#1e40af" font-family="sans-serif" font-weight="700" text-anchor="middle">
    <text x="150" y="240" font-size="16">今の船</text>
    <text x="550" y="160" font-size="16">分岐点</text>
    <text x="850" y="240" font-size="16">次の船</text>
  </g>
