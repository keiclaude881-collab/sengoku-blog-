<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="colGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Faint background rings suggesting repetition/cycles -->
  <circle cx="950" cy="200" r="130" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <circle cx="950" cy="200" r="170" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="250" cy="470" r="110" fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.8"/>

  <!-- A trail of footprints, growing larger, leading up the steps -->
  <g opacity="0.55">
    <ellipse cx="330" cy="520" rx="16" ry="24" fill="#d8b4fe" transform="rotate(-8 330 520)"/>
    <ellipse cx="380" cy="535" rx="16" ry="24" fill="#d8b4fe" transform="rotate(6 380 535)"/>
  </g>
  <g opacity="0.7">
    <ellipse cx="420" cy="470" rx="18" ry="27" fill="#c084fc" transform="rotate(-8 420 470)"/>
    <ellipse cx="472" cy="485" rx="18" ry="27" fill="#c084fc" transform="rotate(6 472 485)"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="515" cy="415" rx="20" ry="30" fill="#a855f7" transform="rotate(-8 515 415)"/>
    <ellipse cx="570" cy="430" rx="20" ry="30" fill="#a855f7" transform="rotate(6 570 430)"/>
  </g>

  <!-- Steps rising, symbolizing habit building character step by step -->
  <rect x="600" y="430" width="90" height="170" fill="#ede9fe"/>
  <rect x="690" y="370" width="90" height="230" fill="#ddd6fe"/>
  <rect x="780" y="300" width="90" height="300" fill="#c4b5fd"/>
  <rect x="870" y="220" width="90" height="380" fill="#a855f7"/>

  <!-- Standing human silhouette at the top of the steps: the formed character -->
  <g transform="translate(915,160)">
    <circle cx="0" cy="0" r="26" fill="url(#colGrad)"/>
    <path d="M -34 130 C -34 50 -24 18 0 18 C 24 18 34 50 34 130 Z" fill="url(#colGrad)"/>
    <path d="M -20 130 L -26 200 L -8 200 L -4 140 Z" fill="#6b21a8"/>
    <path d="M 20 130 L 26 200 L 8 200 L 4 140 Z" fill="#6b21a8"/>
  </g>

  <!-- radiating light from the figure, representing virtue/character achieved -->
  <g stroke="#a855f7" stroke-width="3" opacity="0.5">
    <line x1="915" y1="60" x2="915" y2="20"/>
    <line x1="975" y1="90" x2="1010" y2="65"/>
    <line x1="855" y1="90" x2="820" y2="65"/>
  </g>

  <!-- Decorative small repeating circles trailing along the base, echoing the repetition theme -->
  <g fill="#9333ea" opacity="0.5">
    <circle cx="160" cy="580" r="7"/>
    <circle cx="195" cy="580" r="9"/>
    <circle cx="232" cy="580" r="11"/>
    <circle cx="272" cy="580" r="13"/>
  </g>
</svg>
