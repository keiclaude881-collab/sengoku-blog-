<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <rect x="0" y="0" width="12" height="630" fill="#6b21a8"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="100" height="34" rx="17" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="110" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="2">思考法</text>

  <!-- Main title -->
  <text x="60" y="175" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="46" font-weight="700" fill="#1c1917" letter-spacing="-1">才能より先に「習慣」がある</text>

  <!-- Subtitle -->
  <text x="60" y="240" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="26" fill="#7c3aed" letter-spacing="1">アリストテレスに学ぶ人格形成の哲学</text>

  <!-- Divider -->
  <line x1="60" y1="272" x2="680" y2="272" stroke="#e9d5ff" stroke-width="2"/>

  <!-- Quote -->
  <text x="60" y="315" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="19" fill="#6b7280" letter-spacing="0.5">「勇敢な行いを繰り返すことで</text>
  <text x="60" y="345" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="19" fill="#6b7280" letter-spacing="0.5">　人は勇敢になる」</text>
  <text x="60" y="380" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" fill="#9ca3af">— ニコマコス倫理学</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#7c3aed" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right graphic: habit loop -->
  <rect x="780" y="80" width="370" height="420" rx="12" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="965" y="120" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="700" fill="#6b21a8" text-anchor="middle">習慣が人格を作る</text>

  <!-- Cycle: 3 steps in triangle -->
  <!-- Step 1: 行動 -->
  <circle cx="965" cy="195" r="52" fill="#7c3aed"/>
  <text x="965" y="188" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">繰り返す</text>
  <text x="965" y="210" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="14" fill="#e9d5ff" text-anchor="middle">行動</text>

  <!-- Arrow down-left -->
  <path d="M 925,238 L 868,310" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="862,302 864,316 876,308" fill="#a855f7"/>

  <!-- Step 2: 習慣 -->
  <circle cx="855" cy="350" r="52" fill="#7c3aed"/>
  <text x="855" y="343" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">身につく</text>
  <text x="855" y="365" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="14" fill="#e9d5ff" text-anchor="middle">習慣</text>

  <!-- Arrow right -->
  <path d="M 907,350 L 1023,350" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="1017,343 1031,350 1017,357" fill="#a855f7"/>

  <!-- Step 3: 人格 -->
  <circle cx="1075" cy="350" r="52" fill="#581c87"/>
  <text x="1075" y="343" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">変わる</text>
  <text x="1075" y="365" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="14" fill="#e9d5ff" text-anchor="middle">人格</text>

  <!-- Arrow up-left back -->
  <path d="M 1038,308 L 992,243" stroke="#a855f7" stroke-width="3" fill="none" stroke-dasharray="6,3"/>
  <polygon points="986,250 989,236 1000,244" fill="#a855f7"/>

  <!-- Center text -->
  <text x="965" y="348" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">エートス</text>
  <text x="965" y="363" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">(習慣＝人格)</text>

  <!-- Bottom note -->
  <text x="965" y="460" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" font-style="italic">紀元前4世紀 アリストテレス</text>
  <text x="965" y="480" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">ニコマコス倫理学より</text>
</svg>
