<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Compass rose (Ino Tadataka made Japan first accurate map) -->
  <!-- outer circle -->
  <circle cx="600" cy="315" r="230" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.35"/>
  <circle cx="600" cy="315" r="180" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.25"/>
  <!-- 8-point star (compass rose) -->
  <!-- cardinal points (large) -->
  <polygon points="600,100 622,270 578,270" fill="#1e40af" opacity="0.85"/>
  <polygon points="600,530 622,360 578,360" fill="#1e40af" opacity="0.85"/>
  <polygon points="370,315 540,293 540,337" fill="#1e40af" opacity="0.85"/>
  <polygon points="830,315 660,293 660,337" fill="#1e40af" opacity="0.85"/>
  <!-- intercardinal (smaller) -->
  <polygon points="459,174 580,288 548,320" fill="#3b82f6" opacity="0.65"/>
  <polygon points="741,174 620,288 652,320" fill="#3b82f6" opacity="0.65"/>
  <polygon points="459,456 580,342 548,310" fill="#3b82f6" opacity="0.65"/>
  <polygon points="741,456 620,342 652,310" fill="#3b82f6" opacity="0.65"/>
  <!-- center -->
  <circle cx="600" cy="315" r="40" fill="#1e40af" opacity="0.80"/>
  <circle cx="600" cy="315" r="20" fill="#bfdbfe" opacity="0.85"/>
</svg>