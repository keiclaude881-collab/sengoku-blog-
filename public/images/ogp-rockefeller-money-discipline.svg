<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- soft background coin circles -->
  <circle cx="150" cy="120" r="60" fill="#fde68a" opacity="0.5"/>
  <circle cx="1080" cy="500" r="90" fill="#fde68a" opacity="0.5"/>
  <circle cx="1020" cy="100" r="40" fill="#f59e0b" opacity="0.25"/>

  <!-- pie chart: income split into three slices (donation / savings / living) -->
  <g transform="translate(600,330)">
    <circle r="190" fill="#fde68a" opacity="0.55"/>
    <path d="M 0 0 L 0 -190 A 190 190 0 0 1 164.5 -95 Z" fill="#92400e"/>
    <path d="M 0 0 L 164.5 -95 A 190 190 0 0 1 164.5 95 Z" fill="#d97706"/>
    <path d="M 0 0 L 164.5 95 A 190 190 0 1 1 0 -190 Z" fill="#f59e0b"/>
    <circle r="78" fill="#fffbeb"/>
    <circle r="78" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- coin stack rising, left side -->
  <g transform="translate(280,470)">
    <ellipse cx="0" cy="20" rx="58" ry="16" fill="#92400e"/>
    <rect x="-58" y="-2" width="116" height="22" rx="11" fill="#d97706"/>
    <ellipse cx="0" cy="-2" rx="58" ry="16" fill="#f59e0b"/>
    <ellipse cx="0" cy="-26" rx="50" ry="14" fill="#92400e"/>
    <rect x="-50" y="-48" width="100" height="22" rx="11" fill="#d97706"/>
    <ellipse cx="0" cy="-48" rx="50" ry="14" fill="#f59e0b"/>
    <ellipse cx="0" cy="-70" rx="42" ry="12" fill="#92400e"/>
    <rect x="-42" y="-90" width="84" height="20" rx="10" fill="#d97706"/>
    <ellipse cx="0" cy="-90" rx="42" ry="12" fill="#fde68a"/>
  </g>

  <!-- small upward arrow suggesting growth -->
  <g transform="translate(940,400)" stroke="#92400e" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M -70 70 L -10 10 L 50 50 L 110 -30"/>
    <path d="M 110 -30 L 82 -28 M 110 -30 L 108 -2"/>
  </g>
</svg>
