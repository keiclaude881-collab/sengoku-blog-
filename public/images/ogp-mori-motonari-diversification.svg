<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <rect x="0" y="0" width="12" height="630" fill="#92400e"/>

  <!-- カテゴリバッジ -->
  <rect x="68" y="68" width="120" height="36" rx="18" fill="#fef3c7" stroke="#fde68a"/>
  <text x="128" y="92" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">投資・お金</text>

  <!-- タイトル -->
  <text x="68" y="200" font-family="'Hiragino Sans', sans-serif" font-size="48" font-weight="900" fill="#1c1917">毛利元就に学ぶ</text>
  <text x="68" y="266" font-family="'Hiragino Sans', sans-serif" font-size="46" font-weight="900" fill="#92400e">「分散」の資産形成</text>

  <!-- 説明 -->
  <text x="68" y="330" font-family="'Hiragino Sans', sans-serif" font-size="22" fill="#78716c">「三本の矢」は分散投資の本質を表していた</text>

  <!-- 折れる1本の矢 -->
  <g stroke="#dc2626" stroke-width="9" stroke-linecap="round" opacity="0.65">
    <line x1="800" y1="250" x2="900" y2="232"/>
    <line x1="916" y1="229" x2="1010" y2="212"/>
    <path d="M 1010 212 L 985 200 M 1010 212 L 998 232" fill="none"/>
  </g>

  <!-- 束になった3本の矢 -->
  <g stroke-linecap="round">
    <line x1="800" y1="420" x2="1080" y2="360" stroke="#92400e" stroke-width="11" opacity="0.85"/>
    <line x1="800" y1="460" x2="1080" y2="400" stroke="#b45309" stroke-width="11" opacity="0.8"/>
    <line x1="800" y1="500" x2="1080" y2="440" stroke="#d97706" stroke-width="11" opacity="0.75"/>
    <path d="M 1080 360 L 1050 345 M 1080 360 L 1062 388" stroke="#92400e" stroke-width="11" fill="none" opacity="0.85"/>
    <path d="M 1080 400 L 1050 385 M 1080 400 L 1062 428" stroke="#b45309" stroke-width="11" fill="none" opacity="0.8"/>
    <path d="M 1080 440 L 1050 425 M 1080 440 L 1062 468" stroke="#d97706" stroke-width="11" fill="none" opacity="0.75"/>
  </g>
  <!-- 束ねる帯 -->
  <ellipse cx="900" cy="430" rx="34" ry="80" fill="none" stroke="#1c1917" stroke-width="7" opacity="0.5" transform="rotate(-15 900 430)"/>

  <text x="68" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
