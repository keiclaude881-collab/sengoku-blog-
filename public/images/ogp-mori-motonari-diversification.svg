<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fffbeb"/>

  <!-- left: single arrow, broken -->
  <g transform="translate(280,300)" opacity="0.8">
    <circle r="160" fill="#fde68a" opacity="0.3"/>
    <g stroke="#92400e" stroke-width="14" stroke-linecap="round" transform="rotate(-18)">
      <line x1="-130" y1="0" x2="-20" y2="0"/>
      <line x1="20" y1="0" x2="130" y2="0"/>
    </g>
    <path d="M -20 0 L -45 -22 M -20 0 L -45 22" stroke="#92400e" stroke-width="10" stroke-linecap="round" transform="rotate(-18)"/>
    <path d="M 20 0 L 45 -22 M 20 0 L 45 22" stroke="#92400e" stroke-width="10" stroke-linecap="round" transform="rotate(-18)"/>
    <g transform="rotate(-18)">
      <path d="M 130 0 L 105 -16 M 130 0 L 110 14" stroke="#92400e" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M -130 0 L -150 -14 L -150 14 Z" fill="#92400e"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="600" y1="130" x2="600" y2="500" stroke="#fde68a" stroke-width="3" stroke-dasharray="10,12"/>

  <!-- right: three arrows bundled together, strong -->
  <g transform="translate(900,300)">
    <circle r="190" fill="#fde68a" opacity="0.35"/>
    <g stroke-linecap="round">
      <line x1="-150" y1="-50" x2="150" y2="-50" stroke="#d97706" stroke-width="16"/>
      <line x1="-150" y1="0" x2="150" y2="0" stroke="#b45309" stroke-width="16"/>
      <line x1="-150" y1="50" x2="150" y2="50" stroke="#92400e" stroke-width="16"/>
    </g>
    <!-- arrowheads -->
    <path d="M 150 -50 L 122 -64 L 122 -36 Z" fill="#d97706"/>
    <path d="M 150 0 L 122 -14 L 122 14 Z" fill="#b45309"/>
    <path d="M 150 50 L 122 36 L 122 64 Z" fill="#92400e"/>
    <!-- fletching -->
    <path d="M -150 -50 L -176 -64 L -176 -36 Z" fill="#d97706"/>
    <path d="M -150 0 L -176 -14 L -176 14 Z" fill="#b45309"/>
    <path d="M -150 50 L -176 36 L -176 64 Z" fill="#92400e"/>
    <!-- binding band -->
    <rect x="-22" y="-78" width="44" height="156" rx="14" fill="none" stroke="#78350f" stroke-width="8"/>
    <rect x="-22" y="-78" width="44" height="156" rx="14" fill="#fef3c7" opacity="0.4"/>
  </g>

  <!-- small coin shapes scattered for "asset" feel -->
  <circle cx="980" cy="500" r="22" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <circle cx="1030" cy="480" r="16" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
  <circle cx="820" cy="490" r="18" fill="#f59e0b" stroke="#92400e" stroke-width="3" opacity="0.85"/>

  <ellipse cx="280" cy="490" rx="120" ry="14" fill="#fde68a" opacity="0.5"/>
  <ellipse cx="900" cy="520" rx="160" ry="16" fill="#fde68a" opacity="0.5"/>
</svg>
