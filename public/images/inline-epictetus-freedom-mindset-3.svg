<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <!-- 期待のライン（高め） -->
  <path d="M 200 180 L 500 180" stroke="#6b21a8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- 現実のライン（低め） -->
  <path d="M 200 290 L 500 290" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6" opacity="0.7"/>
  <!-- ギャップの矢印 -->
  <line x1="350" y1="183" x2="350" y2="287" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.65"/>
  <path d="M 343 183 L 350 172 L 357 183" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <path d="M 343 287 L 350 298 L 357 287" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <!-- ギャップラベル -->
  <rect x="356" y="218" width="72" height="26" rx="4" fill="#f3e8ff"/>
  <text x="392" y="236" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">ギャップ</text>
  <!-- 苦しみのアイコン（右側） -->
  <circle cx="680" cy="235" r="55" fill="#e9d5ff" opacity="0.5"/>
  <circle cx="680" cy="235" r="55" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.6"/>
  <text x="680" y="244" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.85">苦しみ</text>
  <!-- ラベル -->
  <text x="200" y="168" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#6b21a8" opacity="0.9">期待</text>
  <text x="200" y="314" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#8b5cf6" opacity="0.85">現実</text>
  <!-- 矢印（ギャップ→苦しみ） -->
  <path d="M 520 235 L 615 235" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 610 228 L 622 235 L 610 242" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
