  <path d="M 970,260 L 994.50,302.44 A 49,49 0 0,1 970.00,309.00 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 970.00,303.00 A 43,43 0 0,1 948.50,297.24 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 949.50,295.51 A 41,41 0 0,1 934.49,280.50 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 931.89,282.00 A 44,44 0 0,1 926.00,260.00 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 912.00,260.00 A 58,58 0 0,1 919.77,231.00 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 907.65,224.00 A 72,72 0 0,1 934.00,197.65 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 928.50,188.12 A 83,83 0 0,1 970.00,177.00 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>

  <!-- Coxcomb wedges: combat (small, dark) -->
  <path d="M 970,260 L 970.00,245.00 A 15,15 0 0,1 977.50,247.01 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 979.50,243.55 A 19,19 0 0,1 986.45,250.50 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 989.05,249.00 A 22,22 0 0,1 992.00,260.00 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 984.00,260.00 A 14,14 0 0,1 982.12,267.00 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 977.79,264.50 A 9,9 0 0,1 974.50,267.79 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 973.50,266.06 A 7,7 0 0,1 970.00,267.00 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 970.00,265.00 A 5,5 0 0,1 967.50,264.33 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 968.00,263.46 A 4,4 0 0,1 966.54,262.00 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 963.94,263.50 A 7,7 0 0,1 963.00,260.00 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 958.00,260.00 A 12,12 0 0,1 959.61,254.00 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 955.28,251.50 A 17,17 0 0,1 961.50,245.28 Z" fill="#6b21a8"/>
  <path d="M 970,260 L 960.00,242.68 A 20,20 0 0,1 970.00,240.00 Z" fill="#6b21a8"/>

  <!-- Legend -->
  <rect x="828" y="362" width="20" height="20" fill="#c4b5fd" stroke="#a855f7" stroke-width="1"/>
  <text x="856" y="378" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" fill="#6b21a8">感染症による死亡</text>
  <rect x="828" y="392" width="20" height="20" fill="#6b21a8"/>
  <text x="856" y="408" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" fill="#6b21a8">戦闘による死亡</text>
</svg>
