<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf7ff"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#6b21a8"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="110" height="34" rx="17" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="115" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="2">思考法</text>

  <!-- Main title -->
  <text x="60" y="185" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="50" font-weight="700" fill="#1c1917" letter-spacing="-1">ナイチンゲールに</text>
  <text x="60" y="255" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="50" font-weight="700" fill="#1c1917" letter-spacing="-1">学ぶ「データ思考」</text>

  <!-- Subtitle -->
  <text x="60" y="320" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="28" fill="#7c3aed" letter-spacing="2">感情ではなく、事実で判断する</text>

  <!-- Divider line -->
  <line x1="60" y1="355" x2="680" y2="355" stroke="#e9d5ff" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">クリミア戦争で死者の大半は「戦闘」ではなく</text>
  <text x="60" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">「不衛生」が原因だと、独自のグラフで示した女性。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#7c3aed" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: Nightingale's coxcomb (rose) diagram -->
  <rect x="800" y="100" width="340" height="320" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>

  <text x="970" y="135" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="700" fill="#6b21a8" text-anchor="middle">死因の内訳(イメージ図)</text>

  <!-- Coxcomb wedges: disease (large, light) -->
  <path d="M 970,260 L 970.00,171.00 A 89,89 0 0,1 1014.50,182.92 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
  <path d="M 970,260 L 1012.50,186.39 A 85,85 0 0,1 1043.61,217.50 Z" fill="#c4b5fd" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
