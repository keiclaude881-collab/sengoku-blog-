<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf5ff"/>

  <!-- background concentric guide rings -->
  <circle cx="600" cy="315" r="260" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <circle cx="600" cy="315" r="190" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <circle cx="600" cy="315" r="120" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- coxcomb / rose diagram, 12 wedges of varying radius (data thinking motif), no labels -->
  <g transform="translate(600,315)">
    <path d="M 0,0 L 0,-230 A 230,230 0 0,1 119,-197 Z" fill="#d8b4fe" opacity="0.9"/>
    <path d="M 0,0 L 119,-197 A 200,200 0 0,1 173,-100 Z" fill="#c4b5fd" opacity="0.9"/>
    <path d="M 0,0 L 173,-100 A 240,240 0 0,1 240,0 Z" fill="#d8b4fe" opacity="0.9"/>
    <path d="M 0,0 L 240,0 A 150,150 0 0,1 130,130 Z" fill="#9333ea" opacity="0.85"/>
    <path d="M 0,0 L 130,130 A 90,90 0 0,1 0,90 Z" fill="#7e22ce" opacity="0.85"/>
    <path d="M 0,0 L 0,90 A 110,110 0 0,1 -95,55 Z" fill="#9333ea" opacity="0.85"/>
    <path d="M 0,0 L -95,55 A 210,210 0 0,1 -182,-105 Z" fill="#d8b4fe" opacity="0.9"/>
    <path d="M 0,0 L -182,-105 A 170,170 0 0,1 -85,-148 Z" fill="#c4b5fd" opacity="0.9"/>
    <path d="M 0,0 L -85,-148 A 230,230 0 0,1 0,-230 Z" fill="#d8b4fe" opacity="0.9"/>

    <!-- spoke lines -->
    <g stroke="#faf5ff" stroke-width="3">
      <line x1="0" y1="0" x2="0" y2="-230"/>
      <line x1="0" y1="0" x2="119" y2="-197"/>
      <line x1="0" y1="0" x2="173" y2="-100"/>
      <line x1="0" y1="0" x2="240" y2="0"/>
      <line x1="0" y1="0" x2="130" y2="130"/>
      <line x1="0" y1="0" x2="0" y2="90"/>
      <line x1="0" y1="0" x2="-95" y2="55"/>
      <line x1="0" y1="0" x2="-182" y2="-105"/>
      <line x1="0" y1="0" x2="-85" y2="-148"/>
    </g>

    <circle r="22" fill="#6b21a8"/>
    <circle r="9" fill="#faf5ff"/>
  </g>

  <!-- magnifying glass examining the data, suggesting analytical thinking -->
  <g transform="translate(940,460)">
    <circle r="58" fill="#faf5ff" stroke="#6b21a8" stroke-width="8" opacity="0.95"/>
    <line x1="42" y1="42" x2="100" y2="100" stroke="#6b21a8" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- floating data points -->
  <circle cx="220" cy="150" r="6" fill="#d8b4fe" opacity="0.7"/>
  <circle cx="270" cy="200" r="4" fill="#9333ea" opacity="0.6"/>
  <circle cx="980" cy="180" r="6" fill="#d8b4fe" opacity="0.7"/>
  <circle cx="1030" cy="230" r="4" fill="#9333ea" opacity="0.6"/>
</svg>
