<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>
  <!-- Bullseye target with arrow -->
  <!-- outer rings (largest to smallest, concentric) -->
  <circle cx="600" cy="315" r="250" fill="#bfdbfe" opacity="0.30"/>
  <circle cx="600" cy="315" r="190" fill="#93c5fd" opacity="0.35"/>
  <circle cx="600" cy="315" r="130" fill="#60a5fa" opacity="0.45"/>
  <circle cx="600" cy="315" r="75"  fill="#3b82f6" opacity="0.60"/>
  <circle cx="600" cy="315" r="32"  fill="#1e40af" opacity="0.85"/>
  <!-- ring borders -->
  <circle cx="600" cy="315" r="250" fill="none" stroke="#1e40af" stroke-width="3" opacity="0.25"/>
  <circle cx="600" cy="315" r="190" fill="none" stroke="#1e40af" stroke-width="3" opacity="0.25"/>
  <circle cx="600" cy="315" r="130" fill="none" stroke="#1e40af" stroke-width="3" opacity="0.25"/>
  <circle cx="600" cy="315" r="75"  fill="none" stroke="#1e40af" stroke-width="3" opacity="0.30"/>
  <!-- arrow (coming from upper-right, hitting bullseye) -->
  <line x1="890" y1="105" x2="624" y2="323" stroke="#1e40af" stroke-width="12" stroke-linecap="round" opacity="0.88"/>
  <!-- arrowhead -->
  <polygon points="609,316 650,103 675,130" fill="#1e40af" opacity="0.88"/>
  <!-- arrow tail fletching -->
  <path d="M 890,105 L 910,80 L 900,110 L 920,120 Z" fill="#1e40af" opacity="0.70"/>
</svg>