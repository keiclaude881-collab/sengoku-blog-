<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- floor baseline -->
  <line x1="160" y1="490" x2="1040" y2="490" stroke="#93c5fd" stroke-width="3" opacity="0.6"/>

  <!-- bar chart (contribution/growth bars) -->
  <!-- bar 1 (low - scattered effort) -->
  <rect x="200" y="390" width="80" height="100" rx="4" fill="#93c5fd" opacity="0.5"/>

  <!-- bar 2 (slightly higher) -->
  <rect x="340" y="340" width="80" height="150" rx="4" fill="#60a5fa" opacity="0.6"/>

  <!-- bar 3 (mid) -->
  <rect x="480" y="280" width="80" height="210" rx="4" fill="url(#barGrad2)" opacity="0.75"/>

  <!-- bar 4 (higher) -->
  <rect x="620" y="210" width="80" height="280" rx="4" fill="url(#barGrad1)" opacity="0.85"/>

  <!-- bar 5 (tallest - focused strength) -->
  <rect x="760" y="140" width="80" height="350" rx="4" fill="#1d4ed8" opacity="0.9"/>

  <!-- trend arrow over bars -->
  <path d="M 240 370 Q 520 270 800 160" stroke="#1d4ed8" stroke-width="4" fill="none" stroke-dasharray="12,6" opacity="0.6"/>
  <polygon points="800,160 776,178 794,188" fill="#1d4ed8" opacity="0.7"/>

  <!-- "strength zone" highlight on bar 5 -->
  <rect x="748" y="128" width="104" height="374" rx="8" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.5"/>

  <!-- concentric circles (contribution concept, right side) -->
  <g fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.2">
    <circle cx="960" cy="300" r="130"/>
    <circle cx="960" cy="300" r="90"/>
    <circle cx="960" cy="300" r="50"/>
  </g>
  <circle cx="960" cy="300" r="20" fill="#1d4ed8" opacity="0.4"/>

  <!-- figure standing on tallest bar -->
  <g fill="#1e40af" opacity="0.8">
    <circle cx="800" cy="118" r="16"/>
    <path d="M 786 134 C 786 110 814 110 814 134 L 818 145 L 782 145 Z"/>
    <!-- arms raised (success) -->
    <line x1="786" y1="134" x2="764" y2="118" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
    <line x1="814" y1="134" x2="836" y2="118" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- bar labels (small) -->
  <g fill="#1e40af" font-size="13" text-anchor="middle" opacity="0.55">
  </g>

  <!-- subtle grid -->
  <g stroke="#bfdbfe" stroke-width="1" opacity="0.4">
    <line x1="160" y1="390" x2="1040" y2="390"/>
    <line x1="160" y1="290" x2="1040" y2="290"/>
    <line x1="160" y1="190" x2="1040" y2="190"/>
  </g>

  <!-- decorative background circle -->
  <circle cx="150" cy="150" r="80" fill="#dbeafe" opacity="0.4"/>
  <circle cx="1080" cy="480" r="60" fill="#bfdbfe" opacity="0.3"/>
</svg>
