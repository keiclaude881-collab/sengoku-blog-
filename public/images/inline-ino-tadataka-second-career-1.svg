<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <rect width="1000" height="340" fill="#f0f7ff" rx="12"/>
  <rect x="0" y="0" width="1000" height="340" rx="12" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>

  <text x="500" y="42" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">伊能忠敬のキャリア転換——第一の蓄積が第二を支える</text>

  <!-- Phase 1: 商人時代 -->
  <rect x="40" y="65" width="280" height="200" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="180" y="95" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">第一のキャリア（〜49歳）</text>
  <text x="180" y="118" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle">商人・名主</text>
  <line x1="70" y1="130" x2="290" y2="130" stroke="#93c5fd" stroke-width="1"/>
  <text x="180" y="153" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle">✓ 組織・人材管理</text>
  <text x="180" y="175" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle">✓ 資金調達・数字管理</text>
  <text x="180" y="197" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle">✓ 交渉・根回し</text>
  <text x="180" y="219" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle">✓ 長期プロジェクト実行力</text>
  <text x="180" y="248" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">（＋天文への強い関心を温め続けた）</text>

  <!-- Arrow -->
  <line x1="332" y1="165" x2="395" y2="165" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="388,158 402,165 388,172" fill="#3b82f6"/>
  <text x="365" y="148" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">転用</text>

  <!-- Phase 2: 天文・測量 -->
  <rect x="405" y="65" width="240" height="200" rx="10" fill="#93c5fd" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="525" y="95" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">学び直し（50〜54歳）</text>
  <text x="525" y="118" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle">天文・測量を習得</text>
  <line x1="425" y1="130" x2="625" y2="130" stroke="#60a5fa" stroke-width="1"/>
  <text x="525" y="160" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">年下の師匠に弟子入り</text>
  <text x="525" y="185" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">天文観測・測量技術を習得</text>
  <text x="525" y="210" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">プロジェクト計画を設計</text>

  <!-- Arrow -->
  <line x1="648" y1="165" x2="710" y2="165" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="703,158 717,165 703,172" fill="#3b82f6"/>
  <text x="678" y="148" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">実行</text>

  <!-- Phase 3: 測量実施 -->
  <rect x="720" y="65" width="240" height="200" rx="10" fill="#1e40af"/>
  <text x="840" y="95" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#dbeafe" text-anchor="middle">第二のキャリア（55〜）</text>
  <text x="840" y="118" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle">全国測量・地図制作</text>
  <line x1="740" y1="130" x2="940" y2="130" stroke="#60a5fa" stroke-width="1"/>
  <text x="840" y="155" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">17年・40,000kmを歩く</text>
  <text x="840" y="178" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">数十人の隊を指揮</text>
  <text x="840" y="201" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">日本初の精密地図を完成</text>
  <text x="840" y="240" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">→ 明治時代まで使われ続けた</text>

  <!-- Bottom note -->
  <text x="500" y="310" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">「第二のキャリア」は第一の蓄積なしには生まれなかった</text>
</svg>
