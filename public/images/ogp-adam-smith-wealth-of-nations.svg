<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Balance scales -->
  <!-- stand pole -->
  <rect x="587" y="410" width="26" height="115" rx="5" fill="#92400e" opacity="0.75"/>
  <ellipse cx="600" cy="528" rx="100" ry="16" fill="#92400e" opacity="0.45"/>
  <!-- pivot -->
  <circle cx="600" cy="410" r="20" fill="#d97706"/>
  <circle cx="600" cy="410" r="9" fill="#92400e"/>
  <!-- beam (slight tilt: left 12px lower) -->
  <line x1="215" y1="397" x2="985" y2="382" stroke="#92400e" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <!-- left chain -->
  <line x1="298" y1="394" x2="298" y2="462" stroke="#d97706" stroke-width="5" stroke-dasharray="9,5" opacity="0.9"/>
  <!-- right chain -->
  <line x1="902" y1="383" x2="902" y2="445" stroke="#d97706" stroke-width="5" stroke-dasharray="9,5" opacity="0.9"/>
  <!-- left pan (lower) -->
  <path d="M185,462 Q298,476 411,462" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round"/>
  <!-- left coin stack (3) -->
  <ellipse cx="298" cy="460" rx="64" ry="11" fill="#fbbf24" opacity="0.65"/>
  <ellipse cx="298" cy="448" rx="64" ry="11" fill="#fbbf24" opacity="0.78"/>
  <ellipse cx="298" cy="436" rx="64" ry="11" fill="#fde68a" opacity="0.90"/>
  <!-- right pan (higher) -->
  <path d="M789,445 Q902,459 1015,445" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round"/>
  <!-- right coin stack (2) -->
  <ellipse cx="902" cy="443" rx="58" ry="11" fill="#fbbf24" opacity="0.60"/>
  <ellipse cx="902" cy="431" rx="58" ry="11" fill="#fde68a" opacity="0.72"/>
</svg>