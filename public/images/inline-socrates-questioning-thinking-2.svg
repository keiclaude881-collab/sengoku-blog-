<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <!-- 「わかった気」の壁が壊れて本質が見えるイメージ -->
  <!-- 左側：分厚い壁（わかった気） -->
  <rect x="120" y="100" width="72" height="220" rx="6" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="2.5" opacity="0.7"/>
  <text x="156" y="182" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.8">わかった</text>
  <text x="156" y="200" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.8">気になっている</text>
  <text x="156" y="222" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#8b5cf6" text-anchor="middle" opacity="0.65">壁</text>
  <!-- 壁にひびが入っている -->
  <path d="M 192 120 L 184 175 L 196 200 L 180 270" stroke="#6b21a8" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M 178 150 L 168 165 L 182 180" stroke="#6b21a8" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
  <!-- 矢印（問いが壁を壊す） -->
  <path d="M 250 210 L 340 210" stroke="#6b21a8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 332 200 L 346 210 L 332 220" fill="none" stroke="#6b21a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="295" y="198" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.8">問い</text>
  <!-- 右側：本質（光のような円） -->
  <circle cx="580" cy="210" r="90" fill="#f3e8ff" opacity="0.45"/>
  <circle cx="580" cy="210" r="60" fill="#e9d5ff" opacity="0.5"/>
  <circle cx="580" cy="210" r="32" fill="#a855f7" opacity="0.25"/>
  <text x="580" y="206" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.85">本質</text>
  <text x="580" y="228" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#8b5cf6" text-anchor="middle" opacity="0.7">が見えてくる</text>
  <!-- 輝きの線 -->
  <line x1="580" y1="100" x2="580" y2="118" stroke="#a855f7" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="580" y1="302" x2="580" y2="320" stroke="#a855f7" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="666" y1="210" x2="684" y2="210" stroke="#a855f7" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="476" y1="210" x2="458" y2="210" stroke="#a855f7" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="644" y1="146" x2="656" y2="134" stroke="#a855f7" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="516" y1="274" x2="504" y2="286" stroke="#a855f7" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <!-- 右端ラベル -->
  <text x="820" y="210" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#6b21a8" text-anchor="middle" opacity="0.5" letter-spacing="1">無知の知</text>
</svg>
