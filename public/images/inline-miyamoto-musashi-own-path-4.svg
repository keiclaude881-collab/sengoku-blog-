<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf5ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 縦に深く掘り進めると、底で地平が大きく開けるイメージ -->
  <rect x="430" y="60" width="140" height="220" rx="4" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="2"/>
  <rect x="438" y="60" width="124" height="50" rx="2" fill="#e9d5ff"/>
  <rect x="438" y="110" width="124" height="50" rx="2" fill="#d8b4fe"/>
  <rect x="438" y="160" width="124" height="50" rx="2" fill="#c4b5fd"/>
  <rect x="438" y="210" width="124" height="70" rx="2" fill="#9333ea"/>

  <line x1="500" y1="40" x2="500" y2="60" stroke="#6b21a8" stroke-width="3"/>
  <polygon points="500,60 491,44 509,44" fill="#6b21a8"/>

  <!-- 底から横へ広がる地平線 -->
  <ellipse cx="500" cy="330" rx="300" ry="32" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="8,4"/>
  <ellipse cx="500" cy="330" rx="210" ry="20" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="200" y1="330" x2="120" y2="330" stroke="#9333ea" stroke-width="2.5"/>
  <polygon points="120,330 138,322 138,338" fill="#9333ea"/>
  <line x1="800" y1="330" x2="880" y2="330" stroke="#9333ea" stroke-width="2.5"/>
  <polygon points="880,330 862,322 862,338" fill="#9333ea"/>

  <circle cx="500" cy="245" r="10" fill="#ffffff"/>
</svg>
