<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad6)"/>

  <circle cx="1080" cy="130" r="80" fill="#fde68a" opacity="0.4"/>
  <circle cx="120" cy="520" r="70" fill="#fde68a" opacity="0.4"/>

  <!-- large balance scale: book (morals) vs coin (money), perfectly balanced -->
  <g transform="translate(600,300)">
    <!-- stand -->
    <path d="M -16 320 L 16 320 L 6 60 L -6 60 Z" fill="#92400e"/>
    <ellipse cx="0" cy="324" rx="90" ry="16" fill="#78350f"/>
    <circle cx="0" cy="40" r="16" fill="#92400e"/>

    <!-- beam -->
    <rect x="-230" y="32" width="460" height="12" rx="6" fill="#92400e"/>

    <!-- left chain + pan -->
    <line x1="-200" y1="40" x2="-200" y2="110" stroke="#78350f" stroke-width="3"/>
    <line x1="-160" y1="40" x2="-160" y2="110" stroke="#78350f" stroke-width="3"/>
    <path d="M -226 110 Q -180 150 -134 110 L -134 100 Q -180 132 -226 100 Z" fill="#d97706"/>

    <!-- left pan content: open book (morals) -->
    <g transform="translate(-180,80)">
      <path d="M -46 -8 Q 0 -22 46 -8 L 46 14 Q 0 0 -46 14 Z" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
      <line x1="0" y1="-14" x2="0" y2="12" stroke="#92400e" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- right chain + pan -->
    <line x1="200" y1="40" x2="200" y2="110" stroke="#78350f" stroke-width="3"/>
    <line x1="160" y1="40" x2="160" y2="110" stroke="#78350f" stroke-width="3"/>
    <path d="M 134 110 Q 180 150 226 110 L 226 100 Q 180 132 134 100 Z" fill="#d97706"/>

    <!-- right pan content: coin stack (money) -->
    <g transform="translate(180,72)">
      <ellipse cx="0" cy="20" rx="38" ry="11" fill="#92400e"/>
      <rect x="-38" y="2" width="76" height="18" fill="#d97706"/>
      <ellipse cx="0" cy="2" rx="38" ry="11" fill="#f59e0b"/>
      <ellipse cx="0" cy="-12" rx="32" ry="9" fill="#92400e"/>
      <rect x="-32" y="-26" width="64" height="14" fill="#d97706"/>
      <ellipse cx="0" cy="-26" rx="32" ry="9" fill="#fde68a"/>
    </g>
  </g>

  <!-- gentle rays from the fulcrum suggesting harmony -->
  <g stroke="#d97706" stroke-width="2" opacity="0.3">
    <line x1="600" y1="240" x2="560" y2="190"/>
    <line x1="600" y1="240" x2="640" y2="190"/>
  </g>
</svg>
