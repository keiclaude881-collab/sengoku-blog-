<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Jung vs Freud: paths diverging from shared origin (different from adler) -->
  <circle cx="300" cy="248" r="28" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="700" cy="248" r="28" fill="#7c3aed" opacity="0.8"/>
  <!-- Shared center origin -->
  <circle cx="500" cy="248" r="22" fill="#6b21a8" opacity="0.65"/>
  <line x1="478" y1="248" x2="328" y2="248" stroke="#c4b5fd" stroke-width="6"/>
  <line x1="522" y1="248" x2="672" y2="248" stroke="#7c3aed" stroke-width="6"/>
  <!-- Diverging paths continuing -->
  <path d="M 300 248 C 240 220 160 168 100 128" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M 700 248 C 760 208 840 168 920 118" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <!-- Different symbols at end -->
  <!-- Freud: couch/analysis -->
  <rect x="58" y="118" width="80" height="30" rx="5" fill="#c4b5fd" opacity="0.5"/>
  <!-- Jung: mandala/circle -->
  <circle cx="920" cy="98" r="28" fill="none" stroke="#6b21a8" stroke-width="5"/>
  <circle cx="920" cy="98" r="12" fill="#7c3aed" opacity="0.5"/>

</svg>