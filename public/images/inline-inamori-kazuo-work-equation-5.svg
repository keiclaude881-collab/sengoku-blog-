<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Amoeba management: cells dividing and expanding -->
  <circle cx="250" cy="210" r="80" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="250" cy="210" r="80" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Division arrow -->
  <line x1="345" y1="210" x2="425" y2="210" stroke="#1d4ed8" stroke-width="5"/>
  <polyline points="413,198 428,210 413,222" fill="none" stroke="#1d4ed8" stroke-width="5"/>
  <!-- Two daughter cells -->
  <circle cx="540" cy="168" r="60" fill="#bfdbfe" opacity="0.45"/>
  <circle cx="540" cy="168" r="60" fill="none" stroke="#1e40af" stroke-width="5"/>
  <circle cx="540" cy="260" r="60" fill="#bfdbfe" opacity="0.45"/>
  <circle cx="540" cy="260" r="60" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Four granddaughter cells -->
  <line x1="608" y1="168" x2="660" y2="148" stroke="#93c5fd" stroke-width="3"/>
  <line x1="608" y1="168" x2="660" y2="188" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="698" cy="138" r="44" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="698" cy="138" r="44" fill="none" stroke="#1e40af" stroke-width="4"/>
  <circle cx="698" cy="200" r="44" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="698" cy="200" r="44" fill="none" stroke="#1e40af" stroke-width="4"/>
  <line x1="608" y1="260" x2="660" y2="240" stroke="#93c5fd" stroke-width="3"/>
  <line x1="608" y1="260" x2="660" y2="280" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="698" cy="232" r="44" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="698" cy="232" r="44" fill="none" stroke="#1e40af" stroke-width="4"/>
  <circle cx="698" cy="292" r="44" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="698" cy="292" r="44" fill="none" stroke="#1e40af" stroke-width="4"/>

</svg>