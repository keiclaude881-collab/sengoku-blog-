<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>
  <!-- Corinthian helmet (side profile facing right) -->
  <!-- helmet dome -->
  <path d="M 420,460 Q 380,300 420,180 Q 460,80 600,60 Q 740,80 780,180 Q 820,300 780,460 Z"
        fill="#3b82f6" opacity="0.80"/>
  <!-- cheek guards (left side shadow) -->
  <path d="M 420,320 Q 390,370 400,460 L 440,460 Q 440,380 460,330 Z"
        fill="#1e40af" opacity="0.55"/>
  <!-- face opening (cut out) -->
  <path d="M 440,190 Q 440,440 490,460 L 580,460 Q 540,420 520,340 Q 500,260 510,190 Z"
        fill="#eff6ff" opacity="0.90"/>
  <!-- nasal guard -->
  <rect x="592" y="160" width="22" height="240" rx="6" fill="#1e40af" opacity="0.70"/>
  <!-- brow ridge -->
  <path d="M 510,190 Q 560,170 640,175 Q 700,178 740,195" fill="none" stroke="#1e40af" stroke-width="10" opacity="0.55"/>
  <!-- crest/plume (top, flowing back) -->
  <path d="M 600,62 Q 650,30 750,20 Q 850,15 920,50 Q 870,65 780,80 Q 720,88 680,100 Q 640,70 600,62"
        fill="#bfdbfe" opacity="0.80"/>
  <!-- plume feather lines -->
  <g stroke="#93c5fd" stroke-width="2" opacity="0.5">
    <line x1="650" y1="38" x2="660" y2="90"/>
    <line x1="700" y1="28" x2="710" y2="88"/>
    <line x1="750" y1="25" x2="755" y2="82"/>
    <line x1="800" y1="30" x2="800" y2="78"/>
    <line x1="850" y1="40" x2="840" y2="72"/>
  </g>
</svg>