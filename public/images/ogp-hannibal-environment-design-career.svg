<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>
  <!-- Pincer encirclement (Cannae) -->
  <!-- center: enemy force -->
  <circle cx="600" cy="315" r="55" fill="#1e40af" opacity="0.80"/>
  <circle cx="600" cy="315" r="32" fill="#3b82f6" opacity="0.60"/>
  <!-- three encircling arrows (left, right, top) -->
  <!-- left arrow curving right -->
  <path d="M 200,315 C 200,160 420,120 530,280"
        fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
  <polygon points="535,265 512,300 555,298" fill="#3b82f6" opacity="0.85"/>
  <!-- right arrow curving left -->
  <path d="M 1000,315 C 1000,160 780,120 670,280"
        fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
  <polygon points="665,265 688,300 645,298" fill="#3b82f6" opacity="0.85"/>
  <!-- bottom arrow curving up -->
  <path d="M 600,530 C 800,530 850,440 660,375"
        fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round" opacity="0.72"/>
  <polygon points="650,362 675,395 635,392" fill="#60a5fa" opacity="0.82"/>
  <!-- decorative dots for "army units" -->
  <g fill="#bfdbfe" opacity="0.50">
    <circle cx="200" cy="315" r="18"/>
    <circle cx="1000" cy="315" r="18"/>
    <circle cx="600" cy="530" r="18"/>
  </g>
</svg>