<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#g7)"/>
  <circle cx="920" cy="60" r="120" fill="#fde68a" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#fbbf24" opacity="0.3"/>
  
  <!-- circular reinvestment arrows -->
  <circle cx="500" cy="210" r="110" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="20 8" opacity="0.5"/>
  <!-- arrow heads on circle -->
  <polygon points="500,100 488,120 512,120" fill="#d97706" opacity="0.6"/>
  <polygon points="610,210 590,198 590,222" fill="#d97706" opacity="0.6"/>
  <polygon points="500,320 512,300 488,300" fill="#d97706" opacity="0.6"/>
  <polygon points="390,210 410,222 410,198" fill="#d97706" opacity="0.6"/>
  <!-- center coin -->
  <circle cx="500" cy="210" r="55" fill="#fbbf24" opacity="0.5"/>
  <circle cx="500" cy="210" r="35" fill="#92400e" opacity="0.4"/>
  <!-- small coins spinning out -->
  <circle cx="620" cy="120" r="22" fill="#fbbf24" opacity="0.7"/>
  <circle cx="380" cy="300" r="18" fill="#fbbf24" opacity="0.6"/>

