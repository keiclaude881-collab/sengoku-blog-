<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Open scroll/book (Genji Monogatari - world oldest novel) -->
  <!-- scroll body -->
  <rect x="320" y="180" width="560" height="280" rx="8" fill="#dbeafe" opacity="0.75"/>
  <!-- top roller -->
  <ellipse cx="600" cy="180" rx="280" ry="28" fill="#3b82f6" opacity="0.82"/>
  <!-- bottom roller -->
  <ellipse cx="600" cy="460" rx="280" ry="28" fill="#3b82f6" opacity="0.82"/>
  <!-- writing lines on scroll -->
  <g stroke="#1e40af" stroke-width="2.5" opacity="0.30">
    <!-- vertical lines (traditional Japanese writing) -->
    <line x1="740" y1="210" x2="740" y2="450"/>
    <line x1="700" y1="210" x2="700" y2="450"/>
    <line x1="660" y1="210" x2="660" y2="450"/>
    <line x1="620" y1="210" x2="620" y2="450"/>
    <line x1="580" y1="210" x2="580" y2="450"/>
    <line x1="540" y1="210" x2="540" y2="450"/>
    <line x1="500" y1="210" x2="500" y2="450"/>
    <line x1="460" y1="210" x2="460" y2="450"/>
    <line x1="420" y1="210" x2="420" y2="450"/>
    <line x1="380" y1="210" x2="380" y2="450"/>
  </g>
  <!-- decorative brush stroke (calligraphy) -->
  <path d="M 760,230 Q 740,300 745,380 Q 748,420 750,445" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <!-- cherry blossom accent (平安時代) -->
  <g fill="#60a5fa" opacity="0.40">
    <circle cx="900" cy="250" r="18"/>
    <circle cx="925" cy="235" r="14"/>
    <circle cx="875" cy="235" r="14"/>
    <circle cx="930" cy="265" r="14"/>
    <circle cx="870" cy="265" r="14"/>
    <circle cx="900" cy="250" r="8" fill="#bfdbfe" opacity="0.70"/>
  </g>
</svg>