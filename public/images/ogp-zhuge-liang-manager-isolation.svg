<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Feather fan + single chess piece (strategic isolation) -->
  <!-- feather fan body -->
  <path d="M 560,440 A 240,240 0 0,1 800,440 Z" fill="#3b82f6" opacity="0.70"/>
  <!-- fan outer arc -->
  <path d="M 560,440 A 240,240 0 0,1 800,440" fill="none" stroke="#1e40af" stroke-width="8" opacity="0.65"/>
  <!-- fan ribs (radial lines) -->
  <g stroke="#bfdbfe" stroke-width="4" opacity="0.45">
    <line x1="680" y1="440" x2="560" y2="440"/>
    <line x1="680" y1="440" x2="578" y2="344"/>
    <line x1="680" y1="440" x2="617" y2="250"/>
    <line x1="680" y1="440" x2="680" y2="202"/>
    <line x1="680" y1="440" x2="744" y2="250"/>
    <line x1="680" y1="440" x2="783" y2="344"/>
    <line x1="680" y1="440" x2="800" y2="440"/>
  </g>
  <!-- fan handle -->
  <rect x="668" y="430" width="24" height="120" rx="8" fill="#1e40af" opacity="0.82"/>
  <!-- chess piece (advisor, separate) -->
  <rect x="880" y="450" width="80" height="14" rx="4" fill="#3b82f6" opacity="0.75"/>
  <rect x="887" y="400" width="66" height="54" rx="5" fill="#3b82f6" opacity="0.72"/>
  <rect x="890" y="388" width="60" height="16" rx="4" fill="#1e40af" opacity="0.70"/>
  <ellipse cx="920" cy="368" rx="36" ry="26" fill="#3b82f6" opacity="0.70"/>
  <rect x="914" y="338" width="12" height="34" rx="3" fill="#1e40af" opacity="0.80"/>
</svg>