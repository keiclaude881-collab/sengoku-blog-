<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- central figure: the isolated manager -->
  <g transform="translate(600,300)">
    <circle cx="0" cy="-60" r="38" fill="#1e40af"/>
    <path d="M -52 150 C -52 40 -36 10 0 10 C 36 10 52 40 52 150 Z" fill="#1e40af"/>
    <path d="M -30 150 L -38 230 L -12 230 L -6 160 Z" fill="#1e3a8a"/>
    <path d="M 30 150 L 38 230 L 12 230 L 6 160 Z" fill="#1e3a8a"/>
  </g>

  <!-- arrows pointing at/demanding from the central figure -->
  <g stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="200" y1="180" x2="520" y2="280"/>
    <line x1="200" y1="420" x2="520" y2="330"/>
    <line x1="1000" y1="180" x2="680" y2="280"/>
    <line x1="1000" y1="420" x2="680" y2="330"/>
    <line x1="600" y1="80" x2="600" y2="180"/>
  </g>
  <!-- arrowheads -->
  <polygon points="520,280 488,256 490,290" fill="#3b82f6"/>
  <polygon points="520,330 490,320 490,354" fill="#3b82f6"/>
  <polygon points="680,280 710,256 710,290" fill="#3b82f6"/>
  <polygon points="680,330 710,320 710,354" fill="#3b82f6"/>
  <polygon points="600,180 582,148 618,148" fill="#3b82f6"/>

  <!-- small figures at arrow origins -->
  <g fill="#93c5fd" opacity="0.8">
    <circle cx="170" cy="160" r="22"/>
    <circle cx="170" cy="435" r="22"/>
    <circle cx="1030" cy="160" r="22"/>
    <circle cx="1030" cy="435" r="22"/>
    <circle cx="600" cy="52" r="22"/>
  </g>

  <!-- isolation circle around center figure -->
  <circle cx="600" cy="300" r="130" fill="none" stroke="#bfdbfe" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- background dots suggesting chaos -->
  <g fill="#bfdbfe" opacity="0.4">
    <circle cx="100" cy="100" r="8"/>
    <circle cx="320" cy="60" r="6"/>
    <circle cx="900" cy="80" r="7"/>
    <circle cx="1100" cy="150" r="9"/>
    <circle cx="80" cy="560" r="6"/>
    <circle cx="1150" cy="540" r="8"/>
  </g>
</svg>
