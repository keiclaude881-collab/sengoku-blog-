<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <defs>
    <marker id="arrowGray2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">「投資の種銭がない」を、どう乗り越えるか</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Row 1: よくある思い込み -->
  <text x="40" y="92" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#9ca3af">よくある思い込み</text>

  <rect x="40" y="105" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="110" y="146" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#57534e" text-anchor="middle">投資の元手</text>

  <line x1="184" y1="140" x2="226" y2="140" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrowGray2)"/>

  <rect x="230" y="105" width="190" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="325" y="146" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">まとまったお金がない</text>

  <line x1="424" y1="140" x2="466" y2="140" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrowGray2)"/>

  <rect x="470" y="105" width="180" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="560" y="146" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">だから投資は無理…</text>

  <!-- Row 2: ウォーカーの実践 -->
  <text x="40" y="222" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#b45309">マダム・ウォーカーの実践</text>

  <rect x="40" y="235" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="110" y="266" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">自分の経験・</text>
  <text x="110" y="286" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">悩み</text>

  <line x1="184" y1="270" x2="226" y2="270" stroke="#d97706" stroke-width="3" marker-end="url(#arrowAmber)"/>

  <rect x="230" y="218" width="200" height="104" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="330" y="262" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">商品・サービス化</text>
  <text x="330" y="284" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">↑ まずは小さく副業から</text>

  <line x1="434" y1="270" x2="476" y2="270" stroke="#d97706" stroke-width="3" marker-end="url(#arrowAmber)"/>

  <rect x="480" y="235" width="190" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="575" y="266" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">収入が生まれ、</text>
  <text x="575" y="286" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">一部を投資へ</text>

  <!-- caption -->
  <text x="335" y="365" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#78716c" text-anchor="middle">「お金」より先に、「経験」が投資先になる</text>

  <!-- Right side: explanation box -->
  <rect x="650" y="80" width="310" height="280" rx="8" fill="none" stroke="#e8e0d4" stroke-width="1.5"/>
  <text x="805" y="115" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">ウォーカーの思考法</text>
  <line x1="670" y1="128" x2="940" y2="128" stroke="#e8e0d4" stroke-width="1"/>

  <circle cx="675" cy="160" r="5" fill="#92400e"/>
  <text x="690" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">お金がなくても、経験やスキルは誰にでもある</text>

  <circle cx="675" cy="198" r="5" fill="#92400e"/>
  <text x="690" y="203" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">自分の悩みを解決した経験は、誰かの役にも立つ</text>

  <circle cx="675" cy="236" r="5" fill="#92400e"/>
  <text x="690" y="241" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">それを「仕組み」にすれば、繰り返し収入を生む</text>

  <circle cx="675" cy="274" r="5" fill="#92400e"/>
  <text x="690" y="279" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#1c1917">生まれた収入の一部が、次の「投資の種銭」になる</text>

  <!-- Bottom quote -->
  <text x="500" y="405" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85" font-style="italic">「チャンスは待つものではない。自分の手でつくるものだ」</text>
</svg>
