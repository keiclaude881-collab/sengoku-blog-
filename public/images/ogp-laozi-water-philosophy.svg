<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="lwBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#lwBg)"/>

  <!-- mountain/rock obstacles the water must move around -->
  <polygon points="280,460 360,280 440,460" fill="#e9d5ff"/>
  <polygon points="560,490 630,330 700,490" fill="#e9d5ff"/>
  <polygon points="800,460 870,310 940,460" fill="#e9d5ff"/>

  <!-- source spring at top left -->
  <circle cx="140" cy="120" r="36" fill="#9333ea"/>
  <circle cx="140" cy="120" r="50" fill="#c084fc" opacity="0.4"/>

  <!-- flowing water path winding around every obstacle, finally pooling at bottom right -->
  <path d="M 140 156 C 170 220, 250 250, 300 320 C 350 390, 430 380, 470 320
           C 510 260, 590 290, 630 360 C 670 430, 750 410, 790 350
           C 830 290, 900 320, 940 390 C 980 460, 1040 470, 1070 520"
        fill="none" stroke="#9333ea" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
  <path d="M 140 156 C 170 220, 250 250, 300 320 C 350 390, 430 380, 470 320
           C 510 260, 590 290, 630 360 C 670 430, 750 410, 790 350
           C 830 290, 900 320, 940 390 C 980 460, 1040 470, 1070 520"
        fill="none" stroke="#d8b4fe" stroke-width="7" stroke-linecap="round"/>

  <!-- gentle ripple marks along the flow -->
  <circle cx="320" cy="345" r="6" fill="#e9d5ff"/>
  <circle cx="640" cy="380" r="6" fill="#e9d5ff"/>
  <circle cx="800" cy="365" r="6" fill="#e9d5ff"/>

  <!-- final calm pool, large and wide, gathering everything -->
  <ellipse cx="1010" cy="560" rx="220" ry="48" fill="#9333ea" opacity="0.9"/>
  <ellipse cx="1010" cy="552" rx="220" ry="40" fill="#c084fc" opacity="0.5"/>
  <ellipse cx="1010" cy="546" rx="150" ry="26" fill="#e9d5ff" opacity="0.6"/>

  <!-- a few bamboo-like flexible reeds near the pool, bending but not breaking -->
  <g stroke="#7e22ce" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 1140 560 C 1150 500, 1130 460, 1145 410"/>
    <path d="M 1175 565 C 1185 510, 1165 470, 1182 425"/>
  </g>
</svg>
