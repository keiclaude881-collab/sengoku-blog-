<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">チャーチルの「戦略的休息」サイクル</text>

  <!-- Left circle: 仕事 -->
  <circle cx="300" cy="215" r="110" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="300" y="198" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">仕事</text>
  <text x="300" y="220" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">（深い集中）</text>
  <text x="300" y="244" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">・戦時の意思決定</text>
  <text x="300" y="262" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">・演説の準備</text>
  <text x="300" y="280" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">・著述活動</text>

  <!-- Right circle: 休息 -->
  <circle cx="700" cy="215" r="110" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="700" y="198" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">休息</text>
  <text x="700" y="220" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">（意図的な切替）</text>
  <text x="700" y="244" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">・昼寝（30分）</text>
  <text x="700" y="262" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">・絵画（趣味）</text>
  <text x="700" y="280" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">・読書・散歩</text>

  <!-- Arrows between circles -->
  <path d="M 415 185 C 460 150 540 150 585 185" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="581,174 597,186 582,196" fill="#92400e"/>
  <text x="500" y="148" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">切替</text>

  <path d="M 585 245 C 540 280 460 280 415 245" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="419,234 403,246 418,256" fill="#d97706"/>
  <text x="500" y="295" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">回復</text>

  <!-- Result arrow pointing right -->
  <line x1="840" y1="215" x2="910" y2="215" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="906,206 922,215 906,224" fill="#f59e0b"/>
  <text x="875" y="202" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">生産性</text>
  <text x="875" y="238" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">向上</text>

  <!-- Caption -->
  <text x="500" y="370" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" letter-spacing="1">「働き続けること」より「切り替えること」が思考の質を上げる</text>
  <text x="500" y="395" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" opacity="0.8">チャーチルは昼寝と絵画で脳をリセットし、連日の激務を乗り越えた</text>
</svg>
