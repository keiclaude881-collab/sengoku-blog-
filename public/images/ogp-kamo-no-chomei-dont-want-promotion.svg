<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgG)"/>
  <circle cx="120" cy="540" r="80" fill="#ddd6fe" opacity="0.45"/>
  <circle cx="1080" cy="100" r="60" fill="#ddd6fe" opacity="0.45"/>

  <!-- Small hermit hut (方丈記 — one-square hut) centered -->
  <!-- Roof -->
  <polygon points="600,180 730,320 470,320" fill="#7c3aed" opacity="0.85"/>
  <!-- Walls -->
  <rect x="485" y="320" width="230" height="150" fill="none" stroke="#6b21a8" stroke-width="7" rx="3"/>
  <rect x="485" y="320" width="230" height="150" fill="#e9d5ff" opacity="0.4"/>
  <!-- Door -->
  <rect x="560" y="390" width="80" height="80" fill="none" stroke="#6b21a8" stroke-width="6" rx="3"/>
  <!-- Small window -->
  <rect x="503" y="340" width="45" height="40" fill="none" stroke="#6b21a8" stroke-width="4" rx="2"/>
  
  <!-- Career ladder on right side — deliberately left behind (faded/tilted away) -->
  <g opacity="0.35" transform="translate(810,140) rotate(15)">
    <line x1="0" y1="0" x2="0" y2="280" stroke="#9333ea" stroke-width="8"/>
    <line x1="80" y1="0" x2="80" y2="280" stroke="#9333ea" stroke-width="8"/>
    <line x1="0" y1="60" x2="80" y2="60" stroke="#9333ea" stroke-width="6"/>
    <line x1="0" y1="120" x2="80" y2="120" stroke="#9333ea" stroke-width="6"/>
    <line x1="0" y1="180" x2="80" y2="180" stroke="#9333ea" stroke-width="6"/>
    <line x1="0" y1="240" x2="80" y2="240" stroke="#9333ea" stroke-width="6"/>
  </g>
  
  <!-- Willow/tree branches on left — nature, simplicity -->
  <line x1="310" y1="480" x2="310" y2="210" stroke="#6b21a8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 310 240 C 350 270 380 290 360 340" fill="none" stroke="#9333ea" stroke-width="5" opacity="0.55"/>
  <path d="M 310 260 C 270 290 250 320 270 360" fill="none" stroke="#9333ea" stroke-width="5" opacity="0.55"/>
  <path d="M 310 290 C 350 310 370 340 345 380" fill="none" stroke="#9333ea" stroke-width="4" opacity="0.45"/>
  <path d="M 310 310 C 275 325 260 355 280 395" fill="none" stroke="#9333ea" stroke-width="4" opacity="0.45"/>
  
  <!-- Moon (peaceful night/solitude) -->
  <circle cx="950" cy="200" r="70" fill="#e9d5ff" opacity="0.6"/>
  <circle cx="982" cy="185" r="58" fill="#ede9fe" opacity="0.95"/>
</svg>