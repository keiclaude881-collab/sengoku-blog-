  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Buffett + Munger partnership: two figures together, stronger -->
  <circle cx="380" cy="198" r="38" fill="#c4b5fd" opacity="0.7"/>
  <rect x="344" y="236" width="72" height="100" rx="8" fill="#c4b5fd" opacity="0.6"/>
