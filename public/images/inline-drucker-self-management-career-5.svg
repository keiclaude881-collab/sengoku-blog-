<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Self-management wheel: 3 sectors rotating -->
  <circle cx="500" cy="210" r="160" fill="#bfdbfe" opacity="0.3"/>
  <circle cx="500" cy="210" r="160" fill="none" stroke="#1e40af" stroke-width="5"/>
  <circle cx="500" cy="210" r="60" fill="#1e40af" opacity="0.6"/>
  <!-- 3 sectors -->
  <path d="M 500 210 L 500 50 A 160 160 0 0 1 658 302 Z" fill="#1e40af" opacity="0.3"/>
  <path d="M 500 210 L 658 302 A 160 160 0 0 1 342 302 Z" fill="#1d4ed8" opacity="0.25"/>
  <path d="M 500 210 L 342 302 A 160 160 0 0 1 500 50 Z" fill="#93c5fd" opacity="0.3"/>
  <!-- Sector dividers -->
  <line x1="500" y1="210" x2="500" y2="50" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="500" y1="210" x2="658" y2="302" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="500" y1="210" x2="342" y2="302" stroke="#1d4ed8" stroke-width="3"/>

</svg>