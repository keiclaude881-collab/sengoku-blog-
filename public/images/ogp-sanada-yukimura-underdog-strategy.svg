<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Small triangle vs large mountain (underdog strategy) -->
  <!-- large mountain (giant / Tokugawa) -->
  <polygon points="750,500 1100,500 925,140" fill="#1e40af" opacity="0.50"/>
  <polygon points="780,500 1070,500 925,190" fill="#3b82f6" opacity="0.30"/>
  <!-- small hero triangle (Sanada / underdog) -->
  <polygon points="280,480 420,480 350,300" fill="#1e40af" opacity="0.85"/>
  <!-- bold arrow from small to large (attacking upward) -->
  <path d="M 420,390 Q 580,300 720,310" fill="none" stroke="#60a5fa" stroke-width="10" opacity="0.75"/>
  <polygon points="732,310 698,292 698,328" fill="#60a5fa" opacity="0.80"/>
  <!-- local concentration lines (局所的優位) -->
  <g stroke="#bfdbfe" stroke-width="5" opacity="0.40">
    <line x1="340" y1="390" x2="280" y2="430"/>
    <line x1="340" y1="390" x2="380" y2="440"/>
  </g>
</svg>