<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Anchor -->
  <!-- ring at top -->
  <circle cx="600" cy="148" r="56" fill="none" stroke="#d97706" stroke-width="22" opacity="0.9"/>
  <!-- horizontal stock (across top of shank) -->
  <rect x="490" y="200" width="220" height="20" rx="6" fill="#92400e" opacity="0.82"/>
  <!-- shank (vertical center bar) -->
  <rect x="589" y="196" width="22" height="296" rx="5" fill="#92400e" opacity="0.85"/>
  <!-- left arm -->
  <path d="M598,490 Q500,525 455,498" fill="none" stroke="#92400e" stroke-width="22" stroke-linecap="round"/>
  <!-- right arm -->
  <path d="M602,490 Q700,525 745,498" fill="none" stroke="#92400e" stroke-width="22" stroke-linecap="round"/>
  <!-- left fluke -->
  <ellipse cx="443" cy="488" rx="32" ry="20" fill="#d97706" opacity="0.85" transform="rotate(-30 443 488)"/>
  <!-- right fluke -->
  <ellipse cx="757" cy="488" rx="32" ry="20" fill="#d97706" opacity="0.85" transform="rotate(30 757 488)"/>
  <!-- chain at top of ring -->
  <line x1="600" y1="88" x2="600" y2="60" stroke="#d97706" stroke-width="12" stroke-dasharray="10,7" opacity="0.5"/>
</svg>