<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- bank building (center) -->
  <!-- columns -->
  <g fill="#78350f" opacity="0.6">
    <rect x="340" y="200" width="30" height="250"/>
    <rect x="410" y="200" width="30" height="250"/>
    <rect x="480" y="200" width="30" height="250"/>
    <rect x="690" y="200" width="30" height="250"/>
    <rect x="760" y="200" width="30" height="250"/>
    <rect x="830" y="200" width="30" height="250"/>
  </g>
  <!-- pediment (triangular roof) -->
  <polygon points="300,200 600,120 900,200" fill="url(#vaultGrad)" opacity="0.75"/>
  <!-- frieze (horizontal band under pediment) -->
  <rect x="300" y="195" width="600" height="18" fill="#78350f" opacity="0.6"/>
  <!-- stylobate (base steps) -->
  <rect x="280" y="450" width="640" height="20" rx="2" fill="#92400e" opacity="0.5"/>
  <rect x="260" y="470" width="680" height="18" rx="2" fill="#78350f" opacity="0.4"/>
  <rect x="240" y="488" width="720" height="16" rx="2" fill="#92400e" opacity="0.35"/>

  <!-- vault door (center of bank) -->
  <rect x="520" y="290" width="160" height="160" rx="8" fill="url(#vaultGrad)" opacity="0.9"/>
  <!-- door frame -->
  <rect x="514" y="284" width="172" height="172" rx="10" fill="none" stroke="#d97706" stroke-width="5" opacity="0.6"/>
  <!-- door dial (combination lock) -->
  <circle cx="600" cy="370" r="40" fill="url(#doorGrad)" opacity="0.85"/>
  <circle cx="600" cy="370" r="30" fill="#92400e" opacity="0.6"/>
  <circle cx="600" cy="370" r="6" fill="#fbbf24" opacity="0.9"/>
  <!-- dial tick marks -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.5">
    <line x1="600" y1="333" x2="600" y2="340"/>
    <line x1="600" y1="400" x2="600" y2="407"/>
    <line x1="563" y1="370" x2="570" y2="370"/>
    <line x1="630" y1="370" x2="637" y2="370"/>
    <line x1="574" y1="344" x2="579" y2="349"/>
    <line x1="621" y1="391" x2="626" y2="396"/>
    <line x1="574" y1="396" x2="579" y2="391"/>
    <line x1="621" y1="349" x2="626" y2="344"/>
  </g>
  <!-- door handle bars -->
  <g fill="#d97706" opacity="0.7">
    <rect x="530" y="290" width="12" height="160" rx="3"/>
    <rect x="658" y="290" width="12" height="160" rx="3"/>
    <rect x="520" y="290" width="160" height="12" rx="3"/>
    <rect x="520" y="438" width="160" height="12" rx="3"/>
  </g>

  <!-- left side: falling graph / panic indicator -->
  <g transform="translate(120, 180)">
    <!-- graph area -->
    <rect x="0" y="0" width="160" height="120" rx="6" fill="#fef3c7" opacity="0.5"/>
    <!-- falling line -->
    <polyline points="10,20 40,35 70,60 100,90 130,110 155,115"
              fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <!-- dots on line -->
    <g fill="#dc2626" opacity="0.65">
      <circle cx="10" cy="20" r="4"/>
      <circle cx="70" cy="60" r="4"/>
      <circle cx="155" cy="115" r="4"/>
    </g>
    <!-- label -->
    <text x="80" y="-12" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold" opacity="0.7">1907年 恐慌</text>
  </g>

  <!-- right side: coin stack (reserve/capital) -->
  <g transform="translate(1000, 300)">
    <!-- base platform -->
    <ellipse cx="0" cy="30" rx="65" ry="16" fill="#92400e" opacity="0.4"/>
    <!-- coin stack layers -->
    <rect x="-60" y="-110" width="120" height="140" fill="url(#coinGrad)" opacity="0.7"/>
    <ellipse cx="0" cy="-110" rx="60" ry="15" fill="#fbbf24" opacity="0.9"/>
    <ellipse cx="0" cy="-70" rx="60" ry="15" fill="#fde68a" opacity="0.5"/>
    <ellipse cx="0" cy="-30" rx="60" ry="15" fill="#fbbf24" opacity="0.6"/>
    <!-- second taller stack behind -->
    <rect x="-45" y="-160" width="90" height="60" fill="#d97706" opacity="0.5"/>
    <ellipse cx="0" cy="-160" rx="45" ry="12" fill="#fbbf24" opacity="0.7"/>
    <!-- "信頼資本" label -->
    <text x="0" y="-185" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold" opacity="0.75">信頼資本</text>
  </g>

  <!-- stability arrows (upward, center-left) -->
  <g stroke="#d97706" stroke-width="3" fill="none" opacity="0.35">
    <line x1="200" y1="400" x2="200" y2="340"/>
    <polygon points="200,340 192,362 208,362" fill="#d97706"/>
    <line x1="240" y1="420" x2="240" y2="350"/>
    <polygon points="240,350 232,372 248,372" fill="#d97706"/>
    <line x1="280" y1="410" x2="280" y2="345"/>
    <polygon points="280,345 272,367 288,367" fill="#d97706"/>
  </g>

  <!-- year badge -->
  <rect x="440" y="500" width="320" height="58" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="600" y="525" text-anchor="middle" font-size="14" fill="#92400e" opacity="0.6">民間銀行家が一人で止めた</text>
  <text x="600" y="548" text-anchor="middle" font-size="20" fill="#92400e" font-weight="bold" opacity="0.75">1907年 金融パニック</text>

  <!-- decorative background elements -->
  <g fill="#fde68a" opacity="0.2">
    <circle cx="100" cy="550" r="55"/>
    <circle cx="1100" cy="100" r="50"/>
    <circle cx="1060" cy="80" r="30"/>
  </g>

  <!-- subtle title line -->
  <line x1="60" y1="580" x2="320" y2="580" stroke="#d97706" stroke-width="2" opacity="0.2"/>
  <line x1="880" y1="580" x2="1140" y2="580" stroke="#d97706" stroke-width="2" opacity="0.2"/>
</svg>
