<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 「目的」が先にあり、そこから手段が決まる逆算図 -->

  <!-- Title -->
  <text x="500" y="42" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">「目的」が先——逆算思考でお金を動かす</text>
  <line x1="100" y1="58" x2="900" y2="58" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Most people approach: left to right (bottom-up) -->
  <!-- Label -->
  <text x="250" y="92" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700">一般的な考え方</text>

  <rect x="60" y="108" width="140" height="48" rx="6" fill="#e8e0d4" opacity="0.8"/>
  <text x="130" y="133" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#78716c" text-anchor="middle">お金を稼ぐ</text>
  <text x="130" y="150" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#78716c" text-anchor="middle">とりあえず働く</text>

  <path d="M 202 132 L 238 132" fill="none" stroke="#78716c" stroke-width="2"/>
  <polygon points="234,126 248,132 234,138" fill="#78716c"/>

  <rect x="250" y="108" width="140" height="48" rx="6" fill="#e8e0d4" opacity="0.8"/>
  <text x="320" y="133" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#78716c" text-anchor="middle">少し貯める</text>
  <text x="320" y="150" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#78716c" text-anchor="middle">余ったら貯蓄</text>

  <path d="M 392 132 L 428 132" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="424,126 438,132 424,138" fill="#78716c" opacity="0.5"/>

  <rect x="440" y="108" width="140" height="48" rx="6" fill="#e8e0d4" opacity="0.5"/>
  <text x="510" y="133" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#78716c" text-anchor="middle" opacity="0.6">目的を考える</text>
  <text x="510" y="150" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#78716c" text-anchor="middle" opacity="0.6">老後…いつか…？</text>

  <!-- X mark -->
  <text x="510" y="180" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#78716c" text-anchor="middle" opacity="0.5">目的が曖昧→習慣が崩れやすい</text>

  <!-- Rockefeller approach: right to left (top-down) -->
  <text x="750" y="92" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">ロックフェラーの考え方</text>

  <!-- Goal box at top right -->
  <rect x="640" y="108" width="310" height="58" rx="6" fill="#92400e" opacity="0.85"/>
  <text x="795" y="133" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">① 目的を先に決める</text>
  <text x="795" y="156" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">「寄付で社会をよくする」「教育を広める」</text>

  <!-- Down arrow -->
  <path d="M 795 168 L 795 200" fill="none" stroke="#92400e" stroke-width="2.5"/>
  <polygon points="787,196 795,212 803,196" fill="#92400e"/>

  <rect x="640" y="212" width="310" height="52" rx="6" fill="#b45309" opacity="0.7"/>
  <text x="795" y="235" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">② 必要な額を逆算する</text>
  <text x="795" y="255" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">「いつまでにいくら必要か」</text>

  <path d="M 795 266 L 795 298" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <polygon points="787,294 795,310 803,294" fill="#b45309"/>

  <rect x="640" y="310" width="310" height="52" rx="6" fill="#d97706" opacity="0.65"/>
  <text x="795" y="333" font-family="'Hiragino Sans', sans-serif" font-size="14" font-weight="700" fill="#faf7f2" text-anchor="middle">③ 月の積立比率を決める</text>
  <text x="795" y="353" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#faf7f2" text-anchor="middle">「収入の10%を今日から始める」</text>

  <!-- Bracket showing "逆算" -->
  <path d="M 630 136 Q 610 230 630 362" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="592" y="255" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">逆</text>
  <text x="592" y="272" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">算</text>

  <!-- Divider between two sides -->
  <line x1="500" y1="75" x2="500" y2="380" stroke="#e8e0d4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Bottom label -->
  <text x="500" y="400" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85">「何のために稼ぐか」が決まっていれば、お金は迷わず動く</text>
</svg>
