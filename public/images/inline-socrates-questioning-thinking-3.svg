<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <!-- 浅い問いと深い問いの対比図 -->
  <!-- 中央の分割線 -->
  <line x1="500" y1="60" x2="500" y2="360" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/>
  <!-- 左側：浅い問い -->
  <text x="250" y="100" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="middle" opacity="0.75" letter-spacing="1">浅い問い</text>
  <!-- 浅い矢印（短く・水平） -->
  <path d="M 160" y="148" stroke="#a855f7" stroke-width="2.5" opacity="0.6"/>
  <line x1="160" y1="150" x2="320" y2="150" stroke="#a855f7" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
  <path d="M 312 143 L 325 150 L 312 157" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <text x="240" y="136" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#8b5cf6" text-anchor="middle" opacity="0.65">どうすれば売れるか</text>
  <line x1="160" y1="200" x2="300" y2="200" stroke="#a855f7" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
  <path d="M 293 194 L 305 200 L 293 206" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <text x="232" y="186" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#8b5cf6" text-anchor="middle" opacity="0.55">どう改善するか</text>
  <line x1="160" y1="248" x2="280" y2="248" stroke="#a855f7" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M 273 242 L 284 248 L 273 254" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <text x="220" y="236" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#8b5cf6" text-anchor="middle" opacity="0.45">どのツールを使うか</text>
  <!-- 浅い象徴：波紋なし -->
  <circle cx="240" cy="310" r="22" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
  <text x="240" y="315" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle" opacity="0.5">手段</text>
  <!-- 右側：深い問い -->
  <text x="750" y="100" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" opacity="0.85" letter-spacing="1">深い問い</text>
  <!-- 深い矢印（長く・斜め下） -->
  <path d="M 560 130 L 720 160" stroke="#6b21a8" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M 710 153 L 724 163 L 714 172" fill="none" stroke="#6b21a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <text x="648" y="132" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" opacity="0.75">なぜ売れないのか</text>
  <path d="M 560 185 L 740 225" stroke="#6b21a8" stroke-width="3" opacity="0.65" stroke-linecap="round"/>
  <path d="M 730 217 L 744 228 L 733 237" fill="none" stroke="#6b21a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <text x="655" y="187" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" opacity="0.68">何が本当の問題か</text>
  <path d="M 560 245 L 760 295" stroke="#6b21a8" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
  <path d="M 750 286 L 764 298 L 752 306" fill="none" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <text x="668" y="248" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" opacity="0.58">なぜ相手は動かないか</text>
  <!-- 深い象徴：波紋あり -->
  <circle cx="750" cy="340" r="36" fill="none" stroke="#6b21a8" stroke-width="2" opacity="0.25"/>
  <circle cx="750" cy="340" r="22" fill="none" stroke="#6b21a8" stroke-width="2.5" opacity="0.5"/>
  <circle cx="750" cy="340" r="10" fill="#6b21a8" opacity="0.35"/>
  <text x="750" y="344" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#faf7ff" text-anchor="middle" opacity="0.9">本質</text>
</svg>
