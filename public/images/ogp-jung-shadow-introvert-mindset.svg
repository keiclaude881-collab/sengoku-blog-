<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#ddd6fe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#ddd6fe" opacity="0.12"/>
  <!-- Split circle: light (persona) vs dark (shadow) -->
  <!-- full circle base -->
  <circle cx="600" cy="315" r="240" fill="#f3e8ff" opacity="0.90"/>
  <!-- dark half (shadow, right side) -->
  <path d="M 600,75 A 240,240 0 0,1 600,555 L 600,75 Z" fill="#3b0764" opacity="0.80"/>
  <!-- dividing line -->
  <line x1="600" y1="72" x2="600" y2="558" stroke="#ddd6fe" stroke-width="6" opacity="0.60"/>
  <!-- circle border -->
  <circle cx="600" cy="315" r="240" fill="none" stroke="#8b5cf6" stroke-width="10" opacity="0.55"/>
  <!-- light side: small sun/circle (consciousness) -->
  <circle cx="490" cy="280" r="48" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="490" cy="280" r="28" fill="#8b5cf6" opacity="0.45"/>
  <!-- dark side: small moon (unconscious shadow) -->
  <path d="M 705,355 A 35,35 0 1,0 705,286 A 24,24 0 1,1 705,355 Z" fill="#ddd6fe" opacity="0.50"/>
</svg>