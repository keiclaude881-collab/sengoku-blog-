<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#fffbeb" rx="12"/>
  <rect x="0" y="0" width="1000" height="420" rx="12" fill="none" stroke="#fde68a" stroke-width="1.5"/>

  <text x="500" y="36" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">渋沢栄一が関与した主要事業——500社の「ネットワーク投資」</text>

  <!-- Center node -->
  <circle cx="500" cy="210" r="52" fill="#d97706"/>
  <text x="500" y="200" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">渋沢</text>
  <text x="500" y="220" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">栄一</text>

  <!-- Spoke lines to 8 companies -->
  <!-- Top -->
  <line x1="500" y1="158" x2="500" y2="88" stroke="#fde68a" stroke-width="2"/>
  <!-- Top-right -->
  <line x1="537" y1="172" x2="620" y2="108" stroke="#fde68a" stroke-width="2"/>
  <!-- Right -->
  <line x1="552" y1="210" x2="680" y2="210" stroke="#fde68a" stroke-width="2"/>
  <!-- Bottom-right -->
  <line x1="537" y1="248" x2="620" y2="318" stroke="#fde68a" stroke-width="2"/>
  <!-- Bottom -->
  <line x1="500" y1="262" x2="500" y2="330" stroke="#fde68a" stroke-width="2"/>
  <!-- Bottom-left -->
  <line x1="463" y1="248" x2="380" y2="318" stroke="#fde68a" stroke-width="2"/>
  <!-- Left -->
  <line x1="448" y1="210" x2="320" y2="210" stroke="#fde68a" stroke-width="2"/>
  <!-- Top-left -->
  <line x1="463" y1="172" x2="380" y2="108" stroke="#fde68a" stroke-width="2"/>

  <!-- Company nodes -->
  <!-- Top: 第一国立銀行 -->
  <rect x="415" y="52" width="170" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="72" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">第一国立銀行（1873）</text>
  <text x="500" y="90" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">💰 日本初の近代銀行</text>

  <!-- Top-right: 王子製紙 -->
  <rect x="615" y="72" width="150" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="690" y="92" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">王子製紙（1873）</text>
  <text x="690" y="110" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">📄 出版・印刷を支える</text>

  <!-- Right: 東京海上保険 -->
  <rect x="680" y="188" width="165" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="762" y="208" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">東京海上保険（1879）</text>
  <text x="762" y="226" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">🛡 リスク管理の基盤</text>

  <!-- Bottom-right: 大阪紡績 -->
  <rect x="618" y="304" width="150" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="693" y="324" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">大阪紡績（1882）</text>
  <text x="693" y="342" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">🧵 産業革命の繊維業</text>

  <!-- Bottom: 日本郵船 -->
  <rect x="415" y="330" width="170" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="350" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">日本郵船（1885）</text>
  <text x="500" y="368" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">🚢 海外貿易の物流</text>

  <!-- Bottom-left: 東京ガス -->
  <rect x="232" y="304" width="150" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="307" y="324" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">東京ガス（1885）</text>
  <text x="307" y="342" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">🔥 都市インフラ整備</text>

  <!-- Left: 帝国ホテル -->
  <rect x="155" y="188" width="165" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="237" y="208" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">帝国ホテル（1887）</text>
  <text x="237" y="226" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">🏨 国際都市・東京へ</text>

  <!-- Top-left: 東京証券取引所 -->
  <rect x="232" y="72" width="155" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="92" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">東京株式取引所（1878）</text>
  <text x="310" y="110" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">📈 資本市場の整備</text>
</svg>
