<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf7f2"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#92400e"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="172" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="146" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="2">キャリア・副業</text>

  <!-- Main title -->
  <text x="60" y="180" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="44" font-weight="700" fill="#1c1917" letter-spacing="-1">「やってみせ、言って聞かせて」</text>
  <text x="60" y="238" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="44" font-weight="700" fill="#1c1917" letter-spacing="-1">山本五十六の部下育成術</text>

  <!-- Subtitle -->
  <text x="60" y="298" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="26" fill="#b45309" letter-spacing="1">人を動かし、人を育てる3原則</text>

  <!-- Divider line -->
  <line x1="60" y1="332" x2="680" y2="332" stroke="#e8e0d4" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="372" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="17" fill="#78716c" letter-spacing="0.5">「ほめてやらねば、人は動かじ」</text>
  <text x="60" y="400" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="17" fill="#78716c" letter-spacing="0.5">現代マネジャーに直結する育成の技術。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#b45309" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: Leader + team members -->
  <!-- Background box -->
  <rect x="780" y="90" width="370" height="340" rx="10" fill="#fef3c7" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Ground line -->
  <line x1="810" y1="390" x2="1120" y2="390" stroke="#e8e0d4" stroke-width="1.5"/>

  <!-- Leader (large, front) -->
  <circle cx="855" cy="260" r="28" fill="#92400e" opacity="0.9"/>
  <path d="M 828 300 Q 855 278 882 300 L 886 390 L 824 390 Z" fill="#92400e" opacity="0.85"/>
  <circle cx="855" cy="224" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
  <text x="855" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">リーダー</text>

  <!-- Team member 1 -->
  <circle cx="960" cy="268" r="20" fill="#b45309" opacity="0.7"/>
  <path d="M 940 298 Q 960 280 980 298 L 983 390 L 937 390 Z" fill="#b45309" opacity="0.65"/>
  <text x="960" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">部下①</text>

  <!-- Team member 2 -->
  <circle cx="1060" cy="272" r="20" fill="#b45309" opacity="0.55"/>
  <path d="M 1040 302 Q 1060 284 1080 302 L 1083 390 L 1037 390 Z" fill="#b45309" opacity="0.5"/>
  <text x="1060" y="425" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">部下②</text>

  <!-- Direction arrow -->
  <path d="M 840 170 C 920 150 1020 148 1110 155" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-dasharray="8 5" stroke-linecap="round"/>
  <polygon points="1106,146 1120,157 1107,167" fill="#f59e0b"/>

  <!-- Caption inside box -->
  <text x="965" y="460" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">見せて・させて・ほめる</text>
</svg>
