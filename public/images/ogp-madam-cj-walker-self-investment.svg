<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="cwBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cwBg)"/>

  <!-- single seed at the bottom left, the modest starting "capital" (her own experience) -->
  <ellipse cx="160" cy="520" rx="22" ry="30" fill="#92400e"/>

  <!-- a stem growing upward and branching into many nodes, representing growth from self into a network -->
  <path d="M 160 492 C 160 420, 200 380, 260 340" stroke="#92400e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 260 340 C 320 300, 360 320, 420 280" stroke="#92400e" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 260 340 C 300 300, 280 250, 320 210" stroke="#92400e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 420 280 C 480 250, 540 260, 600 220" stroke="#92400e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 420 280 C 460 320, 520 320, 570 350" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 600 220 C 660 190, 720 200, 780 170" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 600 220 C 650 250, 700 250, 750 280" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 780 170 C 830 150, 880 160, 930 140" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 780 170 C 820 200, 870 200, 920 230" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 750 280 C 800 300, 850 290, 900 320" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- growing circular nodes at each branch tip, symbolizing the thousands of women in her network -->
  <circle cx="320" cy="210" r="16" fill="#f59e0b"/>
  <circle cx="570" cy="350" r="16" fill="#f59e0b"/>
  <circle cx="750" cy="280" r="18" fill="#f59e0b"/>
  <circle cx="930" cy="140" r="20" fill="#d97706"/>
  <circle cx="920" cy="230" r="18" fill="#d97706"/>
  <circle cx="900" cy="320" r="18" fill="#d97706"/>
  <circle cx="1010" cy="170" r="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <circle cx="1000" cy="260" r="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <circle cx="1040" cy="320" r="12" fill="#fde68a" stroke="#92400e" stroke-width="2"/>

  <!-- larger glowing sun-like center near the top, representing the wealth and light that emerged -->
  <circle cx="700" cy="120" r="60" fill="#f59e0b" opacity="0.25"/>

  <!-- ground line -->
  <ellipse cx="160" cy="540" rx="80" ry="14" fill="#92400e" opacity="0.2"/>
</svg>
