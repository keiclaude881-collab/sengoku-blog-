<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Reason to endure: compass pointing to north/meaning -->
  <!-- Inner compass -->
  <circle cx="500" cy="210" r="140" fill="#bfdbfe" opacity="0.3"/>
  <circle cx="500" cy="210" r="140" fill="none" stroke="#1e40af" stroke-width="6"/>
  <circle cx="500" cy="210" r="100" fill="none" stroke="#1e40af" stroke-width="3" opacity="0.4"/>
  <!-- Compass needle (pointing to "north" = meaning) -->
  <polygon points="500,88 492,210 500,170 508,210" fill="#1d4ed8"/>
  <polygon points="500,332 492,210 500,250 508,210" fill="#93c5fd" opacity="0.6"/>
  <!-- Cardinal marks -->
  <line x1="500" y1="82" x2="500" y2="92" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="500" y1="328" x2="500" y2="338" stroke="#1e40af" stroke-width="3"/>
  <line x1="352" y1="210" x2="362" y2="210" stroke="#1e40af" stroke-width="3"/>
  <line x1="638" y1="210" x2="648" y2="210" stroke="#1e40af" stroke-width="3"/>
  <!-- Star at north (meaning/goal) -->
  <polygon points="500,60 506,74 522,74 509,84 514,100 500,90 486,100 491,84 478,74 494,74"
           fill="#93c5fd"/>

</svg>