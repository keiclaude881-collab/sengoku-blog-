<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Exile → Return: leaving door, going around, coming back through bigger door -->
  <!-- Small door (exit/exile) -->
  <rect x="100" y="190" width="100" height="160" rx="5" fill="none" stroke="#1e40af" stroke-width="5"/>
  <path d="M 100 190 A 50 50 0 0 1 200 190" fill="none" stroke="#1e40af" stroke-width="5"/>
  <!-- Arrow going away and around -->
  <path d="M 200 270 C 360 270 500 120 700 270"
        fill="none" stroke="#1d4ed8" stroke-width="6" stroke-dasharray="12,7" stroke-linecap="round"/>
  <!-- Large door (return) -->
  <rect x="760" y="150" width="140" height="220" rx="8" fill="none" stroke="#1d4ed8" stroke-width="7"/>
  <path d="M 760 150 A 70 70 0 0 1 900 150" fill="none" stroke="#1d4ed8" stroke-width="7"/>
  <!-- Arrow entering big door -->
  <polyline points="875,255 900,270 875,285" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <!-- Stars around return (triumph) -->
  <circle cx="830" cy="90" r="10" fill="#93c5fd"/>
  <circle cx="920" cy="110" r="8" fill="#93c5fd" opacity="0.8"/>
  <circle cx="950" cy="170" r="7" fill="#93c5fd" opacity="0.7"/>

</svg>