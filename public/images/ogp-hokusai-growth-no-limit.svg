<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="hkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="hkWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#hkSky)"/>

  <!-- rising sun -->
  <circle cx="930" cy="190" r="95" fill="#d8b4fe" opacity="0.55"/>
  <circle cx="930" cy="190" r="62" fill="#9333ea"/>

  <!-- concentric growth rings, symbolizing limitless expansion -->
  <circle cx="280" cy="430" r="260" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.5"/>
  <circle cx="280" cy="430" r="190" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.6"/>
  <circle cx="280" cy="430" r="120" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.7"/>

  <!-- great-wave-inspired rising wave, curling and climbing higher -->
  <path d="M -20 560 C 120 560, 160 460, 260 420 C 330 392, 350 320, 300 270
           C 360 300, 380 360, 330 410 C 420 380, 470 300, 430 230
           C 510 270, 530 360, 470 420 C 560 380, 600 280, 540 200
           C 640 250, 660 360, 580 430 C 700 410, 760 340, 820 330
           C 900 318, 980 360, 1040 420 L 1220 420 L 1220 630 L -20 630 Z"
        fill="url(#hkWave)"/>

  <!-- foam droplets climbing upward -->
  <circle cx="300" cy="262" r="10" fill="#e9d5ff"/>
  <circle cx="332" cy="238" r="6" fill="#e9d5ff"/>
  <circle cx="430" cy="222" r="11" fill="#e9d5ff"/>
  <circle cx="466" cy="196" r="6" fill="#e9d5ff"/>
  <circle cx="540" cy="192" r="12" fill="#e9d5ff"/>
  <circle cx="580" cy="160" r="7" fill="#e9d5ff"/>
  <circle cx="640" cy="222" r="5" fill="#e9d5ff"/>
  <circle cx="700" cy="270" r="8" fill="#e9d5ff"/>

  <!-- foam curls on the crest -->
  <path d="M 250 430 C 270 410, 300 410, 310 430" fill="none" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 380 400 C 400 380, 430 380, 440 400" fill="none" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 490 390 C 510 370, 540 370, 550 390" fill="none" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- small distant mountain silhouette, low and calm, contrasted with the towering wave -->
  <polygon points="980,420 1060,330 1140,420" fill="#c084fc" opacity="0.5"/>
  <polygon points="1020,420 1075,355 1140,420" fill="#a855f7" opacity="0.4"/>

  <!-- birds, suggesting open sky / no ceiling -->
  <path d="M 760 130 q 14 -14 28 0 q 14 -14 28 0" fill="none" stroke="#7e22ce" stroke-width="4" stroke-linecap="round"/>
  <path d="M 820 95 q 10 -10 20 0 q 10 -10 20 0" fill="none" stroke="#7e22ce" stroke-width="4" stroke-linecap="round"/>
</svg>
