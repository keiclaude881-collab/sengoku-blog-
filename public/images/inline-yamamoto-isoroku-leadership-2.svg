<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 見せる→理解→実践の3ステップ -->

  <!-- Title -->
  <text x="500" y="48" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">「見せる」が最初の一歩——行動が理解と実践をうながす</text>

  <!-- Step 1: 見せる -->
  <rect x="60" y="80" width="240" height="200" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="2.5"/>
  <rect x="60" y="80" width="240" height="44" rx="12" fill="#92400e"/>
  <rect x="60" y="112" width="240" height="12" rx="0" fill="#92400e"/>
  <text x="180" y="110" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#faf7f2" text-anchor="middle">STEP 1</text>
  <text x="180" y="165" font-family="'Hiragino Sans', sans-serif" font-size="26" font-weight="700" fill="#92400e" text-anchor="middle">見せる</text>
  <text x="180" y="198" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">自分でやって</text>
  <text x="180" y="218" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">手本を示す</text>
  <text x="180" y="248" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">「できるイメージ」を</text>
  <text x="180" y="266" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">具体化する</text>

  <!-- Arrow 1→2 -->
  <path d="M 310 180 L 378 180" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="374,171 392,180 374,189" fill="#b45309"/>
  <text x="350" y="165" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">言って聞かせ</text>

  <!-- Step 2: 理解 -->
  <rect x="380" y="80" width="240" height="200" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="380" y="80" width="240" height="44" rx="12" fill="#b45309"/>
  <rect x="380" y="112" width="240" height="12" rx="0" fill="#b45309"/>
  <text x="500" y="110" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#faf7f2" text-anchor="middle">STEP 2</text>
  <text x="500" y="165" font-family="'Hiragino Sans', sans-serif" font-size="26" font-weight="700" fill="#b45309" text-anchor="middle">理解</text>
  <text x="500" y="198" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">「なぜそうするか」</text>
  <text x="500" y="218" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">を腹落ちさせる</text>
  <text x="500" y="248" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">言葉で補足して</text>
  <text x="500" y="266" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">納得感を高める</text>

  <!-- Arrow 2→3 -->
  <path d="M 630 180 L 698 180" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="694,171 712,180 694,189" fill="#b45309"/>
  <text x="670" y="165" font-family="'Hiragino Sans', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">させてみせ</text>

  <!-- Step 3: 実践 -->
  <rect x="700" y="80" width="240" height="200" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="700" y="80" width="240" height="44" rx="12" fill="#f59e0b"/>
  <rect x="700" y="112" width="240" height="12" rx="0" fill="#f59e0b"/>
  <text x="820" y="110" font-family="'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">STEP 3</text>
  <text x="820" y="165" font-family="'Hiragino Sans', sans-serif" font-size="26" font-weight="700" fill="#92400e" text-anchor="middle">実践</text>
  <text x="820" y="198" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">実際にやらせて</text>
  <text x="820" y="218" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">経験を積ませる</text>
  <text x="820" y="248" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">ほめて承認する</text>
  <text x="820" y="266" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">→ 自走が始まる</text>

  <!-- Bottom caption -->
  <text x="500" y="340" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle">この3ステップが、部下の「自ら動く力」を育てる</text>

  <!-- Bottom bar decoration -->
  <rect x="200" y="358" width="600" height="3" rx="2" fill="#f59e0b" opacity="0.4"/>
</svg>
