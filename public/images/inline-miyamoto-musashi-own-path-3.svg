<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf5ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <!-- 守破離：三段階の階段が独自の道へ伸びていくイメージ -->
  <rect x="100" y="260" width="200" height="80" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="2"/>

  <path d="M 310 300 Q 360 240 400 200" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="400,200 388,218 408,214" fill="#9333ea"/>

  <rect x="390" y="160" width="220" height="80" rx="8" fill="#e9d5ff" stroke="#9333ea" stroke-width="2.5"/>

  <path d="M 620 200 Q 670 150 710 110" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="710,110 697,128 717,124" fill="#7e22ce"/>

  <rect x="700" y="60" width="220" height="80" rx="8" fill="#6b21a8"/>

  <!-- 光の放射（独自の道から） -->
  <g stroke="#a855f7" opacity="0.65">
    <line x1="810" y1="60" x2="810" y2="28" stroke-width="2.5"/>
    <line x1="838" y1="68" x2="864" y2="42" stroke-width="2.5"/>
    <line x1="782" y1="68" x2="756" y2="42" stroke-width="2.5"/>
    <line x1="858" y1="82" x2="890" y2="66" stroke-width="2"/>
    <line x1="762" y1="82" x2="730" y2="66" stroke-width="2"/>
  </g>

  <!-- 三段の足跡を示す丸 -->
  <circle cx="200" cy="300" r="9" fill="#9333ea" opacity="0.8"/>
  <circle cx="500" cy="200" r="9" fill="#7e22ce" opacity="0.85"/>
  <circle cx="810" cy="100" r="9" fill="#ffffff"/>
</svg>
