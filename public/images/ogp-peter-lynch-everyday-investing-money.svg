<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Shopping bag with upward arrow inside -->
  <!-- bag body -->
  <rect x="370" y="220" width="460" height="340" rx="20" fill="none" stroke="#d97706" stroke-width="18" opacity="0.85"/>
  <!-- bag fill -->
  <rect x="379" y="229" width="442" height="322" rx="14" fill="#fde68a" opacity="0.25"/>
  <!-- handle left -->
  <path d="M460,220 Q460,140 540,130 Q600,125 600,130" fill="none" stroke="#d97706" stroke-width="16" stroke-linecap="round"/>
  <!-- handle right -->
  <path d="M740,220 Q740,140 660,130 Q600,125 600,130" fill="none" stroke="#d97706" stroke-width="16" stroke-linecap="round"/>
  <!-- upward arrow inside bag -->
  <!-- arrow shaft -->
  <rect x="588" y="295" width="24" height="200" rx="5" fill="#d97706" opacity="0.85"/>
  <!-- arrow head -->
  <polygon points="600,240 548,310 652,310" fill="#d97706" opacity="0.90"/>
</svg>