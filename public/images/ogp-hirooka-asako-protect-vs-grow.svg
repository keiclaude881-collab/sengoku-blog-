<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ha-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ha-glow)"/>

  <!-- center divider -->
  <line x1="600" y1="80" x2="600" y2="550" stroke="#d97706" stroke-width="3" stroke-dasharray="2 14" opacity="0.5"/>

  <!-- LEFT: grow — rising plant + upward bars -->
  <g transform="translate(330,500)">
    <rect x="-30" y="-50" width="60" height="50" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <rect x="50" y="-110" width="60" height="110" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <rect x="130" y="-180" width="60" height="180" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  </g>
  <g transform="translate(280,460)">
    <path d="M 0 0 C 0 -70 -16 -110 -8 -170" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-32" cy="-130" rx="36" ry="20" fill="#d97706" opacity="0.85" transform="rotate(-30 -32 -130)"/>
    <ellipse cx="20" cy="-165" rx="36" ry="20" fill="#f59e0b" opacity="0.85" transform="rotate(20 20 -165)"/>
    <circle cx="-6" cy="-200" r="18" fill="#fde68a"/>
  </g>
  <!-- upward arrow -->
  <path d="M 230 380 C 280 280 360 220 430 180" stroke="#b45309" stroke-width="5" fill="none" stroke-dasharray="3 10" opacity="0.6" stroke-linecap="round"/>
  <path d="M 412 192 L 430 180 L 424 200 Z" fill="#b45309" opacity="0.7"/>

  <!-- RIGHT: protect — shield with steady umbrella overhead -->
  <g transform="translate(870,330)">
    <!-- umbrella -->
    <path d="M -160 -10 C -160 -90 -80 -130 0 -130 C 80 -130 160 -90 160 -10 C 110 -40 60 -50 0 -50 C -60 -50 -110 -40 -160 -10 Z" fill="#92400e"/>
    <line x1="0" y1="-50" x2="0" y2="100" stroke="#78350f" stroke-width="6"/>
    <path d="M 0 100 C 0 130 30 130 30 100" stroke="#78350f" stroke-width="6" fill="none"/>
    <!-- raindrop shapes blocked above the umbrella -->
    <g fill="#bfa15a" opacity="0.5">
      <ellipse cx="-110" cy="-160" rx="7" ry="14"/>
      <ellipse cx="-40" cy="-185" rx="7" ry="14"/>
      <ellipse cx="50" cy="-185" rx="7" ry="14"/>
      <ellipse cx="120" cy="-160" rx="7" ry="14"/>
    </g>
  </g>

  <!-- shield resting beneath, representing protected base capital -->
  <g transform="translate(870,470)">
    <path d="M 0 -70 L 70 -45 L 70 20 C 70 70 35 100 0 115 C -35 100 -70 70 -70 20 L -70 -45 Z" fill="#fde68a" stroke="#92400e" stroke-width="5"/>
    <circle cx="0" cy="15" r="22" fill="#92400e" opacity="0.8"/>
  </g>

  <!-- decorative motes -->
  <circle cx="120" cy="140" r="16" fill="#fde68a" opacity="0.6"/>
  <circle cx="1100" cy="560" r="18" fill="#f59e0b" opacity="0.4"/>
  <circle cx="1130" cy="140" r="12" fill="#d97706" opacity="0.4"/>
</svg>
