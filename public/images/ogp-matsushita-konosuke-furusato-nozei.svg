<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgG)"/>
  <circle cx="120" cy="540" r="80" fill="#fde68a" opacity="0.45"/>
  <circle cx="1080" cy="100" r="60" fill="#fde68a" opacity="0.45"/>
  
  <!-- House silhouette (hometown/furusato) -->
  <!-- Roof -->
  <polygon points="600,130 760,270 440,270" fill="#d97706" opacity="0.9"/>
  <!-- House body -->
  <rect x="470" y="270" width="260" height="180" fill="none" stroke="#92400e" stroke-width="7" rx="4"/>
  <rect x="470" y="270" width="260" height="180" fill="#fde68a" opacity="0.35"/>
  <!-- Door -->
  <rect x="560" y="370" width="80" height="80" fill="none" stroke="#92400e" stroke-width="6" rx="4"/>
  <!-- Windows -->
  <rect x="490" y="305" width="55" height="50" fill="none" stroke="#92400e" stroke-width="5" rx="3"/>
  <rect x="655" y="305" width="55" height="50" fill="none" stroke="#92400e" stroke-width="5" rx="3"/>
  
  <!-- Coin/money arc returning to house (furusato nozei = tax that returns to hometown) -->
  <!-- Arc from right side back to house -->
  <path d="M 900 350 C 900 180 750 130 620 175" 
        fill="none" stroke="#d97706" stroke-width="6" stroke-dasharray="12,8"/>
  <!-- Arrow tip at house -->
  <polygon points="615,165 625,190 605,190" fill="#d97706"/>
  
  <!-- Yen coin on right -->
  <circle cx="920" cy="370" r="65" fill="none" stroke="#d97706" stroke-width="8"/>
  <circle cx="920" cy="370" r="52" fill="#fef3c7" opacity="0.7"/>
  <!-- Yen symbol (¥) - simplified as Y shape -->
  <line x1="920" y1="400" x2="920" y2="340" stroke="#92400e" stroke-width="7" stroke-linecap="round"/>
  <line x1="920" y1="380" x2="898" y2="380" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <line x1="920" y1="365" x2="898" y2="365" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <line x1="896" y1="340" x2="920" y2="368" stroke="#92400e" stroke-width="7" stroke-linecap="round"/>
  <line x1="944" y1="340" x2="920" y2="368" stroke="#92400e" stroke-width="7" stroke-linecap="round"/>

</svg>