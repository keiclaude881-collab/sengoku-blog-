<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="ep-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ep-glow)"/>

  <!-- broken chain, left half -->
  <g stroke="#6b21a8" stroke-width="10" opacity="0.6" fill="none">
    <rect x="190" y="270" width="86" height="48" rx="24"/>
    <rect x="190" y="330" width="86" height="48" rx="24"/>
    <rect x="160" y="300" width="86" height="48" rx="24" transform="rotate(-10 203 324)"/>
  </g>

  <!-- broken chain, right half, fragments drifting apart -->
  <g stroke="#6b21a8" stroke-width="10" opacity="0.5" fill="none">
    <rect x="935" y="220" width="80" height="44" rx="22" transform="rotate(18 975 242)"/>
    <rect x="985" y="290" width="80" height="44" rx="22" transform="rotate(8 1025 312)"/>
  </g>

  <!-- ground line -->
  <line x1="120" y1="500" x2="1080" y2="500" stroke="#d8b4fe" stroke-width="2" opacity="0.4"/>

  <!-- central figure: still, upright, radiating calm light -->
  <g transform="translate(600,360)">
    <ellipse cx="0" cy="140" rx="80" ry="16" fill="#6b21a8" opacity="0.12"/>
    <!-- outer glow rings -->
    <circle cx="0" cy="0" r="190" fill="#f3e8ff" opacity="0.5"/>
    <circle cx="0" cy="0" r="140" fill="#e9d5ff" opacity="0.6"/>
    <circle cx="0" cy="0" r="95" fill="#d8b4fe" opacity="0.55"/>
    <!-- body, anchored and steady -->
    <path d="M -54 130 C -54 50 -46 -10 0 -10 C 46 -10 54 50 54 130 Z" fill="#7e22ce"/>
    <!-- one leg slightly forward to suggest the broken-but-unbowed posture -->
    <path d="M -20 128 L -34 150" stroke="#6b21a8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 20 128 L 30 152" stroke="#6b21a8" stroke-width="14" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="0" cy="-52" r="38" fill="#f3e8ff"/>
    <!-- radiant core -->
    <circle cx="0" cy="0" r="26" fill="#a855f7" opacity="0.9"/>
  </g>

  <!-- radiating light lines from the figure -->
  <g stroke="#9333ea" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="600" y1="150" x2="600" y2="120"/>
    <line x1="600" y1="600" x2="600" y2="572"/>
    <line x1="380" y1="360" x2="352" y2="360"/>
    <line x1="820" y1="360" x2="848" y2="360"/>
    <line x1="455" y1="218" x2="436" y2="198"/>
    <line x1="745" y1="218" x2="764" y2="198"/>
  </g>

  <!-- small floating motes -->
  <circle cx="180" cy="150" r="10" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="1040" cy="500" r="14" fill="#9333ea" opacity="0.3"/>
  <circle cx="1070" cy="140" r="8" fill="#9333ea" opacity="0.4"/>
</svg>
