<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7ff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <!-- 左縦バー -->
  <rect x="0" y="0" width="12" height="630" fill="#6b21a8"/>

  <!-- 鎖と輝きのモチーフ（左側装飾） -->
  <rect x="190" y="176" width="64" height="32" rx="16" fill="none" stroke="#6b21a8" stroke-width="3.5" opacity="0.6"/>
  <rect x="268" y="176" width="64" height="32" rx="16" fill="none" stroke="#6b21a8" stroke-width="3.5" opacity="0.6"/>
  <line x1="254" y1="192" x2="268" y2="192" stroke="#6b21a8" stroke-width="3.5" opacity="0.6"/>
  <rect x="190" y="224" width="64" height="32" rx="16" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.5"/>
  <rect x="268" y="224" width="64" height="32" rx="16" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.5"/>
  <line x1="254" y1="240" x2="268" y2="240" stroke="#8b5cf6" stroke-width="3" opacity="0.5"/>
  <!-- 中心の輝き -->
  <circle cx="330" cy="360" r="72" fill="#f3e8ff" opacity="0.55"/>
  <circle cx="330" cy="360" r="46" fill="#e9d5ff" opacity="0.65"/>
  <circle cx="330" cy="360" r="24" fill="#a855f7" opacity="0.8"/>
  <!-- 放射線 -->
  <line x1="330" y1="274" x2="330" y2="302" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="330" y1="418" x2="330" y2="446" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="244" y1="360" x2="272" y2="360" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="388" y1="360" x2="416" y2="360" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- カテゴリバッジ -->
  <rect x="680" y="180" width="140" height="36" rx="18" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="750" y="204" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="1">思考・マインド</text>

  <!-- タイトル -->
  <text x="680" y="295" font-family="'Shippori Mincho', serif" font-size="36" font-weight="700" fill="#1c1917" letter-spacing="1">エピクテトスの</text>
  <text x="680" y="347" font-family="'Shippori Mincho', serif" font-size="36" font-weight="700" fill="#1c1917" letter-spacing="1">制御の哲学</text>

  <!-- サブタイトル -->
  <text x="680" y="406" font-family="'Hiragino Sans', sans-serif" font-size="18" fill="#44403c" letter-spacing="0.5" opacity="0.8">奴隷でも自由でいられた男の思考法</text>

  <!-- フッター -->
  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
