<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Tree with many branches (multiple income streams) -->
  <!-- trunk -->
  <rect x="580" y="380" width="40" height="160" rx="8" fill="#1e40af" opacity="0.82"/>
  <!-- main branches -->
  <line x1="600" y1="390" x2="350" y2="220" stroke="#1e40af" stroke-width="18" stroke-linecap="round" opacity="0.78"/>
  <line x1="600" y1="390" x2="600" y2="160" stroke="#1e40af" stroke-width="18" stroke-linecap="round" opacity="0.78"/>
  <line x1="600" y1="390" x2="850" y2="220" stroke="#1e40af" stroke-width="18" stroke-linecap="round" opacity="0.78"/>
  <!-- sub-branches left -->
  <line x1="350" y1="220" x2="230" y2="130" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.70"/>
  <line x1="350" y1="220" x2="370" y2="110" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.70"/>
  <!-- sub-branches center -->
  <line x1="600" y1="160" x2="530" y2="80" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.70"/>
  <line x1="600" y1="160" x2="670" y2="80" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.70"/>
  <!-- sub-branches right -->
  <line x1="850" y1="220" x2="830" y2="110" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.70"/>
  <line x1="850" y1="220" x2="970" y2="130" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.70"/>
  <!-- leaf clusters -->
  <g fill="#60a5fa" opacity="0.50">
    <circle cx="220" cy="115" r="35"/>
    <circle cx="365" cy="92" r="30"/>
    <circle cx="525" cy="65" r="32"/>
    <circle cx="675" cy="65" r="32"/>
    <circle cx="825" cy="92" r="30"/>
    <circle cx="975" cy="115" r="35"/>
  </g>
  <!-- base roots -->
  <line x1="600" y1="540" x2="440" y2="590" stroke="#1e40af" stroke-width="10" stroke-linecap="round" opacity="0.40"/>
  <line x1="600" y1="540" x2="760" y2="590" stroke="#1e40af" stroke-width="10" stroke-linecap="round" opacity="0.40"/>
</svg>