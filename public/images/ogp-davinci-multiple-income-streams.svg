<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- A single source point on the left -->
  <circle cx="220" cy="315" r="46" fill="#1e3a8a"/>
  <circle cx="220" cy="315" r="70" fill="none" stroke="#1e40af" stroke-width="2" opacity="0.4"/>

  <!-- Multiple branching paths fanning out to the right, each ending in a different symbolic tool/icon -->
  <g fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M 260 300 C 450 200 650 150 880 130"/>
    <path d="M 260 310 C 450 270 650 250 880 260"/>
    <path d="M 260 320 C 450 330 650 350 880 390"/>
    <path d="M 260 330 C 450 420 650 480 880 520"/>
  </g>

  <!-- Endpoint 1: paintbrush / palette (art) -->
  <g transform="translate(910,120)">
    <circle cx="0" cy="0" r="34" fill="#bfdbfe"/>
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#93c5fd"/>
    <circle cx="-8" cy="-5" r="3.5" fill="#1e40af"/>
    <circle cx="6" cy="-6" r="3.5" fill="#3b82f6"/>
    <circle cx="0" cy="6" r="3.5" fill="#1e3a8a"/>
  </g>

  <!-- Endpoint 2: gear (engineering/invention) -->
  <g transform="translate(910,255)">
    <circle cx="0" cy="0" r="34" fill="#bfdbfe"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#1e40af" stroke-width="6"/>
    <g fill="#1e40af">
      <rect x="-4" y="-26" width="8" height="12"/>
      <rect x="-4" y="14" width="8" height="12"/>
      <rect x="-26" y="-4" width="12" height="8"/>
      <rect x="14" y="-4" width="12" height="8"/>
    </g>
  </g>

  <!-- Endpoint 3: compass/blueprint (architecture) -->
  <g transform="translate(910,388)">
    <circle cx="0" cy="0" r="34" fill="#bfdbfe"/>
    <path d="M 0 -20 L -16 18 L 16 18 Z" fill="none" stroke="#1e40af" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="-20" r="4" fill="#1e40af"/>
  </g>

  <!-- Endpoint 4: anatomical wing/feather (study of nature, flight) -->
  <g transform="translate(910,520)">
    <circle cx="0" cy="0" r="34" fill="#bfdbfe"/>
    <path d="M -20 14 C -10 -20 14 -22 22 -14 C 6 -10 0 6 -4 18 C -10 14 -16 16 -20 14 Z" fill="#1e40af"/>
  </g>

  <!-- Faint Vitruvian-style circle/square motif behind the source, nodding to da Vinci -->
  <circle cx="220" cy="315" r="150" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.45"/>
  <rect x="115" y="210" width="210" height="210" fill="none" stroke="#bfdbfe" stroke-width="2" opacity="0.45"/>
</svg>
