<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7faff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dbeafe" stroke-width="2"/>

  <!-- ウィトルウィウス的人体図モチーフ（簡略） -->
  <g transform="translate(330,360)" opacity="0.75">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1e40af" stroke-width="2.5" opacity="0.65"/>
    <rect x="-92" y="-92" width="184" height="184" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.65"/>
    <circle cx="0" cy="-58" r="16" fill="#1e3a8a" opacity="0.7"/>
    <line x1="0" y1="-42" x2="0" y2="40" stroke="#1e3a8a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="-72" y2="-58" stroke="#1e3a8a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="72" y2="-58" stroke="#1e3a8a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="-50" y2="108" stroke="#1e3a8a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="50" y2="108" stroke="#1e3a8a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- 複数分野を表す重なる円（掛け算のメタファー） -->
  <g opacity="0.8">
    <circle cx="730" cy="400" r="62" fill="#3b82f6" opacity="0.6"/>
    <circle cx="800" cy="400" r="62" fill="#1e40af" opacity="0.55"/>
    <circle cx="765" cy="350" r="62" fill="#1e3a8a" opacity="0.5"/>
  </g>
  <text x="765" y="408" font-family="'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle" opacity="0.8">掛け算</text>

  <!-- カテゴリラベル -->
  <rect x="660" y="180" width="120" height="36" rx="18" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="720" y="204" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="1">仕事・副業</text>

  <!-- タイトル -->
  <text x="660" y="280" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">ダ・ヴィンチに学ぶ</text>
  <text x="660" y="324" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#1c1917" letter-spacing="1">「複線化」戦略</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
