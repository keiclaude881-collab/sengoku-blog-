<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>
  <!-- Classic Model T style car silhouette (side view, facing right) -->
  <!-- wheels (behind body) -->
  <circle cx="380" cy="450" r="85" fill="#1e40af" opacity="0.75"/>
  <circle cx="380" cy="450" r="52" fill="#dbeafe" opacity="0.85"/>
  <circle cx="380" cy="450" r="18" fill="#1e40af" opacity="0.80"/>
  <circle cx="820" cy="450" r="85" fill="#1e40af" opacity="0.75"/>
  <circle cx="820" cy="450" r="52" fill="#dbeafe" opacity="0.85"/>
  <circle cx="820" cy="450" r="18" fill="#1e40af" opacity="0.80"/>
  <!-- car body -->
  <rect x="250" y="340" width="700" height="120" rx="18" fill="#3b82f6" opacity="0.80"/>
  <!-- cabin (roof + windows) -->
  <rect x="360" y="210" width="420" height="135" rx="20" fill="#3b82f6" opacity="0.75"/>
  <!-- windshield (lighter) -->
  <rect x="375" y="222" width="130" height="110" rx="10" fill="#bfdbfe" opacity="0.65"/>
  <!-- rear window -->
  <rect x="660" y="222" width="100" height="110" rx="10" fill="#bfdbfe" opacity="0.65"/>
  <!-- middle window -->
  <rect x="520" y="222" width="125" height="110" rx="8" fill="#bfdbfe" opacity="0.55"/>
  <!-- headlight -->
  <circle cx="955" cy="385" r="30" fill="#bfdbfe" opacity="0.70"/>
  <!-- running board -->
  <rect x="270" y="452" width="660" height="14" rx="5" fill="#1e40af" opacity="0.50"/>
</svg>