<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Naval fleet formation (talent development / fleet) -->
  <!-- wake lines (water ripples) -->
  <g stroke="#bfdbfe" stroke-width="3" opacity="0.30" fill="none">
    <path d="M 0,400 Q 300,380 600,400 Q 900,420 1200,400"/>
    <path d="M 0,430 Q 300,410 600,430 Q 900,450 1200,430"/>
  </g>
  <!-- lead ship (commander) - larger -->
  <path d="M 520,300 Q 490,330 500,360 L 700,360 Q 710,330 680,300 Z" fill="#1e40af" opacity="0.85"/>
  <rect x="570" y="230" width="15" height="75" fill="#1e40af" opacity="0.85"/>
  <path d="M 585,232 L 630,248 L 585,264 Z" fill="#3b82f6" opacity="0.75"/>
  <!-- trailing ships (smaller, three) -->
  <g fill="#3b82f6" opacity="0.65">
    <!-- left trail ship -->
    <path d="M 240,360 Q 215,380 222,400 L 370,400 Q 377,380 352,360 Z"/>
    <rect x="292" y="316" width="10" height="48" fill="#3b82f6" opacity="0.80"/>
    <!-- center trail ship -->
    <path d="M 520,400 Q 500,418 506,436 L 614,436 Q 620,418 600,400 Z"/>
    <rect x="554" y="364" width="8" height="40" fill="#3b82f6" opacity="0.80"/>
    <!-- right trail ship -->
    <path d="M 830,360 Q 805,380 812,400 L 960,400 Q 967,380 942,360 Z"/>
    <rect x="882" y="316" width="10" height="48" fill="#3b82f6" opacity="0.80"/>
  </g>
  <!-- formation lines connecting ships -->
  <g stroke="#bfdbfe" stroke-width="5" stroke-dasharray="12,8" opacity="0.45">
    <line x1="500" y1="330" x2="305" y2="380"/>
    <line x1="600" y1="355" x2="560" y2="418"/>
    <line x1="700" y1="330" x2="895" y2="380"/>
  </g>
</svg>