<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradM)"/>

  <circle cx="1080" cy="140" r="100" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="130" cy="540" r="90" fill="#bfdbfe" opacity="0.3"/>

  <rect x="0" y="520" width="1200" height="110" fill="#1e3a8a" opacity="0.07"/>

  <!-- four growth stages left to right: seedling, sprout, sapling, full tree -->
  <!-- the mentor hand cupping/guiding each stage -->

  <!-- stage 1 -->
  <g transform="translate(200,520)">
    <path d="M -50 30 Q 0 -10 50 30 L 50 60 L -50 60 Z" fill="#1e40af" opacity="0.5"/>
    <ellipse cx="0" cy="10" rx="10" ry="13" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- stage 2 -->
  <g transform="translate(480,500)">
    <path d="M -55 30 Q 0 -14 55 30 L 55 64 L -55 64 Z" fill="#1e40af" opacity="0.55"/>
    <path d="M 0 10 C -4 -14, -16 -22, -24 -30" stroke="#1e3a8a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0 10 C 4 -12, 12 -18, 20 -26" stroke="#1e3a8a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-24" cy="-32" rx="10" ry="6" fill="#3b82f6" transform="rotate(-30 -24 -32)"/>
    <ellipse cx="20" cy="-28" rx="9" ry="6" fill="#3b82f6" transform="rotate(25 20 -28)"/>
  </g>

  <!-- stage 3 -->
  <g transform="translate(760,470)">
    <path d="M -60 30 Q 0 -18 60 30 L 60 70 L -60 70 Z" fill="#1e40af" opacity="0.6"/>
    <rect x="-6" y="-58" width="12" height="68" rx="5" fill="#1e3a8a"/>
    <circle cx="0" cy="-78" r="36" fill="#3b82f6" opacity="0.85"/>
  </g>

  <!-- stage 4: full tree, mentor hand released, standing independently -->
  <g transform="translate(1020,430)">
    <rect x="-9" y="-110" width="18" height="110" rx="6" fill="#1e3a8a"/>
    <circle cx="0" cy="-150" r="62" fill="#1e40af" opacity="0.9"/>
    <circle cx="-46" cy="-118" r="40" fill="#3b82f6" opacity="0.75"/>
    <circle cx="48" cy="-122" r="42" fill="#3b82f6" opacity="0.75"/>
    <!-- open hand releasing, shown as two arcs beneath the canopy -->
    <path d="M -70 6 Q 0 -16 70 6" stroke="#1e3a8a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- connecting dotted arc showing the four-step progression -->
  <path d="M 200 540 Q 350 520 480 520 Q 620 500 760 480 Q 900 440 1020 420" stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="3 13" opacity="0.45" stroke-linecap="round"/>

  <!-- small numbered-feel dots (no text) marking the four stages -->
  <g fill="#1e40af" opacity="0.55">
    <circle cx="200" cy="560" r="9"/>
    <circle cx="480" cy="546" r="9"/>
    <circle cx="760" cy="522" r="9"/>
    <circle cx="1020" cy="486" r="9"/>
  </g>
</svg>
