<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#d8b4fe"/>
      <stop offset="1" stop-color="#9333ea"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradF)"/>

  <circle cx="200" cy="500" r="110" fill="#e9d5ff" opacity="0.4"/>
  <circle cx="1040" cy="150" r="90" fill="#e9d5ff" opacity="0.35"/>

  <!-- hourglass, left of center -->
  <g transform="translate(400,315)">
    <polygon points="-130,-200 130,-200 10,-10" fill="#f3e8ff" stroke="#9333ea" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="-130,200 130,200 10,10" fill="#e9d5ff" stroke="#7e22ce" stroke-width="5" stroke-linejoin="round"/>
    <line x1="-150" y1="-210" x2="150" y2="-210" stroke="#7e22ce" stroke-width="10" stroke-linecap="round"/>
    <line x1="-150" y1="210" x2="150" y2="210" stroke="#7e22ce" stroke-width="10" stroke-linecap="round"/>
    <!-- sand settled at bottom, mostly run out -->
    <polygon points="-50,190 50,190 10,40" fill="#a855f7" opacity="0.55"/>
    <!-- thin remaining trickle -->
    <line x1="10" y1="0" x2="10" y2="35" stroke="#7e22ce" stroke-width="3" stroke-dasharray="2 4" opacity="0.6"/>
  </g>

  <!-- small candle/flame motif rising to the right, symbolizing 志 (the will that outlasts time) -->
  <g transform="translate(840,360)">
    <rect x="-16" y="0" width="32" height="170" rx="6" fill="#ede9fe"/>
    <rect x="-16" y="0" width="32" height="170" rx="6" fill="none" stroke="#c084fc" stroke-width="3"/>
    <path d="M 0 -10 C -22 -50, 18 -70, 0 -110 C -16 -78, 22 -56, 0 -10 Z" fill="url(#flameGrad)"/>
  </g>

  <!-- soft radiating glow behind the flame -->
  <circle cx="840" cy="280" r="90" fill="#fde68a" opacity="0.18"/>
  <circle cx="840" cy="280" r="140" fill="#fde68a" opacity="0.1"/>

  <!-- a trailing line of small lights to the right, symbolizing the flame passed to many students -->
  <g fill="#9333ea" opacity="0.6">
    <circle cx="970" cy="430" r="10"/>
    <circle cx="1040" cy="460" r="8"/>
    <circle cx="1100" cy="495" r="6"/>
  </g>
  <path d="M 856 380 Q 920 420 970 430" stroke="#9333ea" stroke-width="2.5" fill="none" stroke-dasharray="2 8" opacity="0.4"/>
  <path d="M 970 430 Q 1010 448 1040 460" stroke="#9333ea" stroke-width="2.5" fill="none" stroke-dasharray="2 8" opacity="0.4"/>
  <path d="M 1040 460 Q 1072 480 1100 495" stroke="#9333ea" stroke-width="2.5" fill="none" stroke-dasharray="2 8" opacity="0.4"/>

  <!-- horizon ground line -->
  <rect x="0" y="560" width="1200" height="70" fill="#6b21a8" opacity="0.07"/>
</svg>
