<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad5)"/>

  <!-- background soft circles -->
  <circle cx="140" cy="500" r="100" fill="#e9d5ff" opacity="0.5"/>
  <circle cx="1080" cy="120" r="70" fill="#e9d5ff" opacity="0.5"/>

  <!-- large hourglass, sand draining: upper mostly empty, lower filling -->
  <g transform="translate(600,315)">
    <path d="M -130 -230 L 130 -230 L 130 -210 L 20 -10 L 20 10 L 130 210 L 130 230 L -130 230 L -130 210 L -20 10 L -20 -10 L -130 -210 Z"
          fill="none" stroke="#6b21a8" stroke-width="8" stroke-linejoin="round"/>
    <!-- top sand (mostly empty, draining) -->
    <path d="M -70 -160 L 70 -160 L 16 -50 L -16 -50 Z" fill="#9333ea" opacity="0.55"/>
    <!-- falling stream -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#9333ea" stroke-width="5"/>
    <!-- bottom sand, larger pile already fallen -->
    <path d="M -118 218 L 118 218 L 118 212 L 16 16 L -16 16 L -118 212 Z" fill="#7e22ce" opacity="0.4"/>
    <path d="M -90 200 Q 0 150 90 200 L 90 212 L -90 212 Z" fill="#7e22ce" opacity="0.75"/>
    <path d="M -55 165 Q 0 130 55 165 L 50 200 L -50 200 Z" fill="#6b21a8" opacity="0.7"/>
  </g>

  <!-- subtle radiating sundial-like tick marks around the hourglass -->
  <g stroke="#9333ea" stroke-width="3" opacity="0.35" stroke-linecap="round">
    <line x1="600" y1="40" x2="600" y2="70"/>
    <line x1="600" y1="560" x2="600" y2="590"/>
    <line x1="320" y1="315" x2="350" y2="315"/>
    <line x1="850" y1="315" x2="880" y2="315"/>
    <line x1="410" y1="120" x2="430" y2="140"/>
    <line x1="790" y1="120" x2="770" y2="140"/>
    <line x1="410" y1="510" x2="430" y2="490"/>
    <line x1="790" y1="510" x2="770" y2="490"/>
  </g>
</svg>
