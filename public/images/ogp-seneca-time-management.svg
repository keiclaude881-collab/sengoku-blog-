<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7ff"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="0" y="0" width="12" height="630" fill="#6b21a8"/>

  <!-- カテゴリバッジ -->
  <rect x="68" y="68" width="100" height="36" rx="18" fill="#f3e8ff" stroke="#e9d5ff"/>
  <text x="118" y="92" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#6b21a8" text-anchor="middle" letter-spacing="1">思考法</text>

  <!-- タイトル -->
  <text x="68" y="200" font-family="'Hiragino Sans', sans-serif" font-size="48" font-weight="900" fill="#1c1917">セネカに学ぶ</text>
  <text x="68" y="266" font-family="'Hiragino Sans', sans-serif" font-size="46" font-weight="900" fill="#6b21a8">「時間管理」の本質</text>

  <!-- 説明 -->
  <text x="68" y="330" font-family="'Hiragino Sans', sans-serif" font-size="22" fill="#78716c">人生は短いのではない、浪費しているだけだ</text>

  <!-- 砂時計(漏れる砂) -->
  <g transform="translate(950,330)">
    <polygon points="-110,-160 110,-160 0,0" fill="none" stroke="#6b21a8" stroke-width="5"/>
    <polygon points="-110,160 110,160 0,0" fill="none" stroke="#6b21a8" stroke-width="5"/>
    <line x1="-130" y1="-160" x2="130" y2="-160" stroke="#6b21a8" stroke-width="8" stroke-linecap="round"/>
    <line x1="-130" y1="160" x2="130" y2="160" stroke="#6b21a8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="-90,-145 90,-145 0,-25" fill="#a855f7" opacity="0.5"/>
    <polygon points="-70,145 70,145 0,40" fill="#a855f7" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#6b21a8"/>
    <!-- 漏れる砂 -->
    <circle cx="60" cy="-40" r="5" fill="#a855f7" opacity="0.6"/>
    <circle cx="92" cy="10" r="6" fill="#a855f7" opacity="0.5"/>
    <circle cx="118" cy="60" r="5" fill="#a855f7" opacity="0.4"/>
    <circle cx="138" cy="105" r="4" fill="#a855f7" opacity="0.3"/>
    <path d="M 50 -50 Q 100 30 145 110" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,5" fill="none" opacity="0.4"/>
  </g>

  <text x="68" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
