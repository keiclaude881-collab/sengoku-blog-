<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Three Adler core concepts: 3 connected nodes in triangle -->
  <circle cx="500" cy="120" r="72" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="500" cy="120" r="72" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <circle cx="290" cy="320" r="72" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="290" cy="320" r="72" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <circle cx="710" cy="320" r="72" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="710" cy="320" r="72" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <!-- Connecting lines -->
  <line x1="440" y1="160" x2="340" y2="280" stroke="#c4b5fd" stroke-width="4"/>
  <line x1="560" y1="160" x2="660" y2="280" stroke="#c4b5fd" stroke-width="4"/>
  <line x1="360" y1="322" x2="640" y2="322" stroke="#c4b5fd" stroke-width="4"/>
  <!-- Center triangle fill -->
  <polygon points="500,192 362,300 638,300" fill="#7c3aed" opacity="0.12"/>
  <!-- Icons in circles -->
  <line x1="500" y1="96" x2="500" y2="144" stroke="#6b21a8" stroke-width="5" stroke-linecap="round"/>
  <polyline points="488,108 500,90 512,108" fill="none" stroke="#6b21a8" stroke-width="5"/>
  <circle cx="290" cy="312" r="20" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <circle cx="290" cy="312" r="8" fill="#6b21a8"/>
  <line x1="686" y1="296" x2="734" y2="344" stroke="#6b21a8" stroke-width="5" stroke-linecap="round"/>
  <line x1="734" y1="296" x2="686" y2="344" stroke="#6b21a8" stroke-width="5" stroke-linecap="round"/>

</svg>