<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Cave allegory: people chained watching shadows on wall -->
  <!-- Cave shape -->
  <path d="M 100 108 C 200 78 800 78 900 108 L 900 398 L 100 398 Z"
        fill="#ddd6fe" opacity="0.2"/>
  <path d="M 100 108 C 200 78 800 78 900 108" fill="none" stroke="#c4b5fd" stroke-width="5" opacity="0.5"/>
  <!-- Wall at far end -->
  <rect x="100" y="108" width="30" height="290" fill="#6b21a8" opacity="0.4"/>
  <!-- Shadows on wall (abstract forms) -->
  <ellipse cx="190" cy="240" rx="35" ry="70" fill="#6b21a8" opacity="0.3"/>
  <ellipse cx="248" cy="218" rx="25" ry="55" fill="#6b21a8" opacity="0.25"/>
  <!-- Fire/light behind (far right) -->
  <circle cx="820" cy="248" r="65" fill="#c4b5fd" opacity="0.4"/>
  <path d="M 820 298 C 800 272 795 245 808 222 C 808 222 810 232 820 232 C 830 232 842 210 838 188 C 855 210 858 238 844 268 C 852 258 855 238 848 228 C 862 248 862 282 820 298 Z"
        fill="#c4b5fd" opacity="0.7"/>
  <!-- People (shadows/silhouettes, facing wall) -->
  <circle cx="480" cy="295" r="18" fill="#c4b5fd" opacity="0.55"/>
  <rect x="466" y="313" width="28" height="48" rx="5" fill="#c4b5fd" opacity="0.45"/>
  <circle cx="580" cy="305" r="16" fill="#c4b5fd" opacity="0.5"/>
  <rect x="568" y="321" width="24" height="42" rx="5" fill="#c4b5fd" opacity="0.4"/>
  <!-- Chains (horizontal lines at feet) -->
  <line x1="420" y1="368" x2="660" y2="368" stroke="#c4b5fd" stroke-width="4" opacity="0.4"/>

</svg>