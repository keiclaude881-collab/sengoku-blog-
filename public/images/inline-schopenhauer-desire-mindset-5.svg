<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#ddd6fe" opacity="0.35"/>
  
  <!-- Music/art escape: musical notes flowing, desire pendulum stopping -->
  <!-- Musical notes radiating -->
  <path d="M 248 248 C 268 228 298 218 318 228" fill="none" stroke="#c4b5fd" stroke-width="5"/>
  <circle cx="248" cy="248" r="12" fill="#c4b5fd" opacity="0.7"/>
  <line x1="260" y1="248" x2="260" y2="195" stroke="#c4b5fd" stroke-width="5"/>
  <path d="M 310 198 C 330 178 360 168 380 178" fill="none" stroke="#c4b5fd" stroke-width="4"/>
  <circle cx="310" cy="198" r="10" fill="#c4b5fd" opacity="0.65"/>
  <line x1="320" y1="198" x2="320" y2="155" stroke="#c4b5fd" stroke-width="4"/>
  <path d="M 380 158 C 400 138 430 128 450 138" fill="none" stroke="#c4b5fd" stroke-width="4"/>
  <circle cx="380" cy="158" r="10" fill="#c4b5fd" opacity="0.6"/>
  <line x1="390" y1="158" x2="390" y2="118" stroke="#c4b5fd" stroke-width="4"/>
  
  <!-- Person in flow state (immersed) -->
  <circle cx="640" cy="210" r="48" fill="#7c3aed" opacity="0.7"/>
  <circle cx="640" cy="168" r="24" fill="#7c3aed" opacity="0.8"/>
  <!-- Glow rings (flow state) -->
  <circle cx="640" cy="198" r="70" fill="none" stroke="#c4b5fd" stroke-width="4" opacity="0.4"/>
  <circle cx="640" cy="198" r="92" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.28"/>
  
  <!-- Pendulum STOPPED at center (desire stilled) -->
  <line x1="840" y1="88" x2="840" y2="115" stroke="#6b21a8" stroke-width="6"/>
  <line x1="720" y1="88" x2="960" y2="88" stroke="#6b21a8" stroke-width="6"/>
  <line x1="840" y1="115" x2="840" y2="310" stroke="#7c3aed" stroke-width="5"/>
  <circle cx="840" cy="328" r="24" fill="#c4b5fd" opacity="0.5"/>
  <!-- Dotted arc but centered/still -->
  <path d="M 760 380 C 760 298 840 238 840 308"
        fill="none" stroke="#ddd6fe" stroke-width="2" stroke-dasharray="6,4" opacity="0.3"/>
  <path d="M 920 380 C 920 298 840 238 840 308"
        fill="none" stroke="#ddd6fe" stroke-width="2" stroke-dasharray="6,4" opacity="0.3"/>

</svg>