      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#g6)"/>
  <circle cx="920" cy="60" r="120" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#c4b5fd" opacity="0.3"/>
  
  <!-- prescription pad -->
  <rect x="330" y="130" width="260" height="220" rx="12" fill="#7c3aed" opacity="0.15"/>
  <rect x="330" y="130" width="260" height="220" rx="12" fill="none" stroke="#7c3aed" stroke-width="5" opacity="0.45"/>
  <rect x="330" y="130" width="260" height="40" rx="12" fill="#7c3aed" opacity="0.3"/>
  <!-- Rx symbol suggestion (cross + R) -->
  <line x1="365" y1="145" x2="365" y2="165" stroke="white" stroke-width="5" opacity="0.7"/>
  <line x1="358" y1="155" x2="373" y2="155" stroke="white" stroke-width="5" opacity="0.7"/>
  <!-- list lines -->
  <line x1="355" y1="200" x2="565" y2="200" stroke="#7c3aed" stroke-width="4" opacity="0.4"/>
  <line x1="355" y1="230" x2="565" y2="230" stroke="#7c3aed" stroke-width="4" opacity="0.4"/>
  <line x1="355" y1="260" x2="565" y2="260" stroke="#7c3aed" stroke-width="4" opacity="0.4"/>
