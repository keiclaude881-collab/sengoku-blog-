  <rect x="640" y="155" width="50" height="40" rx="20" fill="#6b21a8" opacity="0.5"/>
  <rect x="640" y="215" width="100" height="40" rx="20" fill="#7c3aed" opacity="0.4"/>
  <rect x="640" y="215" width="50" height="40" rx="20" fill="#c4b5fd" opacity="0.5"/>
  <rect x="640" y="275" width="100" height="40" rx="20" fill="#7c3aed" opacity="0.4"/>
  <rect x="640" y="275" width="50" height="40" rx="20" fill="#6b21a8" opacity="0.5"/>

