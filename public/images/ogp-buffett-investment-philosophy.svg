<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#fde68a" opacity="0.12"/>
  <circle cx="1120" cy="550" r="190" fill="#fde68a" opacity="0.10"/>
  <!-- Growing bar chart -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- base line -->
  <line x1="175" y1="522" x2="985" y2="522" stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- 5 bars (heights: 130 195 270 355 430) bottoms at y=522 -->
  <rect x="230" y="392" width="90" height="130" rx="7" fill="url(#bar)" opacity="0.65"/>
  <rect x="368" y="327" width="90" height="195" rx="7" fill="url(#bar)" opacity="0.72"/>
  <rect x="506" y="252" width="90" height="270" rx="7" fill="url(#bar)" opacity="0.80"/>
  <rect x="644" y="167" width="90" height="355" rx="7" fill="url(#bar)" opacity="0.88"/>
  <rect x="782" y="092" width="90" height="430" rx="7" fill="url(#bar)" opacity="0.95"/>
  <!-- trend line -->
  <polyline points="275,392 413,327 551,252 689,167 827,92"
            fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <!-- trend dots -->
  <circle cx="275" cy="392" r="9" fill="#92400e" opacity="0.8"/>
  <circle cx="413" cy="327" r="9" fill="#92400e" opacity="0.8"/>
  <circle cx="551" cy="252" r="9" fill="#92400e" opacity="0.8"/>
  <circle cx="689" cy="167" r="9" fill="#92400e" opacity="0.8"/>
  <circle cx="827" cy="92"  r="9" fill="#92400e" opacity="0.8"/>
  <!-- upward arrow at last bar top -->
  <polygon points="827,68 812,96 842,96" fill="#92400e" opacity="0.8"/>
</svg>