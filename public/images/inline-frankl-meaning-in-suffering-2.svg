<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bg_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg_2)"/>
  <circle cx="920" cy="60" r="120" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="80" cy="360" r="90" fill="#c4b5fd" opacity="0.3"/>
  
  <!-- fence posts -->
  <rect x="250" y="150" width="18" height="240" rx="4" fill="#6b21a8" opacity="0.4"/>
  <rect x="450" y="150" width="18" height="240" rx="4" fill="#6b21a8" opacity="0.4"/>
  <rect x="650" y="150" width="18" height="240" rx="4" fill="#6b21a8" opacity="0.4"/>
  <!-- wire strands -->
  <line x1="250" y1="210" x2="668" y2="210" stroke="#6b21a8" stroke-width="4" opacity="0.5"/>
  <line x1="250" y1="270" x2="668" y2="270" stroke="#6b21a8" stroke-width="4" opacity="0.5"/>
  <line x1="250" y1="330" x2="668" y2="330" stroke="#6b21a8" stroke-width="3" opacity="0.4"/>
  <!-- barbs -->
  <circle cx="350" cy="210" r="6" fill="#6b21a8" opacity="0.6"/>
  <circle cx="550" cy="210" r="6" fill="#6b21a8" opacity="0.6"/>
  <circle cx="350" cy="270" r="6" fill="#6b21a8" opacity="0.6"/>
  <circle cx="550" cy="270" r="6" fill="#6b21a8" opacity="0.6"/>
  <!-- inner glowing light beyond fence -->
  <circle cx="500" cy="115" r="45" fill="#7c3aed" opacity="0.3"/>
  <circle cx="500" cy="115" r="28" fill="#7c3aed" opacity="0.5"/>
  <circle cx="500" cy="115" r="15" fill="white" opacity="0.7"/>

</svg>