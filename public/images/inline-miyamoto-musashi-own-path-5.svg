<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <text x="500" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">二本の刀が示す独自の道——二天一流</text>

  <!-- 中央の交差する二本の刀 -->
  <!-- 刀1（右斜め上） -->
  <line x1="340" y1="320" x2="660" y2="100" stroke="#6b21a8" stroke-width="7" stroke-linecap="round"/>
  <rect x="320" y="310" width="44" height="18" rx="4" fill="#a855f7"/>
  <circle cx="312" cy="330" r="12" fill="none" stroke="#6b21a8" stroke-width="3"/>

  <!-- 刀2（左斜め上） -->
  <line x1="660" y1="320" x2="340" y2="100" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <rect x="636" y="310" width="44" height="18" rx="4" fill="#c4b5fd"/>
  <circle cx="688" cy="330" r="12" fill="none" stroke="#8b5cf6" stroke-width="3"/>

  <!-- 交点の輝き -->
  <circle cx="500" cy="210" r="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="500" cy="210" r="7" fill="#a855f7"/>

  <!-- 左側：「他者基準」（×） -->
  <rect x="60" y="130" width="230" height="160" rx="10" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="175" y="165" font-family="sans-serif" font-size="15" font-weight="700" fill="#9ca3af" text-anchor="middle">他者と比べる道</text>
  <line x1="130" y1="195" x2="220" y2="255" stroke="#d1d5db" stroke-width="3"/>
  <line x1="220" y1="195" x2="130" y2="255" stroke="#d1d5db" stroke-width="3"/>
  <text x="175" y="282" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">焦り・劣等感・迷走</text>

  <!-- 右側：「自己基準」（○） -->
  <rect x="710" y="130" width="230" height="160" rx="10" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="825" y="165" font-family="sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">自分の基準の道</text>
  <circle cx="825" cy="225" r="32" fill="none" stroke="#6b21a8" stroke-width="3"/>
  <line x1="806" y1="225" x2="819" y2="238" stroke="#6b21a8" stroke-width="3" stroke-linecap="round"/>
  <line x1="819" y1="238" x2="844" y2="210" stroke="#6b21a8" stroke-width="3" stroke-linecap="round"/>
  <text x="825" y="282" font-family="sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">成長・安定・独自性</text>

  <!-- 底部テキスト -->
  <rect x="200" y="360" width="600" height="44" rx="10" fill="#6b21a8"/>
  <text x="500" y="387" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">強さとは「他と比べない勇気」から始まる</text>
</svg>
