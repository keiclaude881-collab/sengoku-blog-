  <!-- アクセント線 -->
  <rect x="0" y="0" width="10" height="630" fill="#92400e"/>

  <!-- フラスコアイコン -->
  <g transform="translate(245, 290)">
    <path d="M -34 -106 L -34 -10 L -92 86 Q -106 116 -78 126 L 78 126 Q 106 116 92 86 L 34 -10 L 34 -106 Z"
