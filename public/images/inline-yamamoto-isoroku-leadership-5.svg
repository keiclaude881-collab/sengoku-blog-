<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 3原則まとめ -->

  <!-- Title -->
  <text x="500" y="48" font-family="'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">山本五十六の3原則：部下が育つリーダーの関わり方</text>

  <!-- Center circle: 人が育つ -->
  <circle cx="500" cy="235" r="62" fill="#f59e0b" opacity="0.9" stroke="#92400e" stroke-width="2.5"/>
  <text x="500" y="226" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">部下が</text>
  <text x="500" y="248" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">自走する</text>

  <!-- Principle 1 (left): 見せる -->
  <rect x="55" y="160" width="260" height="110" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2.5"/>
  <text x="185" y="192" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">原則① 見せる</text>
  <text x="185" y="218" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">やってみせる</text>
  <text x="185" y="238" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">→ できるイメージが</text>
  <text x="185" y="256" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">部下の中に生まれる</text>
  <!-- Connection line -->
  <line x1="315" y1="215" x2="438" y2="228" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="434,219 450,229 435,239" fill="#92400e"/>

  <!-- Principle 2 (top): させる -->
  <rect x="360" y="58" width="280" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="500" y="89" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">原則② させる</text>
  <text x="500" y="113" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">失敗させる勇気を持つ</text>
  <text x="500" y="133" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">→ 経験が耐性と</text>
  <text x="500" y="149" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">自信を育てる</text>
  <!-- Connection line -->
  <line x1="500" y1="158" x2="500" y2="173" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <polygon points="493,169 500,185 507,169" fill="#b45309"/>

  <!-- Principle 3 (right): ほめる -->
  <rect x="685" y="160" width="260" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="815" y="192" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">原則③ ほめる</text>
  <text x="815" y="218" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#b45309" text-anchor="middle">承認が動機を生む</text>
  <text x="815" y="238" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">→ 内発的動機で</text>
  <text x="815" y="256" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" text-anchor="middle">自ら動き続ける</text>
  <!-- Connection line -->
  <line x1="685" y1="215" x2="562" y2="228" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="566,219 550,229 565,239" fill="#f59e0b"/>

  <!-- Bottom caption -->
  <text x="500" y="352" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle">「見せて、させて、ほめる」——この3つが揃うとき、人は育つ</text>
  <text x="500" y="375" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" opacity="0.8">山本五十六が100年前に残した言葉は、今も色あせない</text>
</svg>
