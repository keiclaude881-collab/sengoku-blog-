<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <circle cx="80" cy="360" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="940" cy="60" r="40" fill="#bfdbfe" opacity="0.35"/>
  
  <!-- Scale of justice: was Zhuge Liang successful? balanced scale -->
  <!-- Scale beam -->
  <line x1="300" y1="168" x2="700" y2="168" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
  <line x1="500" y1="168" x2="500" y2="368" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
  <!-- Stand -->
  <polygon points="460,368 540,368 520,400 480,400" fill="#1e40af" opacity="0.6"/>
  <!-- Left pan (successes) -->
  <line x1="300" y1="168" x2="280" y2="248" stroke="#1e40af" stroke-width="4"/>
  <line x1="300" y1="168" x2="320" y2="248" stroke="#1e40af" stroke-width="4"/>
  <path d="M 238 248 C 238 268 338 268 338 248 L 338 248 L 238 248 Z" fill="#93c5fd" opacity="0.6"/>
  <path d="M 238 248 C 238 270 338 270 338 248" fill="none" stroke="#1e40af" stroke-width="4"/>
  <!-- Items in left pan -->
  <circle cx="260" cy="242" r="14" fill="#93c5fd" opacity="0.7"/>
  <circle cx="290" cy="242" r="14" fill="#93c5fd" opacity="0.7"/>
  <circle cx="320" cy="242" r="14" fill="#93c5fd" opacity="0.7"/>
  <!-- Right pan (failures) -->
  <line x1="700" y1="168" x2="680" y2="248" stroke="#1e40af" stroke-width="4"/>
  <line x1="700" y1="168" x2="720" y2="248" stroke="#1e40af" stroke-width="4"/>
  <path d="M 658 248 C 658 268 758 268 758 248 L 758 248 L 658 248 Z" fill="#bfdbfe" opacity="0.5"/>
  <path d="M 658 248 C 658 270 758 270 758 248" fill="none" stroke="#1e40af" stroke-width="4"/>
  <!-- Item in right pan (lighter) -->
  <circle cx="708" cy="242" r="14" fill="#bfdbfe" opacity="0.5"/>
  <!-- Scale tilted slightly left (successes heavier) -->

</svg>