<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Microscope -->
  <!-- arm -->
  <rect x="555" y="140" width="30" height="220" rx="8" fill="#1e40af" opacity="0.82"/>
  <!-- nose/objective turret -->
  <rect x="520" y="340" width="100" height="40" rx="8" fill="#3b82f6" opacity="0.80"/>
  <!-- objectives (lenses) -->
  <rect x="550" y="380" width="20" height="60" rx="5" fill="#1e40af" opacity="0.85"/>
  <rect x="575" y="390" width="16" height="50" rx="4" fill="#3b82f6" opacity="0.70"/>
  <!-- stage (sample platform) -->
  <rect x="460" y="450" width="220" height="18" rx="6" fill="#1e40af" opacity="0.75"/>
  <!-- specimen on stage -->
  <ellipse cx="570" cy="450" rx="40" ry="8" fill="#60a5fa" opacity="0.55"/>
  <!-- base -->
  <path d="M 460,468 Q 420,510 400,540 L 740,540 Q 720,510 680,468 Z" fill="#1e40af" opacity="0.60"/>
  <!-- coarse adjustment knob -->
  <ellipse cx="530" cy="250" rx="32" ry="22" fill="#3b82f6" opacity="0.75"/>
  <!-- eyepiece at top -->
  <rect x="558" y="108" width="25" height="40" rx="6" fill="#1e40af" opacity="0.85"/>
  <ellipse cx="570" cy="110" rx="22" ry="14" fill="#3b82f6" opacity="0.75"/>
  <!-- discovery glow (petri dish suggestion) -->
  <circle cx="800" cy="300" r="70" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="800" cy="300" r="40" fill="#93c5fd" opacity="0.30"/>
</svg>