<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- microscope silhouette center -->
  <g transform="translate(550,320)" fill="#1e40af" opacity="0.75">
    <!-- base -->
    <ellipse cx="0" cy="200" rx="110" ry="22" fill="#bfdbfe"/>
    <rect x="-90" y="180" width="180" height="24" rx="8"/>
    <!-- arm -->
    <rect x="-20" y="-160" width="40" height="380" rx="10"/>
    <!-- stage platform -->
    <rect x="-70" y="40" width="140" height="18" rx="6"/>
    <!-- objective lens -->
    <rect x="-14" y="-200" width="28" height="50" rx="8" fill="#3b82f6"/>
    <!-- eyepiece -->
    <path d="M 0 -160 C -30 -200 -30 -250 0 -280 C 30 -250 30 -200 0 -160 Z" fill="#2563eb"/>
    <ellipse cx="0" cy="-285" rx="22" ry="14" fill="#93c5fd"/>
    <!-- arm support -->
    <path d="M 20 -60 C 80 -80 100 -100 80 -160" fill="none" stroke="#1e40af" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- circular discovery glow around microscope -->
  <circle cx="600" cy="360" r="160" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.5" stroke-dasharray="14 8"/>

  <!-- scattered circles representing bacteria/cells being discovered -->
  <g fill="#3b82f6" opacity="0.4">
    <circle cx="280" cy="200" r="18"/>
    <circle cx="340" cy="260" r="12"/>
    <circle cx="310" cy="320" r="16"/>
    <circle cx="260" cy="380" r="10"/>
    <circle cx="900" cy="180" r="16"/>
    <circle cx="950" cy="250" r="12"/>
    <circle cx="920" cy="330" r="14"/>
    <circle cx="880" cy="400" r="10"/>
  </g>
  <!-- highlighted discovered bacteria -->
  <g fill="#1e40af" opacity="0.7">
    <circle cx="420" cy="300" r="14"/>
    <circle cx="460" cy="350" r="10"/>
    <circle cx="400" cy="380" r="8"/>
    <circle cx="780" cy="290" r="14"/>
    <circle cx="760" cy="350" r="10"/>
    <circle cx="800" cy="380" r="8"/>
  </g>

  <!-- magnifying glass overlay at bottom right -->
  <g transform="translate(980,460)" opacity="0.5">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#3b82f6" stroke-width="10"/>
    <circle cx="0" cy="0" r="70" fill="#dbeafe" opacity="0.3"/>
    <line x1="56" y1="56" x2="100" y2="100" stroke="#1e40af" stroke-width="14" stroke-linecap="round"/>
    <!-- tiny bacterium inside lens -->
    <circle cx="-15" cy="5" r="12" fill="#3b82f6" opacity="0.7"/>
    <circle cx="15" cy="-10" r="9" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- decorative corner light -->
  <circle cx="140" cy="100" r="90" fill="none" stroke="#bfdbfe" stroke-width="2" opacity="0.5"/>
</svg>
