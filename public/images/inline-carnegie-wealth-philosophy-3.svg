<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>
  <!-- 仕組みが回り続け、複利で増えていくイメージ -->

  <!-- 複利グラフ（右肩上がり曲線） -->
  <g transform="translate(80,50)">
    <!-- 軸 -->
    <line x1="60" y1="290" x2="60" y2="30" stroke="#92400e" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="290" x2="430" y2="290" stroke="#92400e" stroke-width="2" opacity="0.6"/>
    <!-- 軸ラベル -->
    <text x="245" y="318" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" opacity="0.8">年数</text>
    <text x="28" y="165" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" opacity="0.8" transform="rotate(-90,28,165)">資産</text>

    <!-- 単純積立（直線）-->
    <path d="M 60 290 L 430 130" stroke="#e8e0d4" stroke-width="2.5" fill="none" stroke-dasharray="8 4"/>

    <!-- 複利曲線 -->
    <path d="M 60 290 C 120 285 180 270 220 245 C 270 215 310 175 360 130 C 390 100 415 72 430 55"
          stroke="#d97706" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- 複利の面積を塗る -->
    <path d="M 60 290 C 120 285 180 270 220 245 C 270 215 310 175 360 130 C 390 100 415 72 430 55 L 430 290 Z"
          fill="#f59e0b" opacity="0.12"/>

    <!-- 差分の矢印 -->
    <line x1="430" y1="55" x2="430" y2="130" stroke="#92400e" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="450" y="95" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" opacity="0.9">複利の</text>
    <text x="450" y="112" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e" opacity="0.9">恩恵</text>

    <!-- 凡例 -->
    <line x1="80" y1="44" x2="110" y2="44" stroke="#d97706" stroke-width="3"/>
    <text x="118" y="49" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e">複利運用</text>
    <line x1="80" y1="64" x2="110" y2="64" stroke="#e8e0d4" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="118" y="69" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#92400e">単純積立</text>
  </g>

  <!-- 右側：仕組みの循環 -->
  <g transform="translate(700,210)">
    <!-- 外円 -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#e8e0d4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- 内円 -->
    <circle cx="0" cy="0" r="42" fill="#f59e0b" opacity="0.3" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-6" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">元本</text>
    <text x="0" y="12" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">＋利益</text>

    <!-- 循環矢印（時計回り） -->
    <path d="M 45 -80 A 90 90 0 0 1 90 0" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="88,-8 98,8 76,4" fill="#b45309"/>

    <path d="M 90 0 A 90 90 0 0 1 0 90" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path d="M 0 90 A 90 90 0 0 1 -90 0" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path d="M -90 0 A 90 90 0 0 1 -45 -80" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- ラベル -->
    <text x="0" y="-105" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">再投資</text>
    <text x="110" y="8" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="start">運用益</text>
    <text x="-60" y="108" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">拡大</text>
    <text x="-118" y="8" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="end">積立</text>
  </g>

  <text x="500" y="390" font-family="'Hiragino Sans', sans-serif" font-size="15" fill="#b45309" text-anchor="middle" letter-spacing="1" opacity="0.85">仕組みが回り続けるほど、複利の力は大きくなる</text>
</svg>
