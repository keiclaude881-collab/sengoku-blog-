<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f7faff"/>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dbeafe" stroke-width="3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#1e40af"/>

  <!-- Category badge -->
  <rect x="60" y="55" width="140" height="34" rx="17" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="130" y="77" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle" letter-spacing="2">仕事・副業</text>

  <!-- Main title -->
  <text x="60" y="185" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="52" font-weight="700" fill="#1c1917" letter-spacing="-1">チャーチルの</text>
  <text x="60" y="255" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="52" font-weight="700" fill="#1c1917" letter-spacing="-1">逆境仕事術</text>

  <!-- Subtitle -->
  <text x="60" y="318" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="28" fill="#2563eb" letter-spacing="2">最良の時は常にこれからだ</text>

  <!-- Divider line -->
  <line x1="60" y1="352" x2="680" y2="352" stroke="#dbeafe" stroke-width="2"/>

  <!-- Description -->
  <text x="60" y="392" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">落第・失脚・うつを経験しながら65歳で首相に就任。</text>
  <text x="60" y="422" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#78716c" letter-spacing="0.5">逆境でこそ力を発揮する3原則。</text>

  <!-- Bottom label -->
  <text x="60" y="568" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" fill="#a8a29e" font-weight="700" letter-spacing="3">偉人ラボ</text>

  <!-- Right-side graphic: career curve rising -->
  <rect x="780" y="100" width="360" height="300" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Graph axes -->
  <line x1="820" y1="130" x2="820" y2="370" stroke="#3b82f6" stroke-width="2"/>
  <line x1="820" y1="370" x2="1110" y2="370" stroke="#3b82f6" stroke-width="2"/>

  <!-- Career line: dips then rises sharply at end -->
  <path d="M 830 280
           C 860 295 880 345 910 350
           C 940 355 960 310 990 305
           C 1020 300 1040 335 1060 330
           C 1080 325 1090 275 1110 195"
        stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Shaded area under final rise -->
  <path d="M 1060 330 C 1080 325 1090 275 1110 195 L 1110 370 L 1060 370 Z"
        fill="#3b82f6" opacity="0.15"/>

  <!-- Failure dots -->
  <circle cx="910" cy="350" r="6" fill="#2563eb" opacity="0.8"/>
  <circle cx="1060" cy="330" r="6" fill="#2563eb" opacity="0.8"/>

  <!-- Success star/dot -->
  <circle cx="1110" cy="195" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>

  <!-- Labels inside graph -->
  <text x="840" y="155" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" fill="#2563eb">高</text>
  <text x="840" y="375" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" fill="#2563eb">低</text>
  <text x="960" y="395" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">時間 →</text>
  <text x="1112" y="187" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="start">首相</text>

  <!-- Graph caption -->
  <text x="960" y="432" font-family="'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">65歳で頂点に立ったキャリア</text>
</svg>
