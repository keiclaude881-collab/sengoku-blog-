<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Bold U-turn / reversal arrow -->
  <!-- first direction (going right, then reversing) -->
  <path d="M 200,315 L 600,315 Q 760,315 760,220 Q 760,120 600,120 L 200,120"
        fill="none" stroke="#3b82f6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.80"/>
  <!-- arrowhead at reversal end (pointing left on the top path) -->
  <polygon points="200,120 240,98 240,142" fill="#3b82f6" opacity="0.85"/>
  <!-- starting arrow (going right) -->
  <polygon points="600,337 562,313 600,290" fill="none"/>
  <!-- starting point circle -->
  <circle cx="200" cy="315" r="22" fill="#1e40af" opacity="0.70"/>
  <!-- reversal indicator dot -->
  <circle cx="760" cy="220" r="30" fill="#60a5fa" opacity="0.40"/>
  <!-- "before" faint arrow (direction before reversal) -->
  <path d="M 200,400 L 860,400" fill="none" stroke="#bfdbfe" stroke-width="8" stroke-dasharray="16,10" opacity="0.40"/>
  <polygon points="875,400 843,384 843,416" fill="#bfdbfe" opacity="0.40"/>
</svg>