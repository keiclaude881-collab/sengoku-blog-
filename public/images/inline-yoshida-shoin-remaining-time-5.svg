<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7ff"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e9d5ff" stroke-width="2"/>

  <text x="500" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">松陰の3原則——短い人生を「完成させる」思考法</text>

  <!-- 中央アイコン（松陰） -->
  <circle cx="500" cy="200" r="38" fill="#6b21a8"/>
  <text x="500" y="196" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">吉田</text>
  <text x="500" y="213" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">松陰</text>

  <!-- 原則① -->
  <rect x="60" y="100" width="260" height="90" rx="10" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="190" y="130" font-family="sans-serif" font-size="14" font-weight="900" fill="#6b21a8" text-anchor="middle">原則①</text>
  <text x="190" y="152" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">「今日死んでも悔いないか」</text>
  <text x="190" y="174" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">毎朝、死を意識して問う</text>
  <!-- 矢印 -->
  <line x1="322" y1="145" x2="460" y2="185" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="460,185 445,178 445,192" fill="#8b5cf6"/>

  <!-- 原則② -->
  <rect x="60" y="240" width="260" height="90" rx="10" fill="#ede9fe" stroke="#6b21a8" stroke-width="2.5"/>
  <text x="190" y="270" font-family="sans-serif" font-size="14" font-weight="900" fill="#6b21a8" text-anchor="middle">原則②</text>
  <text x="190" y="292" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">「志」を先に決める</text>
  <text x="190" y="314" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">目的が手段を引き寄せる</text>
  <!-- 矢印 -->
  <line x1="322" y1="280" x2="460" y2="215" stroke="#6b21a8" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="460,215 445,210 447,224" fill="#6b21a8"/>

  <!-- 原則③ -->
  <rect x="680" y="170" width="260" height="90" rx="10" fill="#6b21a8"/>
  <text x="810" y="200" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">原則③</text>
  <text x="810" y="222" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">人を育てることを最優先</text>
  <text x="810" y="244" font-family="sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle">教えることで自分も成長する</text>
  <!-- 矢印 -->
  <line x1="540" y1="200" x2="678" y2="215" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="678,215 663,208 662,222" fill="#a855f7"/>

  <!-- 結果（下部） -->
  <rect x="300" y="330" width="400" height="60" rx="10" fill="#6b21a8"/>
  <text x="500" y="357" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">29年の人生が「完成」する</text>
  <text x="500" y="378" font-family="sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">短くても悔いのない生き方</text>
  <!-- 矢印（中央から結果へ） -->
  <line x1="500" y1="240" x2="500" y2="328" stroke="#d8b4fe" stroke-width="2"/>
  <polygon points="500,328 494,314 506,314" fill="#d8b4fe"/>
</svg>
