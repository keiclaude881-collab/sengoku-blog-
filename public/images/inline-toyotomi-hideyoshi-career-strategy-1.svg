<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- 農民出身から天下人へ向かう階段 -->
  <!-- 階段ステップ（低い出発点から頂点へ） -->
  <g opacity="0.9">
    <!-- Step 1: 最下層（農民） -->
    <rect x="120" y="310" width="100" height="60" rx="4" fill="#f59e0b" opacity="0.3" stroke="#b45309" stroke-width="1.5"/>
    <!-- Step 2 -->
    <rect x="220" y="270" width="100" height="100" rx="4" fill="#f59e0b" opacity="0.35" stroke="#b45309" stroke-width="1.5"/>
    <!-- Step 3 -->
    <rect x="320" y="230" width="100" height="140" rx="4" fill="#f59e0b" opacity="0.4" stroke="#b45309" stroke-width="1.5"/>
    <!-- Step 4 -->
    <rect x="420" y="180" width="100" height="190" rx="4" fill="#f59e0b" opacity="0.5" stroke="#b45309" stroke-width="1.5"/>
    <!-- Step 5 -->
    <rect x="520" y="130" width="100" height="240" rx="4" fill="#f59e0b" opacity="0.6" stroke="#b45309" stroke-width="1.5"/>
    <!-- Step 6: 天下人 -->
    <rect x="620" y="70" width="120" height="300" rx="4" fill="#f59e0b" opacity="0.75" stroke="#92400e" stroke-width="2"/>
  </g>

  <!-- 階段ラベル -->
  <text x="170" y="302" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">農民</text>
  <text x="270" y="262" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">奉公人</text>
  <text x="370" y="222" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">草履取り</text>
  <text x="470" y="172" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">側近</text>
  <text x="570" y="122" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">武将</text>
  <text x="680" y="62" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">天下人</text>

  <!-- 矢印（上昇トレンド） -->
  <path d="M 140 340 L 240 300 L 340 260 L 440 210 L 540 160 L 660 100" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <polygon points="660,100 645,114 670,118" fill="#92400e" opacity="0.7"/>

  <!-- 右側テキスト -->
  <text x="820" y="200" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#92400e" text-anchor="middle" font-weight="700">出発点は</text>
  <text x="820" y="228" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#92400e" text-anchor="middle" font-weight="700">関係ない</text>
  <text x="820" y="270" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#b45309" text-anchor="middle">戦略で登り切る</text>
</svg>
