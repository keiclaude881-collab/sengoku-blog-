<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="#bfdbfe" opacity="0.15"/>
  <circle cx="1120" cy="550" r="190" fill="#bfdbfe" opacity="0.12"/>

  <!-- Crescent moon (Date Masamune clan crest = personal brand) -->
  <!-- large circle (moon base) -->
  <circle cx="600" cy="300" r="220" fill="#3b82f6" opacity="0.72"/>
  <!-- cutting circle (creating crescent) -->
  <circle cx="490" cy="300" r="210" fill="#dbeafe" opacity="0.98"/>
  <!-- inner crescent detail -->
  <path d="M 600,85 A 215,215 0 1,1 600,515 A 170,170 0 1,0 600,85 Z" fill="#1e40af" opacity="0.20"/>
  <!-- star companion -->
  <circle cx="820" cy="170" r="30" fill="#3b82f6" opacity="0.65"/>
  <circle cx="820" cy="170" r="14" fill="#bfdbfe" opacity="0.80"/>
  <!-- star rays -->
  <g stroke="#3b82f6" stroke-width="4" opacity="0.40">
    <line x1="820" y1="130" x2="820" y2="110"/>
    <line x1="820" y1="210" x2="820" y2="230"/>
    <line x1="780" y1="170" x2="760" y2="170"/>
    <line x1="860" y1="170" x2="880" y2="170"/>
    <line x1="792" y1="142" x2="778" y2="128"/>
    <line x1="848" y1="198" x2="862" y2="212"/>
  </g>
</svg>