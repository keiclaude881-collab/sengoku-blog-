<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad7)"/>

  <!-- soft glow behind, light dispelling a shadowy feeling about money -->
  <circle cx="600" cy="320" r="320" fill="url(#glow7)"/>

  <!-- a closed/clenched shape on the left (guilt, hiding) softening into an open hand-like fan of coins on the right -->
  <g transform="translate(330,360)">
    <path d="M 0 -120 C -60 -120 -90 -60 -90 0 C -90 70 -40 120 0 120 C 20 120 30 90 10 80 C -20 65 -30 30 -30 0 C -30 -50 -10 -80 20 -90 C 40 -96 30 -120 0 -120 Z" fill="#92400e" opacity="0.55"/>
  </g>

  <!-- rising sun-like coin fan, money stepping into the light -->
  <g transform="translate(760,400)">
    <ellipse cx="0" cy="140" rx="220" ry="30" fill="#fde68a" opacity="0.5"/>
    <g transform="rotate(-26)">
      <circle cx="0" cy="0" r="58" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#92400e" stroke-width="3" opacity="0.5"/>
    </g>
    <g transform="rotate(-9)">
      <circle cx="0" cy="0" r="66" fill="#fbbf24"/>
      <circle cx="0" cy="0" r="66" fill="none" stroke="#92400e" stroke-width="3" opacity="0.4"/>
    </g>
    <g transform="rotate(9)">
      <circle cx="0" cy="0" r="66" fill="#fbbf24"/>
      <circle cx="0" cy="0" r="66" fill="none" stroke="#92400e" stroke-width="3" opacity="0.4"/>
    </g>
    <g transform="rotate(26)">
      <circle cx="0" cy="0" r="58" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#92400e" stroke-width="3" opacity="0.5"/>
    </g>
    <circle cx="0" cy="0" r="72" fill="#fde68a"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#d97706" stroke-width="4"/>
  </g>

  <!-- upward growth line connecting the two -->
  <path d="M 380 480 Q 560 440 760 400" stroke="#d97706" stroke-width="4" fill="none" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>
</svg>
