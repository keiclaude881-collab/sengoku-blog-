<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- 天秤（論語と算盤のバランス） -->
  <g transform="translate(330,330)" opacity="0.85">
    <line x1="0" y1="-110" x2="0" y2="90" stroke="#92400e" stroke-width="6" opacity="0.6" stroke-linecap="round"/>
    <rect x="-10" y="92" width="20" height="16" rx="3" fill="#92400e" opacity="0.6"/>
    <line x1="-100" y1="-70" x2="100" y2="-70" stroke="#92400e" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
    <circle cx="0" cy="-92" r="7" fill="#92400e" opacity="0.7"/>

    <!-- 左の皿: 本（論語） -->
    <line x1="-100" y1="-70" x2="-100" y2="-22" stroke="#92400e" stroke-width="2.5" opacity="0.5"/>
    <path d="M -134 -22 Q -100 -2 -66 -22 L -66 -16 Q -100 4 -134 -16 Z" fill="#fde68a" opacity="0.85"/>
    <rect x="-122" y="-46" width="44" height="28" rx="2" fill="#fbbf24" opacity="0.8"/>
    <text x="-100" y="-26" font-family="'Shippori Mincho', serif" font-size="16" fill="#92400e" text-anchor="middle" opacity="0.85">論語</text>

    <!-- 右の皿: そろばん（算盤） -->
    <line x1="100" y1="-70" x2="100" y2="-22" stroke="#92400e" stroke-width="2.5" opacity="0.5"/>
    <path d="M 66 -22 Q 100 -2 134 -22 L 134 -16 Q 100 4 66 -16 Z" fill="#fde68a" opacity="0.85"/>
    <rect x="78" y="-46" width="44" height="28" rx="2" fill="#fbbf24" opacity="0.8"/>
    <text x="100" y="-26" font-family="'Shippori Mincho', serif" font-size="16" fill="#92400e" text-anchor="middle" opacity="0.85">算盤</text>
  </g>

  <!-- 上昇する硬貨の積み重ね -->
  <g opacity="0.7">
    <ellipse cx="760" cy="540" rx="46" ry="14" fill="#fbbf24"/>
    <ellipse cx="760" cy="526" rx="46" ry="14" fill="#fcd34d"/>
    <ellipse cx="800" cy="500" rx="46" ry="14" fill="#fbbf24"/>
    <ellipse cx="800" cy="486" rx="46" ry="14" fill="#fcd34d"/>
    <ellipse cx="800" cy="472" rx="46" ry="14" fill="#fde68a"/>
    <ellipse cx="930" cy="450" rx="46" ry="14" fill="#fbbf24"/>
    <ellipse cx="930" cy="436" rx="46" ry="14" fill="#fcd34d"/>
    <ellipse cx="930" cy="422" rx="46" ry="14" fill="#fde68a"/>
    <ellipse cx="930" cy="408" rx="46" ry="14" fill="#fef3c7"/>
  </g>

  <!-- カテゴリラベル -->
  <rect x="700" y="170" width="120" height="36" rx="18" fill="#fef3c7" stroke="#fde68a"/>
  <text x="760" y="194" font-family="'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">投資・お金</text>

  <!-- タイトル -->
  <text x="700" y="262" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">渋沢栄一に学ぶ</text>
  <text x="700" y="304" font-family="'Shippori Mincho', serif" font-size="30" font-weight="700" fill="#1c1917" letter-spacing="1">お金との向き合い方</text>

  <text x="100" y="580" font-family="'Hiragino Sans', sans-serif" font-size="20" fill="#a8a29e" letter-spacing="3">偉人ラボ</text>
</svg>
