<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#faf7f2"/>
  <rect x="0" y="0" width="1000" height="420" fill="none" stroke="#e8e0d4" stroke-width="2"/>

  <!-- 小さな信頼が積み重なって大きくなるイメージ（ピラミッド型） -->
  <!-- 土台：最初の小さな信頼 -->
  <rect x="250" y="330" width="500" height="40" rx="5" fill="#f59e0b" opacity="0.3" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="357" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">小さな仕事を完璧にこなす</text>

  <!-- 2段目 -->
  <rect x="300" y="278" width="400" height="40" rx="5" fill="#f59e0b" opacity="0.45" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="305" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">次の仕事を任される</text>

  <!-- 3段目 -->
  <rect x="355" y="226" width="290" height="40" rx="5" fill="#f59e0b" opacity="0.6" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="253" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">また完璧にこなす</text>

  <!-- 4段目 -->
  <rect x="410" y="174" width="180" height="40" rx="5" fill="#f59e0b" opacity="0.75" stroke="#92400e" stroke-width="2"/>
  <text x="500" y="201" font-family="'Hiragino Sans', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">大きな信頼</text>

  <!-- 頂点 -->
  <rect x="450" y="110" width="100" height="52" rx="5" fill="#f59e0b" opacity="0.9" stroke="#92400e" stroke-width="2.5"/>
  <text x="500" y="132" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">重要な</text>
  <text x="500" y="151" font-family="'Hiragino Sans', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">役割へ</text>

  <!-- 右側テキスト -->
  <text x="830" y="220" font-family="'Hiragino Sans', sans-serif" font-size="18" fill="#92400e" text-anchor="middle" font-weight="700">積み上げが</text>
  <text x="830" y="248" font-family="'Hiragino Sans', sans-serif" font-size="18" fill="#92400e" text-anchor="middle" font-weight="700">信頼になる</text>

  <!-- 矢印（上方向） -->
  <path d="M 140 370 L 140 100" stroke="#b45309" stroke-width="2" opacity="0.5"/>
  <polygon points="140,100 132,118 148,118" fill="#b45309" opacity="0.5"/>
  <text x="140" y="390" font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">信頼</text>
</svg>
